<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#F1EAD6" />
  <title>The Yard — Book a Court</title>
  <meta name="description" content="The Yard · Pickleball · Toul Kork, Phnom Penh. Book a court online." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@400;500;600;700&family=Noto+Serif+Khmer:wght@400;500;700&display=swap" />

  <style>
/* ====================================================================
   THE YARD — BRAND STYLESHEET v01
   Ported 1:1 from the Claude Design React prototype.
   Brand: Cream / Ink / Court Green / Clay / Wood / Concrete
   Type:  Fraunces (display italic) + Manrope (sans) + DM Mono (numbers)
   ==================================================================== */

:root{
  /* Palette */
  --cream:#F1EAD6;
  --cream-2:#E5DBBE;
  --paper:#F7F0DC;
  --green:#3D7A4F;
  --green-2:#2B5938;
  --green-3:#1E4126;
  --clay:#C64F3A;
  --clay-2:#A53D2C;
  --wood:#A8744A;
  --wood-2:#7A5436;
  --concrete:#C9C6BD;
  --ink:#1A1A1A;
  --peach:#D9785C;

  /* Aliases used inside components */
  --bone:var(--cream);
  --bone-2:var(--cream-2);
  --jade:var(--green);
  --jade-2:var(--green-2);
  --coral:var(--clay);
  --coral-2:var(--clay-2);
  --gold:var(--wood);
  --gold-2:var(--wood-2);

  /* Type stacks — Khmer-aware */
  --sans:'Manrope','Noto Sans Khmer',ui-sans-serif,system-ui,sans-serif;
  --serif:'Fraunces','Noto Serif Khmer',ui-serif,Georgia,serif;
  --mono:'DM Mono',ui-monospace,monospace;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--cream);
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* When Khmer is selected, swap to Khmer fonts seamlessly */
body[lang="km"]{ font-family:'Noto Sans Khmer','Manrope',sans-serif; }
body[lang="km"] .h-display,
body[lang="km"] .serif,
body[lang="km"] h1,body[lang="km"] h2,body[lang="km"] h3{
  font-family:'Noto Serif Khmer','Fraunces',serif;
}

/* ========== App shell ========== */
#root{
  width:100%;
  max-width:520px;
  margin:0 auto;
  background:var(--cream);
  position:relative;
  min-height:100vh;
  min-height:100dvh;
}

.screen{ padding:8px 22px 120px; position:relative; }
.scr-pad-top{ padding-top:8px; }

/* ========== Top utility bar (date + lang toggle) ========== */
.topbar{
  position:sticky; top:0; z-index:50;
  height:42px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px;
  background:var(--cream);
  border-bottom:1px dashed rgba(26,26,26,0.18);
  font-family:var(--mono);
  font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
  font-weight:500;
}
.topbar .now{ opacity:0.8; }
.topbar .lang{
  display:flex; gap:0; align-items:stretch;
  border:1.5px solid var(--ink);
  border-radius:999px; overflow:hidden;
}
.topbar .lang button{
  background:transparent; border:0;
  padding:4px 10px;
  font-family:var(--mono); font-weight:500;
  font-size:10px; letter-spacing:0.16em;
  color:var(--ink); cursor:pointer;
}
.topbar .lang button.on{ background:var(--ink); color:var(--cream); }

/* ========== Type ========== */
.h-display{
  font-family:var(--serif); font-weight:400; font-style:italic;
  line-height:0.92; letter-spacing:-0.02em;
}
.h-sans{
  font-family:var(--sans); font-weight:800;
  letter-spacing:-0.01em; line-height:1.0;
}
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.serif{ font-family:var(--serif); }

/* ========== Buttons (CTA) ========== */
.btn{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; min-height:58px; padding:0 22px;
  background:var(--green); color:var(--cream);
  border:1.5px solid var(--ink);
  border-radius:999px;
  font-family:var(--sans); font-weight:700; font-size:15px;
  letter-spacing:0.06em; text-transform:uppercase;
  cursor:pointer; transition:transform .08s ease, background .12s ease;
  font-family:var(--sans);
}
.btn:active{ transform:translateY(1px); }
.btn.coral{ background:var(--clay); color:var(--cream); }
.btn.ink{ background:var(--ink); color:var(--cream); }
.btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
.btn .arrow{ font-family:var(--mono); font-size:18px; font-weight:500; }
.btn:disabled{ opacity:0.45; cursor:not-allowed; }

/* ========== Inputs ========== */
.input{
  width:100%; min-height:56px;
  background:var(--paper);
  border:1.5px solid var(--ink);
  border-radius:14px;
  padding:0 18px;
  font-family:var(--mono); font-size:18px;
  color:var(--ink);
  outline:none;
  transition:background .12s ease, border-color .12s ease;
}
.input:focus{ background:#fff; border-color:var(--green); }

/* ========== Section label ========== */
.label{
  font-family:var(--sans); font-weight:800;
  font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--ink);
  display:flex; align-items:center; gap:8px;
  margin:4px 0 10px;
}
.label .num{
  font-family:var(--mono); font-size:10px; font-weight:500;
  background:var(--ink); color:var(--cream);
  padding:2px 5px;
}
.label .right{
  margin-left:auto;
  font-family:var(--mono); font-size:10px; font-weight:500;
  letter-spacing:0.12em; opacity:0.6;
}

/* ========== Rules ========== */
.rule{ height:1.5px; background:var(--ink); width:100%; }
.rule-thin{ height:1px; background:var(--ink); opacity:0.22; }

/* ========== Pill / sticker ========== */
.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-weight:500;
  font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  padding:5px 10px; border:1.5px solid var(--ink); background:var(--paper);
  border-radius:999px;
}
.sticker{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 10px;
  border:1.5px solid var(--ink);
  background:var(--cream);
  border-radius:999px;
  font-family:var(--mono); font-weight:500;
  font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
}
.sticker.clay{ background:var(--clay); color:var(--cream); border-color:var(--clay); }
.sticker.green{ background:var(--green); color:var(--cream); border-color:var(--green); }
.sticker.ink{ background:var(--ink); color:var(--cream); border-color:var(--ink); }

/* ========== Hint text ========== */
.hint{
  font-family:var(--sans); font-size:13px; color:var(--ink);
  opacity:0.65; line-height:1.45;
}

/* ========== Helpers ========== */
.row{ display:flex; align-items:center; gap:8px; }
.row-between{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

/* ========== Court line motif (dink trajectory) ========== */
.trajectory{
  position:relative; height:32px; width:100%; margin:6px 0;
}
.trajectory svg{ width:100%; height:100%; display:block; overflow:visible; }

/* ========== Date strip ========== */
.date-strip{
  display:flex; gap:10px; overflow-x:auto;
  padding:2px 2px 8px;
  scrollbar-width:none;
  margin:0 -22px; padding-left:22px; padding-right:22px;
}
.date-strip::-webkit-scrollbar{ display:none; }
.date-card{
  flex:0 0 66px; height:86px;
  border:1.5px solid var(--ink); background:var(--paper);
  border-radius:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; cursor:pointer;
  font-family:var(--sans); font-weight:700;
  transition:background .12s ease, color .12s ease;
  position:relative;
}
.date-card .dow{ font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.7; }
.date-card .dnum{ font-family:var(--mono); font-weight:500; font-size:28px; line-height:1; }
.date-card .mo{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.6; }
.date-card:hover{ background:var(--cream-2); }
.date-card.active{ background:var(--green); color:var(--cream); border-color:var(--green); }
.date-card.active .dow,
.date-card.active .mo{ opacity:0.85; }
.date-card.today::after{
  content:"TODAY"; position:absolute; top:-12px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:8px; font-weight:500;
  background:var(--clay); color:var(--cream);
  padding:2px 5px; letter-spacing:0.1em;
  border-radius:4px;
}

/* ========== Time wheel picker (iOS-style) ========== */
.wheel{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--paper);
  overflow:hidden;
}
.wheel .wheel-mask-top,
.wheel .wheel-mask-bot{
  position:absolute; left:0; right:0; height:56px; pointer-events:none; z-index:2;
}
.wheel .wheel-mask-top{ top:0; background:linear-gradient(to bottom, var(--paper) 30%, rgba(247,240,220,0)); }
.wheel .wheel-mask-bot{ bottom:0; background:linear-gradient(to top, var(--paper) 30%, rgba(247,240,220,0)); }
.wheel .wheel-center{
  position:absolute; left:8px; right:8px; top:50%; transform:translateY(-50%);
  height:52px; border-top:1.5px solid var(--ink); border-bottom:1.5px solid var(--ink);
  pointer-events:none; z-index:1;
}
.wheel .wheel-center::before,
.wheel .wheel-center::after{
  content:""; position:absolute; top:50%; width:8px; height:8px;
  background:var(--clay); border-radius:50%; transform:translateY(-50%);
}
.wheel .wheel-center::before{ left:-12px; }
.wheel .wheel-center::after{ right:-12px; }
.wheel .wheel-scroll{
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  mask-image:linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
}
.wheel .wheel-scroll::-webkit-scrollbar{ display:none; }
.wheel .wheel-item{
  scroll-snap-align:center;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px;
  font-family:var(--mono); font-size:26px; font-weight:500;
  letter-spacing:-0.01em;
  color:var(--ink);
  transition:opacity .15s ease, transform .15s ease;
  cursor:pointer;
}
.wheel .wheel-item.dim{ opacity:0.35; font-size:21px; }
.wheel .wheel-item.far{ opacity:0.15; font-size:19px; }
.wheel .wheel-item .meta{
  font-family:var(--sans); font-size:11px; font-weight:700;
  letter-spacing:0.12em; text-transform:uppercase;
  opacity:0.7;
}
.wheel .wheel-item.dim .meta,
.wheel .wheel-item.far .meta{ opacity:0.5; }
.wheel .wheel-item.full{ color:var(--ink); }
.wheel .wheel-item.full .meta{ color:var(--clay); opacity:1; font-weight:800; }
.wheel .wheel-item.hot .meta{ color:var(--clay); opacity:1; font-weight:800; }

/* ========== Stepper (duration / courts) ========== */
.stepper{
  display:flex; align-items:stretch;
  border:1.5px solid var(--ink); border-radius:18px;
  overflow:hidden; background:var(--paper);
  min-height:74px;
}
.stepper .btn-step{
  width:60px; flex:none;
  background:transparent; border:0;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:32px; color:var(--ink);
  transition:background .12s ease, color .12s ease;
}
.stepper .btn-step:hover:not(:disabled){ background:var(--cream-2); }
.stepper .btn-step:disabled{ opacity:0.25; cursor:not-allowed; }
.stepper .btn-step.minus{ border-right:1.5px solid var(--ink); }
.stepper .btn-step.plus{ border-left:1.5px solid var(--ink); background:var(--green); color:var(--cream); }
.stepper .btn-step.plus:hover:not(:disabled){ background:var(--green-2); }
.stepper .val{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:0 12px;
}
.stepper .val .num{
  font-family:var(--mono); font-weight:500; font-size:36px; line-height:1;
  letter-spacing:-0.02em;
}
.stepper .val .sub{
  font-family:var(--sans); font-size:10px; font-weight:800;
  letter-spacing:0.14em; text-transform:uppercase;
  opacity:0.65;
  align-self:flex-end; padding-bottom:9px;
}
.stepper .pips{
  display:flex; gap:3px; align-self:flex-end; padding-bottom:10px;
  margin-left:4px;
}
.stepper .pips i{
  width:5px; height:5px; border-radius:50%;
  background:var(--ink); opacity:0.18;
  display:block;
}
.stepper .pips i.on{ background:var(--clay); opacity:1; }

/* ========== Court rail ========== */
.court-rail{
  display:flex; gap:6px; padding:14px;
  border:1.5px solid var(--ink); border-radius:14px;
  background:var(--paper);
  overflow-x:auto; scrollbar-width:none;
}
.court-rail::-webkit-scrollbar{ display:none; }
.court-pill{
  flex:0 0 auto;
  min-width:52px;
  padding:10px 8px;
  border:1.5px solid var(--ink);
  border-radius:10px;
  background:var(--cream);
  font-family:var(--mono); font-weight:500;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer;
  transition:background .12s ease;
}
.court-pill .id{ font-size:14px; }
.court-pill .lbl{
  font-family:var(--sans); font-size:9px; font-weight:800; letter-spacing:0.1em;
  text-transform:uppercase; opacity:0.55;
}
.court-pill.sel{ background:var(--green); color:var(--cream); border-color:var(--green); }
.court-pill.sel .lbl{ opacity:0.85; }
.court-pill.unavail{
  opacity:0.35; cursor:not-allowed;
  background:repeating-linear-gradient(45deg, transparent 0 5px, rgba(26,26,26,0.18) 5px 6px);
}
.court-pill:hover:not(.sel):not(.unavail){ background:var(--cream-2); }

/* ========== Member strip ========== */
.member-strip{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--green); color:var(--cream);
  padding:18px;
  margin-bottom:20px;
  overflow:hidden;
}
.member-strip::after{
  content:"";
  position:absolute; right:-30px; top:-30px;
  width:160px; height:160px;
  border:1.5px solid rgba(241,234,214,0.2);
  border-radius:50%;
  pointer-events:none;
}
.member-strip .top{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  opacity:0.85; font-weight:500;
}
.member-strip .name{
  font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:34px; line-height:1; margin:8px 0 12px;
  letter-spacing:-0.02em;
}
.member-strip .row-end{
  display:flex; justify-content:space-between; align-items:flex-end; gap:8px;
}
.tier{
  display:inline-flex; align-items:center; gap:6px;
  border:1.5px solid var(--cream);
  background:transparent; color:var(--cream);
  font-family:var(--mono); font-weight:500;
  font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  padding:5px 10px; border-radius:999px;
}
.member-strip.founding{ background:var(--wood); color:var(--cream); }
.member-strip.founding::after{ border-color:rgba(241,234,214,0.25); }

/* ========== Guest hello (mirror member strip but cream) ========== */
.guest-hello{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--paper);
  padding:18px;
  margin-bottom:20px;
}
.guest-hello .top{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  opacity:0.65; font-weight:500;
}
.guest-hello .h{
  font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:28px; line-height:1; margin:8px 0 12px; letter-spacing:-0.02em;
}
.guest-hello input{
  width:100%; min-height:48px;
  background:#fff;
  border:1.5px solid var(--ink);
  border-radius:12px;
  padding:0 14px;
  font-family:var(--sans); font-size:16px; font-weight:600;
  color:var(--ink); outline:none;
}
.guest-hello input:focus{ border-color:var(--green); }

/* ========== Birthday gift card ========== */
.gift{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--clay);
  color:var(--cream);
  padding:22px 20px 20px;
  margin-bottom:20px;
  overflow:hidden;
}
.gift .kicker{
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase;
  font-weight:500; opacity:0.92;
}
.gift h3{
  font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:36px; line-height:1; margin:8px 0; letter-spacing:-0.02em;
}
.gift p{ margin:0 0 16px; font-size:14px; line-height:1.5; max-width:30ch; opacity:0.92; }
.gift.claimed{ background:var(--cream-2); color:var(--ink); }
.gift.claimed::after{
  content:"CLAIMED";
  position:absolute; right:18px; top:18px;
  background:var(--green); color:var(--cream);
  font-family:var(--mono); font-weight:500;
  font-size:10.5px; letter-spacing:0.16em;
  padding:5px 10px; border-radius:999px;
}
.gift .claim-btn{
  background:var(--cream); color:var(--clay);
  border:0;
  padding:10px 16px;
  border-radius:999px;
  font-family:var(--sans); font-weight:800;
  font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
  cursor:pointer;
}

/* ========== Guest promo card (inverted ink) ========== */
.promo{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--ink); color:var(--cream);
  margin-bottom:20px; overflow:hidden;
}
.promo .head{
  padding:16px 18px 10px;
  border-bottom:1.5px solid var(--clay);
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
  font-weight:500;
}
.promo .body{ padding:16px 18px 18px; }
.promo h3{
  font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:30px; line-height:1; margin:0 0 10px;
  color:var(--cream); letter-spacing:-0.02em;
}
.promo h3 .save{ color:var(--clay); }
.promo .tiers{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;
}
.promo .tier-card{
  border:1.5px solid rgba(241,234,214,0.4);
  padding:10px 12px;
  border-radius:12px;
}
.promo .tier-card .name{
  font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  font-weight:600; opacity:0.7;
}
.promo .tier-card .pct{
  font-family:var(--serif); font-style:italic; font-weight:400; font-size:30px;
  line-height:1; margin-top:4px; color:var(--cream);
}
.promo .tier-card .pct b{ color:var(--clay); font-weight:400; }
.promo .tier-card.gold{ border-color:rgba(168,116,74,0.6); }
.promo .tier-card.gold .pct b{ color:var(--wood); }
.promo .cta-row{
  display:flex; align-items:center; justify-content:space-between;
  border-top:1px dashed rgba(241,234,214,0.3);
  padding-top:14px; margin-top:4px;
}
.promo .seats{
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  font-weight:500;
}
.promo .learn{
  font-family:var(--sans); font-weight:700; font-size:12.5px;
  letter-spacing:0.1em; text-transform:uppercase;
  color:var(--clay); text-decoration:none;
  border-bottom:1.5px solid var(--clay);
  padding-bottom:1px; cursor:pointer; background:transparent; border-top:0; border-left:0; border-right:0;
}

/* ========== Price block ========== */
.priceblock{
  border-top:1.5px solid var(--ink);
  padding:16px 0 8px;
  transition:height 0.2s ease;
}
.price-row{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:6px 0;
  font-family:var(--sans);
  animation:priceRowIn 0.18s ease-out;
}
.price-row .k{ font-size:13.5px; transition:opacity 0.2s ease; }
.price-row .v{

/* ========== Loading: bouncing pickleball ========== */
/* A pickleball trajectory motif — bounces left-to-right with diminishing

.bouncer{
  position:relative;
  display:flex;
  align-items:center; justify-content:center;
  overflow:hidden;
}
.bouncer-sm{ width:120px; height:60px; }
.bouncer-md{ width:200px; height:90px; }
.bouncer-lg{ width:280px; height:120px; }

.bouncer .ground{
  position:absolute;
  left:8%; right:8%; bottom:14%;
  height:0;
  border-bottom:1.5px dashed rgba(26,26,26,0.35);
}
.bouncer.on-dark .ground{
  border-bottom-color:rgba(241,234,214,0.35);
}

.bouncer .ball-track{
  position:absolute;
  left:8%; bottom:14%;
  width:0; height:0;
  animation:ballSlideLeft 1.7s cubic-bezier(0.42, 0, 0.7, 1) infinite;
}
.bouncer .ball{
  position:absolute;
  left:-7px; bottom:-7px;
  width:14px; height:14px;
  background:var(--clay);
  border-radius:50%;
  animation:ballBounce 1.7s cubic-bezier(0.5, 0, 0.5, 1) infinite, ballFade 1.7s linear infinite;
  box-shadow:0 2px 0 rgba(26,26,26,0.10);
}
.bouncer.on-dark .ball{ background:var(--clay); }
.bouncer-sm .ball{ width:10px; height:10px; left:-5px; bottom:-5px; }
.bouncer-lg .ball{ width:18px; height:18px; left:-9px; bottom:-9px; }

   a teleport. */
@keyframes ballFade{
  0%   { opacity:0; }
  8%   { opacity:1; }
  92%  { opacity:1; }
  100% { opacity:0; }
}

/* Horizontal slide: track moves from left to right across the bouncer */
@keyframes ballSlideLeft{
  0%   { left:0%; }
  100% { left:84%; }
}

/* Update slide duration to match new 1.7s timing */
.bouncer .ball-track{
  animation-duration:1.7s;
}

/* Vertical bounce: 3 progressively-smaller arcs followed by a small roll.
   Negative translateY = up. The cubic-bezier gives gravity-feel curves. */

  /* Start: dropped from height */
  0%   { transform:translateY(-44px) scaleY(1) scaleX(1); }
  /* Squish on first impact */
  18%  { transform:translateY(0)     scaleY(0.65) scaleX(1.25); }
  /* Rebound 1 (full arc) */
  20%  { transform:translateY(0)     scaleY(1.05) scaleX(0.95); }
  35%  { transform:translateY(-30px) scaleY(1)    scaleX(1); }
  48%  { transform:translateY(0)     scaleY(0.7)  scaleX(1.2); }
  /* Rebound 2 (smaller) */
  50%  { transform:translateY(0)     scaleY(1.04) scaleX(0.96); }
  62%  { transform:translateY(-18px) scaleY(1)    scaleX(1); }
  73%  { transform:translateY(0)     scaleY(0.75) scaleX(1.15); }
  /* Rebound 3 (smallest) */
  75%  { transform:translateY(0)     scaleY(1.02) scaleX(0.98); }
  84%  { transform:translateY(-8px)  scaleY(1)    scaleX(1); }
  92%  { transform:translateY(0)     scaleY(0.85) scaleX(1.08); }
  /* Final roll out */
  100% { transform:translateY(0)     scaleY(1)    scaleX(1); }
}

function t(key, vars, lang) {
  const dict = STRINGS[lang || "en"] || STRINGS.en;
  let s = dict[key] || STRINGS.en[key] || key;
  if (vars) {
    Object.keys(vars).forEach(k => {
      s = s.replace(new RegExp("\\{" + k + "\\}", "g"), vars[k]);
    });
  }
  return s;
}

/* ====================================================================
   3. API CLIENT
   ==================================================================== */

async function api(action, params) {
  if (!API_URL || API_URL.includes("PASTE_YOUR")) {
    return { ok: false, error: "API_URL not configured. Edit index.html line 17." };
  }

  const url = new URL(API_URL);
  url.searchParams.set("action", action);
  for (const k in (params || {})) {
    if (params[k] !== undefined && params[k] !== null) {
      url.searchParams.set(k, params[k]);
    }
  }

  try {
    const resp = await fetch(url.toString(), { method: "GET" });
    if (!resp.ok) return { ok: false, error: "HTTP " + resp.status };
    const data = await resp.json();
    return data;
  } catch (err) {
    return { ok: false, error: err.message || "Network error" };
  }
}

/* ====================================================================
   4. LOCAL STORAGE (auth token)
   ==================================================================== */

const TOKEN_KEY = "yard.token";
const PHONE_KEY = "yard.phone";
const LANG_KEY = "yard.lang";

function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
function getStoredPhone() { try { return localStorage.getItem(PHONE_KEY) || ""; } catch (e) { return ""; } }
function setStoredPhone(p) { try { p ? localStorage.setItem(PHONE_KEY, p) : localStorage.removeItem(PHONE_KEY); } catch (e) {} }
function getLang() { try { return localStorage.getItem(LANG_KEY) || "en"; } catch (e) { return "en"; } }
function setLang(l) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} document.body.setAttribute("lang", l); }

   ==================================================================== */

function pad2(n) { return String(n).padStart(2, "0"); }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function ymd(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function isWeekend(d) {
  const x = (d instanceof Date ? d : new Date(d)).getDay();
  return x === 0 || x === 6;
}
function isPeakHour(date, timeStr) {
  const hr = parseInt((timeStr || "06:00").split(":")[0], 10);
  return isWeekend(date) || hr >= 17;
}

/* ====================================================================
   CLIENT-SIDE PRICING ENGINE
   Mirrors Backend.gs calculatePrice() exactly. Pricing rules are loaded
   once from the server via getConfig and cached for the session.
   ==================================================================== */

const DAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

/** Returns the hourly rate that applies for a given date + hour, using
 *  the cached pricing rules. Falls back to $15 if no rule matches. */
function rateForDateAndHour(rules, dateStr, hour) {
  if (!rules || !rules.length) return 15;
  const d = new Date(dateStr + "T12:00:00");
  const dow = DAY_KEYS[d.getDay()];
  for (const r of rules) {
    if (r.days.indexOf(dow) === -1) continue;
    if (hour < r.hourStart || hour >= r.hourEnd) continue;
    return r.rate;
  }
  return 15;
}

/** Returns a rate-bucket label for the given hour ("offpeak" / "peak"). */
function rateBucketForHour(rules, dateStr, hour) {
  const d = new Date(dateStr + "T12:00:00");
  const dow = DAY_KEYS[d.getDay()];
  for (const r of rules) {
    if (r.days.indexOf(dow) === -1) continue;
    if (hour < r.hourStart || hour >= r.hourEnd) continue;
    // Use the rule name as the bucket. Backend uses "weekday_offpeak",
    // "weekday_peak", "weekend".
    if (r.name && r.name.indexOf("offpeak") >= 0) return "offpeak";
    return "peak";
  }
  return "peak";
}

/**
 * Compute price entirely client-side. Returns the same shape as the
 * backend's calculatePrice (plus a breakdown array for transparency).
 *
 * Inputs:
 *   config    — the cached config object from getConfig
 *   isMember  — boolean
 *   tier      — "Founding" / "Standard" / ""
 *   isBirthdayEligible — boolean (computed elsewhere)
 *   useBirthday — boolean — user has claimed the gift
 *   date, time, slots, courts
 */
function calculatePriceClient({
  config, isMember, tier, isBirthdayEligible, useBirthday,
  date, time, slots, courts
}) {
  const rules = (config && config.pricingRules) || [];
  const slotMinutes = (config && config.slotMinutes) || 30;
  const discountFounding = (config && config.discountFounding) || 50;
  const discountStandard = (config && config.discountStandard) || 30;

  const [startH, startM] = String(time).split(":").map(Number);
  let subtotal = 0;
  // Buckets accumulate slots + dollar amounts by rate-bucket for the
  // transparent breakdown.
  const buckets = {}; // { "offpeak": { slots, rate, amount }, "peak": {...} }

  for (let i = 0; i < slots; i++) {
    const totalMins = startH * 60 + (startM || 0) + i * slotMinutes;
    const hr = Math.floor(totalMins / 60);
    const rate = rateForDateAndHour(rules, date, hr);
    const bucket = rateBucketForHour(rules, date, hr);
    const slotAmount = (rate / 2) * courts;
    subtotal += slotAmount;

    if (!buckets[bucket]) buckets[bucket] = { slots: 0, rate: rate, amount: 0 };
    buckets[bucket].slots += 1;
    buckets[bucket].amount += slotAmount;
  }

  // Member / birthday discount
  let discountPct = 0;
  let isBirthdaySession = false;
  if (isMember) {
    if (useBirthday && isBirthdayEligible && slots <= 4 && courts === 1) {
      isBirthdaySession = true;
      discountPct = (String(tier).toLowerCase() === "founding") ? 100 : 50;
    } else {
      if (String(tier).toLowerCase() === "founding") discountPct = discountFounding;
      else if (String(tier).toLowerCase() === "standard") discountPct = discountStandard;
    }
  }

  const discountAmount = Math.round(subtotal * discountPct) / 100;
  const total = Math.round((subtotal - discountAmount) * 100) / 100;

  // Render buckets in stable order: offpeak first, peak second
  const breakdown = [];
  if (buckets.offpeak) {
    breakdown.push({ bucket: "offpeak", ...buckets.offpeak });
  }
  if (buckets.peak) {
    breakdown.push({ bucket: "peak", ...buckets.peak });
  }
  const isMixed = breakdown.length > 1;

  return {
    ok: true,
    subtotal: Math.round(subtotal * 100) / 100,
    discountPct: discountPct,
    discountAmount: discountAmount,
    total: total,
    isMember: isMember,
    memberTier: tier || "",
    isBirthdayEligible: isBirthdayEligible,
    isBirthdaySession: isBirthdaySession,
    breakdown: breakdown,
    isMixed: isMixed
  };
}

/** Compute whether a member is currently in their birthday window. */
function isBirthdayEligibleClient(member, dateStr, windowDays) {
  if (!member || !member.birthday) return false;
  const parts = String(member.birthday).split("-").map(Number);
  const bMonth = parts[0], bDay = parts[1];
  if (!bMonth || !bDay) return false;

  const checkDate = new Date(dateStr + "T12:00:00");
  const thisYear = checkDate.getFullYear();
  const birthday = new Date(thisYear, bMonth - 1, bDay);
  const diffDays = Math.abs((checkDate - birthday) / (1000 * 60 * 60 * 24));

  const win = windowDays != null ? windowDays : 3;
  if (diffDays > win) return false;

  const usedYear = parseInt(member.birthdayUsedYear) || 0;
  if (usedYear >= thisYear) return false;

  return true;
}

// Format duration (slots in 30-min increments) → "2h" / "2h 30m" / "30m"
function formatDuration(slots) {
  const mins = slots * SLOT_MINUTES;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h === 0) return m + "m";
  if (m === 0) return h + "h";
  return h + "h " + m + "m";
}

// Format duration in Khmer
function formatDurationKm(slots) {
  const mins = slots * SLOT_MINUTES;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h === 0) return m + "នាទី";
  if (m === 0) return h + "ម៉ោង";
  return h + "ម៉ោង " + m + "នាទី";
}

function normalizePhone(p) {
  if (!p) return "";
  let s = String(p).replace(/[\s\-\(\)\+]/g, "");
  if (s.startsWith("855")) s = s.substring(3);
  if (s.startsWith("0")) s = s.substring(1);
  return s.replace(/\D/g, "");
}

function maskPhone(p) {
  const n = normalizePhone(p);
  if (n.length < 3) return n;
  return "***" + n.slice(-3);
}

function fmtDateLong(dateStr, lang) {
  const d = new Date(dateStr + "T12:00:00");
  if (lang === "km") {
    const DOW = ["អា", "ច", "អ", "ព", "ព្រ", "សុ", "ស"];
    const MO = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
    return DOW[d.getDay()] + " " + d.getDate() + " " + MO[d.getMonth()];
  }
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return DOW[d.getDay()] + " " + d.getDate() + " " + MO[d.getMonth()] + " " + d.getFullYear();
}

/* ============== WheelPicker — iOS-style scrolling time picker ============== */
function WheelPicker({ value, onChange, slots, lang }) {
  const scrollRef = useRef(null);
  const ITEM_H = 52;
  const userScrollingRef = useRef(false);
  const lastUserInputRef = useRef(0);
  const mountedRef = useRef(false);

  const idx = Math.max(0, slots.findIndex(s => s.t === value));

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;

    if (!mountedRef.current) {
      mountedRef.current = true;
      let targetIdx = idx;
      const cur = slots[targetIdx];
      if (!cur || cur.left <= 0) {
        for (let step = 1; step < slots.length; step++) {
          const down = targetIdx + step;
          const up = targetIdx - step;
          if (down < slots.length && slots[down].left > 0) { targetIdx = down; break; }
          if (up >= 0 && slots[up].left > 0) { targetIdx = up; break; }
        }
        if (slots[targetIdx] && slots[targetIdx].t !== value) {
          setTimeout(() => onChange(slots[targetIdx].t), 0);
        }
      }
      el.scrollTop = targetIdx * ITEM_H;
      return;
    }

    // If user input was within the last 250ms, skip programmatic scroll —
    // they're still interacting and our scrollTo would fight their finger.
    if (Date.now() - lastUserInputRef.current < 250) return;
    el.scrollTo({ top: idx * ITEM_H, behavior: "smooth" });
  }, [idx, slots.length]);

  function markUserScroll() {
    userScrollingRef.current = true;
    lastUserInputRef.current = Date.now();
  }

  function onScroll() {
    const el = scrollRef.current;
    if (!el || !userScrollingRef.current) return;
    lastUserInputRef.current = Date.now();

    // LIVE update: emit the slot directly under center as the user scrolls.
    // Throttled via rAF so we don't thrash React, and only fires onChange
    // when the centered slot actually changes — minimizing parent re-renders.
    if (!el._rafPending) {
      el._rafPending = true;
      requestAnimationFrame(() => {
        el._rafPending = false;
        const i = Math.round(el.scrollTop / ITEM_H);
        const clamped = Math.max(0, Math.min(slots.length - 1, i));
        const slot = slots[clamped];
        if (slot && slot.left > 0 && slot.t !== value) {
          onChange(slot.t);
        }
      });
    }

    // SETTLE: when scrolling stops, snap to a valid slot (skip over Full ones).
    clearTimeout(el._t);
    el._t = setTimeout(() => {
      const i = Math.round(el.scrollTop / ITEM_H);
      const clamped = Math.max(0, Math.min(slots.length - 1, i));
      const slot = slots[clamped];
      const isFull = (s) => !s || s.left <= 0;
      if (slot && !isFull(slot)) {
        if (slot.t !== value) onChange(slot.t);
      } else {
        let target = -1;
        for (let step = 1; step < slots.length; step++) {
          const up = clamped - step;
          const down = clamped + step;
          if (down < slots.length && !isFull(slots[down])) { target = down; break; }
          if (up >= 0 && !isFull(slots[up])) { target = up; break; }
        }
        if (target >= 0) {
          onChange(slots[target].t);
          el.scrollTo({ top: target * ITEM_H, behavior: "smooth" });
        }
      }
      userScrollingRef.current = false;
    }, 40);
  }

  return (
    <div className="wheel" style={{ height: ITEM_H * 5 }}>
      <div className="wheel-mask-top" />
      <div className="wheel-mask-bot" />
      <div className="wheel-center" />
      <div
        className="wheel-scroll"
        ref={scrollRef}
        onScroll={onScroll}
        onPointerDown={markUserScroll}
        onTouchStart={markUserScroll}
        onWheel={markUserScroll}
        onKeyDown={markUserScroll}
        tabIndex={0}
        style={{ height: "100%", paddingTop: ITEM_H * 2, paddingBottom: ITEM_H * 2 }}
      >
        {slots.map((s, i) => {
          const isCenter = i === idx;
          const dist = Math.abs(i - idx);
          const cls = isCenter ? "" : dist === 1 ? "dim" : "far";
          const isFull = s.left <= 0;
          return (
            <div
              key={s.t}
              className={"wheel-item " + cls + (isFull ? " full" : "") + (s.hot ? " hot" : "")}
              style={{ height: ITEM_H }}
              onClick={() => {
                if (isFull) return;
                onChange(s.t);
                const el = scrollRef.current;
                if (el) el.scrollTo({ top: i * ITEM_H, behavior: "smooth" });
              }}
            >
              <span>{s.label}</span>
              <span className="meta">
                {isFull
                  ? (lang === "km" ? "ពេញ" : "Full")
                  : s.hot
                    ? (lang === "km" ? "Prime" : "Prime")
                    : (lang === "km" ? (s.left + " ទំនេរ") : (s.left + " left"))}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  let el = document.getElementById("toast-host");

    el = document.createElement("div");

/* ===================== SCREEN 2: OTP ===================== */
function ScreenOTP({ state, setState, go, lang }) {
  const [code, setCode] = useState("");
  const [resendIn, setResendIn] = useState(28);
  const [verifying, setVerifying] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    if (resendIn <= 0) return;
    const id = setInterval(() => setResendIn(s => Math.max(0, s - 1)), 1000);
    return () => clearInterval(id);
  }, [resendIn]);

  function setDigit(i, v) {
    v = v.replace(/\D/g, "").slice(-1);
    const arr = code.padEnd(6, " ").split("");
    arr[i] = v || " ";
    const next = arr.join("").trimEnd();
    setCode(next);
    setError("");

    if (v && i < 5) {
      const el = document.getElementById("otp-" + (i + 1));
      el && el.focus();
    }

    if (next.replace(/\s/g, "").length === 6) {
      tryVerify(next.trim());
    }
  }

  async function tryVerify(c) {
    setVerifying(true);
    const r = await api("verifyOTP", {
      phone: state.phone,
      code: c,
      device: navigator.userAgent.substring(0, 80)
    });
    setVerifying(false);
    if (!r.ok || !r.verified) {
      setError(r.error || t("error", null, lang));
      setCode("");
      return;
    }
    setToken(r.token);
    setState(s => ({
      ...s,
      token: r.token,
      isMember: r.isMember,
      member: r.member,
      guest: r.guest || null
    }));
    go("booking");
  }

  async function resend() {
    if (resendIn > 0) return;
    setResendIn(30);
    const r = await api("sendOTP", { phone: state.phone });
    if (!r.ok) showToast(r.error || t("error", null, lang), "error");
    else showToast(lang === "km" ? "បាន​ផ្ញើ" : "Sent", "success");
  }

  const last3 = state.phone ? state.phone.slice(-3) : "···";

  return (
    <div className="screen scr-pad-top">
      <div className="row-between">
        <button onClick={() => go("phone")}
          style={{ background: "transparent", border: "1.5px solid var(--ink)", padding: "6px 10px", cursor: "pointer", borderRadius: 999, fontFamily: "var(--mono)", fontWeight: 500, fontSize: 11, letterSpacing: "0.1em" }}>
          {t("o_back", null, lang)}
        </button>
        <span className="pill">{t("o_step", null, lang)}</span>
      </div>

      <div style={{ position: "relative", marginTop: 22 }}>
        <div className="mono" style={{ fontSize: 11, letterSpacing: "0.16em" }}>
          {t("o_sent_to", { phone: state.phone ? state.phone.slice(0, 2) + " ··· " + last3 : "··· ···" }, lang)}
        </div>
        <h1 className="h-display" style={{ fontSize: 60, margin: "6px 0" }}>
          {t("o_h1_a", null, lang)}<br />{t("o_h1_b", null, lang)}
        </h1>
        <p style={{ fontSize: 14, lineHeight: 1.45, maxWidth: "32ch", margin: "6px 0 22px" }}>
          {t("o_sub", null, lang)}
        </p>
      </div>

      <SectionLabel n="01">{t("o_label", null, lang)}</SectionLabel>
      <div className="otp-row">
        {Array.from({ length: 6 }).map((_, i) => {
          const ch = code[i];
          const filled = ch && ch !== " ";
          const isActive = !filled && code.length === i;
          return (
            <label key={i}
              className={"otp-box" + (filled ? " filled" : "") + (isActive ? " active" : "")}
              htmlFor={"otp-" + i}>
              {filled ? ch : (isActive ? <span className="caret" /> : "")}
              <input
                id={"otp-" + i}
                inputMode="numeric"
                pattern="[0-9]*"
                value={filled ? ch : ""}
                onChange={(e) => setDigit(i, e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Backspace" && !ch) {
                    const prev = document.getElementById("otp-" + Math.max(0, i - 1));
                    prev && prev.focus();
                  }
                }}
              />
            </label>
          );
        })}
      </div>

      {error ? (
        <div className="hint" style={{ marginTop: 14, color: "var(--clay)", fontWeight: 600 }}>{error}</div>
      ) : null}

      <div className="hint" style={{ marginTop: 18, display: "flex", justifyContent: "space-between" }}>
        <span>{t("o_remember", null, lang)}</span>
        {resendIn > 0
          ? <span className="mono" style={{ fontWeight: 500 }}>{t("o_resend_in", { s: resendIn }, lang)}</span>
          : <button className="ulink" onClick={resend} style={{ fontSize: 12 }}>{t("o_resend", null, lang)}</button>}
      </div>

      {verifying ? <Loading message={t("o_verifying", null, lang)} /> : null}
    </div>
  );
}

/* ===================== SCREEN 3: BOOKING ===================== */
function ScreenBooking({ state, setState, go, lang, config }) {
  const isMember = !!state.isMember;
  const isGuest = !isMember;
  const member = state.member;
  const isFounding = member && String(member.tier).toLowerCase() === "founding";
  const memberName = (member && member.name) ? member.name.split(" ")[0] : "";

  // Booking state
  const [date, setDate] = useState(state.date || todayISO());
  const [time, setTime] = useState(state.time || "18:00");
  const [slots, setSlots] = useState(state.slots || 2);   // 30-min slots; 2 = 1 hour
  const [pickedCourts, setPickedCourts] = useState(state.pickedCourts || [1]);
  // Pre-fill name: member name if member, else guest name from prior bookings
  const guestRecord = state.guest;
  const [guestName, setGuestName] = useState(
    state.guestName ||
    (member ? member.name : "") ||
    (guestRecord ? guestRecord.name : "")
  );

  // Live data
  const [availLoading, setAvailLoading] = useState(true);
  const [availSlots, setAvailSlots] = useState([]);
  const [foundingStatus, setFoundingStatus] = useState(null);

  // Birthday gift state
  const [bdayClaimed, setBdayClaimed] = useState(false);
  const [bdayEligible, setBdayEligible] = useState(false);

  // Hard reset: if user is not a member, birthday state must be off.
  // This protects against stale React state if member status changes
  // (e.g. user signs out / token re-validates with new info).
  useEffect(() => {
    if (!isMember) {
      if (bdayEligible) setBdayEligible(false);
      if (bdayClaimed) setBdayClaimed(false);
    }
  }, [isMember]);

  // Submit state
  const [submitting, setSubmitting] = useState(false);

  /* Load availability whenever date changes */
  useEffect(() => {
    let cancelled = false;
    setAvailLoading(true);
    api("getAvailability", { date }).then(r => {
      if (cancelled) return;
      setAvailLoading(false);
      if (!r.ok) {
        showToast(r.error || t("error", null, lang), "error");
        setAvailSlots([]);
        return;
      }
      setAvailSlots(r.slots || []);
      // Pick first available time if current isn't available
      const cur = (r.slots || []).find(s => s.time === time);
      if (!cur || cur.availableCount <= 0) {
        const firstFree = (r.slots || []).find(s => s.availableCount > 0);
        if (firstFree) setTime(firstFree.time);
      }
    });
    return () => { cancelled = true; };
  }, [date]);

  /* Load Founding status (for guest promo card) */
  useEffect(() => {
    api("getFoundingStatus").then(r => { if (r.ok) setFoundingStatus(r); });
  }, []);

  /* Birthday eligibility — computed client-side from cached member info */
  useEffect(() => {
    if (!isMember || !member) {
      if (bdayEligible) setBdayEligible(false);
      return;
    }
    const windowDays = (config && config.birthdayWindowDays) || 3;
    const eligible = isBirthdayEligibleClient(member, date, windowDays);
    if (eligible !== bdayEligible) setBdayEligible(eligible);
    // If date moves out of birthday window while claimed, un-claim it.
    if (!eligible && bdayClaimed) setBdayClaimed(false);
  }, [isMember, member, date, config]);

  /* Price calculation — pure client-side, instant updates */
  const pricing = useMemo(() => {
    if (!config) return null;  // wait for config to load
    return calculatePriceClient({
      config: config,
      isMember: isMember,
      tier: member ? member.tier : "",
      isBirthdayEligible: bdayEligible,
      useBirthday: bdayClaimed && isMember,
      date: date, time: time, slots: slots, courts: pickedCourts.length
    });
  }, [config, isMember, member, bdayEligible, bdayClaimed, date, time, slots, pickedCourts.length]);

  /* Convert backend slots → wheel format */
  const wheelSlots = useMemo(() => {
    return (availSlots || [])
      .filter(s => s.availableCount > 0 || true) // keep full slots visible as 'full'
      .map(s => {
        const dObj = new Date(date + "T12:00:00");
        const hr = parseInt(s.time.split(":")[0], 10);
        const peak = isWeekend(dObj) || hr >= 17;
        return {
          t: s.time,
          label: s.time,
          left: s.availableCount,
          hot: peak && s.availableCount > 0
        };
      });
  }, [availSlots, date]);

  /* Court availability for the *selected* time + duration */
  const courtAvailability = useMemo(() => {
    // Find the slot index for `time`. If not found, no courts available.
    const startIdx = (availSlots || []).findIndex(s => s.time === time);
    if (startIdx < 0) return { available: [], unavailable: [1, 2, 3, 4, 5, 6, 7, 8] };
    const unavailable = [];
    const available = [];
    for (let c = 0; c < COURTS_COUNT; c++) {
      let ok = true;
      for (let s = 0; s < slots; s++) {
        const row = availSlots[startIdx + s];
        if (!row || !row.courts || !row.courts[c]) { ok = false; break; }
      }
      if (ok) available.push(c + 1);
      else unavailable.push(c + 1);
    }
    return { available, unavailable };
  }, [availSlots, time, slots]);

  /* If selected courts become unavailable after duration change, prune */
  useEffect(() => {
    const valid = pickedCourts.filter(n => courtAvailability.available.includes(n));
    if (valid.length === 0 && courtAvailability.available.length > 0) {
      setPickedCourts([courtAvailability.available[0]]);
    } else if (valid.length !== pickedCourts.length) {
      setPickedCourts(valid.length ? valid : [courtAvailability.available[0] || 1]);
    }
  }, [courtAvailability.unavailable.join(",")]);

  /* Force 2 slots + 1 court when birthday session claimed */
  useEffect(() => {
    if (bdayClaimed) {
      if (slots !== 4) setSlots(4); // 4 × 30min = 2 hours
      if (pickedCourts.length !== 1) setPickedCourts([pickedCourts[0] || courtAvailability.available[0] || 1]);
    }
  }, [bdayClaimed]);

  const peakLabel = useMemo(() => {
    const dObj = new Date(date + "T12:00:00");
    const [h, m] = time.split(":").map(Number);
    let peak = 0, off = 0;
    for (let i = 0; i < slots; i++) {
      const totalMin = h * 60 + m + i * SLOT_MINUTES;
      const hr = Math.floor(totalMin / 60);
      if (isWeekend(dObj) || hr >= 17) peak++; else off++;
    }
    if (peak > 0 && off === 0) return t("b_peak", null, lang);
    if (off > 0 && peak === 0) return t("b_offpeak", null, lang);
    return t("b_mixed", null, lang);
  }, [date, time, slots, lang]);

  const guestSavings = useMemo(() => {
    if (!isGuest || !pricing) return 0;
    return Math.round(pricing.subtotal * 0.5);
  }, [pricing, isGuest]);

  function ctaLabel() {
    if (isGuest && !guestName.trim()) return t("b_cta_add_name", null, lang);
    if (bdayClaimed) return t("b_cta_claim", null, lang);
    return t("b_cta_confirm", null, lang);
  }
  function ctaTone() {
    return bdayClaimed ? "coral" : "ink";
  }
  function ctaDisabled() {
    if (isGuest && !guestName.trim()) return true;
    if (submitting) return true;
    if (courtAvailability.available.length === 0) return true;
    return false;
  }

  async function submit() {
    if (ctaDisabled()) return;
    setSubmitting(true);
    const r = await api("createBooking", {
      token: state.token || "",
      phone: state.phone,
      name: guestName || (member ? member.name : ""),
      email: (member && member.email) || "",
      date, time, slots,
      courts: pickedCourts.length,
      useBirthday: bdayClaimed ? 1 : 0,
      source: "Web"
    });
    setSubmitting(false);
    if (!r.ok) {
      showToast(r.error || t("error", null, lang), "error");
      return;
    }
    setState(s => ({ ...s, confirmation: r.confirmation }));
    go("confirm");
  }

  const lockedDuration = bdayClaimed && isMember;
  const lockedCourts = bdayClaimed && isMember;

  return (
    <div className="screen scr-pad-top">
      <div className="row-between" style={{ marginBottom: 14 }}>
        <Lockup size={0.92} onClick={() => go(state.token ? "booking" : "phone")} />
        <span className="pill">{t("b_title", null, lang)}</span>
      </div>

      {/* Member or guest strip */}
      {isMember && (
        <div className={"member-strip" + (isFounding ? " founding" : "")}>
          <div className="top">
            <span>{t("b_welcome", null, lang)}</span>
            <span>{t("b_member_no", null, lang)} {member.memberNumber}</span>
          </div>
          <div className="name">{memberName}</div>
          <div className="row-end">
            <TierBadge tier={isFounding ? "FOUNDING" : "STANDARD"} number={member.memberNumber} />
            <span className="mono" style={{ fontSize: 10.5, letterSpacing: "0.12em", opacity: 0.8 }}>
              {t("b_expires", null, lang)} {member.expiryDate || "—"}
            </span>
          </div>
        </div>
      )}

      {isGuest && (
        <div className="guest-hello">
          <div className="top">
            <span>
              {guestRecord
                ? t("b_guest_returning", { n: guestRecord.totalBookings }, lang)
                : t("b_guest_top", null, lang)}
            </span>
            <span>+855 {maskPhone(state.phone)}</span>
          </div>
          <div className="h">
            {guestRecord && guestRecord.name
              ? t("b_guest_h_back", { name: guestRecord.name.split(" ")[0] }, lang)
              : t("b_guest_h", null, lang)}
          </div>
          <input
            value={guestName}
            placeholder={t("b_guest_placeholder", null, lang)}
            onChange={(e) => setGuestName(e.target.value)}
          />
        </div>
      )}

      {/* Birthday gift card for eligible members */}
      {isMember && bdayEligible && (
        <div className={"gift" + (bdayClaimed ? " claimed" : "")}>
          <div className="kicker">{t("g_kicker", null, lang)}</div>
          <h3>{bdayClaimed ? t("g_h_claimed", null, lang) : t("g_h_unclaimed", null, lang)}</h3>
          <p>{isFounding ? t("g_p_founding", null, lang) : t("g_p_standard", null, lang)}</p>
          {!bdayClaimed
            ? <button className="claim-btn" onClick={() => setBdayClaimed(true)}>{t("g_claim", null, lang)}</button>
            : <div className="hint" style={{ color: "inherit", opacity: 0.8 }}>{t("g_claimed_note", null, lang)}</div>}
        </div>
      )}

      {/* DATE */}
      <SectionLabel n="01" right={t("b_date_right", { n: 14 }, lang)}>
        {t("b_label_date", null, lang)}
      </SectionLabel>
      <DateStrip value={date} onChange={setDate} daysAhead={14} lang={lang} />

      {/* TIME */}
      <div style={{ marginTop: 18 }}>
        <SectionLabel n="02" right={peakLabel}>{t("b_label_time", null, lang)}</SectionLabel>
        {availLoading
          ? <div className="wheel" style={{ height: 260, display: "flex", alignItems: "center", justifyContent: "center" }}><BouncingBall size="md" /></div>
          : wheelSlots.length === 0
            ? <div className="empty"><div>{t("b_no_slots", null, lang)}</div></div>
            : <WheelPicker value={time} onChange={setTime} slots={wheelSlots} lang={lang} />}
        <div className="hint" style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ display: "inline-block", width: 8, height: 8, background: "var(--coral)", border: "2px solid var(--ink)" }} />
          <span>{t("b_peak_pip_hint", null, lang)}</span>
        </div>
      </div>

      {/* DURATION — 30-min steps */}
      <div style={{ marginTop: 22 }}>
        <SectionLabel n="03" right={lockedDuration ? t("b_locked_gift", null, lang) : t("b_duration_right", null, lang)}>
          {t("b_label_duration", null, lang)}
        </SectionLabel>
        <Stepper
          value={lockedDuration ? 4 : slots}
          onChange={(v) => !lockedDuration && setSlots(v)}
          min={MIN_SLOTS}
          max={MAX_SLOTS}
          unitLabel={lang === "km" ? "រយៈពេល" : "DURATION"}
        />
        <div className="hint" style={{ marginTop: 8 }}>
          {lockedDuration ? t("b_dur_lock_hint", null, lang) : t("b_duration_hint", null, lang)}
        </div>
      </div>

      {/* COURTS */}
      <div style={{ marginTop: 22 }}>
        <SectionLabel n="04" right={lockedCourts ? t("b_locked_gift", null, lang) : t("b_courts_right", null, lang)}>
          {t("b_label_courts", null, lang)}
        </SectionLabel>
        <CourtRail
          value={pickedCourts}
          onChange={setPickedCourts}
          count={COURTS_COUNT}
          unavailable={courtAvailability.unavailable}
          lang={lang}
        />
        <div className="hint" style={{ marginTop: 8 }}>
          {lockedCourts
            ? t("b_court_lock_hint", null, lang)
            : (pickedCourts.length === 1
                ? t("b_court_hint_one", null, lang)
                : t("b_court_hint_many", { n: pickedCourts.length }, lang))}
        </div>
      </div>

      {/* GUEST PROMO */}
      {isGuest && pricing && (
        <div className="promo" style={{ marginTop: 20 }}>
          <div className="head">
            <span>{t("pr_head", null, lang)}</span>
            <span>{t("pr_seats", { n: foundingStatus ? foundingStatus.foundingRemaining : "·" }, lang)}</span>
          </div>
          <div className="body">
            <h3>
              {t("pr_h_save", null, lang)} <span className="save">${guestSavings}</span> {t("pr_h_today", null, lang)}
            </h3>
            <div className="tiers">
              <div className="tier-card">
                <div className="name">{t("pr_standard", null, lang)}</div>
                <div className="pct"><b>−30</b>%</div>
              </div>
              <div className="tier-card gold">
                <div className="name">{t("pr_founding", null, lang)}</div>
                <div className="pct"><b>−50</b>%</div>
              </div>
            </div>
            <div className="cta-row">
              <span className="seats">$200/yr · {t("m_visit", null, lang)}</span>
              <button className="learn" onClick={() => go("membership")}>{t("pr_learn", null, lang)}</button>
            </div>
          </div>
        </div>
      )}

      {/* PRICE */}
      <div style={{ marginTop: 24 }}>
        <div className="label">
          <span className="num">05</span>
          <span>{t("b_label_summary", null, lang)}</span>
        </div>
        <div className="priceblock">
          {pricing ? (
            <>
              {pricing.isMixed ? (
                // Mixed-rate: itemize each bucket
                pricing.breakdown.map(b => (
                  <div className="price-row" key={b.bucket}>
                    <span className="k">
                      {b.bucket === "offpeak"
                        ? t("b_offpeak_line", null, lang)
                        : t("b_peak_line", null, lang)}
                      {" · "}
                      {formatDuration(b.slots)} × {pickedCourts.length}
                      {" · $"}{b.rate}/hr
                    </span>
                    <span className="v" key={"v-" + b.bucket + "-" + b.amount}>${b.amount.toFixed(2)}</span>
                  </div>
                ))
              ) : (
                // Single-rate booking
                <div className="price-row">
                  <span className="k">
                    {formatDuration(slots)} × {pickedCourts.length} {pickedCourts.length > 1 ? t("c_courts", null, lang).toLowerCase() : t("c_court", null, lang).toLowerCase()} · {peakLabel.toLowerCase()}
                  </span>
                  <span className="v" key={"v-sub-" + pricing.subtotal}>${pricing.subtotal.toFixed(2)}</span>
                </div>
              )}

              {pricing.isMixed && (
                <div className="price-row subtotal-row" style={{ paddingTop: 8, borderTop: "1px dashed rgba(26,26,26,0.18)", marginTop: 2 }}>
                  <span className="k" style={{ fontWeight: 700 }}>{t("b_subtotal", null, lang)}</span>
                  <span className="v" key={"v-mixsub-" + pricing.subtotal}>${pricing.subtotal.toFixed(2)}</span>
                </div>
              )}

              {pricing.discountPct > 0 && pricing.discountPct < 100 && (
                <div className="price-row discount">
                  <span className="k">
                    {isFounding ? t("b_founding_disc", null, lang) : t("b_member_disc", null, lang)}
                  </span>
                  <span className="v" key={"v-disc-" + pricing.discountAmount}>${pricing.discountAmount.toFixed(2)}</span>
                </div>
              )}

              {pricing.discountPct === 100 && (
                <>
                  <div className="price-row strike">
                    <span className="k">{t("b_standard_rate", null, lang)}</span>
                    <span className="v" key={"v-strike-" + pricing.subtotal}>${pricing.subtotal.toFixed(2)}</span>
                  </div>
                  <div className="price-row discount" style={{ color: "var(--green-2)" }}>
                    <span className="k">{t("b_birthday_gift", null, lang)}</span>
                    <span className="v" key={"v-bday-" + pricing.subtotal}>${pricing.subtotal.toFixed(2)}</span>
                  </div>
                </>
              )}

              <div className="rule" style={{ margin: "10px 0 6px" }} />

              <div className="price-row total">
                <span className="k">{t("b_total", null, lang)}</span>
                <span className="v" key={"v-total-" + pricing.total}>${pricing.total.toFixed(2)}</span>
              </div>
              <div className="hint" style={{ margin: "4px 0 10px", display: "flex", alignItems: "center", gap: 6 }}>
                <span className="mono" style={{
                  fontSize: 10, padding: "2px 5px",
                  background: "var(--ink)", color: "var(--cream)",
                  letterSpacing: "0.14em", fontWeight: 500
                }}>USD</span>
                <span>{t("b_pay_at_counter", null, lang)}</span>
              </div>
            </>
          ) : (
            <div style={{ padding: 10, textAlign: "center", opacity: 0.7 }}>
              <BouncingBall size="sm" />
            </div>
          )}
        </div>
      </div>

      {/* CTA */}
      <div style={{ marginTop: 14 }}>
        <CTA tone={ctaTone()} disabled={ctaDisabled()} onClick={submit}>
          {submitting ? t("loading", null, lang) : ctaLabel()}
        </CTA>
      </div>

      <div className="footer-note" style={{ marginTop: 18 }}>
        THE YARD · TOUL KORK · PHNOM PENH
      </div>

      {submitting && <Loading message={t("loading", null, lang)} />}
    </div>
  );
}

/* ===================== SCREEN 4: CONFIRMATION ===================== */

      <div className="screen scr-pad-top">

        <CTA onClick={() => go("booking")} tone="ink">{t("back", null, lang)}</CTA>
      </div>

  function copy() {
    navigator.clipboard.writeText(c.bookingId).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);

/* ===================== SCREEN 5: MY BOOKINGS ===================== */
function ScreenMyBookings({ state, setState, go, lang }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [cancelTarget, setCancelTarget] = useState(null);
  const [cancelling, setCancelling] = useState(false);

  async function load() {
    setLoading(true);
    const r = await api("getMyBookings", {
      token: state.token || "",
      phone: state.phone || ""
    });
    setLoading(false);
    if (r.ok) setData({ upcoming: r.upcoming || [], past: r.past || [], cancelled: r.cancelled || [] });
    else { setData({ upcoming: [], past: [], cancelled: [] }); showToast(r.error || t("error", null, lang), "error"); }
  }

  useEffect(() => { load(); }, []);

  async function doCancel() {
    if (!cancelTarget) return;
    setCancelling(true);
    const r = await api("cancelBooking", {
      bookingId: cancelTarget.bookingId,
      token: state.token || "",
      phone: state.phone || ""
    });
    setCancelling(false);
    setCancelTarget(null);
    if (!r.ok) { showToast(r.error || t("error", null, lang), "error"); return; }
    showToast(lang === "km" ? "បាន​បោះបង់" : "Cancelled", "success");
    load();
  }

  return (
    <div className="screen scr-pad-top">
      <div className="row-between" style={{ marginBottom: 12 }}>
        <Lockup size={0.92} onClick={() => go(state.token ? "booking" : "phone")} />
        <span className="pill">{t("mb_kicker", null, lang)}</span>
      </div>
      <h1 className="h-display" style={{ fontSize: 48, margin: "10px 0 18px" }}>
        {t("mb_title", null, lang)}
      </h1>

      {loading ? (
        <div style={{ padding: 30, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
      ) : (
        <>
          <SectionLabel n="01">{t("mb_upcoming", null, lang)}</SectionLabel>
          {data && data.upcoming.length > 0 ? (
            data.upcoming.map(b => (
              <div key={b.bookingId} className="booking-card">
                <div className="top">
                  <span>{b.bookingId}</span>
                  <span>{b.memberTier || "GUEST"}</span>
                </div>
                <div className="date">{fmtDateLong(b.date, lang)}</div>
                <div className="meta">
                  {b.time} — {b.timeEnd} · {b.courts > 1 ? "Courts " : "Court "}{b.courtNumbers} · {lang === "km" ? formatDurationKm(b.slots) : formatDuration(b.slots)}
                </div>
                <div style={{ marginTop: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span className="mono" style={{ fontSize: 14, fontWeight: 500 }}>
                    {b.total === 0 ? "FREE" : "$" + Number(b.total).toFixed(2)}
                  </span>
                  <button className="ulink" style={{ fontSize: 12, color: "var(--clay)", borderColor: "var(--clay)" }}
                    onClick={() => setCancelTarget(b)}>
                    {t("mb_cancel", null, lang)}
                  </button>
                </div>
              </div>
            ))
          ) : (
            <div className="empty">
              <div className="icon">🏓</div>
              <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 24, marginBottom: 6 }}>{t("mb_empty_upcoming_h", null, lang)}</div>
              <div style={{ marginBottom: 14 }}>{t("mb_empty_upcoming_p", null, lang)}</div>
              <CTA tone="green" onClick={() => go("booking")}>{t("mb_book_now", null, lang)}</CTA>
            </div>
          )}

          {data && data.past.length > 0 && (
            <>
              <SectionLabel n="02">{t("mb_past", null, lang)}</SectionLabel>
              {data.past.map(b => (
                <div key={b.bookingId} className="booking-card past">
                  <div className="top">
                    <span>{b.bookingId}</span>
                    <span>{b.memberTier || "GUEST"}</span>
                  </div>
                  <div className="date">{fmtDateLong(b.date, lang)}</div>
                  <div className="meta">
                    {b.time} — {b.timeEnd} · {b.courts > 1 ? "Courts " : "Court "}{b.courtNumbers}
                  </div>
                </div>
              ))}
            </>
          )}

          {data && data.cancelled.length > 0 && (
            <>
              <SectionLabel n={data.past.length > 0 ? "03" : "02"}>
                {t("mb_cancelled", null, lang)}
              </SectionLabel>
              {data.cancelled.map(b => {
                const isNoShow = String(b.paymentStatus || "").toLowerCase() === "no-show";
                return (
                  <div key={b.bookingId} className="booking-card cancelled">
                    <div className="top">
                      <span>{b.bookingId}</span>
                      <span style={{ color: isNoShow ? "var(--clay)" : "inherit", fontWeight: 700 }}>
                        {isNoShow ? t("mb_no_show", null, lang) : t("mb_cancelled_tag", null, lang)}
                      </span>
                    </div>
                    <div className="date">{fmtDateLong(b.date, lang)}</div>
                    <div className="meta">
                      {b.time} — {b.timeEnd} · {b.courts > 1 ? "Courts " : "Court "}{b.courtNumbers}
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </>
      )}

      {cancelTarget && (
        <div className="modal-backdrop" onClick={() => !cancelling && setCancelTarget(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <h3>{t("mb_confirm_cancel", null, lang)}</h3>
            <p>{t("mb_confirm_cancel_sub", null, lang)}</p>
            <div className="actions">
              <button className="btn ghost" onClick={() => setCancelTarget(null)} disabled={cancelling}>
                {t("mb_keep", null, lang)}
              </button>
              <button className="btn coral" onClick={doCancel} disabled={cancelling}>
                {cancelling ? t("loading", null, lang) : t("mb_confirm_cancel_yes", null, lang)}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ====================================================================
   8. APP SHELL — top bar, language toggle, screen routing, foot nav
   ==================================================================== */

function App() {
  const [lang, setLangState] = useState(getLang());
  const [state, setState] = useState({
    phone: getStoredPhone(),
    token: getToken(),
    isMember: false,
    member: null,
    guest: null,
    confirmation: null
  });
  const [config, setConfig] = useState(null);  // pricing rules, grace period, etc.

  const [screen, setScreen] = useState("phone");
  const [bootLoading, setBootLoading] = useState(true);

  // On first load: validate existing token if any, and fetch config in parallel
  useEffect(() => {
    document.body.setAttribute("lang", lang);
    const token = getToken();

    // Always fetch config — needed for client-side pricing
    api("getConfig").then(r => {
      if (r.ok) setConfig(r);
    });

    if (!token) { setBootLoading(false); return; }

    api("validateToken", { token }).then(r => {
      setBootLoading(false);
      if (r.ok && r.valid) {
        setState(s => ({
          ...s,
          token,
          phone: r.phone || s.phone,
          isMember: !!r.isMember,
          member: r.member || null,
          guest: r.guest || null
        }));
        // Skip phone+otp screens; jump straight to booking
        const hash = (location.hash || "").replace("#", "");
        const validHashes = ["booking", "myBookings", "membership", "confirm"];
        setScreen(validHashes.includes(hash) ? hash : "booking");
      } else {
        setToken("");
      }
    });
  }, []);

  function go(s) {
    setScreen(s);
    try { location.hash = s; } catch (e) {}
    window.scrollTo(0, 0);
  }

  function switchLang(l) {
    setLangState(l);
    setLang(l);
  }

  function logout() {
    setToken("");
    setStoredPhone("");
    setState({ phone: "", token: "", isMember: false, member: null, guest: null, confirmation: null });
    go("phone");
  }

  const isSignedIn = !!state.token;

  if (bootLoading) {
    return <Loading message={t("loading", null, lang)} />;
  }

  let body = null;
  if (screen === "phone") body = <ScreenPhone state={state} setState={setState} go={go} lang={lang} />;
  else if (screen === "otp") body = <ScreenOTP state={state} setState={setState} go={go} lang={lang} />;
  else if (screen === "booking") body = <ScreenBooking state={state} setState={setState} go={go} lang={lang} config={config} />;
  else if (screen === "confirm") body = <ScreenConfirm state={state} setState={setState} go={go} lang={lang} />;
  else if (screen === "myBookings") body = <ScreenMyBookings state={state} setState={setState} go={go} lang={lang} />;
  else if (screen === "membership") body = <ScreenMembership state={state} setState={setState} go={go} lang={lang} />;
  else body = <ScreenPhone state={state} setState={setState} go={go} lang={lang} />;

  return (
    <>
      <div className="topbar">
        <span className="now">{t("open_hours", null, lang)} · TOUL KORK</span>
        <div className="lang">
          <button className={lang === "en" ? "on" : ""} onClick={() => switchLang("en")}>EN</button>
          <button className={lang === "km" ? "on" : ""} onClick={() => switchLang("km")}>ខ្មែរ</button>
        </div>
      </div>

      {body}

      {/* Foot nav appears only after sign-in */}
      {isSignedIn && screen !== "phone" && screen !== "otp" && screen !== "confirm" && (
        <div className="foot-nav">
          <button className={screen === "booking" ? "on" : ""} onClick={() => go("booking")}>
            {lang === "km" ? "កក់" : "Book"}
          </button>
          <button className={screen === "myBookings" ? "on" : ""} onClick={() => go("myBookings")}>
            {lang === "km" ? "ការ​កក់" : "Manage"}
          </button>
          <button className={screen === "membership" ? "on" : ""} onClick={() => go("membership")}>
            {lang === "km" ? "សមាជិក" : "Members"}
          </button>
          <button className="signout" onClick={logout}>
            {lang === "km" ? "ចេញ" : "Sign out"}
          </button>
        </div>
      )}
    </>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);

  </script>
