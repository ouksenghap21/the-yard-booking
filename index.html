function App() {
  const [lang, setLangState] = useState(getLang());
  const [state, setState] = useState({
    phone: getStoredPhone(),
    token: getToken(),
    isMember: false,
    member: null,
    guest: null,
    confirmation: null
  });
  const [config, setConfig] = useState(null);  // pricing rules, grace period, etc.

  const [screen, setScreen] = useState("phone");
  const [bootLoading, setBootLoading] = useState(true);
  const [configLoaded, setConfigLoaded] = useState(false);
  // H1 fix: fail-CLOSED if getConfig can't be reached. Previously a failed
  // getConfig left `config` as null but still set configLoaded=true, so the
  // app fell through to the normal booking flow with no prices and skipped
  // the pre-launch landing gate entirely. Now a failure renders a dedicated
  // blocked/retry screen instead of ever reaching the booking app.
  const [configError, setConfigError] = useState(false);
  const [configRetryTick, setConfigRetryTick] = useState(0);

  // On first load: validate existing token if any, and fetch config in parallel
  useEffect(() => {
    document.body.setAttribute("lang", lang);
    const token = getToken();

    // Always fetch config — needed for client-side pricing
    setConfigError(false);
    api("getConfig").then(r => {
      if (r && r.ok) {
        setConfig(r);
        setConfigError(false);
      } else {
        setConfig(null);
        setConfigError(true);
      }
      setConfigLoaded(true);
    }).catch(() => {
      setConfig(null);
      setConfigError(true);
      setConfigLoaded(true);
    });

    if (!token) { setBootLoading(false); return; }

    api("validateToken", { token }).then(r => {
      setBootLoading(false);
      if (r.ok && r.valid) {
        setState(s => ({
          ...s,
          token,
          phone: r.phone || s.phone,
          isMember: !!r.isMember,
          member: r.member || null,
          guest: r.guest || null
        }));
        // Skip phone+otp screens; jump straight to booking
        const hash = (location.hash || "").replace("#", "");
        const validHashes = ["phone", "otp", "booking", "myBookings", "membership", "confirm", "openplay", "about"];
        // Authenticated users: phone/otp don't make sense; redirect to booking
        const target = validHashes.includes(hash) ? hash : "booking";
        const SIGNIN_SCREENS = new Set(["phone", "otp"]);
        setScreen(SIGNIN_SCREENS.has(target) ? "booking" : target);
      } else {
        setToken("");
      }
    });
  }, [configRetryTick]);

  function go(s) {
    // Only push a new history entry when the screen actually changes.
    // Otherwise repeated taps on the same nav button pollute history
    // (e.g., user taps Membership twice → two history entries → browser
    // Back has to be pressed twice to actually go back).
    if (s !== screen) {
      setScreen(s);
      try {
        // Use pushState so each distinct screen change is one history
        // entry. location.hash = ... ALSO pushes, but Safari sometimes
        // batches assignments which led to phantom duplicates in
        // testing. pushState is explicit and reliable.
        if (location.hash !== "#" + s) {
          history.pushState(null, "", "#" + s);
        }
      } catch (e) {}
    }
    window.scrollTo(0, 0);
    // Force-blur the currently focused element. On mobile, the last-tapped
    // foot-nav button stays focused, which can make the active indicator
    // appear "stuck" on the previous tab.
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {}
  }

  // Keep React state in sync with the URL hash. Without this, back/forward
  // browser navigation would update the URL without updating the visible
  // screen, leaving the foot-nav indicator out of sync with the body.
  //
  // IMPORTANT: include "phone" and "otp" in the valid hashes. They were
  // omitted before, which meant browser Back from any screen back to "#"
  // (no hash, or #phone) was silently ignored — the screen state stayed
  // wherever it was, and the visual didn't update. Tapping Back again
  // appeared to do nothing.
  useEffect(() => {
    function onHashChange() {
      const hash = (location.hash || "").replace("#", "");
      const validHashes = ["phone", "otp", "booking", "myBookings", "membership", "confirm", "openplay", "about"];
      // Auth gate: if no token, unauth-only screens are forbidden. Force
      // back to "phone" if they try to land on booking/myBookings/openplay/
      // confirm without authenticating. Public screens (membership/about)
      // are always allowed.
      const PUBLIC_SCREENS = new Set(["phone", "otp", "membership", "about"]);
      const target = validHashes.includes(hash) ? hash : (state.token ? "booking" : "phone");
      if (!state.token && !PUBLIC_SCREENS.has(target)) {
        // Force to phone screen and rewrite URL so Back works properly.
        if (screen !== "phone") setScreen("phone");
        try { history.replaceState(null, "", "#phone"); } catch (e) {}
        return;
      }
      if (target !== screen) setScreen(target);
    }
    window.addEventListener("hashchange", onHashChange);
    // Also run once to handle direct URL entry like ouksenghap21.github.io/the-yard-booking/#booking
    // when there's no token in storage.
    onHashChange();
    return () => window.removeEventListener("hashchange", onHashChange);
  }, [screen, state.token]);

  function switchLang(l) {
    setLangState(l);
    setLang(l);
  }

  function logout() {
    setToken("");
    setStoredPhone("");
    clearLastConfirmation();
    setState({ phone: "", token: "", isMember: false, member: null, guest: null, confirmation: null });
    go("phone");
  }

  const isSignedIn = !!state.token;

  if (bootLoading || !configLoaded) {
    return <Loading message={t("loading", null, lang)} />;
  }

  // H1 fix: fail CLOSED, not open. If getConfig failed, we have no pricing,
  // no landing-page config, and no way to know if launch has happened yet —
  // rendering the normal app here would either show a bookable UI with no/
  // blank prices, or skip the pre-launch "Opening Soon" gate entirely. Block
  // with a branded retry screen instead of proceeding past this point.
  if (configError) {
    return (
      <div className="loading-overlay" style={{ flexDirection: "column", gap: 16, textAlign: "center", padding: "0 24px" }}>
        <div style={{ fontFamily: "var(--serif)", fontSize: 22, fontWeight: 700 }}>
          {t("boot_fail_title", null, lang)}
        </div>
        <div style={{ fontFamily: "var(--mono)", fontSize: 13, opacity: 0.75, maxWidth: 360 }}>
          {t("boot_fail_sub", null, lang)}
        </div>
        <button
          className="btn"
          onClick={() => {
            setConfigLoaded(false);
            setBootLoading(true);
            setConfigRetryTick(n => n + 1);
          }}
        >
          {t("boot_fail_retry", null, lang)}
        </button>
      </div>
    );
  }

  // ── Coming-soon landing takeover (customers only; staff use admin.html).
  //    Bypass with ?preview so staff can preview the live site pre-launch.
  const previewBypass = /(?:^|[?&#])preview(?:[=&#]|$)/.test(location.search + location.hash);  // QA fix: allow #hash after ?preview
  if (config && config.landing && config.landing.enabled && !previewBypass) {
    const opening = parseOpening(config.landing.openingDate);
    if (!opening || Date.now() < opening.getTime()) {
      return <LandingPage config={config} lang={lang} setLang={switchLang} />;
    }
  }

  let body = null;
  // Auth gate at the router level — defense-in-depth. If the screen state
  // somehow lands on an auth-only screen without a token (manual URL entry,
  // stale React state during boot, etc), force-render the phone screen
  // instead. This protects against the user filling out a booking form
  // they can't submit (backend would reject for missing phone, but UX-wise
  // it's better to never let them get that far).
  const AUTH_ONLY = new Set(["booking", "myBookings", "confirm", "openplay"]);
  const effectiveScreen = (!state.token && AUTH_ONLY.has(screen)) ? "phone" : screen;

  if (effectiveScreen === "phone") body = <ScreenPhone state={state} setState={setState} go={go} lang={lang} />;
  else if (effectiveScreen === "otp") body = <ScreenOTP state={state} setState={setState} go={go} lang={lang} />;
  else if (effectiveScreen === "booking") body = <ScreenBooking state={state} setState={setState} go={go} lang={lang} config={config} />;
  else if (effectiveScreen === "confirm") body = <ScreenConfirm state={state} setState={setState} go={go} lang={lang} />;
  else if (effectiveScreen === "myBookings") body = <ScreenMyBookings state={state} setState={setState} go={go} lang={lang} config={config} />;
  else if (effectiveScreen === "membership") body = <ScreenMembership state={state} setState={setState} go={go} lang={lang} />;
  else if (effectiveScreen === "openplay") body = <ScreenOpenPlay state={state} setState={setState} go={go} lang={lang} config={config} />;
  else if (effectiveScreen === "about") body = <ScreenAbout state={state} setState={setState} go={go} lang={lang} />;
  else body = <ScreenPhone state={state} setState={setState} go={go} lang={lang} />;

  return (
    <>
      <div className="topbar">
        <span className="now">{t("open_hours", null, lang)} · TOUL KORK</span>
        <div className="lang">
          <button className={lang === "en" ? "on" : ""} onClick={() => switchLang("en")}>EN</button>
          <button className={lang === "km" ? "on" : ""} onClick={() => switchLang("km")}>ខ្មែរ</button>
        </div>
      </div>

      {body}

      {/* Sponsor strip — continuous-scroll logo banner. Appears at the
          bottom of every screen, above the foot-nav (which is fixed-pos
          and overlays this naturally when signed in). Hidden when the
          SPONSORS array inside is empty. */}
      <SponsorStrip />

      {/* When foot-nav is showing, add bottom padding to prevent the
          sponsor strip's last bit from being hidden under the fixed
          navigation. 64px ≈ foot-nav height + breathing room. */}
      {isSignedIn && screen !== "phone" && screen !== "otp" && screen !== "confirm" && (
        <div style={{ height: 64 }} aria-hidden="true" />
      )}

      {/* Foot nav appears only after sign-in */}
      {isSignedIn && screen !== "phone" && screen !== "otp" && screen !== "confirm" && (
        <div className="foot-nav">
          <button className={screen === "booking" ? "on" : ""} onClick={() => go("booking")}>
            {lang === "km" ? "កក់" : "Book"}
          </button>
          <button className={screen === "openplay" ? "on" : ""} onClick={() => go("openplay")}>
            {lang === "km" ? "ល្បែង" : "Walk-in"}
          </button>
          <button className={screen === "myBookings" ? "on" : ""} onClick={() => go("myBookings")}>
            {lang === "km" ? "ការ​កក់" : "Manage"}
          </button>
          <button className={screen === "membership" ? "on" : ""} onClick={() => go("membership")}>
            {lang === "km" ? "សមាជិក" : "Members"}
          </button>
          <button className="signout" onClick={logout}>
            {lang === "km" ? "ចេញ" : "Sign out"}
          </button>
        </div>
      )}
    </>
  );
}

/**
 * Top-level error boundary — see admin.html for rationale. Without this,
 * any uncaught render error blanks the entire booking page. Customers are
 * less forgiving than staff; a graceful "reload" screen beats a white void.
 */
class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error: error };
  }
  componentDidCatch(error, info) {
    console.error("[AppErrorBoundary]", error, info);
  }
  reload() {
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("_r", Date.now());
      window.location.href = url.toString();
    } catch (e) {
      window.location.reload();
    }
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{
          padding: 32, maxWidth: 480, margin: "40px auto",
          fontFamily: "system-ui, -apple-system, sans-serif",
          background: "#fff", border: "1.5px solid #1a1a1a", borderRadius: 4,
          textAlign: "center"
        }}>
          <div style={{
            fontFamily: "ui-monospace, monospace", fontSize: 10,
            letterSpacing: "0.2em", textTransform: "uppercase",
            opacity: 0.55, marginBottom: 12
          }}>Something went wrong</div>
          <h1 style={{ fontStyle: "italic", fontWeight: 400, fontSize: 24, margin: "0 0 12px" }}>
            We hit a snag.
          </h1>
          <p style={{ fontSize: 13, lineHeight: 1.5, marginBottom: 20, opacity: 0.8 }}>
            Please reload the page. Your booking data is safe.
          </p>
          <button onClick={() => this.reload()} style={{
            background: "#1a1a1a", color: "#f1ead6", border: "none",
            padding: "11px 28px", fontSize: 14, fontWeight: 600,
            cursor: "pointer", borderRadius: 2
          }}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = createRoot(document.getElementById("root"));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);

// Register the service worker for instant repeat loads. Same pattern as
// admin.html — see sw.js for details.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("SW registration failed:", err);
    });
  });
}

  </script>

<!-- ═══════════════════════════════════════════════════════════════════
     THE YARD — PREMIUM MOTION LAYER
     Pure-vanilla JS (no React). Self-contained.
     Adds: 3D pickleball hole population, cursor-tilt for ball + cards,
     IntersectionObserver scroll-reveal, magnetic CTA hover, soft
     parallax on cinema postcard. All respects prefers-reduced-motion.
     ═══════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ─── 32 Fibonacci-distributed hole positions for the pickleball ─── */
  const HOLES = [
    [0,90],[137.5,69.3],[-85,60.6],[52.5,53.8],[-170,47.9],[-32.5,42.6],
    [105,37.8],[-117.4,33.3],[20.1,28.9],[157.6,24.8],[-64.9,20.8],
    [72.6,16.9],[-149.9,13.1],[-12.4,9.3],[125.1,5.6],[-97.4,1.8],
    [40.1,-1.8],[177.6,-5.6],[-44.9,-9.3],[92.6,-13.1],[-129.8,-16.9],
    [7.7,-20.8],[145.2,-24.8],[-77.3,-28.9],[60.2,-33.3],[-162.3,-37.8],
    [-24.8,-42.6],[112.7,-47.9],[-109.8,-53.8],[27.7,-60.6],[165.2,-69.3],
    [0,-90]
  ];
  const HOLES_HTML =
    '<div class="yb-stage">'
    + '<div class="yb-body"></div>'
    + '<div class="yb-rotator">'
    + HOLES.map(h => '<i class="yb-hole" style="--p:' + h[0] + 'deg;--e:' + h[1] + 'deg"></i>').join('')
    + '</div>'
    + '<div class="yb-glaze"></div>'
    + '<div class="yb-shadow"></div>'
    + '</div>';

  /* ─── Trajectory ribbon SVG — clay path + phantom ball + fading trail.
         The path arcs from off-screen lower-left to the pickleball's
         position, animated with stroke-dasharray "draw" + animateMotion
         for the traveling balls. Loops every 7s, matching the CSS
         keyframes above. ─── */
  const TRAIL_PATH = 'M 0 210 Q 220 -90, 472 108';
  const TRAIL_HTML = ''
    + '<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">'
      // The drawn curve
    + '<path class="yt-line" d="' + TRAIL_PATH + '"/>'
      // Impact pulse at the landing point (animated via CSS r:)
    + '<circle class="yt-impact" cx="472" cy="108" r="6"/>'
      // Trailing fade dots — earliest arrives first, larger/brighter.
      // All move along TRAIL_PATH via CSS offset-path.
    + '<circle class="yt-trail-4 yt-mover" r="2"/>'
    + '<circle class="yt-trail-3 yt-mover" r="2.5"/>'
    + '<circle class="yt-trail-2 yt-mover" r="3"/>'
    + '<circle class="yt-trail-1 yt-mover" r="3.5"/>'
    + '<circle class="yt-lead yt-mover" r="4.5"/>'
    + '</svg>';


  function initBalls(){
    document.querySelectorAll('.yard-ball:not([data-yb-init])').forEach(ball => {
      ball.dataset.ybInit = '1';
      ball.innerHTML = HOLES_HTML;
    });
    document.querySelectorAll('.yard-trail:not([data-yb-init])').forEach(t => {
      t.dataset.ybInit = '1';
      t.innerHTML = TRAIL_HTML;
    });
  }

  /* ─── Cursor-tied tilt for the 3D ball (page-wide) ─── */
  let raf = 0, pointer = null;
  function onPointerMove(e){
    pointer = { x: e.clientX, y: e.clientY };
    if (raf) return;
    raf = requestAnimationFrame(applyTilt);
  }
  function applyTilt(){
    raf = 0;
    if (!pointer) return;
    document.querySelectorAll('.yard-ball').forEach(ball => {
      const r = ball.getBoundingClientRect();
      // Skip entirely if the ball isn't on screen — saves expensive 3D
      // recomputation when the user has scrolled past the hero. The ball
      // is 140px tall, so even a tiny on-screen sliver still matters
      // visually; we add 50px buffer either side.
      if (r.bottom < -50 || r.top > window.innerHeight + 50) return;
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = (pointer.x - cx);
      const dy = (pointer.y - cy);
      // Distance falloff so ball only reacts when cursor is reasonably close
      const dist = Math.hypot(dx, dy);
      const reach = 380;
      if (dist > reach) {
        ball.style.setProperty('--tilt-x', '-8deg');
        ball.style.setProperty('--tilt-y', '14deg');
        return;
      }
      const k = (1 - dist / reach);
      const tiltY = Math.max(-25, Math.min(35, (dx / reach) * 45 * k + 14 * (1 - k)));
      const tiltX = Math.max(-25, Math.min(25, (-dy / reach) * 30 * k - 8 * (1 - k)));
      ball.style.setProperty('--tilt-x', tiltX.toFixed(1) + 'deg');
      ball.style.setProperty('--tilt-y', tiltY.toFixed(1) + 'deg');
    });
  }
  if (!reduced) document.addEventListener('pointermove', onPointerMove, { passive: true });

  /* ─── 3D tilt on date cards / court pills ─── */
  function attachCardTilt(el){
    if (el.dataset.tilt === '1') return;
    el.dataset.tilt = '1';
    el.addEventListener('pointermove', e => {
      if (reduced) return;
      const r = el.getBoundingClientRect();
      const rx = ((e.clientX - r.left) / r.width - 0.5) * 16;  // ±8deg
      const ry = ((e.clientY - r.top) / r.height - 0.5) * -12; // ±6deg
      el.style.setProperty('--rx', rx.toFixed(1) + 'deg');
      el.style.setProperty('--ry', ry.toFixed(1) + 'deg');
    });
    el.addEventListener('pointerleave', () => {
      el.style.setProperty('--rx', '0deg');
      el.style.setProperty('--ry', '0deg');
    });
  }
  function refreshCardTilt(){
    document.querySelectorAll('.date-card, .court-pill').forEach(attachCardTilt);
  }

  /* ─── Magnetic CTA: cursor pulls button slightly ─── */
  function attachMagnet(btn){
    if (btn.dataset.mag === '1') return;
    btn.dataset.mag = '1';
    btn.addEventListener('pointermove', e => {
      if (reduced) return;
      const r = btn.getBoundingClientRect();
      const mx = (e.clientX - r.left - r.width / 2) / 6;
      const my = (e.clientY - r.top - r.height / 2) / 8;
      btn.style.setProperty('--mx', mx.toFixed(2));
      btn.style.setProperty('--my', my.toFixed(2));
    });
    btn.addEventListener('pointerleave', () => {
      btn.style.setProperty('--mx', 0);
      btn.style.setProperty('--my', 0);
    });
  }
  function refreshMagnets(){
    document.querySelectorAll('.btn, .claim-btn').forEach(attachMagnet);
  }

  /* ─── Scroll reveal — IntersectionObserver ─── */
  let io = null;
  function ensureObserver(){
    if (io || reduced) return;
    io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add('in-view');
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  }
  function markReveals(){
    if (reduced) return;
    ensureObserver();
    // Targets — only the ones that benefit
    const targets = [
      '.yard-cinema',
      '.member-strip',
      '.guest-hello',
      '.gift',
      '.promo',
      '.priceblock',
      '.booking-card',
      '.tier-block',
      '.grace-card',
      '.court-svg',
      '.stamp-wrap',
      '.bookingid',
      '.date-strip',
      '.wheel',
      '.stepper',
      '.court-rail'
    ].join(',');
    document.querySelectorAll(targets).forEach(el => {
      if (el.dataset.reveal === '1') return;
      el.dataset.reveal = '1';
      el.classList.add('yard-reveal');
      // Already in viewport? mark in-view immediately so first paint isn't blank.
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) {
        // Add slight delay so paint shows the fade
        requestAnimationFrame(() => el.classList.add('in-view'));
      } else {
        io.observe(el);
      }
    });
  }

  /* ─── Cinema postcard subtle parallax on scroll ─── */
  let pRaf = 0;
  function onScroll(){
    if (pRaf) return;
    pRaf = requestAnimationFrame(() => {
      pRaf = 0;
      if (reduced) return;
      document.querySelectorAll('.yc-frame').forEach(frame => {
        const r = frame.getBoundingClientRect();
        const winH = window.innerHeight;
        // Skip the parallax math + style write if the cinema is fully
        // off-screen. Saves a layout read + style write per scroll frame
        // when the user has scrolled past the hero. Buffer 100px so we
        // still update when it's just out of view (animation prep).
        if (r.bottom < -100 || r.top > winH + 100) return;
        const center = winH / 2;
        const distance = (r.top + r.height / 2) - center;
        const par = -distance * 0.04; // gentle
        frame.style.setProperty('--par', Math.max(-24, Math.min(24, par)).toFixed(1));
      });
    });
  }
  document.addEventListener('scroll', onScroll, { passive: true });

  /* ─── Boot + re-init after React re-renders ─── */
  let _lastInit = 0;
  function initAll(){
    // Throttle to prevent rapid-fire reinit on dense React rerenders.
    // The cinema, ball, and trail animations restart visibly when their
    // DOM nodes get replaced. Limiting reinits to once per 250ms keeps
    // things steady on laptop where React rerenders can chain.
    const now = Date.now();
    if (now - _lastInit < 250) return;
    _lastInit = now;
    initBalls();
    refreshCardTilt();
    refreshMagnets();
    markReveals();
    onScroll();
  }

  // Initial + periodic check (React rerenders aren't always caught
  // by MutationObserver if subtree is dense; a 1.2s poll is cheap).
  // Shorter polling interval was triggering flicker on laptop where
  // React-CDN's reconciliation produces many small DOM mutations.
  initAll();
  let pollCount = 0;
  const poll = setInterval(() => {
    initAll();
    if (++pollCount > 10) clearInterval(poll); // 12s, then trust MutationObserver
  }, 1200);

  const mo = new MutationObserver((muts) => {
    // Only respond to ADDED nodes (new React subtree), not class/attribute
    // changes. Otherwise every IntersectionObserver-triggered class addition
    // (`.in-view`) would re-run initAll, which thrashes when scrolling.
    let added = false;
    for (const m of muts) {
      if (m.type === 'childList' && m.addedNodes.length > 0) {
        // Verify at least one added node is an element (not a text node)
        for (const n of m.addedNodes) {
          if (n.nodeType === 1) { added = true; break; }
        }
        if (added) break;
      }
    }
    if (!added) return;
    // Debounce — slightly longer than before to ride out React rerender bursts
    if (mo._t) return;
    mo._t = setTimeout(() => { mo._t = null; initAll(); }, 200);
  });
  mo.observe(document.body, { childList: true, subtree: true });

  /* ─── Pause sponsor strip animation when off-screen ───
   *
   * The sponsor strip animates infinitely via CSS keyframes. When the
   * user is at the top of the page, the strip is below the fold but
   * still consuming CPU/GPU for the animation. IntersectionObserver
   * lets us pause it when fully off-screen and resume when scrolled
   * into view.
   *
   * Mobile battery + perf savings, especially on lower-end Android.
   */
  function setupSponsorPause() {
    const strip = document.querySelector('.sponsor-strip');
    if (!strip) return false;
    if (strip.dataset.pauseObserved === '1') return true;
    strip.dataset.pauseObserved = '1';
    const track = strip.querySelector('.sponsor-track');
    if (!track) return false;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        track.style.animationPlayState = e.isIntersecting ? 'running' : 'paused';
      });
    }, { threshold: 0.05 });
    io.observe(strip);
    return true;
  }
  // Try setting it up periodically until the strip mounts (React renders
  // it after our script loads).
  let sponsorAttempts = 0;
  const sponsorPoll = setInterval(() => {
    if (setupSponsorPause() || ++sponsorAttempts > 30) clearInterval(sponsorPoll);
  }, 500);
})();
</script>
