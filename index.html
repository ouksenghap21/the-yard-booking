/* ============== WheelPicker — iOS-style scrolling time picker ============== */
function WheelPicker({ value, onChange, slots, lang }) {
  const scrollRef = useRef(null);
  const ITEM_H = 52;
  const userScrollingRef = useRef(false);
  const lastUserInputRef = useRef(0);
  const mountedRef = useRef(false);

  const idx = Math.max(0, slots.findIndex(s => s.t === value));

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;

    if (!mountedRef.current) {
      mountedRef.current = true;
      let targetIdx = idx;
      const cur = slots[targetIdx];
      if (!cur || cur.left <= 0) {
        for (let step = 1; step < slots.length; step++) {
          const down = targetIdx + step;
          const up = targetIdx - step;
          if (down < slots.length && slots[down].left > 0) { targetIdx = down; break; }
          if (up >= 0 && slots[up].left > 0) { targetIdx = up; break; }
        }
        if (slots[targetIdx] && slots[targetIdx].t !== value) {
          setTimeout(() => onChange(slots[targetIdx].t), 0);
        }
      }
      el.scrollTop = targetIdx * ITEM_H;
      return;
    }

    // If user input was within the last 250ms, skip programmatic scroll —
    // they're still interacting and our scrollTo would fight their finger.
    if (Date.now() - lastUserInputRef.current < 250) return;
    el.scrollTo({ top: idx * ITEM_H, behavior: "smooth" });
  }, [idx, slots.length]);

  function markUserScroll() {
    userScrollingRef.current = true;
    lastUserInputRef.current = Date.now();
  }

  function onScroll() {
    const el = scrollRef.current;
    if (!el) return;
    // Mark recent input so the auto-centering effect doesn't fight the finger.
    lastUserInputRef.current = Date.now();

    // LIVE feedback: highlight the slot under the center line as it scrolls
    // (throttled via rAF). Gives immediate response on browsers that stream
    // scroll events; the poll below guarantees the FINAL commit regardless.
    if (!el._rafPending) {
      el._rafPending = true;
      requestAnimationFrame(() => {
        el._rafPending = false;
        const i = Math.max(0, Math.min(slots.length - 1, Math.round(el.scrollTop / ITEM_H)));
        const slot = slots[i];
        if (slot && slot.left > 0 && slot.t !== value) onChange(slot.t);
      });
    }

    // REST DETECTION BY POLLING — the reliable, cross-browser way to know the
    // wheel has truly settled. iOS momentum frequently fires NO 'scrollend' and
    // stops emitting scroll events before the final resting position, which is
    // why the selection used to lag until the user tapped. We poll scrollTop
    // every ~70ms until it stops changing, THEN commit the centered slot
    // (snapping past any Full ones). No dependency on iOS event quirks.
    clearTimeout(el._rest);
    el._prevST = null;
    el._rest = setTimeout(function poll() {
      const cur = el.scrollTop;
      // "Rested" once scrollTop stops moving — tolerant of sub-pixel jitter that
      // a strict === compare would never satisfy (leaving the row faded forever).
      if (el._prevST != null && Math.abs(cur - el._prevST) < 1) {
        el._prevST = null;
        const i = Math.max(0, Math.min(slots.length - 1, Math.round(cur / ITEM_H)));
        const isFull = (s) => !s || s.left <= 0;
        let target = i;
        if (isFull(slots[i])) {
          target = -1;
          for (let step = 1; step < slots.length; step++) {
            if (i + step < slots.length && !isFull(slots[i + step])) { target = i + step; break; }
            if (i - step >= 0 && !isFull(slots[i - step])) { target = i - step; break; }
          }
        }
        if (target >= 0) {
          if (slots[target].t !== value) onChange(slots[target].t);
          // ALWAYS align the center line to the committed slot, so the bold
          // (selected) row and the row under the guides are the same one. A rest
          // between two rows was leaving the selection looking faded / off-centre.
          if (Math.abs(cur - target * ITEM_H) > 1) el.scrollTo({ top: target * ITEM_H, behavior: "smooth" });
        }
      } else {
        el._prevST = cur;
        el._rest = setTimeout(poll, 70);
      }
    }, 70);
  }

  // Reliable commit when momentum scrolling truly ends. iOS 16+ / Chrome 114+
  // fire 'scrollend' only once the wheel has settled, so the centered slot
  // always commits without needing a second tap. The 40ms timeout above stays
  // as a fallback for browsers that lack 'scrollend'.
  useEffect(() => {
    const el = scrollRef.current;
    if (!el || !("onscrollend" in window)) return;
    function commit() {
      const i = Math.round(el.scrollTop / ITEM_H);
      const clamped = Math.max(0, Math.min(slots.length - 1, i));
      const isFull = (x) => !x || x.left <= 0;
      let target = clamped;
      if (isFull(slots[clamped])) {
        target = -1;
        for (let step = 1; step < slots.length; step++) {
          if (clamped + step < slots.length && !isFull(slots[clamped + step])) { target = clamped + step; break; }
          if (clamped - step >= 0 && !isFull(slots[clamped - step])) { target = clamped - step; break; }
        }
      }
      if (target >= 0) {
        if (slots[target].t !== value) onChange(slots[target].t);
        if (target !== clamped) el.scrollTo({ top: target * ITEM_H, behavior: "smooth" });
      }
      userScrollingRef.current = false;
    }
    el.addEventListener("scrollend", commit);
    return () => el.removeEventListener("scrollend", commit);
  }, [slots, value, onChange]);

  return (
    <div className="wheel" style={{ height: ITEM_H * 5 }}>
      <div className="wheel-mask-top" />
      <div className="wheel-mask-bot" />
      <div className="wheel-center" />
      <div
        className="wheel-scroll"
        ref={scrollRef}
        onScroll={onScroll}
        onPointerDown={markUserScroll}
        onTouchStart={markUserScroll}
        onWheel={markUserScroll}
        onKeyDown={markUserScroll}
        tabIndex={0}
        style={{ height: "100%", paddingTop: ITEM_H * 2, paddingBottom: ITEM_H * 2 }}
      >
        {slots.map((s, i) => {
          const isCenter = i === idx;
          const dist = Math.abs(i - idx);
          const cls = isCenter ? "" : dist === 1 ? "dim" : "far";
          const isFull = s.left <= 0;
          return (
            <div
              key={s.t}
              className={"wheel-item " + cls + (isFull ? " full" : "") + (s.hot ? " hot" : "")}
              style={{ height: ITEM_H }}
              onClick={() => {
                if (isFull) return;
                onChange(s.t);
                const el = scrollRef.current;
                if (el) el.scrollTo({ top: i * ITEM_H, behavior: "smooth" });
              }}
            >
              <span>{s.label}</span>
              <span className="meta">
                {isFull
                  ? (lang === "km" ? "ពេញ" : "Full")
                  : s.hot
                    ? (lang === "km" ? "Prime" : "Prime")
                    : (lang === "km" ? (s.left + " ទំនេរ") : (s.left + " left"))}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============== CourtRail — floor-plan court selector ==============
   Courts laid out to match the real facility footprint (Sheet A-101):
   01–06 in a row, 08 as a landscape bay above the right end, 07 below it.
   Picking by spatial position beats a left→right scroll. Same props and
   toggle behaviour as before, so the caller is unchanged. The 8-court
   footprint is fixed, so the layout is intentionally hard-coded. */
function CourtRail({ value, onChange, count = 8, unavailable = [], pastClosing = false, lang }) {
  function toggle(num) {
    if (unavailable.includes(num)) {
      // L3 fix: if the chosen duration simply runs past closing time, say so
      // instead of the generic "isn't free" message (which implies it's
      // booked/taken, not that the facility is closed then).
      const msg = pastClosing
        ? (lang === "km" ? "រយៈពេលនេះលើសម៉ោងបិទ — សូមកាត់បន្ថយរយៈពេល ឬជ្រើសម៉ោងចាប់ផ្តើមមុន" : "That duration runs past closing — try a shorter duration or an earlier start time")
        : (lang === "km" ? "តារាង " + pad2(num) + " មិន​ទំនេរ​សម្រាប់​ពេល/រយៈពេល​នេះ" : "Court " + pad2(num) + " isn't free for this time/duration");
      showToast(msg, "info");
      return;
    }
    if (value.includes(num)) {
      const next = value.filter(v => v !== num);
      onChange(next.length === 0 ? [num] : next);
    } else {
      onChange([...value, num].sort((a, b) => a - b));
    }
  }
  function Court({ num, landscape }) {
    const isUnavail = unavailable.includes(num);
    const isSel = value.includes(num);
    const stateLbl = isUnavail ? t("b_court_taken", null, lang)
      : isSel ? t("b_court_yours", null, lang)
      : t("b_court_open", null, lang);
    return (
      <button
        type="button"
        style={{ gridArea: "c" + num }}
        className={"court-cell" + (landscape ? " land" : "") + (isSel ? " sel" : "") + (isUnavail ? " unavail" : "")}
        disabled={isUnavail}
        aria-pressed={isSel}
        aria-label={"Court " + num + " — " + stateLbl}
        title={"Court " + pad2(num) + " · " + stateLbl}
        onClick={() => toggle(num)}
      >
        <span className="court-lines" aria-hidden="true">
          <span className="court-kitchen" />
          <span className="court-net" />
          <span className="court-center" />
        </span>
        <span className="cn">{pad2(num)}</span>
      </button>
    );
  }
  return (
    <div className="court-map" role="group" aria-label="Select courts by facility layout">
      <div className="court-map-grid">
        <Court num={8} landscape />
        <Court num={1} />
        <Court num={2} />
        <Court num={3} />
        <Court num={4} />
        <Court num={5} />
        <Court num={6} />
        <Court num={7} />
      </div>
      <div className="court-map-legend">
        <span><i className="dot open" />{t("b_court_open", null, lang)}</span>
        <span><i className="dot sel" />{t("b_court_yours", null, lang)}</span>
        <span><i className="dot taken" />{t("b_court_taken", null, lang)}</span>
      </div>
    </div>
  );
}

/**
 * BouncingBall — a pickleball bouncing left→right across a dotted court line.
 * Used wherever we used to render a spinner.
 *
 * Sizes: "sm" (120×60, inline use), "md" (200×90, default), "lg" (280×120, full-screen).
 */
function BouncingBall({ size = "md", onDark = false }) {
  const cls = "bouncer bouncer-" + size + (onDark ? " on-dark" : "");
  return (
    <div className={cls} aria-label="Loading" role="status">
      <div className="ground" />
      <div className="ball-track">
        <div className="ball" />
      </div>
    </div>
  );
}

function Loading({ message }) {
  return (
    <div className="loading-overlay">
      <BouncingBall size="md" />
      {message ? <div className="msg">{message}</div> : null}
    </div>
  );
}

let toastTimeout = null;
function showToast(msg, kind) {
  let el = document.getElementById("toast-host");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast-host";
    document.body.appendChild(el);
  }
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { el.remove(); }, 3000);
}

function ScreenPhone({ state, setState, go, lang }) {
  const [phone, setPhone] = useState(state.phone || "");
  const [founding, setFounding] = useState(null);
  const [sending, setSending] = useState(false);

  // v63 — "Book here" CTA: the hero button scrolls to the phone step and
  // focuses the input, making it obvious that the phone field IS the
  // booking entry point (customer feedback: "phone number can be many
  // other things").
  const bookStepRef = useRef(null);
  const phoneInputRef = useRef(null);
  function scrollToBook() {
    try {
      if (bookStepRef.current) {
        bookStepRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      // Focus after the smooth scroll has (mostly) settled. preventScroll
      // keeps the focus from fighting the smooth scroll animation.
      setTimeout(() => {
        if (phoneInputRef.current) {
          try { phoneInputRef.current.focus({ preventScroll: true }); }
          catch (e) { phoneInputRef.current.focus(); }
        }
      }, 450);
    } catch (e) { /* non-fatal — worst case the button does nothing */ }
  }

  const valid = normalizePhone(phone).length >= 8;

  useEffect(() => {
    api("getFoundingStatus").then(r => {
      if (r.ok) setFounding(r);
    });
  }, []);

  async function onContinue() {
    if (!valid || sending) return;
    // M10 fix: shared OTP-send guard — blocks the Phone→OTP→Back→Continue
    // loop from firing unlimited SMS sends (cooldown + hard per-session cap).
    const guard = otpSendGuardCheck();
    if (!guard.allowed) {
      if (guard.reason === "max") {
        showToast(lang === "km" ? "អ្នកបានស្នើសុំកូដច្រើនដងពេកសម្រាប់ការចូលមើលនេះ។ សូមផ្ទុកទំព័រម្ដងទៀត។" : "Too many code requests this visit. Please reload the page to try again.", "error");
      } else {
        const secs = Math.ceil(guard.remainingMs / 1000);
        showToast(lang === "km" ? "សូមរង់ចាំ " + secs + " វិនាទីមុននឹងស្នើសុំកូដម្ដងទៀត" : "Please wait " + secs + "s before requesting another code", "error");
      }
      return;
    }
    setSending(true);
    const norm = normalizePhone(phone);
    setStoredPhone(norm);
    const r = await api("sendOTP", { phone: norm });
    setSending(false);
    if (r.ok && r.sent !== false) otpSendGuardRecord();
    if (!r.ok) {

      return;
    }
    // The backend returns ok:true even when the SMS itself failed to send

    // no text actually went out — there'd be no code to enter. Surface the
    // real reason so the failure isn't silent. (r.sent===false is explicit so
    // older backends that omit the field stay backward-compatible.)
    if (r.sent === false) {

/* ===================== SCREEN 2: OTP ===================== */
function ScreenOTP({ state, setState, go, lang }) {
  const [code, setCode] = useState("");
  // M10 fix: 60s cooldown (was 30s) between resends, shared with ScreenPhone's
  // "Continue" via the module-level otpSendGuard so a Phone→OTP→Back→Continue
  // loop can't dodge this cooldown.
  const [resendIn, setResendIn] = useState(60);
  const [resendMaxHit, setResendMaxHit] = useState(false);
  const [verifying, setVerifying] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    if (resendIn <= 0) return;
    const id = setInterval(() => setResendIn(s => Math.max(0, s - 1)), 1000);
    return () => clearInterval(id);
  }, [resendIn]);

  function setDigit(i, v) {
    v = v.replace(/\D/g, "").slice(-1);
    const arr = code.padEnd(6, " ").split("");
    arr[i] = v || " ";
    const next = arr.join("").trimEnd();
    setCode(next);
    setError("");

    if (v && i < 5) {
      const el = document.getElementById("otp-" + (i + 1));
      el && el.focus();
    }

    if (next.replace(/\s/g, "").length === 6) {
      tryVerify(next.trim());
    }
  }

  async function tryVerify(c) {
    setVerifying(true);
    const r = await api("verifyOTP", {
      phone: state.phone,
      code: c,
      device: navigator.userAgent.substring(0, 80)
    });
    setVerifying(false);
    if (!r.ok || !r.verified) {
      setError(r.error || t("error", null, lang));
      setCode("");
      return;
    }
    setToken(r.token);
    setState(s => ({
      ...s,
      token: r.token,
      isMember: r.isMember,
      member: r.member,
      guest: r.guest || null
    }));
    go("booking");
  }

  async function resend() {
    if (resendIn > 0 || resendMaxHit) return;
    // M10 fix: shared OTP-send guard — 60s cooldown + 5-sends-per-page-session
    // hard cap, enforced across both ScreenPhone and ScreenOTP so no combination
    // of Back/Continue/Resend taps can loop unlimited SMS sends.
    const guard = otpSendGuardCheck();
    if (!guard.allowed) {
      if (guard.reason === "max") {
        setResendMaxHit(true);
        showToast(lang === "km" ? "អ្នកបានស្នើសុំកូដច្រើនដងពេកសម្រាប់ការចូលមើលនេះ។ សូមផ្ទុកទំព័រម្ដងទៀត។" : "Too many code requests this visit. Please reload the page to try again.", "error");
      } else {
        setResendIn(Math.ceil(guard.remainingMs / 1000));
      }
      return;
    }
    setResendIn(60);
    const r = await api("sendOTP", { phone: state.phone });
    if (r.ok && r.sent !== false) otpSendGuardRecord();
    if (!r.ok) showToast(r.error || t("error", null, lang), "error");
    else showToast(lang === "km" ? "បាន​ផ្ញើ" : "Sent", "success");
  }

  const last3 = state.phone ? state.phone.slice(-3) : "···";

  return (
    <div className="screen scr-pad-top">
      <div className="row-between">
        <button onClick={() => go("phone")}
          style={{ background: "transparent", border: "1.5px solid var(--ink)", padding: "6px 10px", cursor: "pointer", borderRadius: 999, fontFamily: "var(--mono)", fontWeight: 500, fontSize: 11, letterSpacing: "0.1em" }}>
          {t("o_back", null, lang)}
        </button>
        <span className="pill">{t("o_step", null, lang)}</span>
      </div>

      <div style={{ position: "relative", marginTop: 22 }}>
        <div className="mono" style={{ fontSize: 11, letterSpacing: "0.16em" }}>
          {t("o_sent_to", { phone: state.phone ? state.phone.slice(0, 2) + " ··· " + last3 : "··· ···" }, lang)}
        </div>
        <h1 className="h-display" style={{ fontSize: 60, margin: "6px 0" }}>
          {t("o_h1_a", null, lang)}<br />{t("o_h1_b", null, lang)}
        </h1>
        <p style={{ fontSize: 14, lineHeight: 1.45, maxWidth: "32ch", margin: "6px 0 22px" }}>
          {t("o_sub", null, lang)}
        </p>
      </div>

      <SectionLabel n="01">{t("o_label", null, lang)}</SectionLabel>
      <div className="otp-row">
        {Array.from({ length: 6 }).map((_, i) => {
          const ch = code[i];
          const filled = ch && ch !== " ";
          const isActive = !filled && code.length === i;
          return (
            <label key={i}
              className={"otp-box" + (filled ? " filled" : "") + (isActive ? " active" : "")}
              htmlFor={"otp-" + i}>
              {filled ? ch : (isActive ? <span className="caret" /> : "")}
              <input
                id={"otp-" + i}
                inputMode="numeric"
                pattern="[0-9]*"
                value={filled ? ch : ""}
                onChange={(e) => setDigit(i, e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Backspace" && !ch) {
                    const prev = document.getElementById("otp-" + Math.max(0, i - 1));
                    prev && prev.focus();
                  }
                }}
              />
            </label>
          );
        })}
      </div>

      {error ? (
        <div className="hint" style={{ marginTop: 14, color: "var(--clay)", fontWeight: 600 }}>{error}</div>
      ) : null}

      <div className="hint" style={{ marginTop: 18, display: "flex", justifyContent: "space-between" }}>
        <span>{t("o_remember", null, lang)}</span>
        {resendMaxHit
          ? <span className="mono" style={{ fontWeight: 500, opacity: 0.6 }}>
              {lang === "km" ? "ដល់ដែនកំណត់ហើយ — សូមផ្ទុកទំព័រម្ដងទៀត" : "Limit reached — reload the page"}
            </span>
          : resendIn > 0
            ? <span className="mono" style={{ fontWeight: 500 }}>{t("o_resend_in", { s: resendIn }, lang)}</span>
            : <button className="ulink" onClick={resend} disabled={resendMaxHit} style={{ fontSize: 12 }}>{t("o_resend", null, lang)}</button>}
      </div>

      {verifying ? <Loading message={t("o_verifying", null, lang)} /> : null}
    </div>
  );
}

/* ===================== SCREEN 3: BOOKING ===================== */
function ScreenBooking({ state, setState, go, lang, config }) {
  const isMember = !!state.isMember;
  const isGuest = !isMember;
  const member = state.member;
  const isFounding = member && String(member.tier).toLowerCase() === "founding";
  const memberName = (member && member.name) ? member.name.split(" ")[0] : "";

  // Booking state
  const [date, setDate] = useState(state.date || todayISO());
  const [time, setTime] = useState(state.time || "18:00");
  const [slots, setSlots] = useState(state.slots || 2);   // 30-min slots; 2 = 1 hour
  const [pickedCourts, setPickedCourts] = useState(state.pickedCourts || [1]);
  // Pre-fill name: member name if member, else guest name from prior bookings
  const guestRecord = state.guest;
  const [guestName, setGuestName] = useState(
    state.guestName ||
    (member ? member.name : "") ||
    (guestRecord ? guestRecord.name : "")
  );

  // Live data
  const [availLoading, setAvailLoading] = useState(true);
  const [availSlots, setAvailSlots] = useState([]);
  const [foundingStatus, setFoundingStatus] = useState(null);

  // Birthday gift state
  const [bdayClaimed, setBdayClaimed] = useState(false);
  const [bdayEligible, setBdayEligible] = useState(false);

  // Hard reset: if user is not a member, birthday state must be off.
  // This protects against stale React state if member status changes
  // (e.g. user signs out / token re-validates with new info).
  useEffect(() => {
    if (!isMember) {
      if (bdayEligible) setBdayEligible(false);
      if (bdayClaimed) setBdayClaimed(false);
    }
  }, [isMember]);

  // Submit state
  const [submitting, setSubmitting] = useState(false);
  // Synchronous in-flight guard. React batches state updates, so on a fast
  // double-tap both click handlers can fire before `submitting` hits the DOM.
  // A ref flips immediately and reliably blocks the second call.
  const submittingRef = useRef(false);

  /* Fetch availability for a given date and update the slots/time state.
     Extracted so the booking-conflict path (H2) can re-run the same load. */
  function loadAvailability(targetDate, opts) {
    opts = opts || {};
    setAvailLoading(true);
    return api("getAvailability", { date: targetDate }).then(r => {
      if (opts.cancelled && opts.cancelled()) return r;
      setAvailLoading(false);
      if (!r.ok) {
        showToast(r.error || t("error", null, lang), "error");
        setAvailSlots([]);
        return r;
      }
      setAvailSlots(r.slots || []);
      // Pick first available time if current isn't available
      const cur = (r.slots || []).find(s => s.time === time);
      if (!cur || cur.availableCount <= 0) {
        const firstFree = (r.slots || []).find(s => s.availableCount > 0);
        if (firstFree) setTime(firstFree.time);
      }
      return r;
    });
  }

  /* Load availability whenever date changes */
  useEffect(() => {
    let cancelled = false;
    loadAvailability(date, { cancelled: () => cancelled });
    return () => { cancelled = true; };
  }, [date]);

  /* Load Founding status (for guest promo card) */
  useEffect(() => {
    api("getFoundingStatus").then(r => { if (r.ok) setFoundingStatus(r); });
  }, []);

  /* Birthday eligibility — computed client-side from cached member info */
  useEffect(() => {
    if (!isMember || !member) {
      if (bdayEligible) setBdayEligible(false);
      return;
    }
    const windowDays = (config && config.birthdayWindowDays) || 3;
    const eligible = isBirthdayEligibleClient(member, date, windowDays);
    if (eligible !== bdayEligible) setBdayEligible(eligible);
    // If date moves out of birthday window while claimed, un-claim it.
    if (!eligible && bdayClaimed) setBdayClaimed(false);
  }, [isMember, member, date, config]);

  /* Price calculation — pure client-side, instant updates */
  const pricing = useMemo(() => {
    if (!config) return null;  // wait for config to load
    return calculatePriceClient({
      config: config,
      isMember: isMember,
      tier: member ? member.tier : "",
      isBirthdayEligible: bdayEligible,
      useBirthday: bdayClaimed && isMember,
      date: date, time: time, slots: slots, courts: pickedCourts.length
    });
  }, [config, isMember, member, bdayEligible, bdayClaimed, date, time, slots, pickedCourts.length]);

  /* Convert backend slots → wheel format */
  const wheelSlots = useMemo(() => {
    return (availSlots || [])
      .filter(s => s.availableCount > 0 || true) // keep full slots visible as 'full'
      .map(s => {
        const dObj = new Date(date + "T12:00:00");
        const hr = parseInt(s.time.split(":")[0], 10);
        const peak = isWeekend(dObj) || hr >= 17;
        return {
          t: s.time,
          label: s.time,
          left: s.availableCount,
          hot: peak && s.availableCount > 0
        };
      });
  }, [availSlots, date]);

  /* Court availability for the *selected* time + duration */
  const courtAvailability = useMemo(() => {
    // Find the slot index for `time`. If not found, no courts available.
    const startIdx = (availSlots || []).findIndex(s => s.time === time);
    if (startIdx < 0) return { available: [], unavailable: [1, 2, 3, 4, 5, 6, 7, 8], pastClosing: false };
    const unavailable = [];
    const available = [];
    // L3 fix: distinguish "runs past closing" (no availability ROW exists for
    // a later slot — the facility just isn't open then) from "booked/taken"
    // (the row exists but that specific court is occupied), so the UI can
    // show the right message instead of a generic "unavailable" for both.
    let pastClosing = false;
    for (let c = 0; c < COURTS_COUNT; c++) {
      let ok = true;
      for (let s = 0; s < slots; s++) {
        const row = availSlots[startIdx + s];
        if (!row) { ok = false; pastClosing = true; break; }
        if (!row.courts || !row.courts[c]) { ok = false; break; }
      }
      if (ok) available.push(c + 1);
      else unavailable.push(c + 1);
    }
    return { available, unavailable, pastClosing };
  }, [availSlots, time, slots]);

  /* If selected courts become unavailable for the chosen time+duration, prune
     them — but TELL the user, so their picked court is never silently swapped. */
  const courtPruneMountedRef = useRef(false);
  useEffect(() => {
    const valid = pickedCourts.filter(n => courtAvailability.available.includes(n));
    if (valid.length !== pickedCourts.length) {
      const dropped = pickedCourts.filter(n => !courtAvailability.available.includes(n));
      const next = (valid.length === 0 && courtAvailability.available.length > 0)
        ? [courtAvailability.available[0]]
        : (valid.length ? valid : [courtAvailability.available[0] || 1]);
      setPickedCourts(next);
      if (courtPruneMountedRef.current && dropped.length && courtAvailability.available.length > 0) {
        const dl = dropped.map(n => pad2(n)).join(", ");
        showToast(
          (dropped.length === 1 ? "Court " + dl + " isn't" : "Courts " + dl + " aren't") +
          " free for the full time — switched to Court " + pad2(next[0]) + ".",
          "info"
        );
      }
    }
    courtPruneMountedRef.current = true;
  }, [courtAvailability.unavailable.join(",")]);

  /* Force 2 slots + 1 court when birthday session claimed */
  useEffect(() => {
    if (bdayClaimed) {
      if (slots !== 4) setSlots(4); // 4 × 30min = 2 hours
      if (pickedCourts.length !== 1) setPickedCourts([pickedCourts[0] || courtAvailability.available[0] || 1]);
    }
  }, [bdayClaimed]);

  const peakLabel = useMemo(() => {
    const dObj = new Date(date + "T12:00:00");
    const [h, m] = time.split(":").map(Number);
    let peak = 0, off = 0;
    for (let i = 0; i < slots; i++) {
      const totalMin = h * 60 + m + i * SLOT_MINUTES;
      const hr = Math.floor(totalMin / 60);
      if (isWeekend(dObj) || hr >= 17) peak++; else off++;
    }
    if (peak > 0 && off === 0) return t("b_peak", null, lang);
    if (off > 0 && peak === 0) return t("b_offpeak", null, lang);
    return t("b_mixed", null, lang);
  }, [date, time, slots, lang]);

  const guestSavings = useMemo(() => {
    if (!isGuest || !pricing) return 0;
    // Keep cents precision, consistent with all other money math.
    return Math.round(pricing.subtotal * 0.5 * 100) / 100;
  }, [pricing, isGuest]);

  function ctaLabel() {
    if (isGuest && !guestName.trim()) return t("b_cta_add_name", null, lang);
    if (bdayClaimed) return t("b_cta_claim", null, lang);
    return t("b_cta_confirm", null, lang);
  }
  function ctaTone() {
    return bdayClaimed ? "coral" : "ink";
  }
  // M11/H4: when the selected date is today (in Cambodia), the chosen start
  // time must not be in the past. Compared using Cambodia wall-clock time
  // (nowInCambodia), NOT the device's local clock — so a traveler or a phone
  // with the wrong timezone/date sees the same slots a Phnom Penh local would.
  const isPastStart = useMemo(() => {
    const cambodiaNow = nowInCambodia();
    if (date !== cambodiaNow.dateStr) return false;
    const [hh, mi] = (time || "00:00").split(":").map(Number);
    const startMin = (hh || 0) * 60 + (mi || 0);
    const nowMin = cambodiaNow.h * 60 + cambodiaNow.mi + cambodiaNow.s / 60;
    return startMin < nowMin;
  }, [date, time]);

  function ctaDisabled() {
    if (isGuest && !guestName.trim()) return true;
    if (submitting) return true;
    if (courtAvailability.available.length === 0) return true;
    if (isPastStart) return true;   // can't book a start time that already passed today
    return false;
  }

  async function submit() {
    if (ctaDisabled()) return;
    if (submittingRef.current) return;   // synchronous double-tap guard
    submittingRef.current = true;
    setSubmitting(true);
    try {
      const r = await api("createBooking", {
        token: state.token || "",
        phone: state.phone,
        name: guestName || (member ? member.name : ""),
        email: (member && member.email) || "",
        date, time, slots,
        courts: pickedCourts.length,
        // H1: also send the actual chosen court numbers (e.g. "3,7"). Backend
        // honors requestedCourts when free, else falls back. `courts` (count)
        // kept for backward compatibility.
        requestedCourts: pickedCourts.join(","),
        useBirthday: bdayClaimed ? 1 : 0,
        source: "Web"
      });
      if (!r.ok) {
        // M13: graceful session-expiry re-auth. If the backend rejected us on
        // an auth/session problem, the token is stale — clear it and bounce to
        // the phone screen rather than leaving the user stuck on an error.
        if (isSessionError(r.error)) { handleSessionExpiry(setState, go, lang); return; }
        // H2: a conflict (slot just taken) — re-fetch availability for the
        // selected date so the wheel reflects reality, then ask them to retry.
        showToast(
          lang === "km"
            ? "ពេល​នេះ​ត្រូវ​បាន​កក់​រួច — ភាព​ទំនេរ​ត្រូវ​បាន​ផ្ទុក​ឡើង​វិញ សូម​ជ្រើស​ម្ដង​ទៀត។"
            : "That slot was just taken — availability refreshed, please pick again.",
          "error"
        );
        loadAvailability(date);
        return;
      }
      // H3: stash the client quote so the confirm screen can reconcile it
      // against the server's settled total and flag any mismatch.
      const quotedTotal = pricing ? pricing.total : null;
      const requestedCourts = pickedCourts.join(",");
      setState(s => ({ ...s, confirmation: r.confirmation, quotedTotal: quotedTotal, requestedCourts: requestedCourts }));
      // M9 fix: persist so a refresh on the confirmation screen restores it
      // instead of dying to a blank/dead screen.
      saveLastConfirmation(r.confirmation, quotedTotal, requestedCourts);
      go("confirm");
    } finally {
      submittingRef.current = false;
      setSubmitting(false);
    }
  }

  const lockedDuration = bdayClaimed && isMember;
  const lockedCourts = bdayClaimed && isMember;

  return (
    <div className="screen scr-pad-top">
      <div className="row-between" style={{ marginBottom: 14 }}>
        <Lockup size={0.92} onClick={() => go(state.token ? "booking" : "phone")} />
        <span className="pill">{t("b_title", null, lang)}</span>
      </div>

      {/* Member or guest strip */}
      {isMember && (
        <div className={"member-strip" + (isFounding ? " founding" : "")}>
          <div className="top">
            <span>{t("b_welcome", null, lang)}</span>
            <span>{t("b_member_no", null, lang)} {member.memberNumber}</span>
          </div>
          <div className="name">{memberName}</div>
          <div className="row-end">
            <TierBadge tier={isFounding ? "FOUNDING" : "STANDARD"} number={member.memberNumber} />
            <span className="mono" style={{ fontSize: 10.5, letterSpacing: "0.12em", opacity: 0.8 }}>
              {t("b_expires", null, lang)} {member.expiryDate || "—"}
            </span>
          </div>
        </div>
      )}

      {isGuest && (
        <div className="guest-hello">
          <div className="top">
            <span>
              {guestRecord
                ? t("b_guest_returning", { n: guestRecord.totalBookings }, lang)
                : t("b_guest_top", null, lang)}
            </span>
            <span>+855 {maskPhone(state.phone)}</span>
          </div>
          <div className="h">
            {guestRecord && guestRecord.name
              ? t("b_guest_h_back", { name: guestRecord.name.split(" ")[0] }, lang)
              : t("b_guest_h", null, lang)}
          </div>
          <input
            value={guestName}
            placeholder={t("b_guest_placeholder", null, lang)}
            onChange={(e) => setGuestName(e.target.value)}
          />
        </div>
      )}

      {/* Birthday gift card for eligible members */}
      {isMember && bdayEligible && (
        <div className={"gift" + (bdayClaimed ? " claimed" : "")}>
          <div className="kicker">{t("g_kicker", null, lang)}</div>
          <h3>{bdayClaimed ? t("g_h_claimed", null, lang) : t("g_h_unclaimed", null, lang)}</h3>
          <p>{isFounding ? t("g_p_founding", null, lang) : t("g_p_standard", null, lang)}</p>
          {!bdayClaimed
            ? <button className="claim-btn" onClick={() => setBdayClaimed(true)}>{t("g_claim", null, lang)}</button>
            : <div className="hint" style={{ color: "inherit", opacity: 0.8 }}>{t("g_claimed_note", null, lang)}</div>}
        </div>
      )}

      {/* DATE */}
      <SectionLabel n="01" right={t("b_date_right", { n: 14 }, lang)}>
        {t("b_label_date", null, lang)}
      </SectionLabel>
      <DateStrip value={date} onChange={setDate} daysAhead={14} lang={lang} />

      {/* TIME */}
      <div style={{ marginTop: 18 }}>
        <SectionLabel n="02" right={peakLabel}>{t("b_label_time", null, lang)}</SectionLabel>
        {availLoading
          ? <div className="wheel" style={{ height: 260, display: "flex", alignItems: "center", justifyContent: "center" }}><BouncingBall size="md" /></div>
          : wheelSlots.length === 0
            ? <div className="empty"><div>{t("b_no_slots", null, lang)}</div></div>
            : <WheelPicker value={time} onChange={setTime} slots={wheelSlots} lang={lang} />}
        <div className="hint" style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ display: "inline-block", width: 8, height: 8, background: "var(--coral)", border: "2px solid var(--ink)" }} />
          <span>{t("b_peak_pip_hint", null, lang)}</span>
        </div>
      </div>

      {/* DURATION — 30-min steps */}
      <div style={{ marginTop: 22 }}>
        <SectionLabel n="03" right={lockedDuration ? t("b_locked_gift", null, lang) : t("b_duration_right", null, lang)}>
          {t("b_label_duration", null, lang)}
        </SectionLabel>
        <Stepper
          value={lockedDuration ? 4 : slots}
          onChange={(v) => !lockedDuration && setSlots(v)}
          min={MIN_SLOTS}
          max={MAX_SLOTS}
          unitLabel={lang === "km" ? "រយៈពេល" : "DURATION"}
        />
        <div className="hint" style={{ marginTop: 8 }}>
          {lockedDuration ? t("b_dur_lock_hint", null, lang) : t("b_duration_hint", null, lang)}
        </div>
        {/* L3 fix: immediate, specific feedback when the chosen duration runs
            past closing time (as opposed to a generic "unavailable" message
            surfacing only after tapping a court). */}
        {!lockedDuration && courtAvailability.pastClosing && (
          <div className="hint" style={{ marginTop: 4, color: "var(--clay)", fontWeight: 600 }}>
            {lang === "km"
              ? "រយៈពេលនេះលើសម៉ោងបិទ — សូមកាត់បន្ថយរយៈពេល ឬជ្រើសម៉ោងចាប់ផ្តើមមុន"
              : "That duration runs past closing — try a shorter duration or an earlier start time"}
          </div>
        )}
      </div>

      {/* COURTS */}
      <div style={{ marginTop: 22 }}>
        <SectionLabel n="04" right={lockedCourts ? t("b_locked_gift", null, lang) : t("b_courts_right", null, lang)}>
          {t("b_label_courts", null, lang)}
        </SectionLabel>
        <CourtRail
          value={pickedCourts}
          onChange={setPickedCourts}
          count={COURTS_COUNT}
          unavailable={courtAvailability.unavailable}
          pastClosing={courtAvailability.pastClosing}
          lang={lang}
        />
        <div className="hint" style={{ marginTop: 8 }}>
          {lockedCourts
            ? t("b_court_lock_hint", null, lang)
            : (pickedCourts.length === 1
                ? t("b_court_hint_one", null, lang)
                : t("b_court_hint_many", { n: pickedCourts.length }, lang))}
        </div>
      </div>

      {/* GUEST PROMO */}
      {isGuest && pricing && (
        <div className="promo" style={{ marginTop: 20 }}>
          <div className="head">
            <span>{t("pr_head", null, lang)}</span>
            <span>{t("pr_seats", { n: foundingStatus ? Math.max(0, foundingStatus.foundingRemaining) : "·" }, lang)}</span>
          </div>
          <div className="body">
            <h3>
              {t("pr_h_save", null, lang)} <span className="save">${guestSavings}</span> {t("pr_h_today", null, lang)}
            </h3>
            <div className="tiers">
              <div className="tier-card">
                <div className="name">{t("pr_standard", null, lang)}</div>
                <div className="pct"><b>−30</b>%</div>
              </div>
              <div className="tier-card gold">
                <div className="name">{t("pr_founding", null, lang)}</div>
                <div className="pct"><b>−50</b>%</div>
              </div>
            </div>
            <div className="cta-row">
              <span className="seats">$200/yr · {t("m_visit", null, lang)}</span>
              <button className="learn" onClick={() => go("membership")}>{t("pr_learn", null, lang)}</button>
            </div>
          </div>
        </div>
      )}

      {/* PRICE */}
      <div style={{ marginTop: 24 }}>
        <div className="label">
          <span className="num">05</span>
          <span>{t("b_label_summary", null, lang)}</span>
        </div>
        <div className="priceblock">
          {pricing ? (
            <>
              {pricing.isMixed ? (
                // Mixed-rate: itemize each bucket
                pricing.breakdown.map(b => (
                  <div className="price-row" key={b.bucket}>
                    <span className="k">
                      {b.bucket === "offpeak"
                        ? t("b_offpeak_line", null, lang)
                        : t("b_peak_line", null, lang)}
                      {" · "}
                      {formatDuration(b.slots)} × {pickedCourts.length}
                      {" · $"}{b.rate}/hr
                    </span>
                    <span className="v" key={"v-" + b.bucket + "-" + b.amount}>${b.amount.toFixed(2)}</span>
                  </div>
                ))
              ) : (
                // Single-rate booking
                <div className="price-row">
                  <span className="k">
                    {formatDuration(slots)} × {pickedCourts.length} {pickedCourts.length > 1 ? t("c_courts", null, lang).toLowerCase() : t("c_court", null, lang).toLowerCase()} · {peakLabel.toLowerCase()}
                  </span>
                  <span className="v" key={"v-sub-" + pricing.subtotal}>${pricing.subtotal.toFixed(2)}</span>
                </div>
              )}

              {pricing.isMixed && (
                <div className="price-row subtotal-row" style={{ paddingTop: 8, borderTop: "1px dashed rgba(26,26,26,0.18)", marginTop: 2 }}>
                  <span className="k" style={{ fontWeight: 700 }}>{t("b_subtotal", null, lang)}</span>
                  <span className="v" key={"v-mixsub-" + pricing.subtotal}>${pricing.subtotal.toFixed(2)}</span>
                </div>
              )}

              {pricing.discountPct > 0 && pricing.discountPct < 100 && (
                <div className="price-row discount">
                  <span className="k">
                    {isFounding ? t("b_founding_disc", null, lang) : t("b_member_disc", null, lang)}
                  </span>
                  <span className="v" key={"v-disc-" + pricing.discountAmount}>${pricing.discountAmount.toFixed(2)}</span>
                </div>
              )}

              {pricing.discountPct === 100 && (
                <>
                  <div className="price-row strike">
                    <span className="k">{t("b_standard_rate", null, lang)}</span>
                    <span className="v" key={"v-strike-" + pricing.subtotal}>${pricing.subtotal.toFixed(2)}</span>
                  </div>
                  <div className="price-row discount" style={{ color: "var(--green-2)" }}>
                    <span className="k">{t("b_birthday_gift", null, lang)}</span>
                    <span className="v" key={"v-bday-" + pricing.subtotal}>${pricing.subtotal.toFixed(2)}</span>
                  </div>
                </>
              )}

              <div className="rule" style={{ margin: "10px 0 6px" }} />

              <div className="price-row total">
                <span className="k">{t("b_total", null, lang)}</span>
                <span className="v" key={"v-total-" + pricing.total}>${pricing.total.toFixed(2)}</span>
              </div>
              <div className="hint" style={{ margin: "4px 0 10px", display: "flex", alignItems: "center", gap: 6 }}>
                <span className="mono" style={{
                  fontSize: 10, padding: "2px 5px",
                  background: "var(--ink)", color: "var(--cream)",
                  letterSpacing: "0.14em", fontWeight: 500
                }}>USD</span>
                <span>{t("b_pay_at_counter", null, lang)}</span>
              </div>
            </>
          ) : (
            <div style={{ padding: 10, textAlign: "center", opacity: 0.7 }}>
              <BouncingBall size="sm" />
            </div>
          )}
        </div>
      </div>

      {/* CTA */}
      <div style={{ marginTop: 14 }}>
        <CTA tone={ctaTone()} disabled={ctaDisabled()} onClick={submit}>
          {submitting ? t("loading", null, lang) : ctaLabel()}
        </CTA>
      </div>

      <div className="footer-note" style={{ marginTop: 18 }}>
        THE YARD · TOUL KORK · PHNOM PENH
      </div>

      {submitting && <Loading message={t("loading", null, lang)} />}
    </div>
  );
}

/* ===================== SCREEN 4: CONFIRMATION ===================== */
function ScreenConfirm({ state, setState, go, lang }) {
  const c = state.confirmation;
  const [copied, setCopied] = useState(false);
  // M9 fix: on mount, if React state has no confirmation (e.g. the page was
  // refreshed while sitting on #confirm — React state is lost but the hash
  // router still lands here), try to restore the last confirmation from
  // sessionStorage. If there's nothing to restore, route to My Bookings
  // instead of showing a dead/blank screen.
  const [restoreChecked, setRestoreChecked] = useState(false);
  useEffect(() => {
    if (c) { setRestoreChecked(true); return; }
    const restored = loadLastConfirmation();
    if (restored) {
      setState(s => ({
        ...s,
        confirmation: restored.confirmation,
        quotedTotal: restored.quotedTotal,
        requestedCourts: restored.requestedCourts
      }));
      setRestoreChecked(true);
    } else {
      go("myBookings");
    }
    // eslint-disable-next-line
  }, []);

  if (!c) {
    if (!restoreChecked) {
      return <Loading message={t("loading", null, lang)} />;
    }
    return (
      <div className="screen scr-pad-top">
        <p>{t("error", null, lang)}</p>
        <CTA onClick={() => go("booking")} tone="ink">{t("back", null, lang)}</CTA>
      </div>
    );
  }

  function copy() {
    navigator.clipboard.writeText(c.bookingId).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  const isFounding = c.memberTier && String(c.memberTier).toLowerCase() === "founding";

  // Safe first-court for the diagram label. c.courtNumbers may be a number,
  // a comma string ("3,7"), or missing — coerce defensively so .split never
  // throws and blanks the just-paid success screen.
  const firstCourt = String(c.courtNumbers || c.courts || "1").split(",")[0].trim() || "1";

  // If the courts actually booked differ from what the customer picked (their
  // court was taken between viewing and confirming, so the server assigned the
  // next free one), flag it — otherwise "I picked 8 but got 7" looks like a bug.
  const _bookedCourts = String(c.courtNumbers || "").split(",").map(x => parseInt(x.trim())).filter(n => n >= 1).sort((a, b) => a - b);
  const _askedCourts = String(state.requestedCourts || "").split(",").map(x => parseInt(x.trim())).filter(n => n >= 1).sort((a, b) => a - b);
  const courtMismatch = _bookedCourts.length > 0 && _askedCourts.length > 0 &&
    (_bookedCourts.length !== _askedCourts.length || _bookedCourts.some((n, i) => n !== _askedCourts[i]));

  // Reconcile client quote vs server charge. state.quotedTotal is the price
  // the customer saw before paying; if the server settled on a meaningfully
  // different number, surface a gentle informational notice (not an error).
  const quoted = (state.quotedTotal != null) ? Number(state.quotedTotal) : null;
  const priceMismatch = (quoted != null && c.total != null && Math.abs(quoted - c.total) > 0.01);

  return (

      </div>

      <div className="stamp-wrap">
        <div className="stamp">
          {t("c_stamp", null, lang)}
          <span className="dot"></span>
        </div>
        <p style={{ fontSize: 15, lineHeight: 1.5, margin: "8px 0 22px", maxWidth: "30ch" }}>{t("c_sub", null, lang)}</p>
      </div>

      <div className="label"><span className="num">01</span><span>{t("c_booking_id", null, lang)}</span></div>
      <div className="bookingid" style={{ marginBottom: 16 }}>
        <span>{c.bookingId}</span>
        <button className="copy" onClick={copy}>{copied ? t("c_copied", null, lang) : t("c_copy", null, lang)}</button>
      </div>

      {/* Heads-up: grace period notice */}
      <div className="grace-card" style={{ marginBottom: 18 }}>

        <div className="grace-title">{t("grace_title", null, lang)}</div>
        <div className="grace-body">{t("grace_body", null, lang)}</div>
      </div>

      {/* Court diagram */}
      <svg viewBox="0 0 360 220" className="court-svg" preserveAspectRatio="none" style={{ marginBottom: 20 }}>
        <rect x="0" y="0" width="360" height="220" fill="#F1EAD6" />
        <rect x="20" y="20" width="320" height="180" fill="#3D7A4F" />
        <rect x="140" y="20" width="80" height="180" fill="#C64F3A" />
        <rect x="20" y="20" width="320" height="180" fill="none" stroke="#F1EAD6" strokeWidth="2.5" />
        <line x1="140" y1="20" x2="140" y2="200" stroke="#F1EAD6" strokeWidth="2.5" />
        <line x1="220" y1="20" x2="220" y2="200" stroke="#F1EAD6" strokeWidth="2.5" />
        <line x1="20" y1="110" x2="140" y2="110" stroke="#F1EAD6" strokeWidth="2.5" />
        <line x1="220" y1="110" x2="340" y2="110" stroke="#F1EAD6" strokeWidth="2.5" />
        <line x1="180" y1="14" x2="180" y2="206" stroke="#1A1A1A" strokeWidth="3" strokeDasharray="3 3" />
        <circle cx="180" cy="14" r="4" fill="#1A1A1A" />
        <circle cx="180" cy="206" r="4" fill="#1A1A1A" />
        <g transform="translate(180,110)">

      <div className="label"><span className="num">02</span><span>Details</span></div>
      <div style={{ marginBottom: 18 }}>

        <div className="detail-row">

        <div className="detail-row">
          <span className="k">{c.courts > 1 ? t("c_courts", null, lang) : t("c_court", null, lang)}</span>

        </div>
        {courtMismatch && (
          <div className="hint" style={{ marginTop: 4, marginBottom: 6, color: "var(--clay)", opacity: 0.95 }}>
            {lang === "km"
              ? "តារាង​ដែល​អ្នក​ជ្រើស​មិន​ទំនេរ​ទៀត​ទេ — អ្នក​ត្រូវ​បាន​កក់​តារាង​ខាង​លើ​ជំនួស។"
              : "The court you picked was no longer free at that time — you're booked on the court shown above instead."}

        )}
        <div className="detail-row">
          <span className="k">{t("c_duration", null, lang)}</span>
          <span className="v">{lang === "km" ? formatDurationKm(c.slots) : formatDuration(c.slots)}</span>

        <div className="detail-row">
          <span className="k">{t("c_player", null, lang)}</span>
          <span className="v">{c.name}{c.memberNumber ? " · " + c.memberNumber : ""}</span>
        </div>
        <div className="detail-row">
          <span className="k">{t("c_total", null, lang)}</span>
          <span className="v" style={{ color: c.total === 0 ? "var(--green)" : "var(--ink)", fontWeight: 700 }}>
            {c.total === 0 ? (lang === "km" ? "ឥត​គិត​ថ្លៃ" : "FREE") : "$" + c.total.toFixed(2)}

        </div>
        {priceMismatch && (
          <div className="hint" style={{ marginTop: 6, color: "var(--ink)", opacity: 0.85 }}>
            {lang === "km"
              ? "តម្លៃ​ចុង​ក្រោយ​ត្រូវ​បាន​បញ្ជាក់​ត្រឹម $" + c.total.toFixed(2)

        )}

      {/* L4 fix: only claim the SMS was sent when the backend actually

      {c.smsSent === true && (

          📱 {t("c_sms", { p: maskPhone(c.phone) }, lang).replace("***", "")} · {t("c_reminder", null, lang)}
