<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#F1EAD6" />
  <title>The Yard — Book a Court</title>
  <meta name="description" content="The Yard · Pickleball · Toul Kork, Phnom Penh. Book a court online." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@400;500;600;700&family=Noto+Serif+Khmer:wght@400;500;700&display=swap" />

  <style>
/* ====================================================================
   THE YARD — BRAND STYLESHEET v01
   Ported 1:1 from the Claude Design React prototype.
   Brand: Cream / Ink / Court Green / Clay / Wood / Concrete
   Type:  Fraunces (display italic) + Manrope (sans) + DM Mono (numbers)
   ==================================================================== */

:root{
  /* Palette */
  --cream:#F1EAD6;
  --cream-2:#E5DBBE;
  --paper:#F7F0DC;
  --green:#3D7A4F;
  --green-2:#2B5938;
  --green-3:#1E4126;
  --clay:#C64F3A;
  --clay-2:#A53D2C;
  --wood:#A8744A;
  --wood-2:#7A5436;
  --concrete:#C9C6BD;
  --ink:#1A1A1A;
  --peach:#D9785C;

  /* Aliases used inside components */
  --bone:var(--cream);
  --bone-2:var(--cream-2);
  --jade:var(--green);
  --jade-2:var(--green-2);
  --coral:var(--clay);
  --coral-2:var(--clay-2);
  --gold:var(--wood);
  --gold-2:var(--wood-2);

  /* Type stacks — Khmer-aware */
  --sans:'Manrope','Noto Sans Khmer',ui-sans-serif,system-ui,sans-serif;
  --serif:'Fraunces','Noto Serif Khmer',ui-serif,Georgia,serif;
  --mono:'DM Mono',ui-monospace,monospace;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--cream);
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* When Khmer is selected, swap to Khmer fonts seamlessly */
body[lang="km"]{ font-family:'Noto Sans Khmer','Manrope',sans-serif; }
body[lang="km"] .h-display,
body[lang="km"] .serif,
body[lang="km"] h1,body[lang="km"] h2,body[lang="km"] h3{
  font-family:'Noto Serif Khmer','Fraunces',serif;
}

/* ========== App shell ========== */
#root{
  width:100%;
  max-width:520px;
  margin:0 auto;
  background:var(--cream);
  position:relative;
  min-height:100vh;
  min-height:100dvh;
}

.screen{ padding:8px 22px 120px; position:relative; }
.scr-pad-top{ padding-top:8px; }

/* ========== Top utility bar (date + lang toggle) ========== */
.topbar{
  position:sticky; top:0; z-index:50;
  height:42px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px;
  background:var(--cream);
  border-bottom:1px dashed rgba(26,26,26,0.18);
  font-family:var(--mono);
  font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
  font-weight:500;
}
.topbar .now{ opacity:0.8; }
.topbar .lang{
  display:flex; gap:0; align-items:stretch;
  border:1.5px solid var(--ink);
  border-radius:999px; overflow:hidden;
}
.topbar .lang button{
  background:transparent; border:0;
  padding:4px 10px;
  font-family:var(--mono); font-weight:500;
  font-size:10px; letter-spacing:0.16em;
  color:var(--ink); cursor:pointer;
}
.topbar .lang button.on{ background:var(--ink); color:var(--cream); }

/* ========== Type ========== */
.h-display{
  font-family:var(--serif); font-weight:400; font-style:italic;
  line-height:0.92; letter-spacing:-0.02em;
}
.h-sans{
  font-family:var(--sans); font-weight:800;
  letter-spacing:-0.01em; line-height:1.0;
}
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.serif{ font-family:var(--serif); }

/* ========== Buttons (CTA) ========== */
.btn{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; min-height:58px; padding:0 22px;
  background:var(--green); color:var(--cream);
  border:1.5px solid var(--ink);
  border-radius:999px;
  font-family:var(--sans); font-weight:700; font-size:15px;
  letter-spacing:0.06em; text-transform:uppercase;
  cursor:pointer; transition:transform .08s ease, background .12s ease;
  font-family:var(--sans);
}
.btn:active{ transform:translateY(1px); }
.btn.coral{ background:var(--clay); color:var(--cream); }
.btn.ink{ background:var(--ink); color:var(--cream); }
.btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
.btn .arrow{ font-family:var(--mono); font-size:18px; font-weight:500; }
.btn:disabled{ opacity:0.45; cursor:not-allowed; }

/* ========== Inputs ========== */
.input{
  width:100%; min-height:56px;
  background:var(--paper);
  border:1.5px solid var(--ink);
  border-radius:14px;
  padding:0 18px;
  font-family:var(--mono); font-size:18px;
  color:var(--ink);
  outline:none;
  transition:background .12s ease, border-color .12s ease;
}
.input:focus{ background:#fff; border-color:var(--green); }

/* ========== Section label ========== */
.label{
  font-family:var(--sans); font-weight:800;
  font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--ink);
  display:flex; align-items:center; gap:8px;
  margin:4px 0 10px;
}
.label .num{
  font-family:var(--mono); font-size:10px; font-weight:500;
  background:var(--ink); color:var(--cream);
  padding:2px 5px;
}
.label .right{
  margin-left:auto;
  font-family:var(--mono); font-size:10px; font-weight:500;
  letter-spacing:0.12em; opacity:0.6;
}

/* ========== Rules ========== */
.rule{ height:1.5px; background:var(--ink); width:100%; }
.rule-thin{ height:1px; background:var(--ink); opacity:0.22; }

/* ========== Pill / sticker ========== */
.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-weight:500;
  font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  padding:5px 10px; border:1.5px solid var(--ink); background:var(--paper);
  border-radius:999px;
}
.sticker{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 10px;
  border:1.5px solid var(--ink);
  background:var(--cream);
  border-radius:999px;
  font-family:var(--mono); font-weight:500;
  font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
}
.sticker.clay{ background:var(--clay); color:var(--cream); border-color:var(--clay); }
.sticker.green{ background:var(--green); color:var(--cream); border-color:var(--green); }
.sticker.ink{ background:var(--ink); color:var(--cream); border-color:var(--ink); }

/* ========== Hint text ========== */
.hint{
  font-family:var(--sans); font-size:13px; color:var(--ink);
  opacity:0.65; line-height:1.45;
}

/* ========== Helpers ========== */
.row{ display:flex; align-items:center; gap:8px; }
.row-between{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

/* ========== Court line motif (dink trajectory) ========== */
.trajectory{
  position:relative; height:32px; width:100%; margin:6px 0;
}
.trajectory svg{ width:100%; height:100%; display:block; overflow:visible; }

/* ========== Date strip ========== */
.date-strip{
  display:flex; gap:10px; overflow-x:auto;
  padding:2px 2px 8px;
  scrollbar-width:none;
  margin:0 -22px; padding-left:22px; padding-right:22px;
}
.date-strip::-webkit-scrollbar{ display:none; }
.date-card{
  flex:0 0 66px; height:86px;
  border:1.5px solid var(--ink); background:var(--paper);
  border-radius:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; cursor:pointer;
  font-family:var(--sans); font-weight:700;
  transition:background .12s ease, color .12s ease;
  position:relative;
}
.date-card .dow{ font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.7; }
.date-card .dnum{ font-family:var(--mono); font-weight:500; font-size:28px; line-height:1; }
.date-card .mo{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.6; }
.date-card:hover{ background:var(--cream-2); }
.date-card.active{ background:var(--green); color:var(--cream); border-color:var(--green); }
.date-card.active .dow,
.date-card.active .mo{ opacity:0.85; }
.date-card.today::after{
  content:"TODAY"; position:absolute; top:-12px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:8px; font-weight:500;
  background:var(--clay); color:var(--cream);
  padding:2px 5px; letter-spacing:0.1em;
  border-radius:4px;
}

/* ========== Time wheel picker (iOS-style) ========== */
.wheel{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--paper);
  overflow:hidden;
}
.wheel .wheel-mask-top,
.wheel .wheel-mask-bot{
  position:absolute; left:0; right:0; height:56px; pointer-events:none; z-index:2;
}
.wheel .wheel-mask-top{ top:0; background:linear-gradient(to bottom, var(--paper) 30%, rgba(247,240,220,0)); }
.wheel .wheel-mask-bot{ bottom:0; background:linear-gradient(to top, var(--paper) 30%, rgba(247,240,220,0)); }
.wheel .wheel-center{
  position:absolute; left:8px; right:8px; top:50%; transform:translateY(-50%);
  height:52px; border-top:1.5px solid var(--ink); border-bottom:1.5px solid var(--ink);
  pointer-events:none; z-index:1;
}
.wheel .wheel-center::before,
.wheel .wheel-center::after{
  content:""; position:absolute; top:50%; width:8px; height:8px;
  background:var(--clay); border-radius:50%; transform:translateY(-50%);
}
.wheel .wheel-center::before{ left:-12px; }
.wheel .wheel-center::after{ right:-12px; }
.wheel .wheel-scroll{
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  mask-image:linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
}
.wheel .wheel-scroll::-webkit-scrollbar{ display:none; }
.wheel .wheel-item{
  scroll-snap-align:center;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px;
  font-family:var(--mono); font-size:26px; font-weight:500;
  letter-spacing:-0.01em;
  color:var(--ink);
  transition:opacity .15s ease, transform .15s ease;
  cursor:pointer;
}
.wheel .wheel-item.dim{ opacity:0.35; font-size:21px; }
.wheel .wheel-item.far{ opacity:0.15; font-size:19px; }
.wheel .wheel-item .meta{
  font-family:var(--sans); font-size:11px; font-weight:700;
  letter-spacing:0.12em; text-transform:uppercase;
  opacity:0.7;
}
.wheel .wheel-item.dim .meta,
.wheel .wheel-item.far .meta{ opacity:0.5; }
.wheel .wheel-item.full{ color:var(--ink); }
.wheel .wheel-item.full .meta{ color:var(--clay); opacity:1; font-weight:800; }
.wheel .wheel-item.hot .meta{ color:var(--clay); opacity:1; font-weight:800; }

/* ========== Stepper (duration / courts) ========== */
.stepper{
  display:flex; align-items:stretch;
  border:1.5px solid var(--ink); border-radius:18px;
  overflow:hidden; background:var(--paper);
  min-height:74px;
}
.stepper .btn-step{
  width:60px; flex:none;
  background:transparent; border:0;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:32px; color:var(--ink);
  transition:background .12s ease, color .12s ease;
}
.stepper .btn-step:hover:not(:disabled){ background:var(--cream-2); }
.stepper .btn-step:disabled{ opacity:0.25; cursor:not-allowed; }
.stepper .btn-step.minus{ border-right:1.5px solid var(--ink); }
.stepper .btn-step.plus{ border-left:1.5px solid var(--ink); background:var(--green); color:var(--cream); }
.stepper .btn-step.plus:hover:not(:disabled){ background:var(--green-2); }
.stepper .val{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:0 12px;
}
.stepper .val .num{
  font-family:var(--mono); font-weight:500; font-size:36px; line-height:1;
  letter-spacing:-0.02em;
}
.stepper .val .sub{
  font-family:var(--sans); font-size:10px; font-weight:800;
  letter-spacing:0.14em; text-transform:uppercase;
  opacity:0.65;
  align-self:flex-end; padding-bottom:9px;
}
.stepper .pips{
  display:flex; gap:3px; align-self:flex-end; padding-bottom:10px;
  margin-left:4px;
}
.stepper .pips i{
  width:5px; height:5px; border-radius:50%;
  background:var(--ink); opacity:0.18;
  display:block;
}
.stepper .pips i.on{ background:var(--clay); opacity:1; }

/* ========== Court rail ========== */
.court-rail{
  display:flex; gap:6px; padding:14px;
  border:1.5px solid var(--ink); border-radius:14px;
  background:var(--paper);
  overflow-x:auto; scrollbar-width:none;
}
.court-rail::-webkit-scrollbar{ display:none; }
.court-pill{
  flex:0 0 auto;
  min-width:52px;
  padding:10px 8px;
  border:1.5px solid var(--ink);
  border-radius:10px;
  background:var(--cream);
  font-family:var(--mono); font-weight:500;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer;
  transition:background .12s ease;
}
.court-pill .id{ font-size:14px; }
.court-pill .lbl{
  font-family:var(--sans); font-size:9px; font-weight:800; letter-spacing:0.1em;
  text-transform:uppercase; opacity:0.55;
}
.court-pill.sel{ background:var(--green); color:var(--cream); border-color:var(--green); }
.court-pill.sel .lbl{ opacity:0.85; }
.court-pill.unavail{
  opacity:0.35; cursor:not-allowed;
  background:repeating-linear-gradient(45deg, transparent 0 5px, rgba(26,26,26,0.18) 5px 6px);
}
.court-pill:hover:not(.sel):not(.unavail){ background:var(--cream-2); }

/* ========== Floor-plan court selector (Sheet A-101 footprint) ========== */
.court-map{ margin-top:4px; }
.court-map-grid{
  display:grid;
  grid-template-columns:repeat(6, 1fr);
  grid-template-areas:
    ".  .  .  .  c8 c8"
    "c1 c2 c3 c4 c5 c6"
    ".  .  .  .  .  c7";
  gap:7px;
}
.court-cell{
  position:relative;
  aspect-ratio:3 / 4;
  border:1.5px solid var(--ink);
  border-radius:7px;
  background:#B7CE9B;                 /* matcha court surface */
  display:flex; align-items:flex-end; justify-content:flex-start;
  padding:5px 6px;
  cursor:pointer; overflow:hidden;
  box-shadow:var(--lift-1);
  transition:background 0.12s ease, transform 0.06s ease;
  -webkit-tap-highlight-color:transparent;
}
.court-cell.land{ aspect-ratio:5 / 3; }   /* 08 sits landscape in the real plan */
.court-cell:active{ transform:translateY(1px); }
/* court boundary line — "outline the shape of the court" (inset like real markings) */
.court-lines{ position:absolute; inset:11%; border:1.5px solid var(--ink); z-index:1; }
/* clay non-volley zone (kitchen) straddling the net */
.court-kitchen{ position:absolute; left:0; right:0; top:34%; height:32%; background:var(--clay); }
.court-cell.land .court-kitchen{ left:34%; right:34%; top:0; bottom:0; height:auto; }
/* net across the middle */
.court-net{ position:absolute; left:0; right:0; top:50%; height:0; border-top:2.5px solid var(--ink); transform:translateY(-1.25px); }
.court-cell.land .court-net{ left:50%; top:0; bottom:0; right:auto; width:0; height:auto; border-top:none; border-left:2.5px solid var(--ink); transform:translateX(-1.25px); }
/* centerline (service division) perpendicular to the net */
.court-center{ position:absolute; top:0; bottom:0; left:50%; width:0; border-left:1.5px solid var(--ink); transform:translateX(-0.75px); }
.court-cell.land .court-center{ left:0; right:0; top:50%; bottom:auto; height:0; width:auto; border-left:none; border-top:1.5px solid var(--ink); transform:translateY(-0.75px); }
.court-cell .cn{
  position:relative; z-index:2;
  font-family:var(--serif); font-style:italic; font-size:clamp(13px,3.5vw,17px);
  line-height:1; color:var(--ink);
}
/* selected → brand-green court, cream markings (kitchen stays clay) */
.court-cell.sel{ background:var(--green); border-color:var(--green); }
.court-cell.sel .court-lines{ border-color:var(--cream); }
.court-cell.sel .court-net,
.court-cell.sel .court-center{ border-color:var(--cream); }
.court-cell.sel .cn{ color:var(--cream); }
/* unavailable → muted */
.court-cell.unavail{ background:rgba(26,26,26,0.06); border-color:rgba(26,26,26,0.22); cursor:not-allowed; box-shadow:none; opacity:0.75; }
.court-cell.unavail .court-lines{ border-color:rgba(26,26,26,0.25); }
.court-cell.unavail .court-kitchen{ background:rgba(26,26,26,0.12); }
.court-cell.unavail .court-net,
.court-cell.unavail .court-center{ border-color:rgba(26,26,26,0.25); }
.court-cell.unavail .cn{ color:rgba(26,26,26,0.42); text-decoration:line-through; }
.court-cell:hover:not(.sel):not(.unavail){ background:#A9C487; }
.court-map-legend{
  display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:12px;
  font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--ink); opacity:0.72;
}
.court-map-legend span{ display:inline-flex; align-items:center; gap:6px; }
.court-map-legend .dot{ width:11px; height:11px; border-radius:3px; border:1.5px solid var(--ink); }
.court-map-legend .dot.open{ background:#B7CE9B; }
.court-map-legend .dot.sel{ background:var(--green); border-color:var(--green); }
.court-map-legend .dot.taken{ background:rgba(26,26,26,0.12); border-color:rgba(26,26,26,0.3); }

/* ========== Member strip ========== */
.member-strip{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--green); color:var(--cream);
  padding:18px;
  margin-bottom:20px;
  overflow:hidden;
}
.member-strip::after{
  content:"";
  position:absolute; right:-30px; top:-30px;
  width:160px; height:160px;
  border:1.5px solid rgba(241,234,214,0.2);
  border-radius:50%;
  pointer-events:none;
}
.member-strip .top{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  opacity:0.85; font-weight:500;
}
.member-strip .name{
  font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:34px; line-height:1; margin:8px 0 12px;
  letter-spacing:-0.02em;
}
.member-strip .row-end{
  display:flex; justify-content:space-between; align-items:flex-end; gap:8px;
}
.tier{
  display:inline-flex; align-items:center; gap:6px;
  border:1.5px solid var(--cream);
  background:transparent; color:var(--cream);
  font-family:var(--mono); font-weight:500;
  font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  padding:5px 10px; border-radius:999px;
}
.member-strip.founding{ background:var(--wood); color:var(--cream); }
.member-strip.founding::after{ border-color:rgba(241,234,214,0.25); }

/* ========== Guest hello (mirror member strip but cream) ========== */
.guest-hello{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--paper);
  padding:18px;
  margin-bottom:20px;
}
.guest-hello .top{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
  opacity:0.65; font-weight:500;
}
.guest-hello .h{
  font-family:var(--serif); font-style:italic; font-weight:400;
  font-size:28px; line-height:1; margin:8px 0 12px; letter-spacing:-0.02em;
}
.guest-hello input{
  width:100%; min-height:48px;
  background:#fff;
  border:1.5px solid var(--ink);
  border-radius:12px;
  padding:0 14px;
  font-family:var(--sans); font-size:16px; font-weight:600;
  color:var(--ink); outline:none;
}
.guest-hello input:focus{ border-color:var(--green); }

/* ========== Birthday gift card ========== */
.gift{
  position:relative;
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--clay);
  color:var(--cream);
  padding:22px 20px 20px;
  margin-bottom:20px;
  overflow:hidden;
}

/* ========== Loading: bouncing pickleball ========== */
/* A pickleball trajectory motif — bounces left-to-right with diminishing
   arcs, ending in a small roll. Built from two independent animations:
   horizontal slide + vertical bounce. Combined they give realistic physics. */

.bouncer{
  position:relative;
  display:flex;
  align-items:center; justify-content:center;
  overflow:hidden;
}
.bouncer-sm{ width:120px; height:60px; }
.bouncer-md{ width:200px; height:90px; }
.bouncer-lg{ width:280px; height:120px; }

.bouncer .ground{
  position:absolute;
  left:8%; right:8%; bottom:14%;
  height:0;
  border-bottom:1.5px dashed rgba(26,26,26,0.35);
}
.bouncer.on-dark .ground{
  border-bottom-color:rgba(241,234,214,0.35);
}

.bouncer .ball-track{
  position:absolute;
  left:8%; bottom:14%;
  width:0; height:0;
  animation:ballSlideLeft 1.7s cubic-bezier(0.42, 0, 0.7, 1) infinite;
}
.bouncer .ball{
  position:absolute;
  left:-7px; bottom:-7px;
  width:14px; height:14px;
  background:var(--clay);
  border-radius:50%;
  animation:ballBounce 1.7s cubic-bezier(0.5, 0, 0.5, 1) infinite, ballFade 1.7s linear infinite;
  box-shadow:0 2px 0 rgba(26,26,26,0.10);
}
.bouncer.on-dark .ball{ background:var(--clay); }
.bouncer-sm .ball{ width:10px; height:10px; left:-5px; bottom:-5px; }
.bouncer-lg .ball{ width:18px; height:18px; left:-9px; bottom:-9px; }

/* Fade the ball in/out at loop boundaries so the restart doesn't look like
   a teleport. */
@keyframes ballFade{
  0%   { opacity:0; }
  8%   { opacity:1; }
  92%  { opacity:1; }
  100% { opacity:0; }
}

/* Horizontal slide: track moves from left to right across the bouncer */
@keyframes ballSlideLeft{
  0%   { left:0%; }
  100% { left:84%; }
}

/* Update slide duration to match new 1.7s timing */
.bouncer .ball-track{
  animation-duration:1.7s;
}

/* Vertical bounce: 3 progressively-smaller arcs followed by a small roll.
   Negative translateY = up. The cubic-bezier gives gravity-feel curves. */
@keyframes ballBounce{
  /* Start: dropped from height */
  0%   { transform:translateY(-44px) scaleY(1) scaleX(1); }
  /* Squish on first impact */
  18%  { transform:translateY(0)     scaleY(0.65) scaleX(1.25); }
  /* Rebound 1 (full arc) */
  20%  { transform:translateY(0)     scaleY(1.05) scaleX(0.95); }
  35%  { transform:translateY(-30px) scaleY(1)    scaleX(1); }
  48%  { transform:translateY(0)     scaleY(0.7)  scaleX(1.2); }
  /* Rebound 2 (smaller) */
  50%  { transform:translateY(0)     scaleY(1.04) scaleX(0.96); }
  62%  { transform:translateY(-18px) scaleY(1)    scaleX(1); }
  73%  { transform:translateY(0)     scaleY(0.75) scaleX(1.15); }
  /* Rebound 3 (smallest) */
  75%  { transform:translateY(0)     scaleY(1.02) scaleX(0.98); }
  84%  { transform:translateY(-8px)  scaleY(1)    scaleX(1); }
  92%  { transform:translateY(0)     scaleY(0.85) scaleX(1.08); }
  /* Final roll out */
  100% { transform:translateY(0)     scaleY(1)    scaleX(1); }
}
.bouncer-sm .ball{ animation-name:ballBounceSm; }
@keyframes ballBounceSm{
  0%   { transform:translateY(-28px) scaleY(1) scaleX(1); }
  18%  { transform:translateY(0)     scaleY(0.65) scaleX(1.25); }
  20%  { transform:translateY(0)     scaleY(1.05) scaleX(0.95); }
  35%  { transform:translateY(-20px) scaleY(1) scaleX(1); }
  48%  { transform:translateY(0)     scaleY(0.7) scaleX(1.2); }
  50%  { transform:translateY(0)     scaleY(1.04) scaleX(0.96); }
  62%  { transform:translateY(-12px) scaleY(1) scaleX(1); }
  73%  { transform:translateY(0)     scaleY(0.75) scaleX(1.15); }
  75%  { transform:translateY(0)     scaleY(1.02) scaleX(0.98); }
  84%  { transform:translateY(-5px)  scaleY(1) scaleX(1); }
  92%  { transform:translateY(0)     scaleY(0.85) scaleX(1.08); }
  100% { transform:translateY(0)     scaleY(1) scaleX(1); }
}
.bouncer-lg .ball{ animation-name:ballBounceLg; }
@keyframes ballBounceLg{
  0%   { transform:translateY(-60px) scaleY(1) scaleX(1); }
  18%  { transform:translateY(0)     scaleY(0.65) scaleX(1.25); }
  20%  { transform:translateY(0)     scaleY(1.05) scaleX(0.95); }
  35%  { transform:translateY(-42px) scaleY(1) scaleX(1); }
  48%  { transform:translateY(0)     scaleY(0.7) scaleX(1.2); }
  50%  { transform:translateY(0)     scaleY(1.04) scaleX(0.96); }
  62%  { transform:translateY(-24px) scaleY(1) scaleX(1); }
  73%  { transform:translateY(0)     scaleY(0.75) scaleX(1.15); }
  75%  { transform:translateY(0)     scaleY(1.02) scaleX(0.98); }
  84%  { transform:translateY(-10px) scaleY(1) scaleX(1); }
  92%  { transform:translateY(0)     scaleY(0.85) scaleX(1.08); }
  100% { transform:translateY(0)     scaleY(1) scaleX(1); }
}

/* Optional: a faint trajectory trail behind the ball */
.bouncer .trail{
  position:absolute; inset:0;
  pointer-events:none; opacity:0.16;
}
.bouncer .trail svg{ width:100%; height:100%; }

/* ========== Loading overlay ========== */
.loading-overlay{
