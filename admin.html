function NewWalkInBlockModal({ dateDefault, onClose, onCreated }) {
  const [form, setForm] = useState({
    date: dateDefault || todayISO(),
    time: "18:00",
    durationHours: 2,
    court: 1,
    notes: ""
  });
  const [availSlots, setAvailSlots] = useState([]);
  const [submitting, setSubmitting] = useState(false);
  const [computedRate, setComputedRate] = useState(null);

  // Compute the auto rate based on date + start time
  useEffect(() => {
    api("adminGetWalkInRate", { date: form.date, time: form.time }).then(r => {
      if (r.ok) setComputedRate(r);
    });
  }, [form.date, form.time]);

  // Load availability for chosen date
  useEffect(() => {
    api("getAvailability", { date: form.date }).then(r => {
      if (r.ok) setAvailSlots(r.slots || []);
    });
  }, [form.date]);

  // Court availability across full duration
  const courtAvailability = useMemo(() => {
    if (!availSlots.length) return { unavailable: [] };
    const startIdx = availSlots.findIndex(s => s.time === form.time);
    if (startIdx < 0) return { unavailable: [1,2,3,4,5,6,7,8] };
    const slots = Math.round(form.durationHours * 60 / 30);
    const courtsAvail = new Set([1,2,3,4,5,6,7,8]);
    for (let i = 0; i < slots; i++) {
      const s = availSlots[startIdx + i];
      if (!s) return { unavailable: [1,2,3,4,5,6,7,8] };
      const courtsBoolArr = s.courts || [];
      for (let cIdx = 0; cIdx < 8; cIdx++) {
        const courtNum = cIdx + 1;
        if (!courtsBoolArr[cIdx]) courtsAvail.delete(courtNum);
      }
    }
    return { unavailable: [1,2,3,4,5,6,7,8].filter(c => !courtsAvail.has(c)) };
  }, [availSlots, form.time, form.durationHours]);

  async function submit() {
    if (courtAvailability.unavailable.includes(form.court)) {
      return showToast("Court " + form.court + " is busy during this window", "error");
    }
    setSubmitting(true);
    const r = await api("adminCreateWalkInBlock", {
      date: form.date,
      time: form.time,
      durationHours: form.durationHours,
      court: form.court,
      notes: form.notes
    });
    setSubmitting(false);
    if (r.ok) {
      showToast("Open play block created · $" + r.rate + "/player", "success");
      onCreated && onCreated(r.blockId);
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  // Time options
  const timeOptions = useMemo(() => {
    const out = [];
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      for (const m of [0, 30]) {
        out.push(String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0"));
      }
    }
    return out;
  }, []);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 540 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">Open court for drop-in players</div>
            <h2>New Open Play</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field-row three">
          <div className="field">
            <div className="field-label">Date</div>
            <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          </div>
          <div className="field">
            <div className="field-label">Start time</div>
            <select value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })}>
              {timeOptions.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="field">
            <div className="field-label">Duration</div>
            <select value={form.durationHours} onChange={(e) => setForm({ ...form, durationHours: parseFloat(e.target.value) })}>
              <option value={1}>1h</option>
              <option value={1.5}>1h 30m</option>
              <option value={2}>2h</option>
              <option value={2.5}>2h 30m</option>
              <option value={3}>3h</option>
              <option value={4}>4h</option>
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Court</div>
          <div className="court-picker">
            {[1,2,3,4,5,6,7,8].map(c => {
              const isUnavail = courtAvailability.unavailable.includes(c);
              const isOn = form.court === c;
              return (
                <div
                  key={c}
                  className={"ct" + (isOn ? " on" : "") + (isUnavail ? " unavail" : "")}
                  onClick={() => { if (!isUnavail) setForm({ ...form, court: c }); }}
                >C·{c}</div>
              );
            })}
          </div>
        </div>

        {computedRate && (
          <div className="math-preview">
            <div className="row total facility">
              <span className="k">Auto rate per player</span>
              <span className="v">${computedRate.rate.toFixed(2)}</span>
            </div>
            <div className="formula">
              {form.time >= "17:00" || (new Date(form.date + "T12:00:00").getDay() % 6 === 0)
                ? "Peak (weekday after " + computedRate.peakStartHour + ":00 or weekend)"
                : "Off-peak (weekday before " + computedRate.peakStartHour + ":00)"}
              {" · Cap: " + computedRate.maxPlayers + " players"}
            </div>
          </div>
        )}

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea value={form.notes} placeholder="e.g. Open play night · all skill levels"
            onChange={(e) => setForm({ ...form, notes: e.target.value })} />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Cancel</button>
          <button className="btn primary" onClick={submit} disabled={submitting}>
            {submitting ? "Creating…" : "Open the court"}
          </button>
        </div>
      </div>
    </div>
  );
}

function WalkInBlockModal({ block, onClose, onChanged }) {
  const [players, setPlayers] = useState(block.players || []);
  const [showAddPlayer, setShowAddPlayer] = useState(false);
  const [working, setWorking] = useState(false);

  async function refresh() {
    const r = await api("adminListWalkInBlocks", { dateFrom: block.date, dateTo: block.date });
    if (r.ok) {
      const fresh = (r.blocks || []).find(b => b.blockId === block.blockId);
      if (fresh) setPlayers(fresh.players || []);
    }
  }

  async function markPaid(playerId) {
    setWorking(true);
    const r = await api("adminMarkWalkInPlayerPaid", { playerId: playerId, paymentMethod: "Cash" });
    setWorking(false);
    if (r.ok) {
      showToast("Marked paid", "success");
      refresh();
      onChanged && onChanged();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function removePlayer(playerId) {
    if (!confirm("Remove this player from the block?")) return;
    setWorking(true);
    const r = await api("adminRemoveWalkInPlayer", { playerId: playerId });
    setWorking(false);
    if (r.ok) {
      showToast("Removed", "success");
      refresh();
      onChanged && onChanged();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function closeBlock() {
    if (!confirm("Close this walk-in block? Players already added remain on record.")) return;
    setWorking(true);
    const r = await api("adminCloseWalkInBlock", { blockId: block.blockId });
    setWorking(false);
    if (r.ok) {
      showToast("Block closed", "success");
      onChanged && onChanged();
      onClose && onClose();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function cancelBlock() {
    if (!confirm("Cancel this walk-in block? Court will be freed and players removed from the roster.")) return;
    setWorking(true);
    const r = await api("adminCancelWalkInBlock", { blockId: block.blockId });
    setWorking(false);
    if (r.ok) {
      showToast("Block cancelled", "success");
      onChanged && onChanged();
      onClose && onClose();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const paid = players.filter(p => String(p.paymentStatus).toLowerCase() === "paid");
  const pending = players.filter(p => String(p.paymentStatus).toLowerCase() !== "paid");
  const capacity = block.playerCap || 15;
  const full = players.length >= capacity;
  const revenuePaid = paid.reduce((s, p) => s + p.amountPaid, 0);
  const revenuePending = pending.reduce((s, p) => s + p.amountPaid, 0);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 640, maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{block.blockId} · {block.date}</div>
            <h2>Open Play · Court {block.courtNumber}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="stat-grid" style={{ gridTemplateColumns: "1fr 1fr 1fr", marginBottom: 14 }}>
          <div className="stat-card accent-ink">
            <div className="label">Players</div>
            <div className="value">{players.length}<span className="unit">of {capacity}</span></div>
          </div>
          <div className="stat-card accent-green">
            <div className="label">Collected</div>
            <div className="value">${revenuePaid.toFixed(2)}</div>
          </div>
          <div className="stat-card accent-clay">
            <div className="label">Pending</div>
            <div className="value">${revenuePending.toFixed(2)}</div>
          </div>
        </div>

        <div className="modal-detail-row">
          <span className="k">Time</span>
          <span className="v">{block.time} – {(() => {
            const [h,m] = block.time.split(":").map(Number);
            const end = h*60+m+block.durationHours*60;
            return String(Math.floor(end/60)).padStart(2,"0") + ":" + String(end%60).padStart(2,"0");
          })()} ({block.durationHours}h)</span>
        </div>
        <div className="modal-detail-row">
          <span className="k">Rate per player</span>
          <span className="v">${block.rate.toFixed(2)}</span>
        </div>
        <div className="modal-detail-row">
          <span className="k">Status</span>
          <span className="v">
            <span className={"status-pill " + (block.status === "Open" ? "paid" : block.status === "Closed" ? "completed" : "cancelled")}>
              {block.status}
            </span>
          </span>
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 14, marginBottom: 8 }}>
          <div style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", fontWeight: 700 }}>
            Players · {players.length}/{capacity}
          </div>
          <button
            className="btn-sm primary"
            disabled={full || block.status !== "Open"}
            onClick={() => setShowAddPlayer(true)}
          >
            {full ? "FULL" : "+ Add player"}
          </button>
        </div>

        {players.length === 0 ? (
          <div className="empty-mini" style={{ padding: 20 }}>No players yet · tap + Add player</div>
        ) : (
          <div style={{ maxHeight: 280, overflowY: "auto" }}>
            {players.map(p => {
              const isPaid = String(p.paymentStatus).toLowerCase() === "paid";
              return (
                <div key={p.playerId} style={{
                  display: "grid", gridTemplateColumns: "1fr auto auto auto", gap: 10, alignItems: "center",
                  padding: "10px 0", borderBottom: "1px solid rgba(26,26,26,0.08)"
                }}>
                  <div>
                    <div style={{ fontFamily: "var(--sans)", fontWeight: 600, fontSize: 13.5 }}>{p.name}</div>
                    <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.06em", opacity: 0.55 }}>
                      {p.phone || "no phone"} · {p.checkedInAt}
                    </div>
                  </div>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 13, fontWeight: 700 }}>
                    ${p.amountPaid.toFixed(2)}
                  </div>
                  <span className={"status-pill " + (isPaid ? "paid" : "at_risk")}>{p.paymentStatus}</span>
                  {!isPaid && (
                    <button className="btn-sm primary" onClick={() => markPaid(p.playerId)} disabled={working}>Mark paid</button>
                  )}
                  {isPaid && (
                    <button className="btn-sm ghost" onClick={() => removePlayer(p.playerId)} disabled={working} title="Remove">×</button>
                  )}
                </div>
              );
            })}
          </div>
        )}

        <div className="actions" style={{ flexWrap: "wrap" }}>
          {block.status === "Open" && (
            <>
              <button className="btn ghost" style={{ color: "var(--clay)", marginRight: "auto" }}
                onClick={cancelBlock} disabled={working}>Cancel block</button>
              <button className="btn" onClick={closeBlock} disabled={working}>Close block</button>
            </>
          )}
          <button className="btn primary" onClick={onClose}>Done</button>
        </div>

        {showAddPlayer && (
          <AddWalkInPlayerModal
            block={block}
            onClose={() => setShowAddPlayer(false)}
            onAdded={() => {
              setShowAddPlayer(false);
              refresh();
              onChanged && onChanged();
            }}
          />
        )}
      </div>
    </div>
  );
}

function AddWalkInPlayerModal({ block, onClose, onAdded }) {

    const r = await api("adminAddWalkInPlayer", {
      blockId: block.blockId,
      name: form.name,
      phone: form.phone,
      amount: form.amount,
      paymentStatus: markPaidNow ? "Paid" : form.paymentStatus,
      paymentMethod: markPaidNow ? form.paymentMethod : ""
    });

      showToast(markPaidNow ? "Player added · $" + r.amountCharged + " collected" : "Player added · pending payment", "success");
      onAdded && onAdded();
    } else {
      showToast(r.error || "Failed", "error");

  return (
    <div className="modal-overlay" onClick={onClose}>

            Add · paid now

        </div>

    </div>
  );

  const [members, setMembers] = useState(null);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [editMember, setEditMember] = useState(null);

  async function load() {
    setLoading(true);
    const r = await api("adminListMembers");
    if (r.ok) setMembers(r.members || []);
    else showToast(r.error || "Failed to load", "error");
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const founding = (members || []).filter(m => m.tier === "Founding" && m.status === "Active");
  const standard = (members || []).filter(m => m.tier === "Standard" && m.status === "Active");

  const FOUNDING_CAP = 20;
  const foundingFull = founding.length >= FOUNDING_CAP;

  const filtered = (members || []).filter(m => {
    if (!search.trim()) return true;
    const s = search.toLowerCase();
    return (
      m.name.toLowerCase().includes(s) ||
      m.phone.includes(s) ||
      m.memberNumber.toLowerCase().includes(s)
    );
  });

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">Membership</div>
          <h1>Members</h1>
        </div>
        <div>
          <button className="btn primary" onClick={() => setShowAdd(true)}>+ Add member</button>
        </div>
      </div>

      {/* Counters */}
      <div className="member-header">
        <div className={"member-counter founding" + (foundingFull ? " full" : "")}>
          <div className="label">Founding · capped at {FOUNDING_CAP}</div>
          <div className="big">{founding.length}<span className="of">of {FOUNDING_CAP}</span></div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", opacity: 0.6, marginTop: 4 }}>
            {foundingFull ? "Capped — no more Founding slots" : (FOUNDING_CAP - founding.length) + " slots remain"}
          </div>
        </div>
        <div className="member-counter standard">
          <div className="label">Standard · unlimited</div>
          <div className="big">{standard.length}</div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", opacity: 0.6, marginTop: 4 }}>
            Active annual memberships
          </div>
        </div>
      </div>

      {/* Search */}
      <div style={{ marginBottom: 16 }}>
        <input
          type="text"
          className="search-input"
          placeholder="Search name, phone, member number…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      {loading ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
          <BouncingBall size="md" />
        </div>
      ) : filtered.length === 0 ? (
        <div className="empty">No members match</div>
      ) : (
        <div className="member-list">
          {filtered.map(m => (
            <div
              key={m.phone}
              className={"member-row" + (m.tier === "Founding" ? " founding" : "")}
              onClick={() => setEditMember(m)}
            >
              <div className="num">{m.memberNumber}</div>
              <div>
                <div className="name">
                  {m.name}
                  <span className={"tier-pill " + m.tier} style={{ marginLeft: 8 }}>{m.tier}</span>
                  {m.isExpired && <span className="status-pill cancelled" style={{ marginLeft: 6 }}>Expired</span>}
                  {m.status !== "Active" && !m.isExpired && (
                    <span className="status-pill cancelled" style={{ marginLeft: 6 }}>{m.status}</span>
                  )}
                </div>
                <div className="meta">{m.phone} · Exp. {m.expiryDate || "—"}</div>
              </div>
              <div className="bday">
                <span className="label">Birthday</span>
                {m.birthday || "—"}
              </div>
              <button className="btn-sm">Manage</button>
            </div>
          ))}
        </div>
      )}

      {showAdd && (
        <AddMemberModal
          foundingFull={foundingFull}
          onClose={() => setShowAdd(false)}
          onCreated={() => { load(); setShowAdd(false); }}
        />
      )}

      {editMember && (
        <EditMemberModal
          member={editMember}
          onClose={() => setEditMember(null)}
          onSaved={() => { load(); setEditMember(null); }}
        />
      )}
    </div>
  );
}

function AddMemberModal({ foundingFull, onClose, onCreated }) {
  const [form, setForm] = useState({
    phone: "",
    name: "",
    email: "",
    tier: foundingFull ? "Standard" : "Founding",
    birthday: "",
    notes: ""
  });
  const [bMonth, setBMonth] = useState("");
  const [bDay, setBDay] = useState("");
  const [submitting, setSubmitting] = useState(false);

  async function submit() {
    if (!form.phone) return showToast("Phone required", "error");
    if (!form.name) return showToast("Name required", "error");
    if (!bMonth || !bDay) return showToast("Birthday required", "error");
    const m = parseInt(bMonth);
    const d = parseInt(bDay);
    if (m < 1 || m > 12 || d < 1 || d > 31) return showToast("Invalid birthday", "error");
    const birthday = String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");

    setSubmitting(true);
    const r = await api("adminCreateMember", {
      phone: form.phone,
      name: form.name,
      email: form.email,
      tier: form.tier,
      birthday: birthday,
      notes: form.notes
    });
    setSubmitting(false);
    if (r.ok) {
      showToast("Member " + r.memberNumber + " added", "success");
      onCreated && onCreated();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const months = [
    "01 · Jan", "02 · Feb", "03 · Mar", "04 · Apr", "05 · May", "06 · Jun",
    "07 · Jul", "08 · Aug", "09 · Sep", "10 · Oct", "11 · Nov", "12 · Dec"
  ];

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">New membership</div>
            <h2>Add Member</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field">
          <div className="field-label">Tier</div>
          <select value={form.tier} onChange={(e) => setForm({ ...form, tier: e.target.value })}>
            <option value="Founding" disabled={foundingFull}>
              Founding {foundingFull ? "(capped at 20)" : "· $200/yr · 50% off"}
            </option>
            <option value="Standard">Standard · $150/yr · 30% off</option>
          </select>
        </div>

        <div className="field">
          <div className="field-label">Phone</div>
          <input
            type="tel"
            inputMode="numeric"
            value={form.phone}
            placeholder="e.g. 12345678"
            onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/[^0-9]/g, "") })}
          />
        </div>

        <div className="field">
          <div className="field-label">Full name</div>
          <input
            type="text"
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
          />
        </div>

        <div className="field">
          <div className="field-label">Email (optional)</div>
          <input
            type="email"
            value={form.email}
            onChange={(e) => setForm({ ...form, email: e.target.value })}
          />
        </div>

        <div className="field">
          <div className="field-label">Birthday · MM and DD</div>
          <div className="field-row">
            <select value={bMonth} onChange={(e) => setBMonth(e.target.value)}>
              <option value="">Month…</option>
              {months.map((m, i) => (
                <option key={i} value={String(i + 1).padStart(2, "0")}>{m}</option>
              ))}
            </select>
            <input
              type="number"
              min="1"
              max="31"
              value={bDay}
              placeholder="Day"
              onChange={(e) => setBDay(e.target.value)}
            />
          </div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.55, marginTop: 4 }}>
            Used to grant birthday-week sessions. Day only, no year.
          </div>
        </div>

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea
            value={form.notes}
            onChange={(e) => setForm({ ...form, notes: e.target.value })}
            placeholder="Anything staff should remember…"
          />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Cancel</button>
          <button
            className="btn primary"
            onClick={submit}
            disabled={submitting || !form.phone || !form.name || !bMonth || !bDay}
          >
            {submitting ? "Adding…" : "Add member"}
          </button>
        </div>
      </div>
    </div>
  );
}

function EditMemberModal({ member, onClose, onSaved }) {
  const [form, setForm] = useState({
    name: member.name || "",
    email: member.email || "",
    expiryDate: member.expiryDate || "",
    birthday: member.birthday || "",
    status: member.status || "Active",
    notes: member.notes || ""
  });
  const [saving, setSaving] = useState(false);

  async function save() {
    setSaving(true);
    const r = await api("adminUpdateMember", {
      phone: member.phone,
      name: form.name,
      email: form.email,
      expiryDate: form.expiryDate,
      birthday: form.birthday,
      status: form.status,
      notes: form.notes
    });
    setSaving(false);
    if (r.ok) {
      showToast("Saved", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function renew() {
    if (!confirm("Renew this membership for another year?")) return;
    const exp = member.expiryDate ? new Date(member.expiryDate + "T12:00:00") : new Date();
    if (exp < new Date()) exp.setTime(Date.now());  // start from today if expired
    exp.setFullYear(exp.getFullYear() + 1);
    const newExp = exp.getFullYear() + "-" + String(exp.getMonth() + 1).padStart(2, "0") + "-" + String(exp.getDate()).padStart(2, "0");
    setForm(f => ({ ...f, expiryDate: newExp, status: "Active" }));
    showToast("Renewal date set — press Save to confirm", "success");
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{member.memberNumber} · {member.phone}</div>
            <h2>{member.name}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="modal-detail-row">
          <span className="k">Tier</span>
          <span className="v"><span className={"tier-pill " + member.tier}>{member.tier}</span></span>
        </div>
        <div className="modal-detail-row">
          <span className="k">Started</span>
          <span className="v">{member.startDate || "—"}</span>
        </div>

        <div className="field" style={{ marginTop: 14 }}>
          <div className="field-label">Name</div>
          <input type="text" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        </div>

        <div className="field">
          <div className="field-label">Email</div>
          <input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
        </div>

        <div className="field">
          <div className="field-label">Birthday · MM-DD</div>
          <input
            type="text"
            value={form.birthday}
            placeholder="05-15"
            maxLength={5}
            onChange={(e) => setForm({ ...form, birthday: e.target.value })}
          />
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Expiry date</div>
            <input
              type="date"
              value={form.expiryDate}
              onChange={(e) => setForm({ ...form, expiryDate: e.target.value })}
            />
          </div>
          <div className="field">
            <div className="field-label">Status</div>
            <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
              <option value="Active">Active</option>
              <option value="Cancelled">Cancelled</option>
              <option value="Paused">Paused</option>
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Notes</div>
          <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={saving}>Close</button>
          <button className="btn" onClick={renew} disabled={saving}>Renew +1yr</button>
          <button className="btn primary" onClick={save} disabled={saving}>
            {saving ? "Saving…" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}
