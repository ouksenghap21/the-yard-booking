/* ====================================================================
   POS — drinks + pro shop point-of-sale terminal
   Layout: product grid (left) + cart (right).
   ==================================================================== */

function ScreenPOS() {
  const [products, setProducts] = useState(null);
  const [category, setCategory] = useState("All");
  const [search, setSearch] = useState("");
  const [cart, setCart] = useState([]);  // [{sku, name, category, price, quantity}]
  const [attached, setAttached] = useState([]); // [{ kind: "booking" | "walkin_player", id, label, price }]
  const [discountPct, setDiscountPct] = useState(0);
  const [discountAmount, setDiscountAmount] = useState(0);
  const [paymentMethod, setPaymentMethod] = useState("Cash");
  const [cashReceived, setCashReceived] = useState("");
  const [customerPhone, setCustomerPhone] = useState("");
  const [customerName, setCustomerName] = useState("");
  const [notes, setNotes] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [todayStats, setTodayStats] = useState({ revenue: 0, transactions: 0 });
  const [showProductModal, setShowProductModal] = useState(false);
  const [editProduct, setEditProduct] = useState(null);
  const [showStockMgmt, setShowStockMgmt] = useState(false);
  const [confirmSale, setConfirmSale] = useState(null);
  const [showAttachPicker, setShowAttachPicker] = useState(false);

  async function loadProducts() {
    const r = await api("posListProducts");
    if (r.ok) setProducts(r.products || []);
  }
  async function loadTodayStats() {
    const r = await api("posListSales", { date: todayISO() });
    if (r.ok) {
      const sales = r.sales || [];
      setTodayStats({
        revenue: sales.reduce((s, x) => s + x.total, 0),
        transactions: sales.length
      });
    }
  }

  useEffect(() => {
    loadProducts();
    loadTodayStats();
  }, []);

  // Categories present in products
  const categories = useMemo(() => {
    const set = new Set();
    for (const p of (products || [])) set.add(p.category || "Other");
    return ["All", ...Array.from(set).sort()];
  }, [products]);

  // Visible products = filter by category + search + active
  const visibleProducts = useMemo(() => {
    if (!products) return [];
    return products.filter(p => {
      if (!p.active) return false;
      if (category !== "All" && p.category !== category) return false;
      if (search) {
        const s = search.toLowerCase();
        if (p.name.toLowerCase().indexOf(s) < 0 && p.sku.toLowerCase().indexOf(s) < 0) return false;
      }
      return true;
    });
  }, [products, category, search]);

  // Add product to cart (or increment qty)
  function addToCart(p) {
    setCart(prev => {
      const idx = prev.findIndex(x => x.sku === p.sku);
      if (idx >= 0) {
        const next = [...prev];
        if (next[idx].quantity < p.stock) {
          next[idx] = { ...next[idx], quantity: next[idx].quantity + 1 };
        } else {
          showToast("Not enough stock", "error");
        }
        return next;
      }
      if (p.stock < 1) {
        showToast("Out of stock", "error");
        return prev;
      }
      return [...prev, {
        sku: p.sku, name: p.name, category: p.category,
        price: p.price, quantity: 1, stockLimit: p.stock
      }];
    });
  }

  function updateQty(sku, delta) {
    setCart(prev => prev.map(x => {
      if (x.sku !== sku) return x;
      const q = x.quantity + delta;
      if (q < 1) return null;
      const product = (products || []).find(p => p.sku === sku);
      if (product && q > product.stock) {
        showToast("Not enough stock", "error");
        return x;
      }
      return { ...x, quantity: q };
    }).filter(Boolean));
  }

  function removeFromCart(sku) {
    setCart(prev => prev.filter(x => x.sku !== sku));
  }

  // Compute totals — INCLUDES attached bookings/walk-in players
  const cartSubtotal = useMemo(() => cart.reduce((s, x) => s + x.price * x.quantity, 0), [cart]);
  const attachedSubtotal = useMemo(() => attached.reduce((s, x) => s + (x.price || 0), 0), [attached]);
  const subtotal = useMemo(() => cartSubtotal + attachedSubtotal, [cartSubtotal, attachedSubtotal]);

  const computedDiscountAmount = useMemo(() => {
    if (discountPct > 0) return Math.round(subtotal * discountPct) / 100;
    return Math.min(parseFloat(discountAmount) || 0, subtotal);
  }, [subtotal, discountPct, discountAmount]);
  const total = useMemo(() => {
    return Math.round((subtotal - computedDiscountAmount) * 100) / 100;
  }, [subtotal, computedDiscountAmount]);
  const change = useMemo(() => {
    if (paymentMethod !== "Cash") return 0;
    const r = parseFloat(cashReceived) || 0;
    return Math.max(0, Math.round((r - total) * 100) / 100);
  }, [cashReceived, total, paymentMethod]);

  function clearCart() {
    if ((cart.length > 0 || attached.length > 0) && !confirm("Clear cart?")) return;
    setCart([]);
    setAttached([]);
    setDiscountPct(0);
    setDiscountAmount(0);
    setCashReceived("");
    setCustomerPhone("");
    setCustomerName("");
    setNotes("");
  }

  function removeAttached(idx) {
    setAttached(prev => prev.filter((_, i) => i !== idx));
  }

  async function processCharge() {
    if (cart.length === 0 && attached.length === 0) return showToast("Cart is empty", "error");
    if (paymentMethod === "Cash" && parseFloat(cashReceived) < total) {
      return showToast("Cash received less than total", "error");
    }
    setSubmitting(true);

    // If there are attached items, use the combined-settle endpoint;
    // otherwise use the regular posCreateSale.
    let r;
    if (attached.length > 0) {
      const attachedBookings = attached.filter(a => a.kind === "booking").map(a => a.id);
      const attachedPlayers = attached.filter(a => a.kind === "walkin_player").map(a => a.id);
      r = await api("adminSettleCombined", {
        items: JSON.stringify(cart.map(x => ({ sku: x.sku, quantity: x.quantity }))),
        attachedBookings: JSON.stringify(attachedBookings),
        attachedWalkInPlayers: JSON.stringify(attachedPlayers),
        discountPct: discountPct > 0 ? discountPct : 0,
        discountAmount: discountPct > 0 ? 0 : computedDiscountAmount,
        paymentMethod: paymentMethod,
        cashReceived: parseFloat(cashReceived) || 0,
        customerPhone: customerPhone,
        customerName: customerName,
        notes: notes,
        cashier: "Staff"
      });
    } else {
      r = await api("posCreateSale", {
        items: JSON.stringify(cart.map(x => ({ sku: x.sku, quantity: x.quantity }))),
        discountPct: discountPct > 0 ? discountPct : 0,
        discountAmount: discountPct > 0 ? 0 : computedDiscountAmount,
        paymentMethod: paymentMethod,
        cashReceived: parseFloat(cashReceived) || 0,
        customerPhone: customerPhone,
        customerName: customerName,
        notes: notes,
        cashier: "Staff"
      });
    }
    setSubmitting(false);
    if (r.ok) {
      setConfirmSale({
        saleId: r.saleId,
        total: r.total,
        changeGiven: r.changeGiven,
        items: cart.length + attached.length,
        attachedCount: r.attachedCount || 0
      });
      setCart([]);
      setAttached([]);
      setDiscountPct(0);
      setDiscountAmount(0);
      setCashReceived("");
      setCustomerPhone("");
      setCustomerName("");
      setNotes("");
      loadProducts();
      loadTodayStats();
    } else {
      showToast(r.error || "Sale failed", "error");
    }
  }

  if (products === null) {
    return (
      <div className="main">
        <div style={{ padding: 60, display: "flex", justifyContent: "center" }}>
          <BouncingBall size="md" />
        </div>
      </div>
    );
  }

  return (
    <div className="main pos-main">
      <div className="main-head">
        <div>
          <div className="title">Drinks · Pro shop · Counter</div>
          <h1>Point of Sale</h1>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <div style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", opacity: 0.6 }}>
            Today: ${todayStats.revenue.toFixed(2)} · {todayStats.transactions} sales
          </div>
          <button className="btn" onClick={() => setShowStockMgmt(true)}>Manage stock</button>
          <button className="btn primary" onClick={() => { setEditProduct(null); setShowProductModal(true); }}>+ Product</button>
        </div>
      </div>

      <div className="pos-shell">
        {/* LEFT: products */}
        <div className="pos-products">
          <div className="pos-filters">
            <div className="cat-strip">
              {categories.map(c => (
                <button
                  key={c}
                  className={"cat-pill" + (category === c ? " on" : "")}
                  onClick={() => setCategory(c)}
                >{c}</button>
              ))}
            </div>
            <input
              type="text"
              className="search-input"
              placeholder="Search products…"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
            />
          </div>

          {visibleProducts.length === 0 ? (
            <div className="empty" style={{ marginTop: 12 }}>
              {category === "All" && !search ? "No active products — add one with the + Product button" : "No matches"}
            </div>
          ) : (
            <div className="pos-grid">
              {visibleProducts.map(p => {
                const inCart = cart.find(x => x.sku === p.sku);
                const stockLow = p.reorderLevel > 0 && p.stock <= p.reorderLevel;
                const outOfStock = p.stock < 1;
                return (
                  <div
                    key={p.sku}
                    className={"pos-tile" + (outOfStock ? " oos" : "") + (inCart ? " in-cart" : "")}
                    onClick={() => addToCart(p)}
                    onContextMenu={(e) => { e.preventDefault(); setEditProduct(p); setShowProductModal(true); }}
                  >
                    {stockLow && !outOfStock && <span className="stock-dot" title="Low stock" />}
                    <div className="tile-name">{p.name}</div>
                    <div className="tile-price">${p.price.toFixed(2)}</div>
                    <div className="tile-stock">
                      {outOfStock ? "OUT OF STOCK" : "Stock: " + p.stock}
                    </div>
                    {inCart && <div className="tile-qty">×{inCart.quantity}</div>}
                  </div>
                );
              })}
            </div>
          )}
          <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.14em", textTransform: "uppercase", opacity: 0.4, marginTop: 14 }}>
            Tap to add · right-click a product to edit
          </div>
        </div>

        {/* RIGHT: cart */}
        <div className="pos-cart">
          <div className="cart-head">
            <h3>Cart</h3>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="btn-sm" onClick={() => setShowAttachPicker(true)} title="Attach a court booking or walk-in player">
                + Attach
              </button>
              {(cart.length > 0 || attached.length > 0) && (
                <button className="btn-sm ghost" onClick={clearCart}>Clear</button>
              )}
            </div>
          </div>

          {cart.length === 0 && attached.length === 0 ? (
            <div className="cart-empty">
              <div style={{ opacity: 0.4 }}>Tap a product to start</div>
              <div style={{ opacity: 0.4, marginTop: 8, fontSize: 9 }}>
                Or + Attach to settle a booking with drinks
              </div>
            </div>
          ) : (
            <>
              {/* Attached items (bookings + walk-in players) */}
              {attached.length > 0 && (
                <div className="cart-attached">
                  <div className="head">
                    <span>Attached · settle on charge</span>
                    <span className="count">{attached.length}</span>
                  </div>
                  {attached.map((a, idx) => (
                    <div className="att-item" key={a.kind + "-" + a.id}>
                      <div className="att-info">
                        <div className="att-icon">{a.kind === "booking" ? "⬛" : "◉"}</div>
                        <div className="att-text">
                          <div className="att-name">{a.label}</div>
                          {a.sub && <div className="att-sub">{a.sub}</div>}
                        </div>
                      </div>
                      <div className="att-price">${(a.price || 0).toFixed(2)}</div>
                      <button className="ci-x" onClick={() => removeAttached(idx)} title="Detach">×</button>
                    </div>
                  ))}
                </div>
              )}

              {/* Product cart items */}
              <div className="cart-items">
                {cart.map(x => (
                  <div className="cart-item" key={x.sku}>
                    <div className="ci-info">
                      <div className="ci-name">{x.name}</div>
                      <div className="ci-meta">${x.price.toFixed(2)} each</div>
                    </div>
                    <div className="ci-qty">
                      <button className="qb" onClick={() => updateQty(x.sku, -1)}>−</button>
                      <span className="qn">{x.quantity}</span>
                      <button className="qb" onClick={() => updateQty(x.sku, 1)}>+</button>
                    </div>
                    <div className="ci-total">${(x.price * x.quantity).toFixed(2)}</div>
                    <button className="ci-x" onClick={() => removeFromCart(x.sku)} title="Remove">×</button>
                  </div>
                ))}
              </div>

              <div className="cart-discount">
                <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, opacity: 0.55, marginBottom: 6 }}>Discount</div>
                <div className="discount-buttons">
                  {[0, 10, 20, 50].map(p => (
                    <button
                      key={p}
                      className={"disc-pill" + (discountPct === p ? " on" : "")}
                      onClick={() => { setDiscountPct(p); setDiscountAmount(0); }}
                    >{p === 0 ? "None" : p + "%"}</button>
                  ))}
                  <input
                    type="number"
                    min="0"
                    step="0.5"
                    placeholder="$ custom"
                    value={discountAmount || ""}
                    onChange={(e) => { setDiscountAmount(parseFloat(e.target.value) || 0); setDiscountPct(0); }}
                    className="disc-amount"
                  />
                </div>
              </div>

              <div className="cart-totals">
                <div className="row">
                  <span className="k">Subtotal</span>
                  <span className="v">${subtotal.toFixed(2)}</span>
                </div>
                {computedDiscountAmount > 0 && (
                  <div className="row" style={{ color: "var(--clay)" }}>
                    <span className="k">Discount {discountPct > 0 && "(" + discountPct + "%)"}</span>
                    <span className="v">−${computedDiscountAmount.toFixed(2)}</span>
                  </div>
                )}
                <div className="row total">
                  <span className="k">Total</span>
                  <span className="v">${total.toFixed(2)}</span>
                </div>
              </div>

              <div className="cart-customer">
                <details>
                  <summary>+ Add customer (optional)</summary>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
                    <input type="tel" placeholder="Phone" value={customerPhone}
                      onChange={(e) => setCustomerPhone(e.target.value.replace(/[^0-9]/g, ""))} />
                    <input type="text" placeholder="Name" value={customerName}
                      onChange={(e) => setCustomerName(e.target.value)} />
                  </div>
                </details>
              </div>

              <div className="cart-payment">
                <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, opacity: 0.55, marginBottom: 6 }}>Payment</div>
                <div className="pay-buttons">
                  {["Cash", "ABA", "Wing", "Card", "Account"].map(m => (
                    <button
                      key={m}
                      className={"pay-pill" + (paymentMethod === m ? " on" : "")}
                      onClick={() => setPaymentMethod(m)}
                    >{m}</button>
                  ))}
                </div>
                {paymentMethod === "Cash" && (
                  <div style={{ marginTop: 8 }}>
                    <input
                      type="number"
                      min="0"
                      step="0.5"
                      placeholder="Cash received"
                      value={cashReceived}
                      onChange={(e) => setCashReceived(e.target.value)}
                      style={{
                        width: "100%", padding: "10px 12px", border: "1.5px solid var(--ink)",
                        borderRadius: 4, fontFamily: "var(--mono)", fontSize: 14, background: "var(--paper)"
                      }}
                    />
                    {parseFloat(cashReceived) >= total && total > 0 && (
                      <div style={{ marginTop: 6, fontFamily: "var(--mono)", fontSize: 11, color: "var(--green)" }}>
                        Change: ${change.toFixed(2)}
                      </div>
                    )}
                  </div>
                )}
              </div>

              <button
                className="charge-btn"
                onClick={processCharge}
                disabled={submitting || (cart.length === 0 && attached.length === 0) || (paymentMethod === "Cash" && parseFloat(cashReceived) < total)}
              >
                {submitting ? "Charging…" : `Charge $${total.toFixed(2)}`}
              </button>
            </>
          )}
        </div>
      </div>

      {showProductModal && (
        <ProductModal
          product={editProduct}
          onClose={() => { setShowProductModal(false); setEditProduct(null); }}
          onSaved={() => { setShowProductModal(false); setEditProduct(null); loadProducts(); }}
        />
      )}

      {showStockMgmt && (
        <StockManagementModal
          products={products}
          onClose={() => setShowStockMgmt(false)}
          onChanged={loadProducts}
        />
      )}

      {confirmSale && (
        <SaleConfirmModal sale={confirmSale} onClose={() => setConfirmSale(null)} />
      )}

      {showAttachPicker && (
        <AttachPickerModal
          alreadyAttached={attached}
          onClose={() => setShowAttachPicker(false)}
          onPick={(item) => {
            setAttached(prev => [...prev, item]);
            setShowAttachPicker(false);
          }}
        />
      )}
    </div>
  );
}

    <div className="modal-overlay" onClick={onClose}>

function ProductModal({ product, onClose, onSaved }) {
  const isNew = !product;
  const [form, setForm] = useState({
    sku: product ? product.sku : "",
    name: product ? product.name : "",
    category: product ? product.category : "Drinks",
    price: product ? product.price : 0,
    cost: product ? product.cost : 0,
    stock: product ? product.stock : 0,
    reorderLevel: product ? product.reorderLevel : 0,
    active: product ? product.active : true,
    notes: product ? product.notes : ""
  });
  const [saving, setSaving] = useState(false);

  async function save() {
    if (!form.sku) return showToast("SKU required", "error");
    if (!form.name) return showToast("Name required", "error");
    setSaving(true);
    const action = isNew ? "posCreateProduct" : "posUpdateProduct";
    const params = { ...form };
    if (!isNew) params.sku = product.sku;
    const r = await api(action, params);
    setSaving(false);
    if (r.ok) {
      showToast(isNew ? "Product added" : "Saved", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{isNew ? "New product" : product.sku}</div>
            <h2>{isNew ? "Add Product" : product.name}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">SKU</div>
            <input type="text" value={form.sku} disabled={!isNew}
              onChange={(e) => setForm({ ...form, sku: e.target.value.toUpperCase() })} />
          </div>
          <div className="field">
            <div className="field-label">Category</div>
            <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
              <option value="Drinks">Drinks</option>
              <option value="Paddles">Paddles</option>
              <option value="Accessories">Accessories</option>
              <option value="Apparel">Apparel</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Name</div>
          <input type="text" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        </div>

        <div className="field-row three">
          <div className="field">
            <div className="field-label">Price · $</div>
            <input type="number" min="0" step="0.1" value={form.price}
              onChange={(e) => setForm({ ...form, price: parseFloat(e.target.value) || 0 })} />
          </div>
          <div className="field">
            <div className="field-label">Cost · $ (optional)</div>
            <input type="number" min="0" step="0.1" value={form.cost}
              onChange={(e) => setForm({ ...form, cost: parseFloat(e.target.value) || 0 })} />
          </div>
          <div className="field">
            <div className="field-label">Reorder at</div>
            <input type="number" min="0" value={form.reorderLevel}
              onChange={(e) => setForm({ ...form, reorderLevel: parseInt(e.target.value) || 0 })} />
          </div>
        </div>

        {isNew && (
          <div className="field">
            <div className="field-label">Opening stock</div>
            <input type="number" min="0" value={form.stock}
              onChange={(e) => setForm({ ...form, stock: parseInt(e.target.value) || 0 })} />
          </div>
        )}

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} />
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0" }}>
          <input
            type="checkbox"
            id="active-cb"
            checked={form.active}
            onChange={(e) => setForm({ ...form, active: e.target.checked })}
          />
          <label htmlFor="active-cb" style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 600 }}>
            Active · show in POS grid
          </label>
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={saving}>Cancel</button>
          <button className="btn primary" onClick={save} disabled={saving}>
            {saving ? "Saving…" : isNew ? "Add product" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

function StockManagementModal({ products, onClose, onChanged }) {
  const [adjustments, setAdjustments] = useState({});  // sku -> delta string

  async function applyAll() {
    const deltas = Object.entries(adjustments).filter(([sku, d]) => parseInt(d) !== 0 && d !== "");
    if (deltas.length === 0) {
      showToast("No changes", "error");
      return;
    }
    let success = 0;
    for (const [sku, delta] of deltas) {
      const r = await api("posAdjustStock", { sku: sku, delta: parseInt(delta) });
      if (r.ok) success++;
    }
    showToast(`Adjusted ${success} product${success === 1 ? "" : "s"}`, "success");
    setAdjustments({});
    onChanged && onChanged();
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 600 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">Stock adjustments</div>
            <h2>Manage Stock</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.12em", opacity: 0.6, marginBottom: 12 }}>
          Enter a positive number to add stock (restocking), or negative for shrinkage/damage.
          Leave blank to skip.
        </div>

        <div style={{ maxHeight: 400, overflowY: "auto" }}>
          {(products || []).map(p => (
            <div key={p.sku} style={{
              display: "grid", gridTemplateColumns: "1fr auto auto", gap: 10, alignItems: "center",
              padding: "10px 0", borderBottom: "1px solid rgba(26,26,26,0.08)"
            }}>
              <div>
                <div style={{ fontFamily: "var(--sans)", fontWeight: 600, fontSize: 13 }}>{p.name}</div>
                <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.1em", opacity: 0.55 }}>
                  {p.sku} · {p.category}
                </div>
              </div>
              <div style={{ fontFamily: "var(--mono)", fontSize: 13, fontWeight: 700, minWidth: 60, textAlign: "right" }}>
                {p.stock} {p.reorderLevel > 0 && p.stock <= p.reorderLevel && <span style={{ color: "var(--clay)" }}> ⚠</span>}
              </div>
              <input
                type="number"
                placeholder="+/−"
                style={{ width: 80, padding: "6px 8px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)", textAlign: "center" }}
                value={adjustments[p.sku] || ""}
                onChange={(e) => setAdjustments(prev => ({ ...prev, [p.sku]: e.target.value }))}
              />
            </div>
          ))}
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose}>Close</button>
          <button className="btn primary" onClick={applyAll}>Apply all</button>
        </div>
      </div>
    </div>
  );
}

function ScreenCustomers() {
  const [customers, setCustomers] = useState(null);
  const [search, setSearch] = useState("");
  const [typeFilter, setTypeFilter] = useState("all");
  const [historyCustomer, setHistoryCustomer] = useState(null);

  async function load() {
    const r = await api("adminListCustomers", { search: search, type: typeFilter === "all" ? "" : typeFilter });
    if (r.ok) setCustomers(r.customers || []);
  }
  useEffect(() => {
    const id = setTimeout(load, 200);  // debounce search
    return () => clearTimeout(id);
  }, [search, typeFilter]);

  const counts = useMemo(() => {
    if (!customers) return { all: 0, member: 0, guest: 0 };
    return {
      all: customers.length,
      member: customers.filter(c => c.type === "member").length,
      guest: customers.filter(c => c.type === "guest").length
    };
  }, [customers]);

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">All customers · members + guests</div>
          <h1>Customers</h1>
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 16 }}>
        <input
          type="text"
          className="search-input"
          placeholder="Search name, phone, member number…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        <div className="filter-chips" style={{ margin: 0 }}>
          {["all", "member", "guest"].map(t => (
            <button
              key={t}
              className={"filter-chip" + (typeFilter === t ? " on" : "")}
              onClick={() => setTypeFilter(t)}
            >
              {t === "all" ? "All" : t === "member" ? "Members" : "Guests"} · {counts[t] || 0}
            </button>
          ))}
        </div>
      </div>

      {customers === null ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
      ) : customers.length === 0 ? (
        <div className="empty">No customers match</div>
      ) : (
        <div className="customer-list">
          {customers.map(c => (
            <div
              key={c.phone}
              className={"customer-row" + (c.type === "member" ? " is-member" : "")}
              onClick={() => setHistoryCustomer(c)}
            >
              <div>
                <div className="cust-name">
                  {c.name || "Unknown"}
                  {c.type === "member" && <span className={"tier-pill " + c.tier} style={{ marginLeft: 8 }}>{c.tier}</span>}
                  {c.type === "guest" && <span style={{ marginLeft: 8, fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.16em", textTransform: "uppercase", opacity: 0.5 }}>GUEST</span>}
                </div>
                <div className="cust-meta">
                  {c.phone}{c.memberNumber ? " · " + c.memberNumber : ""}{c.email ? " · " + c.email : ""}
                </div>
              </div>
              <div className="cust-stats">
                <div className="big">{c.totalBookings}</div>
                <div className="lbl">{c.totalBookings === 1 ? "booking" : "bookings"}</div>
              </div>
              <div className="cust-last">
                <span className="lbl">Last visit</span>
                {c.lastBooking || "—"}
              </div>
            </div>
          ))}
        </div>
      )}

      {historyCustomer && (
        <CustomerHistoryModal
          customer={historyCustomer}
          onClose={() => setHistoryCustomer(null)}
        />
      )}
    </div>
  );
}

function CustomerHistoryModal({ customer, onClose }) {
  const [data, setData] = useState(null);
  useEffect(() => {
    api("adminGetCustomerHistory", { phone: customer.phone }).then(r => {
      if (r.ok) setData(r);
    });
  }, []);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 640, maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{customer.type === "member" ? customer.memberNumber : "Guest"} · {customer.phone}</div>
            <h2>{customer.name || "Unknown"}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        {data === null ? (
          <div style={{ padding: 30, display: "flex", justifyContent: "center" }}><BouncingBall size="sm" /></div>
        ) : (
          <>
            <div className="stat-grid" style={{ marginBottom: 18, gridTemplateColumns: "1fr 1fr" }}>
              <div className="stat-card accent-ink">
                <div className="label">Lifetime bookings</div>
                <div className="value">{data.totalBookings}</div>
              </div>
              <div className="stat-card accent-green">
                <div className="label">Lifetime spend</div>
                <div className="value">${data.totalSpent.toFixed(2)}</div>
                <div className="sub">(paid bookings only)</div>
              </div>
            </div>

            <div className="section-label">
              <span><span className="num">01</span><span className="name">Booking History</span></span>
              <span className="right">{data.bookings.length} entries</span>
            </div>

            {data.bookings.length === 0 ? (
              <div className="empty-mini" style={{ padding: 20 }}>No bookings yet</div>
            ) : (
              <div style={{ maxHeight: 400, overflowY: "auto" }}>
                {data.bookings.map(b => (
                  <div key={b.bookingId} className="modal-detail-row" style={{ padding: "10px 0" }}>
                    <span className="k">
                      {b.date} · {b.time}
                      <span style={{ marginLeft: 8 }} className={"status-pill " + b.derivedStatus}>
                        {STATUS_LABELS[b.derivedStatus] || b.derivedStatus}
                      </span>
                    </span>
                    <span className="v">
                      {b.slots * 0.5}h · C·{b.courtNumbers} · ${(b.total || 0).toFixed(2)}
                    </span>
                  </div>
                ))}
              </div>
            )}

            <div className="actions">
              <button className="btn ghost" onClick={onClose}>Close</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}


/* ====================================================================
   SMS LOG
   ==================================================================== */

function ScreenSmsLog() {
  const [entries, setEntries] = useState(null);
  const [typeFilter, setTypeFilter] = useState("");
  const [statusFilter, setStatusFilter] = useState("");

  async function load() {
    const r = await api("adminListSmsLog", { type: typeFilter, status: statusFilter, limit: 200 });
    if (r.ok) setEntries(r.entries || []);
  }
  useEffect(() => { load(); }, [typeFilter, statusFilter]);

  const totalCost = useMemo(() => {
    if (!entries) return 0;
    return entries.reduce((s, x) => s + (x.cost || 0), 0);
  }, [entries]);

  const sentCount = useMemo(() => (entries || []).filter(e => String(e.status).toLowerCase() === "sent").length, [entries]);
  const failedCount = useMemo(() => (entries || []).filter(e => String(e.status).toLowerCase() === "failed").length, [entries]);

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">All SMS sent · last 200</div>
          <h1>SMS Log</h1>
        </div>
      </div>

      <div className="stat-grid" style={{ marginBottom: 20 }}>
        <div className="stat-card accent-ink">
          <div className="label">Messages shown</div>
          <div className="value">{entries ? entries.length : 0}</div>
        </div>
        <div className="stat-card accent-green">
          <div className="label">Sent successfully</div>
          <div className="value">{sentCount}</div>
        </div>
        <div className="stat-card accent-clay">
          <div className="label">Failed</div>
          <div className="value">{failedCount}</div>
        </div>
        <div className="stat-card accent-wood">
          <div className="label">Cost · shown</div>
          <div className="value">${totalCost.toFixed(3)}</div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)}
          style={{ padding: "8px 12px", border: "1.5px solid var(--ink)", borderRadius: 999, fontFamily: "var(--mono)", fontSize: 12 }}>
          <option value="">All types</option>
          <option value="otp">OTP</option>
          <option value="confirmation">Confirmation</option>
          <option value="reminder">Reminder</option>
          <option value="cancellation">Cancellation</option>
          <option value="noshow_release">No-show release</option>
        </select>
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}
          style={{ padding: "8px 12px", border: "1.5px solid var(--ink)", borderRadius: 999, fontFamily: "var(--mono)", fontSize: 12 }}>
          <option value="">All statuses</option>
          <option value="sent">Sent</option>
          <option value="failed">Failed</option>
        </select>
      </div>

      {entries === null ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
      ) : entries.length === 0 ? (
        <div className="empty">No messages match</div>
      ) : (
        <div className="sms-list">
          {entries.map((e, i) => (
            <div key={i} className={"sms-row " + (String(e.status).toLowerCase() === "failed" ? "failed" : "ok")}>
              <div className="sms-when">
                {e.timestamp}
              </div>
              <div className="sms-body">
                <div className="sms-head">
                  <span className={"sms-type type-" + String(e.type).toLowerCase()}>{e.type}</span>
                  <span className="sms-phone">{e.phone}</span>
                  <span className={"sms-status " + String(e.status).toLowerCase()}>{e.status}</span>
                </div>
                <div className="sms-msg">{e.message}</div>
                {e.error && <div className="sms-error">⚠ {e.error}</div>}
              </div>
              <div className="sms-cost">${(e.cost || 0).toFixed(3)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}



/* ====================================================================
   SETTINGS
   ==================================================================== */
function ScreenSettings() {
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [promo, setPromo] = useState({ active: false, pct: 50, label: "Soft launch −50%" });

  async function load() {
    setLoading(true);
    const r = await api("adminGetPromo");
    if (r.ok) {
      setPromo({
        active: !!r.active,
        pct: r.pct || 50,
        label: r.label || "Soft launch −50%"
      });
    }
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  async function save() {
    setSaving(true);
    const r = await api("adminSetPromo", {
      active: promo.active,
      pct: promo.pct,
      label: promo.label
    });
    setSaving(false);
    if (r.ok) {
      showToast("Saved", "success");
      setPromo({
        active: !!r.active,
        pct: r.pct || 50,
        label: r.label || ""
      });
    } else {
      showToast(r.error || "Save failed", "error");
    }
  }

  if (loading) {
    return (
      <div className="main">
        <div style={{ padding: 60, display: "flex", justifyContent: "center" }}>
          <BouncingBall size="md" />
        </div>
      </div>
    );
  }

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">Configuration</div>
          <h1>Settings</h1>
        </div>
      </div>

      <div className="settings-card">
        <h3>Promotional Discount</h3>
        <div className="desc">
          When active, applies a flat percentage discount to <b>all bookings</b>.
          Member discounts do not stack — customers receive whichever is more generous.
          Birthday sessions are exempt and keep their original discount.
        </div>

        <div className="settings-row">
          <div className="field-label">Status</div>
          <div
            className={"toggle" + (promo.active ? " on" : "")}
            onClick={() => setPromo({ ...promo, active: !promo.active })}
          />
          <div style={{
            fontFamily: "var(--mono)",
            fontSize: 12,
            letterSpacing: "0.14em",
            textTransform: "uppercase",
            fontWeight: 600,
            color: promo.active ? "var(--green)" : "var(--ink)",
            opacity: promo.active ? 1 : 0.5
          }}>
            {promo.active ? "Active" : "Inactive"}
          </div>
        </div>

        <div className="settings-row">
          <div className="field-label">Discount %</div>
          <input
            type="number"
            min="0"
            max="100"
            value={promo.pct}
            onChange={(e) => setPromo({ ...promo, pct: parseInt(e.target.value) || 0 })}
          />
        </div>

        <div className="settings-row">
          <div className="field-label">Label</div>
          <input
            type="text"
            value={promo.label}
            placeholder="e.g. Soft launch −50%, Grand Opening Weekend"
            onChange={(e) => setPromo({ ...promo, label: e.target.value })}
            maxLength={60}
          />
        </div>

        <div className="settings-row">
          <div className="actions">
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? "Saving…" : "Save changes"}
            </button>
          </div>
        </div>

        {promo.active && promo.pct > 0 && (
          <div className="settings-warning">
            <b>HEADS-UP:</b> All bookings will receive a {promo.pct}% discount as long as this is active.
            Toggle off to return to standard pricing + member discounts.
          </div>
        )}
      </div>

      <div className="settings-card" style={{ opacity: 0.6 }}>
        <h3>More settings</h3>
        <div className="desc">Pricing rules, operating hours, grace period, and birthday window will appear here in a future release. For now, these are configured in the Pricing sheet and Script Properties.</div>
      </div>
    </div>
  );
}

/* ====================================================================
   APP SHELL — sidebar + screen router
   ==================================================================== */
function App() {
  const [authed, setAuthed] = useState(!!getStoredPin());
  const [screen, setScreen] = useState("dashboard");

  // Validate the stored PIN on boot (e.g. PIN may have been changed)
  useEffect(() => {
    if (!authed) return;
    api("adminDashboard").then(r => {
      if (!r.ok) {
        setStoredPin("");
        setAuthed(false);
      }
    });
  }, []);

  function signOut() {
    setStoredPin("");
    setAuthed(false);
  }

  if (!authed) {
    return <ScreenLogin onAuth={() => setAuthed(true)} />;
  }

  // Tab definitions
  const tabs = [
    { id: "dashboard", label: "Dashboard", ready: true },
    { id: "bookings",  label: "Bookings",  ready: true },
    { id: "pos",       label: "POS",       ready: true },
    { id: "members",   label: "Members",   ready: true },
    { id: "coaching",  label: "Coaching",  ready: true },
    { id: "customers", label: "Customers", ready: true },
    { id: "sms",       label: "SMS Log",   ready: true },
    { id: "settings",  label: "Settings",  ready: true }
  ];

  function go(id) {
    const t = tabs.find(x => x.id === id);
    if (!t || !t.ready) return;
    setScreen(id);
  }

  let body;
  switch (screen) {
    case "dashboard": body = <ScreenDashboard />; break;
    case "bookings":  body = <ScreenBookings />; break;
    case "members":   body = <ScreenMembers />; break;
    case "coaching":  body = <ScreenCoaching />; break;
    case "settings":  body = <ScreenSettings />; break;
    case "pos":       body = <ScreenPOS />; break;
    case "customers": body = <ScreenCustomers />; break;
    case "sms":       body = <ScreenSmsLog />; break;
    default:          body = <ScreenDashboard />;
  }

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="logo">
          <div className="top">THE</div>
          <div className="name">Yard</div>
          <div className="sub">Admin</div>
        </div>
        <nav>
          {tabs.map(t => (
            <button
              key={t.id}
              className={(screen === t.id ? "active " : "") + (!t.ready ? "soon" : "")}
              onClick={() => go(t.id)}
            >
              <span className="label">{t.label}</span>
              {!t.ready && <span className="soon-tag">Soon</span>}
            </button>
          ))}
        </nav>
        <div className="footer">
          <div className="staff">Signed in</div>
          <button className="signout" onClick={signOut}>
            <span>Sign out</span>
          </button>
        </div>
      </aside>
      {body}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);

  </script>
