function SessionsView({ coaches }) {
  const today = todayISO();
  const weekFromNow = (() => {
    const d = new Date(); d.setDate(d.getDate() + 7);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  })();
  const [dateFrom, setDateFrom] = useState(today);
  const [dateTo, setDateTo] = useState(weekFromNow);
  const [coachFilter, setCoachFilter] = useState("");
  const [paymentFilter, setPaymentFilter] = useState("");
  const [sessions, setSessions] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [editSession, setEditSession] = useState(null);

  async function load() {
    const r = await api("adminListCoachingSessions", {
      dateFrom: dateFrom, dateTo: dateTo,
      coachId: coachFilter, paymentStatus: paymentFilter
    });
    if (r.ok) setSessions(r.sessions || []);
  }
  useEffect(() => { load(); }, [dateFrom, dateTo, coachFilter, paymentFilter]);

  async function duplicate(s) {
    if (!confirm("Duplicate this session to one week from now?")) return;
    const r = await api("adminDuplicateCoachingSession", { sessionId: s.sessionId, offsetDays: 7 });
    if (r.ok) {
      showToast("Duplicated to next week (" + r.sessionId + ")", "success");
      load();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  return (
    <div>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 16 }}>
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700 }}>From</div>
        <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)}
          style={{ padding: "6px 10px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)" }} />
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700 }}>To</div>
        <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)}
          style={{ padding: "6px 10px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)" }} />
        <select value={coachFilter} onChange={(e) => setCoachFilter(e.target.value)}
          style={{ padding: "6px 10px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)", fontSize: 12 }}>
          <option value="">All coaches</option>
          {coaches.map(c => <option key={c.coachId} value={c.coachId}>{c.coachId} · {c.name}</option>)}
        </select>
        <select value={paymentFilter} onChange={(e) => setPaymentFilter(e.target.value)}
          style={{ padding: "6px 10px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)", fontSize: 12 }}>
          <option value="">Any payment</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="waived">Waived</option>
        </select>
        <button className="btn primary" style={{ marginLeft: "auto" }}
          onClick={() => setShowAdd(true)}
          disabled={coaches.filter(c => c.status === "Active").length === 0}
        >+ Add session</button>
      </div>

      {coaches.length === 0 && (
        <div className="modal-warning" style={{ margin: "0 0 16px" }}>
          Add at least one coach (on the Coaches tab) before booking sessions.
        </div>
      )}

      {sessions === null ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
      ) : sessions.length === 0 ? (
        <div className="empty">No sessions in this range</div>
      ) : (
        sessions.map(s => (
          <div
            key={s.sessionId}
            className={"session-card " + s.paymentStatus.toLowerCase()}
            onClick={() => setEditSession(s)}
          >
            <div className="when">
              <span className="date">{s.date}</span>
              {s.time}
              <div style={{ fontSize: 9, fontWeight: 500, opacity: 0.5, letterSpacing: "0.14em", textTransform: "uppercase", marginTop: 2 }}>
                {s.durationHours}h · C·{s.courtNumbers}
              </div>
            </div>
            <div className="who">
              <div className="coach">
                {s.coachName}
                <span className={"deal-tag " + s.dealTypeUsed}>{s.dealTypeUsed.replace("_", " ")}</span>
                <span className={"status-pill " + (s.paymentStatus.toLowerCase() === "paid" ? "paid" : s.paymentStatus.toLowerCase() === "waived" ? "cancelled" : "at_risk")}>
                  {s.paymentStatus}
                </span>
              </div>
              <div className={"student-line" + (!s.studentName ? " empty" : "")}>
                {s.studentName ? (s.studentName + (s.studentPhone ? " · " + s.studentPhone : "")) : "No student recorded"}
              </div>
              <div className="meta-line">
                {s.sessionType}{s.groupSize > 1 ? " · " + s.groupSize + " students" : ""}{s.manualOverride ? " · MANUAL" : ""} · {s.sessionId}
              </div>
            </div>
            <div className="amounts">
              <div className="facility">${s.facilityEarns.toFixed(2)}</div>
              <div className="coach-take">Coach: ${s.coachTakes.toFixed(2)}</div>
              <div className="lesson">Lesson: ${s.lessonFee.toFixed(2)}</div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <button className="btn-sm" onClick={(e) => { e.stopPropagation(); duplicate(s); }} title="Duplicate to next week">↻ +1wk</button>
            </div>
          </div>
        ))
      )}

      {showAdd && (
        <CoachingSessionModal
          session={null}
          coaches={coaches}
          dateDefault={today}
          onClose={() => setShowAdd(false)}
          onSaved={() => { load(); setShowAdd(false); }}
        />
      )}
      {editSession && (
        <CoachingSessionModal
          session={editSession}
          coaches={coaches}
          onClose={() => setEditSession(null)}
          onSaved={() => { load(); setEditSession(null); }}
        />
      )}
    </div>
  );
}

function CoachingSessionModal({ session, coaches, dateDefault, onClose, onSaved }) {
  const isNew = !session;
  const activeCoaches = coaches.filter(c => c.status === "Active");

  const [form, setForm] = useState({
    coachId: session ? session.coachId : (activeCoaches[0] ? activeCoaches[0].coachId : ""),
    date: session ? session.date : (dateDefault || todayISO()),
    time: session ? session.time : "18:00",
    durationHours: session ? session.durationHours : 1,
    courts: session ? String(session.courtNumbers).split(",").map(x => parseInt(x.trim())).filter(Boolean) : [1],
    sessionType: session ? session.sessionType : "private",
    studentName: session ? session.studentName : "",
    studentPhone: session ? session.studentPhone : "",
    groupSize: session ? session.groupSize : 1,
    lessonFee: session ? session.lessonFee : 0,
    manualOverride: session ? session.manualOverride : false,
    facilityEarnsOverride: session ? session.facilityEarns : 0,
    coachTakesOverride: session ? session.coachTakes : 0,
    paymentStatus: session ? session.paymentStatus : "Pending",
    paymentMethod: session ? session.paymentMethod : "",
    paymentDate: session ? session.paymentDate : "",
    notes: session ? session.notes : ""
  });
  const [submitting, setSubmitting] = useState(false);

  const selectedCoach = coaches.find(c => c.coachId === form.coachId);

  // Compute facility earns + coach takes from coach's deal terms
  const auto = useMemo(() => {
    if (!selectedCoach) return { facilityEarns: 0, coachTakes: 0, formula: "" };
    const fee = parseFloat(form.lessonFee) || 0;
    const rate = parseFloat(selectedCoach.courtRate) || 0;
    const pct = parseFloat(selectedCoach.revSharePct) || 0;
    const hrs = parseFloat(form.durationHours) || 0;
    let facility = 0;
    let formula = "";
    if (selectedCoach.dealType === "flat_rent") {
      facility = rate * hrs;
      formula = `$${rate}/hr × ${hrs}h = $${facility.toFixed(2)}`;
    } else if (selectedCoach.dealType === "rev_share") {
      facility = fee * (pct / 100);
      formula = `$${fee.toFixed(2)} × ${pct}% = $${facility.toFixed(2)}`;
    } else if (selectedCoach.dealType === "hybrid") {
      const rent = rate * hrs;
      const share = fee * (pct / 100);
      facility = rent + share;
      formula = `$${rate}/hr × ${hrs}h + $${fee.toFixed(2)} × ${pct}% = $${facility.toFixed(2)}`;
    } else {
      facility = 0;
      formula = "Custom deal — enter amounts manually";
    }
    facility = Math.round(facility * 100) / 100;
    const coachTakes = Math.round((fee - facility) * 100) / 100;
    return { facilityEarns: facility, coachTakes: coachTakes, formula: formula };
  }, [selectedCoach, form.lessonFee, form.durationHours]);

  const facilityEarns = form.manualOverride ? parseFloat(form.facilityEarnsOverride) || 0 : auto.facilityEarns;
  const coachTakes = form.manualOverride ? parseFloat(form.coachTakesOverride) || 0 : auto.coachTakes;

  function toggleCourt(c) {
    setForm(f => {
      const set = new Set(f.courts);
      if (set.has(c)) set.delete(c);
      else set.add(c);
      return { ...f, courts: Array.from(set).sort() };
    });
  }

  async function submit() {
    if (!form.coachId) return showToast("Coach required", "error");
    if (!form.courts.length) return showToast("Pick at least one court", "error");
    if (!form.durationHours || form.durationHours <= 0) return showToast("Duration required", "error");

    setSubmitting(true);
    if (isNew) {
      const r = await api("adminCreateCoachingSession", {
        coachId: form.coachId,
        date: form.date,
        time: form.time,
        durationHours: form.durationHours,
        courts: form.courts.join(","),
        sessionType: form.sessionType,
        studentName: form.studentName,
        studentPhone: form.studentPhone,
        groupSize: form.groupSize,
        lessonFee: form.lessonFee,
        manualOverride: form.manualOverride ? "true" : "false",
        facilityEarns: facilityEarns,
        coachTakes: coachTakes,
        paymentStatus: form.paymentStatus,
        paymentMethod: form.paymentMethod,
        notes: form.notes
      });
      setSubmitting(false);
      if (r.ok) {
        showToast("Session " + r.sessionId + " booked", "success");
        onSaved && onSaved();
      } else {
        showToast(r.error || "Failed", "error");
      }
    } else {
      // Edit: only mutable fields
      const r = await api("adminUpdateCoachingSession", {
        sessionId: session.sessionId,
        studentName: form.studentName,
        studentPhone: form.studentPhone,
        groupSize: form.groupSize,
        lessonFee: form.lessonFee,
        manualOverride: form.manualOverride ? "true" : "false",
        facilityEarns: facilityEarns,
        coachTakes: coachTakes,
        paymentStatus: form.paymentStatus,
        paymentMethod: form.paymentMethod,
        paymentDate: form.paymentDate,
        notes: form.notes
      });
      setSubmitting(false);
      if (r.ok) {
        showToast("Saved", "success");
        onSaved && onSaved();
      } else {
        showToast(r.error || "Failed", "error");
      }
    }
  }

  async function cancelSession() {
    if (!confirm("Cancel this session? Court slots will be released.")) return;
    setSubmitting(true);
    const r = await api("adminCancelCoachingSession", { sessionId: session.sessionId });
    setSubmitting(false);
    if (r.ok) {
      showToast("Cancelled", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const timeOptions = useMemo(() => {
    const out = [];
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      for (const m of [0, 30]) {
        const t = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        out.push(t);
      }
    }
    return out;
  }, []);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 640 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{isNew ? "New coaching session" : session.sessionId}</div>
            <h2>{isNew ? "Book Session" : selectedCoach ? selectedCoach.name : "Session"}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        {isNew && (
          <>
            <div className="field">
              <div className="field-label">Coach</div>
              <select value={form.coachId} onChange={(e) => setForm({ ...form, coachId: e.target.value })}>
                {activeCoaches.length === 0 && <option>(no active coaches)</option>}
                {activeCoaches.map(c => (
                  <option key={c.coachId} value={c.coachId}>
                    {c.coachId} · {c.name} · {c.dealType.replace("_", " ")}
                  </option>
                ))}
              </select>
              {selectedCoach && (
                <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.55, marginTop: 4 }}>
                  Default: {selectedCoach.dealType === "flat_rent" ? "$" + selectedCoach.courtRate + "/hr court" : ""}
                  {selectedCoach.dealType === "rev_share" ? selectedCoach.revSharePct + "% rev share" : ""}
                  {selectedCoach.dealType === "hybrid" ? "$" + selectedCoach.courtRate + "/hr + " + selectedCoach.revSharePct + "%" : ""}
                  {selectedCoach.dealType === "custom" ? "Custom — manual amounts" : ""}
                </div>
              )}
            </div>

            <div className="field-row three">
              <div className="field">
                <div className="field-label">Date</div>
                <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
              </div>
              <div className="field">
                <div className="field-label">Time</div>
                <select value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })}>
                  {timeOptions.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="field">
                <div className="field-label">Duration</div>
                <select value={form.durationHours} onChange={(e) => setForm({ ...form, durationHours: parseFloat(e.target.value) })}>
                  <option value={0.5}>30 min</option>
                  <option value={1}>1h</option>
                  <option value={1.5}>1h 30m</option>
                  <option value={2}>2h</option>
                  <option value={2.5}>2h 30m</option>
                  <option value={3}>3h</option>
                </select>
              </div>
            </div>

            <div className="field">
              <div className="field-label">Courts {form.courts.length > 0 && <span style={{ opacity: 0.5 }}>· {form.courts.join(", ")}</span>}</div>
              <div className="court-picker">
                {[1, 2, 3, 4, 5, 6, 7, 8].map(c => (
                  <div
                    key={c}
                    className={"ct" + (form.courts.includes(c) ? " on" : "")}
                    onClick={() => toggleCourt(c)}
                  >C·{c}</div>
                ))}
              </div>
            </div>
          </>
        )}

        <div className="field-row">
          <div className="field">
            <div className="field-label">Session type</div>
            <select value={form.sessionType} onChange={(e) => setForm({ ...form, sessionType: e.target.value })}>
              <option value="private">Private (1 student)</option>
              <option value="group">Group (2–4)</option>
              <option value="clinic">Clinic (5+)</option>
              <option value="practice">Coach practice (no student)</option>
            </select>
          </div>
          {form.sessionType !== "practice" && (
            <div className="field">
              <div className="field-label">Group size</div>
              <input
                type="number"
                min="1"
                value={form.groupSize}
                onChange={(e) => setForm({ ...form, groupSize: parseInt(e.target.value) || 1 })}
              />
            </div>
          )}
        </div>

        {form.sessionType !== "practice" && (
          <div className="field-row">
            <div className="field">
              <div className="field-label">Student name</div>
              <input type="text" value={form.studentName}
                onChange={(e) => setForm({ ...form, studentName: e.target.value })} />
            </div>
            <div className="field">
              <div className="field-label">Student phone</div>
              <input type="tel" inputMode="numeric" value={form.studentPhone}
                onChange={(e) => setForm({ ...form, studentPhone: e.target.value.replace(/[^0-9]/g, "") })} />
            </div>
          </div>
        )}

        <div className="field">
          <div className="field-label">Lesson fee · TOTAL for this session · $</div>
          <input
            type="number"
            min="0"
            step="0.5"
            value={form.lessonFee}
            onChange={(e) => setForm({ ...form, lessonFee: parseFloat(e.target.value) || 0 })}
            placeholder="Total amount coach charged the student(s)"
          />
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.1em", opacity: 0.55, marginTop: 4 }}>
            Enter the TOTAL (not per-hour). E.g. coach charges $30 for a 1.5hr lesson → enter 30. Used for revenue split. Leave at 0 if coach is renting court for personal practice.
          </div>
        </div>

        {/* Math preview */}
        <div className="math-preview">
          <div className="row">
            <span className="k">Lesson fee</span>
            <span className="v">${(parseFloat(form.lessonFee) || 0).toFixed(2)}</span>
          </div>
          <div className="row total facility">
            <span className="k">Facility earns</span>
            <span className="v">${facilityEarns.toFixed(2)}</span>
          </div>
          <div className="row total coach">
            <span className="k">Coach takes</span>
            <span className="v">${coachTakes.toFixed(2)}</span>
          </div>
          {auto.formula && !form.manualOverride && (
            <div className="formula">{auto.formula}</div>
          )}
          <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 8 }}>
            <input
              type="checkbox"
              id="override"
              checked={form.manualOverride}
              onChange={(e) => setForm({
                ...form,
                manualOverride: e.target.checked,
                facilityEarnsOverride: e.target.checked ? facilityEarns : 0,
                coachTakesOverride: e.target.checked ? coachTakes : 0
              })}
            />
            <label htmlFor="override" style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 600, cursor: "pointer" }}>
              Override default split for this session
            </label>
          </div>
          {form.manualOverride && (
            <div className="field-row" style={{ marginTop: 10 }}>
              <div className="field">
                <div className="field-label">Facility earns</div>
                <input type="number" step="0.5" value={form.facilityEarnsOverride}
                  onChange={(e) => setForm({ ...form, facilityEarnsOverride: parseFloat(e.target.value) || 0 })} />
              </div>
              <div className="field">
                <div className="field-label">Coach takes</div>
                <input type="number" step="0.5" value={form.coachTakesOverride}
                  onChange={(e) => setForm({ ...form, coachTakesOverride: parseFloat(e.target.value) || 0 })} />
              </div>
            </div>
          )}
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Payment status</div>
            <select value={form.paymentStatus} onChange={(e) => setForm({ ...form, paymentStatus: e.target.value })}>
              <option value="Pending">Pending</option>
              <option value="Paid">Paid</option>
              <option value="Waived">Waived</option>
            </select>
          </div>
          <div className="field">
            <div className="field-label">Payment method</div>
            <select value={form.paymentMethod} onChange={(e) => setForm({ ...form, paymentMethod: e.target.value })}>
              <option value="">—</option>
              <option value="Cash">Cash</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="ABA">ABA</option>
              <option value="Wing">Wing</option>
              <option value="Net from coach earnings">Net from coach earnings</option>
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea value={form.notes}
            placeholder="e.g. Make-up session, monthly clinic, etc."
            onChange={(e) => setForm({ ...form, notes: e.target.value })} />
        </div>

        <div className="actions">
          {!isNew && (
            <button
              className="btn ghost"
              style={{ color: "var(--clay)", marginRight: "auto" }}
              onClick={cancelSession}
              disabled={submitting}
            >Cancel session</button>
          )}
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Close</button>
          <button className="btn primary" onClick={submit} disabled={submitting || !form.coachId || (isNew && form.courts.length === 0)}>
            {submitting ? "Saving…" : isNew ? "Book session" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ----- Payments Due subview ----- */

function PaymentsDueView() {
  const [data, setData] = useState(null);
  const [expandedCoachId, setExpandedCoachId] = useState(null);
  const [coachSessions, setCoachSessions] = useState({});  // coachId -> sessions[]
  const [loadingSessions, setLoadingSessions] = useState(false);
  const [paymentModal, setPaymentModal] = useState(null);  // { coach, sessionIds }

  async function load() {
    const r = await api("adminListCoachPayments");
    if (r.ok) setData(r.summary || []);
  }
  useEffect(() => { load(); }, []);

  async function expand(coachId) {
    if (expandedCoachId === coachId) {
      setExpandedCoachId(null);
      return;
    }
    setExpandedCoachId(coachId);
    if (!coachSessions[coachId]) {
      setLoadingSessions(true);
      const r = await api("adminListCoachingSessions", {
        coachId: coachId,
        paymentStatus: "pending"
      });
      setLoadingSessions(false);
      if (r.ok) {
        setCoachSessions(prev => ({ ...prev, [coachId]: r.sessions || [] }));
      }
    }
  }

  function openPaymentModal(coach, sessionIds) {
    if (!sessionIds || sessionIds.length === 0) return;
    setPaymentModal({ coach, sessionIds });
  }

  async function confirmPayment(paymentMethod, paymentDate) {
    if (!paymentModal) return;
    const r = await api("adminMarkCoachingSessionsPaid", {
      sessionIds: paymentModal.sessionIds.join(","),
      paymentMethod: paymentMethod,
      paymentDate: paymentDate
    });
    if (r.ok) {
      showToast(`Marked ${r.updated} session${r.updated === 1 ? "" : "s"} paid · $${r.totalCollected.toFixed(2)} collected`, "success");
      // Clear cached sessions for this coach so they reload
      setCoachSessions(prev => {
        const next = { ...prev };
        delete next[paymentModal.coach.coachId];
        return next;
      });
      setExpandedCoachId(null);
      setPaymentModal(null);
      load();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  if (data === null) {
    return <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>;
  }

  const totalOwed = data.reduce((s, c) => s + c.pendingAmount, 0);
  const totalPaid = data.reduce((s, c) => s + c.paidAmount, 0);
  const totalCoachTakes = data.reduce((s, c) => s + c.coachTakesPending, 0);

  return (
    <div>
      <div className="stat-grid" style={{ marginBottom: 24 }}>
        <div className="stat-card accent-clay">
          <div className="label">Coaches owe us</div>
          <div className="value">${totalOwed.toFixed(2)}</div>
          <div className="sub">Across all unpaid sessions</div>
        </div>
        <div className="stat-card accent-green">
          <div className="label">Already collected</div>
          <div className="value">${totalPaid.toFixed(2)}</div>
          <div className="sub">All-time paid sessions</div>
        </div>
        <div className="stat-card accent-wood">
          <div className="label">Coaches haven't taken</div>
          <div className="value">${totalCoachTakes.toFixed(2)}</div>
          <div className="sub">Their earnings on unpaid sessions</div>
        </div>
      </div>

      <div className="section-label">
        <span><span className="num">01</span><span className="name">By Coach · click to expand</span></span>
        <span className="right">{data.length} coach{data.length === 1 ? "" : "es"}</span>
      </div>
      {data.length === 0 ? (
        <div className="empty">No coaches in system</div>
      ) : (
        data.map(c => {
          const isExpanded = expandedCoachId === c.coachId;
          const sessions = coachSessions[c.coachId] || [];
          return (
            <div key={c.coachId} style={{ marginBottom: 10 }}>
              <div
                className={"coach-pay-card" + (c.pendingAmount > 0 ? " has-debt" : "") + (isExpanded ? " expanded" : "")}
                onClick={() => expand(c.coachId)}
                style={{ cursor: "pointer", marginBottom: 0 }}
              >
                <div>
                  <div className="name">{c.name}</div>
                  <div className="meta">{c.coachId} · {c.phone}</div>
                </div>
                <div style={{ textAlign: "right", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.6 }}>
                  <div>{c.pendingSessions} unpaid · {c.paidSessions} paid</div>
                  <div style={{ marginTop: 2 }}>Lifetime $ {c.paidAmount.toFixed(2)} collected</div>
                </div>
                <div className="owes">
                  <div className="v">${c.pendingAmount.toFixed(2)}</div>
                  <div className="label">
                    {c.pendingAmount > 0 ? (isExpanded ? "▼ Hide sessions" : "▶ Show sessions") : "All settled"}
                  </div>
                </div>
              </div>

              {isExpanded && (
                <div className="pay-expand">
                  {loadingSessions && !sessions.length ? (
                    <div style={{ padding: 20, display: "flex", justifyContent: "center" }}>
                      <BouncingBall size="sm" />
                    </div>
                  ) : sessions.length === 0 ? (
                    <div className="empty-mini" style={{ padding: 14 }}>No unpaid sessions for this coach</div>
                  ) : (
                    <>
                      <div className="pay-expand-head">
                        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", opacity: 0.7, fontWeight: 700 }}>
                          {sessions.length} unpaid session{sessions.length === 1 ? "" : "s"} · total ${sessions.reduce((s, x) => s + x.facilityEarns, 0).toFixed(2)}
                        </div>
                        <button
                          className="btn primary"
                          onClick={(e) => {
                            e.stopPropagation();
                            openPaymentModal(c, sessions.map(s => s.sessionId));
                          }}
                        >
                          Mark all paid · ${sessions.reduce((s, x) => s + x.facilityEarns, 0).toFixed(2)}
                        </button>
                      </div>
                      {sessions.map(s => (
                        <PaymentSessionRow
                          key={s.sessionId}
                          session={s}
                          onMarkPaid={() => openPaymentModal(c, [s.sessionId])}
                        />
                      ))}
                    </>
                  )}
                </div>
              )}
            </div>
          );
        })
      )}

      {paymentModal && (
        <PaymentConfirmModal
          coach={paymentModal.coach}
          sessionIds={paymentModal.sessionIds}
          totalAmount={
            (coachSessions[paymentModal.coach.coachId] || [])
              .filter(s => paymentModal.sessionIds.indexOf(s.sessionId) >= 0)
              .reduce((sum, s) => sum + s.facilityEarns, 0)
          }
          onClose={() => setPaymentModal(null)}
          onConfirm={confirmPayment}
        />
      )}
    </div>
  );
}

function PaymentSessionRow({ session, onMarkPaid }) {
  return (
    <div className="pay-expand-row">
      <div>
        <div style={{ fontFamily: "var(--mono)", fontSize: 12, fontWeight: 700 }}>
          {session.date} · {session.time} · {session.durationHours}h · C·{session.courtNumbers}
        </div>
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55, letterSpacing: "0.06em", marginTop: 3 }}>
          {session.studentName || "—"}{session.studentPhone ? " · " + session.studentPhone : ""} · {session.sessionType}
        </div>
        <div style={{ fontFamily: "var(--mono)", fontSize: 9, opacity: 0.4, letterSpacing: "0.14em", textTransform: "uppercase", marginTop: 2 }}>
          {session.sessionId}{session.manualOverride ? " · MANUAL" : ""}
        </div>
      </div>
      <div style={{ textAlign: "right", fontFamily: "var(--mono)" }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: "var(--clay)" }}>${session.facilityEarns.toFixed(2)}</div>
        <div style={{ fontSize: 9, opacity: 0.5, letterSpacing: "0.06em", marginTop: 2 }}>
          Lesson ${session.lessonFee.toFixed(2)}
        </div>
      </div>
      <button className="btn-sm primary" onClick={onMarkPaid}>Mark paid</button>
    </div>
  );
}

function PaymentConfirmModal({ coach, sessionIds, totalAmount, onClose, onConfirm }) {
  const [method, setMethod] = useState("Cash");
  const [date, setDate] = useState(todayISO());
  const [submitting, setSubmitting] = useState(false);

  async function go() {
    setSubmitting(true);
    await onConfirm(method, date);
    setSubmitting(false);
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 460 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">Record payment</div>
            <h2>{coach.name}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="modal-detail-row">
          <span className="k">Sessions</span>
          <span className="v">{sessionIds.length}</span>
        </div>
        <div className="modal-detail-row total">
          <span className="k">Amount collected</span>
          <span className="v">${totalAmount.toFixed(2)}</span>
        </div>

        <div className="field" style={{ marginTop: 18 }}>
          <div className="field-label">Payment method</div>
          <select value={method} onChange={(e) => setMethod(e.target.value)}>
            <option value="Cash">Cash</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="ABA">ABA</option>
            <option value="Wing">Wing</option>
            <option value="Net from coach earnings">Net from coach earnings</option>
          </select>
        </div>
        <div className="field">
          <div className="field-label">Payment date</div>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Cancel</button>
          <button className="btn primary" onClick={go} disabled={submitting}>
            {submitting ? "Recording…" : "Confirm payment"}
          </button>
        </div>
      </div>
    </div>
  );
}


/* ====================================================================
   POS — drinks + pro shop point-of-sale terminal
   Layout: product grid (left) + cart (right).
   ==================================================================== */

function ScreenPOS() {
  const [products, setProducts] = useState(null);
  const [category, setCategory] = useState("All");
  const [search, setSearch] = useState("");
  const [cart, setCart] = useState([]);  // [{sku, name, category, price, quantity}]
  const [attached, setAttached] = useState([]); // [{ kind: "booking" | "walkin_player", id, label, price }]
  const [discountPct, setDiscountPct] = useState(0);
  const [discountAmount, setDiscountAmount] = useState(0);
  const [paymentMethod, setPaymentMethod] = useState("Cash");
  const [cashReceived, setCashReceived] = useState("");
  const [customerPhone, setCustomerPhone] = useState("");
  const [customerName, setCustomerName] = useState("");
  const [notes, setNotes] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [todayStats, setTodayStats] = useState({ revenue: 0, transactions: 0 });
  const [showProductModal, setShowProductModal] = useState(false);
  const [editProduct, setEditProduct] = useState(null);
  const [showStockMgmt, setShowStockMgmt] = useState(false);
  const [confirmSale, setConfirmSale] = useState(null);
  const [showAttachPicker, setShowAttachPicker] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [showOpenTabs, setShowOpenTabs] = useState(false);
  const [showQuickNewTab, setShowQuickNewTab] = useState(false);
  const [openTabCount, setOpenTabCount] = useState(0);
  const [activeTabId, setActiveTabId] = useState(null);  // tab currently open in detail modal

  async function loadProducts() {
    // Sync cache hit for instant render
    const cached = getCachedApi("posListProducts");
    if (cached && cached.ok) setProducts(cached.products || []);
    const r = await api("posListProducts");
    if (r.ok) setProducts(r.products || []);
  }
  async function loadTodayStats() {
    const r = await api("posListSales", { date: todayISO() });
    if (r.ok) {
      const sales = r.sales || [];
      setTodayStats({
        revenue: sales.reduce((s, x) => s + x.total, 0),
        transactions: sales.length
      });
    }
  }

  async function loadTabCount() {
    const cached = getCachedApi("tabListOpen");
    if (cached && cached.ok) setOpenTabCount((cached.tabs || []).length);
    const r = await api("tabListOpen");
    if (r.ok) setOpenTabCount((r.tabs || []).length);
  }

  useEffect(() => {
    loadProducts();
    loadTodayStats();
    loadTabCount();
  }, []);

  // Categories present in products
  const categories = useMemo(() => {
    const set = new Set();
    for (const p of (products || [])) set.add(p.category || "Other");
    return ["All", ...Array.from(set).sort()];
  }, [products]);

  // Visible products = filter by category + search + active
  const visibleProducts = useMemo(() => {
    if (!products) return [];
    return products.filter(p => {
      if (!p.active) return false;
      if (category !== "All" && p.category !== category) return false;
      if (search) {
        const s = search.toLowerCase();
        if (p.name.toLowerCase().indexOf(s) < 0 && p.sku.toLowerCase().indexOf(s) < 0) return false;
      }
      return true;
    });
  }, [products, category, search]);

  // Add product to cart (or increment qty)
  function addToCart(p) {
    setCart(prev => {
      const idx = prev.findIndex(x => x.sku === p.sku);
      if (idx >= 0) {
        const next = [...prev];
        if (next[idx].quantity < p.stock) {
          next[idx] = { ...next[idx], quantity: next[idx].quantity + 1 };
        } else {
          showToast("Not enough stock", "error");
        }
        return next;
      }
      if (p.stock < 1) {
        showToast("Out of stock", "error");
        return prev;
      }
      return [...prev, {
        sku: p.sku, name: p.name, category: p.category,
        price: p.price, quantity: 1, stockLimit: p.stock,
        memberEligible: p.memberEligible !== false
      }];
    });
  }

  function updateQty(sku, delta) {
    setCart(prev => prev.map(x => {
      if (x.sku !== sku) return x;
      const q = x.quantity + delta;
      if (q < 1) return null;
      const product = (products || []).find(p => p.sku === sku);
      if (product && q > product.stock) {
        showToast("Not enough stock", "error");
        return x;
      }
      return { ...x, quantity: q };
    }).filter(Boolean));
  }

  function removeFromCart(sku) {
    setCart(prev => prev.filter(x => x.sku !== sku));
  }

  // Compute totals — INCLUDES attached bookings/walk-in players
  const cartSubtotal = useMemo(() => cart.reduce((s, x) => s + x.price * x.quantity, 0), [cart]);
  // Eligible-only subtotal — drinks and other ineligible items excluded
  const eligibleSubtotal = useMemo(() => cart.reduce((s, x) => x.memberEligible !== false ? s + x.price * x.quantity : s, 0), [cart]);
  const attachedSubtotal = useMemo(() => attached.reduce((s, x) => s + (x.price || 0), 0), [attached]);
  const subtotal = useMemo(() => cartSubtotal + attachedSubtotal, [cartSubtotal, attachedSubtotal]);

  // Member discount: looked up from customer phone, only on ELIGIBLE products
  const [memberTier, setMemberTier] = useState("");
  const [memberDiscountPct, setMemberDiscountPct] = useState(10);  // fetched from POS settings

  // Fetch the current member discount % once on mount
  useEffect(() => {
    api("adminGetPosSettings").then(r => {
      if (r.ok && typeof r.memberDiscountPct === "number") {
        setMemberDiscountPct(r.memberDiscountPct);
      }
    });
  }, []);

  useEffect(() => {
    if (!customerPhone || customerPhone.length < 6) { setMemberTier(""); return; }
    let cancelled = false;
    api("adminGetMemberByPhone", { phone: customerPhone }).then(r => {
      if (cancelled) return;
      if (r.ok && r.member && r.member.status === "active" && !r.member.isExpired) {
        setMemberTier(r.member.tier || "");
      } else {
        setMemberTier("");
      }
    });
    return () => { cancelled = true; };
  }, [customerPhone]);
  const memberDiscountAmount = useMemo(() => {
    return memberTier && eligibleSubtotal > 0 ? Math.round(eligibleSubtotal * memberDiscountPct) / 100 : 0;
  }, [memberTier, eligibleSubtotal, memberDiscountPct]);

  const computedDiscountAmount = useMemo(() => {
    const afterMember = subtotal - memberDiscountAmount;
    if (discountPct > 0) return memberDiscountAmount + Math.round(afterMember * discountPct) / 100;
    const staffAmt = Math.min(parseFloat(discountAmount) || 0, afterMember);
    return memberDiscountAmount + staffAmt;
  }, [subtotal, memberDiscountAmount, discountPct, discountAmount]);
  const total = useMemo(() => {
    return Math.round((subtotal - computedDiscountAmount) * 100) / 100;
  }, [subtotal, computedDiscountAmount]);
  const change = useMemo(() => {
    if (paymentMethod !== "Cash") return 0;
    const r = parseFloat(cashReceived) || 0;
    return Math.max(0, Math.round((r - total) * 100) / 100);
  }, [cashReceived, total, paymentMethod]);

  function clearCart() {
    if ((cart.length > 0 || attached.length > 0) && !confirm("Clear cart?")) return;
    setCart([]);
    setAttached([]);
    setDiscountPct(0);
    setDiscountAmount(0);
    setCashReceived("");
    setCustomerPhone("");
    setCustomerName("");
    setNotes("");
  }

  function removeAttached(idx) {
    setAttached(prev => prev.filter((_, i) => i !== idx));
  }

  async function processCharge() {
    if (cart.length === 0 && attached.length === 0) return showToast("Cart is empty", "error");
    if (paymentMethod === "Cash" && parseFloat(cashReceived) < total) {
      return showToast("Cash received less than total", "error");
    }
    setSubmitting(true);

    // If there are attached items, use the combined-settle endpoint;
    // otherwise use the regular posCreateSale.
    let r;
    if (attached.length > 0) {
      const attachedBookings = attached.filter(a => a.kind === "booking").map(a => a.id);
      const attachedPlayers = attached.filter(a => a.kind === "walkin_player").map(a => a.id);
      r = await api("adminSettleCombined", {
        items: JSON.stringify(cart.map(x => ({ sku: x.sku, quantity: x.quantity }))),
        attachedBookings: JSON.stringify(attachedBookings),
        attachedWalkInPlayers: JSON.stringify(attachedPlayers),
        discountPct: discountPct > 0 ? discountPct : 0,
        discountAmount: discountPct > 0 ? 0 : computedDiscountAmount,
        paymentMethod: paymentMethod,
        cashReceived: parseFloat(cashReceived) || 0,
        customerPhone: customerPhone,
        customerName: customerName,
        notes: notes,
        cashier: "Staff"
      });
    } else {
      r = await api("posCreateSale", {
        items: JSON.stringify(cart.map(x => ({ sku: x.sku, quantity: x.quantity }))),
        discountPct: discountPct > 0 ? discountPct : 0,
        discountAmount: discountPct > 0 ? 0 : computedDiscountAmount,
        paymentMethod: paymentMethod,
        cashReceived: parseFloat(cashReceived) || 0,
        customerPhone: customerPhone,
        customerName: customerName,
        notes: notes,
        cashier: "Staff"
      });
    }
    setSubmitting(false);
    if (r.ok) {
      setConfirmSale({
        saleId: r.saleId,
        total: r.total,
        changeGiven: r.changeGiven,
        items: cart.length + attached.length,
        attachedCount: r.attachedCount || 0
      });
      setCart([]);
      setAttached([]);
      setDiscountPct(0);
      setDiscountAmount(0);
      setCashReceived("");
      setCustomerPhone("");
      setCustomerName("");
      setNotes("");
      loadProducts();
      loadTodayStats();
    } else {
      showToast(r.error || "Sale failed", "error");
    }
  }

  if (products === null) {
    return (
      <div className="main">
        <div style={{ padding: 60, display: "flex", justifyContent: "center" }}>
          <BouncingBall size="md" />
        </div>
      </div>
    );
  }

  return (
    <div className="main pos-main">
      <div className="main-head">
        <div>
          <div className="title">Drinks · Pro shop · Counter</div>
          <h1>Point of Sale</h1>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <div style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", opacity: 0.6 }}>
            Today: ${todayStats.revenue.toFixed(2)} · {todayStats.transactions} sales
          </div>
          <button className="btn" onClick={() => setShowOpenTabs(true)} style={{ position: "relative" }}>
            Open tabs
            {openTabCount > 0 && (
              <span style={{
                marginLeft: 6,
                background: "var(--clay)", color: "var(--cream)",
                padding: "1px 6px", borderRadius: 8,
                fontSize: 10, fontFamily: "var(--mono)", fontWeight: 700
              }}>{openTabCount}</span>
            )}
          </button>
          <button className="btn" onClick={() => setShowQuickNewTab(true)}>+ New Tab</button>
          <button className="btn" onClick={() => setShowHistory(true)}>Sale history</button>
          <button className="btn" onClick={() => setShowStockMgmt(true)}>Manage stock</button>
          <button className="btn primary" onClick={() => { setEditProduct(null); setShowProductModal(true); }}>+ Product</button>
        </div>
      </div>

      <div className="pos-shell">
        {/* LEFT: products */}
        <div className="pos-products">
          <div className="pos-filters">
            <div className="cat-strip">
              {categories.map(c => (
                <button
                  key={c}
                  className={"cat-pill" + (category === c ? " on" : "")}
                  onClick={() => setCategory(c)}
                >{c}</button>
              ))}
            </div>
            <input
              type="text"
              className="search-input"
              placeholder="Search products…"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
            />
          </div>

          {visibleProducts.length === 0 ? (
            <div className="empty" style={{ marginTop: 12 }}>
              {category === "All" && !search ? "No active products — add one with the + Product button" : "No matches"}
            </div>
          ) : (
            <div className="pos-grid">
              {visibleProducts.map(p => {
                const inCart = cart.find(x => x.sku === p.sku);
                const stockLow = p.reorderLevel > 0 && p.stock <= p.reorderLevel;
                const outOfStock = p.stock < 1;
                return (
                  <div
                    key={p.sku}
                    className={"pos-tile" + (outOfStock ? " oos" : "") + (inCart ? " in-cart" : "")}
                    onClick={() => addToCart(p)}
                    onContextMenu={(e) => { e.preventDefault(); setEditProduct(p); setShowProductModal(true); }}
                  >
                    {stockLow && !outOfStock && <span className="stock-dot" title="Low stock" />}
                    <div className="tile-name">{p.name}</div>
                    <div className="tile-price">${p.price.toFixed(2)}</div>
                    <div className="tile-stock">
                      {outOfStock ? "OUT OF STOCK" : "Stock: " + p.stock}
                    </div>
                    {inCart && <div className="tile-qty">×{inCart.quantity}</div>}
                  </div>
                );
              })}
            </div>
          )}
          <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.14em", textTransform: "uppercase", opacity: 0.4, marginTop: 14 }}>
            Tap to add · right-click a product to edit
          </div>
        </div>

        {/* RIGHT: cart */}
        <div className="pos-cart">
          <div className="cart-head">
            <h3>Cart</h3>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="btn-sm" onClick={() => setShowAttachPicker(true)} title="Attach a court booking or walk-in player">
                + Attach
              </button>
              {(cart.length > 0 || attached.length > 0) && (
                <button className="btn-sm ghost" onClick={clearCart}>Clear</button>
              )}
            </div>
          </div>

          {cart.length === 0 && attached.length === 0 ? (
            <div className="cart-empty">
              <div style={{ opacity: 0.4 }}>Tap a product to start</div>
              <div style={{ opacity: 0.4, marginTop: 8, fontSize: 9 }}>
                Or + Attach to settle a booking with drinks
              </div>
            </div>
          ) : (
            <>
              {/* Attached items (bookings + walk-in players) */}
              {attached.length > 0 && (
                <div className="cart-attached">
                  <div className="head">
                    <span>Attached · settle on charge</span>
                    <span className="count">{attached.length}</span>
                  </div>
                  {attached.map((a, idx) => (
                    <div className="att-item" key={a.kind + "-" + a.id}>
                      <div className="att-info">
                        <div className="att-icon">{a.kind === "booking" ? "⬛" : "◉"}</div>
                        <div className="att-text">
                          <div className="att-name">{a.label}</div>
                          {a.sub && <div className="att-sub">{a.sub}</div>}
                        </div>
                      </div>
                      <div className="att-price">${(a.price || 0).toFixed(2)}</div>
                      <button className="ci-x" onClick={() => removeAttached(idx)} title="Detach">×</button>
                    </div>
                  ))}
                </div>
              )}

              {/* Product cart items */}
              <div className="cart-items">
                {cart.map(x => (
                  <div className="cart-item" key={x.sku}>
                    <div className="ci-info">
                      <div className="ci-name">{x.name}</div>
                      <div className="ci-meta">${x.price.toFixed(2)} each</div>
                    </div>
                    <div className="ci-qty">
                      <button className="qb" onClick={() => updateQty(x.sku, -1)}>−</button>
                      <span className="qn">{x.quantity}</span>
                      <button className="qb" onClick={() => updateQty(x.sku, 1)}>+</button>
                    </div>
                    <div className="ci-total">${(x.price * x.quantity).toFixed(2)}</div>
                    <button className="ci-x" onClick={() => removeFromCart(x.sku)} title="Remove">×</button>
                  </div>
                ))}
              </div>

              <div className="cart-discount">
                <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, opacity: 0.55, marginBottom: 6 }}>Discount</div>
                <div className="discount-buttons">
                  {[0, 10, 20, 50].map(p => (
                    <button
                      key={p}
                      className={"disc-pill" + (discountPct === p ? " on" : "")}
                      onClick={() => { setDiscountPct(p); setDiscountAmount(0); }}
                    >{p === 0 ? "None" : p + "%"}</button>
                  ))}
                  <input
                    type="number"
                    min="0"
                    step="0.5"
                    placeholder="$ custom"
                    value={discountAmount || ""}
                    onChange={(e) => { setDiscountAmount(parseFloat(e.target.value) || 0); setDiscountPct(0); }}
                    className="disc-amount"
                  />
                </div>
              </div>

              <div className="cart-totals">
                <div className="row">
                  <span className="k">Subtotal</span>
                  <span className="v">${subtotal.toFixed(2)}</span>
                </div>
                {memberDiscountAmount > 0 && (
                  <div className="row" style={{ color: "var(--green)" }}>
                    <span className="k">{memberTier} {memberDiscountPct}% (pro-shop)</span>
                    <span className="v">−${memberDiscountAmount.toFixed(2)}</span>
                  </div>
                )}
                {computedDiscountAmount > memberDiscountAmount && (
                  <div className="row" style={{ color: "var(--clay)" }}>
                    <span className="k">Staff discount {discountPct > 0 && "(" + discountPct + "%)"}</span>
                    <span className="v">−${(computedDiscountAmount - memberDiscountAmount).toFixed(2)}</span>
                  </div>
                )}
                <div className="row total">
                  <span className="k">Total</span>
                  <span className="v">${total.toFixed(2)}</span>
                </div>
              </div>

              <div className="cart-customer">
                <details>
                  <summary>+ Add customer (optional)</summary>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
                    <input type="tel" placeholder="Phone" value={customerPhone}
                      onChange={(e) => setCustomerPhone(e.target.value.replace(/[^0-9]/g, ""))} />
                    <input type="text" placeholder="Name" value={customerName}
                      onChange={(e) => setCustomerName(e.target.value)} />
                  </div>
                </details>
              </div>

              <div className="cart-payment">
                <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, opacity: 0.55, marginBottom: 6 }}>Payment</div>
                <div className="pay-buttons">
                  {["Cash", "ABA", "Wing", "Card", "Account"].map(m => (
                    <button
                      key={m}
                      className={"pay-pill" + (paymentMethod === m ? " on" : "")}
                      onClick={() => setPaymentMethod(m)}
                    >{m}</button>
                  ))}
                </div>
                {paymentMethod === "Cash" && (
                  <div style={{ marginTop: 8 }}>
                    <input
                      type="number"
                      min="0"
                      step="0.5"
                      placeholder="Cash received"
                      value={cashReceived}
                      onChange={(e) => setCashReceived(e.target.value)}
                      style={{
                        width: "100%", padding: "10px 12px", border: "1.5px solid var(--ink)",
                        borderRadius: 4, fontFamily: "var(--mono)", fontSize: 14, background: "var(--paper)"
                      }}
                    />
                    {parseFloat(cashReceived) >= total && total > 0 && (
                      <div style={{ marginTop: 6, fontFamily: "var(--mono)", fontSize: 11, color: "var(--green)" }}>
                        Change: ${change.toFixed(2)}
                      </div>
                    )}
                  </div>
                )}
              </div>

              <button
                className="charge-btn"
                onClick={processCharge}
                disabled={submitting || (cart.length === 0 && attached.length === 0) || (paymentMethod === "Cash" && parseFloat(cashReceived) < total)}
              >
                {submitting ? "Charging…" : `Charge $${total.toFixed(2)}`}
              </button>
            </>
          )}
        </div>
      </div>

      {showProductModal && (
        <ProductModal
          product={editProduct}
          onClose={() => { setShowProductModal(false); setEditProduct(null); }}
          onSaved={() => { setShowProductModal(false); setEditProduct(null); loadProducts(); }}
        />
      )}

      {showStockMgmt && (
        <StockManagementModal
          products={products}
          onClose={() => setShowStockMgmt(false)}
          onChanged={loadProducts}
        />
      )}

      {confirmSale && (
        <SaleConfirmModal sale={confirmSale} onClose={() => setConfirmSale(null)} />
      )}

      {showAttachPicker && (
        <AttachPickerModal
          alreadyAttached={attached}
          onClose={() => setShowAttachPicker(false)}
          onPick={(item) => {
            setAttached(prev => [...prev, item]);
            setShowAttachPicker(false);
          }}
        />
      )}

      {showHistory && (
        <SaleHistoryModal onClose={() => setShowHistory(false)} />
      )}

      {showOpenTabs && (
        <OpenTabsModal
          onClose={() => setShowOpenTabs(false)}
          onSelect={(tabId) => { setShowOpenTabs(false); setActiveTabId(tabId); }}
          onChanged={loadTabCount}
        />
      )}

      {showQuickNewTab && (
        <NewTabModal
          onClose={() => setShowQuickNewTab(false)}
          onCreated={(tabId) => {
            setShowQuickNewTab(false);
            loadTabCount();
            setActiveTabId(tabId);  // jump straight to detail view
          }}
        />
      )}

      {activeTabId && (
        <TabDetailModal
          tabId={activeTabId}
          products={products}
          onClose={() => { setActiveTabId(null); loadTabCount(); loadProducts(); loadTodayStats(); }}
        />
      )}
    </div>
  );
}

function OpenTabsModal({ onClose, onSelect, onChanged }) {

  const [showNewTab, setShowNewTab] = useState(false);

  async function load() {
    const r = await api("tabListOpen");
    if (r.ok) setTabs(r.tabs || []);

  useEffect(() => { load(); }, []);

  return (
    <div className="modal-overlay" onClick={onClose}>

          <button className="x" onClick={onClose}>×</button>

          <button className="btn primary" onClick={() => setShowNewTab(true)}>+ New Tab</button>

          <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>

                style={{
                  display: "grid",
                  gridTemplateColumns: "1fr auto",
                  gap: 10,
                  padding: "14px 12px",
                  border: t.isStale ? "1.5px solid var(--clay)" : "1.5px solid var(--ink)",
                  borderRadius: 4,
                  marginBottom: 10,
                  cursor: "pointer",
                  background: t.isStale ? "rgba(217,120,92,0.06)" : "var(--paper)",

                onClick={() => onSelect(t.tabId)}
                onMouseEnter={(e) => e.currentTarget.style.background = t.isStale ? "rgba(217,120,92,0.12)" : "rgba(61,122,79,0.04)"}
                onMouseLeave={(e) => e.currentTarget.style.background = t.isStale ? "rgba(217,120,92,0.06)" : "var(--paper)"}
              >
                {t.isStale && (
                  <div style={{
                    position: "absolute", top: 6, right: 8,

                )}
                <div>
                  <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 18 }}>
                    {t.customerName || "(no name)"}

                  </div>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55, letterSpacing: "0.08em", marginTop: 3 }}>
                    {t.tabId} · opened {t.openedAt.substring(11, 16)}
                    {!t.isStale && t.ageHours >= 1 && <span> · {t.ageHours}h ago</span>}
                  </div>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.7, marginTop: 6 }}>
                    {t.itemCount > 0 && <span>{t.itemCount} item{t.itemCount === 1 ? "" : "s"} ${t.itemTotal.toFixed(2)}</span>}
                    {t.itemCount > 0 && (t.bookingCount > 0 || t.playerCount > 0) && " · "}
                    {t.bookingCount > 0 && <span style={{ color: "var(--green)" }}>{t.bookingCount} booking{t.bookingCount === 1 ? "" : "s"} ${t.bookingTotal.toFixed(2)}</span>}
                    {t.bookingCount > 0 && t.playerCount > 0 && " · "}
                    {t.playerCount > 0 && <span style={{ color: "var(--peach,#D9785C)" }}>{t.playerCount} walk-in{t.playerCount === 1 ? "" : "s"} ${t.playerTotal.toFixed(2)}</span>}
                    {t.itemCount === 0 && t.bookingCount === 0 && t.playerCount === 0 && (
                      <span style={{ opacity: 0.5, fontStyle: "italic" }}>empty</span>
                    )}
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 26, fontWeight: 700 }}>
                    ${t.runningTotal.toFixed(2)}
                  </div>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.14em", opacity: 0.5, textTransform: "uppercase" }}>
                    running
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        <div className="actions">
          <button className="btn ghost" onClick={onClose}>Close</button>
        </div>

        {showNewTab && (
          <NewTabModal
            onClose={() => setShowNewTab(false)}
            onCreated={(tabId) => {
              setShowNewTab(false);
              load();
              onChanged && onChanged();
              onSelect(tabId);  // jump straight to the new tab
            }}
          />
        )}
      </div>
    </div>
  );
}

function NewTabModal({ onClose, onCreated }) {
  const [phone, setPhone] = useState("");
  const [name, setName] = useState("");
  const [notes, setNotes] = useState("");
  const [working, setWorking] = useState(false);

  async function submit() {
    if (!phone.trim() && !name.trim()) {
      showToast("Enter a name or phone for the tab", "error");
      return;
    }
    setWorking(true);
    const r = await api("tabOpen", {
      customerPhone: phone.trim(),
      customerName: name.trim(),
      notes: notes.trim(),
      openedBy: "Staff"
    });
    setWorking(false);
    if (r.ok) {
      if (r.duplicatePhoneTabId) {
        showToast("Tab opened: " + r.tabId + " · ⚠ same phone is on " + r.duplicatePhoneTabId, "success");
      } else {
        showToast("Tab opened: " + r.tabId, "success");
      }
      onCreated(r.tabId);
    } else {
      showToast(r.error || "Failed to open tab", "error");
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose} style={{ zIndex: 200 }}>
      <div className="modal" style={{ maxWidth: 460 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">For accumulating items + pay-at-end</div>
            <h2>New Tab</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div style={{ marginBottom: 14 }}>
          <label className="field-label">Customer name</label>
          <input
            className="field-input"
            type="text"
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder="Linda Nguyen / Walk-up at C·3 / etc."
            autoFocus
          />
        </div>
        <div style={{ marginBottom: 14 }}>
          <label className="field-label">Phone (optional but recommended)</label>
          <input
            className="field-input"
            type="tel"
            value={phone}
            onChange={(e) => setPhone(e.target.value)}
            placeholder="91234002"
          />
          <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.1em", opacity: 0.55, marginTop: 4 }}>
            Phone lets us apply member discounts and link this tab to customer history.
          </div>
        </div>
        <div style={{ marginBottom: 14 }}>
          <label className="field-label">Notes</label>
          <input
            className="field-input"
            type="text"
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
            placeholder="e.g. court 3 group, kids' birthday"
          />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={submit} disabled={working}>
            {working ? "Opening…" : "Open Tab"}
          </button>
        </div>
      </div>
    </div>
  );
}

function TabDetailModal({ tabId, products, onClose }) {
  const [data, setData] = useState(null);
  const [working, setWorking] = useState(false);
  const [showAddItem, setShowAddItem] = useState(false);
  const [showAttachBooking, setShowAttachBooking] = useState(false);
  const [showClose, setShowClose] = useState(false);

  async function load() {
    const r = await api("tabGetDetail", { tabId: tabId });
    if (r.ok) setData(r);
    else { showToast(r.error || "Failed", "error"); onClose(); }
  }
  useEffect(() => { load(); }, [tabId]);

  async function removeItem(itemId) {
    if (!confirm("Remove this item from the tab?")) return;
    setWorking(true);
    const r = await api("tabRemoveItem", { tabId: tabId, itemId: itemId });
    setWorking(false);
    if (r.ok) load();
    else showToast(r.error || "Failed", "error");
  }

  async function detachBooking(bookingId) {
    if (!confirm("Detach this booking from the tab? It will go back to Pending (needs separate payment).")) return;
    setWorking(true);
    const r = await api("tabDetachBooking", { bookingId: bookingId });
    setWorking(false);
    if (r.ok) load();
    else showToast(r.error || "Failed", "error");
  }

  async function detachPlayer(playerId) {
    if (!confirm("Detach this walk-in player from the tab?")) return;
    setWorking(true);
    const r = await api("tabDetachWalkInPlayer", { playerId: playerId });
    setWorking(false);
    if (r.ok) load();
    else showToast(r.error || "Failed", "error");
  }

  async function cancelTab() {
    if (!confirm("Cancel this tab? Items will be discarded. Attached bookings/walk-ins will revert to Pending (need separate payment).")) return;
    setWorking(true);
    const r = await api("tabCancel", { tabId: tabId });
    setWorking(false);
    if (r.ok) {
      showToast("Tab cancelled", "success");
      onClose();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  if (data === null) {
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal" style={{ maxWidth: 720 }} onClick={(e) => e.stopPropagation()}>
          <div style={{ padding: 60, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
        </div>
      </div>
    );
  }

  const tab = data.tab;
  const isOpen = tab.status === "Open";

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 760, maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">
              {tab.tabId} · opened {tab.openedAt.substring(11, 16)} by {tab.openedBy}

            </div>
            <h2>{tab.customerName || "(no name)"} <span style={{ fontSize: 13, fontFamily: "var(--mono)", opacity: 0.5, fontStyle: "normal" }}>{tab.customerPhone}</span></h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        {tab.notes && (
          <div style={{
            padding: "8px 12px", marginBottom: 14,
            background: "rgba(168,116,74,0.06)", borderLeft: "3px solid var(--wood)",
            fontFamily: "var(--mono)", fontSize: 11, opacity: 0.85
          }}>
            {tab.notes}
          </div>
        )}

        {/* Running total summary */}
        <div style={{
          display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1.2fr",
          gap: 10, marginBottom: 18,
          padding: 14, border: "1.5px solid var(--ink)", borderRadius: 4,
          background: "var(--paper)"
        }}>
          <div>
            <div className="kicker">Items</div>
            <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 22 }}>${data.itemTotal.toFixed(2)}</div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.5 }}>{data.items.length} line{data.items.length === 1 ? "" : "s"}</div>
          </div>
          <div>
            <div className="kicker">Courts</div>
            <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 22, color: "var(--green)" }}>${data.bookingTotal.toFixed(2)}</div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.5 }}>{data.bookings.length} booking{data.bookings.length === 1 ? "" : "s"}</div>
          </div>
          <div>
            <div className="kicker">Walk-in</div>
            <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 22, color: "var(--peach,#D9785C)" }}>${data.playerTotal.toFixed(2)}</div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.5 }}>{data.walkInPlayers.length} player{data.walkInPlayers.length === 1 ? "" : "s"}</div>
          </div>
          <div style={{ borderLeft: "1.5px solid var(--ink)", paddingLeft: 14 }}>
            <div className="kicker">Total</div>
            <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 30, fontWeight: 700 }}>${data.runningTotal.toFixed(2)}</div>
          </div>
        </div>

        <div className="section-label">
          <span><span className="num">01</span><span className="name">Items</span></span>

            {isOpen && <button className="btn-sm primary" onClick={() => setShowAddItem(true)}>+ Add item</button>}
          </span>
        </div>
        {data.items.length === 0 ? (
          <div className="empty-mini" style={{ padding: 14, opacity: 0.5 }}>No items yet</div>
        ) : (
          <div style={{ marginBottom: 14 }}>
            {data.items.map(it => (
              <div key={it.itemId} className="modal-detail-row" style={{ padding: "8px 0" }}>
                <span className="k">
                  <span style={{ fontFamily: "var(--mono)", fontSize: 9, opacity: 0.4, marginRight: 8 }}>{it.addedAt}</span>
                  <strong>{it.name}</strong>
                  <span style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55, marginLeft: 6 }}>{it.quantity} × ${it.price.toFixed(2)}</span>
                </span>
                <span className="v" style={{ display: "flex", gap: 8, alignItems: "center" }}>

                    <button className="btn-sm" onClick={() => removeItem(it.itemId)} disabled={working}
                      style={{ color: "var(--clay)" }}>×</button>
                  )}
                </span>
              </div>
            ))}
          </div>
        )}

        {/* Bookings section */}
        <div className="section-label">
          <span><span className="num">02</span><span className="name" style={{ color: "var(--green)" }}>Court Bookings</span></span>
          <span className="right">
            {isOpen && <button className="btn-sm primary" onClick={() => setShowAttachBooking(true)}>+ Attach booking / walk-in</button>}
          </span>
        </div>
        {data.bookings.length === 0 ? (
          <div className="empty-mini" style={{ padding: 14, opacity: 0.5 }}>No bookings attached</div>
        ) : (
          <div style={{ marginBottom: 14 }}>
            {data.bookings.map(b => (
              <div key={b.bookingId} className="modal-detail-row" style={{ padding: "8px 0" }}>
                <span className="k">
                  <strong>{b.name}</strong>
                  <span style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55, marginLeft: 6 }}>
                    {b.date} · {b.time}–{b.timeEnd} · C·{b.courtNumbers}
                  </span>
                </span>
                <span className="v" style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  ${b.total.toFixed(2)}
                  {isOpen && (
                    <button className="btn-sm" onClick={() => detachBooking(b.bookingId)} disabled={working}
                      style={{ color: "var(--clay)" }}>detach</button>
                  )}
                </span>
              </div>
            ))}
          </div>
        )}

        {/* Walk-in players section */}
        {data.walkInPlayers.length > 0 && (
          <>
            <div className="section-label">
              <span><span className="num">03</span><span className="name" style={{ color: "var(--peach,#D9785C)" }}>Walk-in Players</span></span>
              <span className="right">{data.walkInPlayers.length}</span>
            </div>
            <div style={{ marginBottom: 14 }}>
              {data.walkInPlayers.map(p => (
                <div key={p.playerId} className="modal-detail-row" style={{ padding: "8px 0" }}>
                  <span className="k">
                    <strong>{p.name}</strong>
                    <span style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55, marginLeft: 6 }}>
                      C·{p.court} · {p.date} {p.time}
                    </span>
                  </span>
                  <span className="v" style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    ${p.amount.toFixed(2)}
                    {isOpen && (
                      <button className="btn-sm" onClick={() => detachPlayer(p.playerId)} disabled={working}
                        style={{ color: "var(--clay)" }}>detach</button>
                    )}
                  </span>
                </div>
              ))}
            </div>
          </>
