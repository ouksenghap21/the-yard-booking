        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Day utilization</div>
        <div className="value">{util.utilizationPct || 0}<span className="unit">%</span></div>
        <div className="util-bar">
          <div
            className={"fill " + utilCls}
            style={{ transform: "scaleX(" + ((util.utilizationPct || 0) / 100) + ")" }}
          />
        </div>
        <div className="delta flat">
          {util.bookedCourtHours || 0}h booked of {util.totalCourtHours || 0}h available
        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Peak utilization · {util.peakHoursToday || 5}h peak window</div>
        <div className="value">{util.peakUtilizationPct || 0}<span className="unit">%</span></div>
        <div className="util-bar">
          <div
            className={"fill " + peakCls}
            style={{ transform: "scaleX(" + ((util.peakUtilizationPct || 0) / 100) + ")" }}
          />
        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Today's total revenue</div>
        <div className="value">${todayTotal.toFixed(2)}</div>
        <div className={"delta " + deltaClass(deltaYest)}>
          vs yesterday: {deltaLabel(deltaYest)} · ${yest.toFixed(2)}
        </div>
        <div className={"delta " + deltaClass(deltaWk)}>
          vs last {new Date().toLocaleDateString("en", { weekday: "long" })}: {deltaLabel(deltaWk)} · ${lastWk.toFixed(2)}
        </div>
      </div>
    </div>
  );
}

/* ====================================================================
   BOOKINGS TAB — list, filter by date+status, actions (paid/no-show/cancel),
   walk-in creation modal.
   ==================================================================== */

const STATUS_LABELS = {
  all: "All",
  awaiting: "Awaiting",
  at_risk: "At-risk",
  paid: "Paid",
  no_show_freed: "Released",
  no_show_kept: "No-show",
  completed: "Completed",
  cancelled: "Cancelled"
};

function ScreenBookings() {
  const [view, setView] = useState("day"); // day | week | month
  const [date, setDate] = useState(todayISO());
  const [statusFilter, setStatusFilter] = useState("all");
  const [entries, setEntries] = useState(null);
  const [loading, setLoading] = useState(true);
  const [detailBooking, setDetailBooking] = useState(null);
  const [walkInBlock, setWalkInBlock] = useState(null); // walk-in block modal
  const [addBookingFlow, setAddBookingFlow] = useState(null); // null | "chooser" | "court" | "walkin"

  // Compute the date range we need to fetch based on view + selected date
  const range = useMemo(() => {
    const d = new Date(date + "T12:00:00");
    if (view === "day") {
      return { from: date, to: date };
    } else if (view === "week") {
      // 7 days starting from selected date
      const out = [date];
      for (let i = 1; i < 7; i++) {
        const x = new Date(d);
        x.setDate(x.getDate() + i);
        out.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"));
      }
      return { from: out[0], to: out[6], all: out };
    } else {
      // Month containing the selected date
      const y = d.getFullYear();
      const m = d.getMonth();
      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const fmt = (x) => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
      return { from: fmt(first), to: fmt(last) };
    }
  }, [view, date]);

  async function load(opts) {
    const silent = opts && opts.silent;
    if (!silent) setLoading(true);
    const r = await api("adminListTimelineEntries", { dateFrom: range.from, dateTo: range.to });
    if (r.ok) setEntries(r.entries || []);
    else if (!silent) showToast(r.error || "Failed to load", "error");
    if (!silent) setLoading(false);
  }

  useEffect(() => { load(); }, [range.from, range.to]);

  // Poll every 20s silently — no loading flicker
  useEffect(() => {
    const id = setInterval(() => load({ silent: true }), 20000);
    return () => clearInterval(id);
  }, [range.from, range.to]);

  // For Day view: get just today's bookings (not coaching, since coaching has its own tab)
  // Coaching sessions still show on the timeline visual, but the Booking ROW list is guest-only
  const dayBookings = useMemo(() => {
    if (!entries) return [];
    return entries
      .filter(e => e.date === date && e.entryType === "booking")
      .filter(b => statusFilter === "all" ? true : b.derivedStatus === statusFilter);
  }, [entries, date, statusFilter]);

  // Coaching entries on day (for showing in the list separately)
  const dayCoaching = useMemo(() => {
    if (!entries) return [];
    return entries.filter(e => e.date === date && e.entryType === "coaching");
  }, [entries, date]);

  // Walk-in entries on day (separate from guest bookings)
  const dayWalkIns = useMemo(() => {
    if (!entries) return [];
    return entries.filter(e => e.date === date && e.entryType === "walkin");
  }, [entries, date]);

  // Status counts (guest bookings only)
  const counts = useMemo(() => {
    const c = { all: 0, awaiting: 0, at_risk: 0, paid: 0, no_show_freed: 0, no_show_kept: 0, completed: 0, cancelled: 0 };
    if (!entries) return c;
    for (const b of entries) {
      if (b.entryType !== "booking") continue;
      if (b.date !== date) continue;
      c.all++;
      if (c[b.derivedStatus] !== undefined) c[b.derivedStatus]++;
    }
    return c;
  }, [entries, date]);

  // Date pills (Day view only)
  const datePills = useMemo(() => {
    const out = [];
    const today = new Date();
    for (let off = -1; off <= 2; off++) {
      const d = new Date(today);
      d.setDate(d.getDate() + off);
      const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const labels = { "-1": "Yesterday", "0": "Today", "1": "Tomorrow", "2": d.toLocaleDateString("en", { weekday: "short" }) };
      out.push({ iso: iso, label: labels[String(off)] || iso, day: d.getDate() });
    }
    return out;
  }, []);

  // Title for the head
  const title = useMemo(() => {
    if (view === "day") return fmtDateLong(date);
    if (view === "week") {
      const start = new Date(range.from + "T12:00:00");
      const end = new Date(range.to + "T12:00:00");
      const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return start.getDate() + " " + MO[start.getMonth()] + " – " + end.getDate() + " " + MO[end.getMonth()] + " " + end.getFullYear();
    }
    const d = new Date(date + "T12:00:00");
    const MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return MO[d.getMonth()] + " " + d.getFullYear();
  }, [view, date, range]);

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">{title}</div>
          <h1>Bookings</h1>
        </div>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <div className="range-toggle">
            <button className={view === "day" ? "on" : ""} onClick={() => setView("day")}>Day</button>
            <button className={view === "week" ? "on" : ""} onClick={() => setView("week")}>Week</button>
            <button className={view === "month" ? "on" : ""} onClick={() => setView("month")}>Month</button>
          </div>
          <button className="btn primary" onClick={() => setAddBookingFlow("chooser")}>+ Add booking</button>
        </div>
      </div>

      {/* Date strip — visible on Day view, simpler nav on Week/Month */}
      {view === "day" && (
        <div className="bookings-toolbar">
          <div className="date-strip">
            {datePills.map(p => (
              <button
                key={p.iso}
                className={"date-pill" + (date === p.iso ? " on" : "")}
                onClick={() => setDate(p.iso)}
              >
                {p.label}<span className="num">{p.day}</span>
              </button>
            ))}
            <button className="date-pill">
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
            </button>
          </div>
        </div>
      )}

      {(view === "week" || view === "month") && (
        <div className="bookings-toolbar">
          <button className="date-pill" onClick={() => {
            const d = new Date(date + "T12:00:00");
            d.setDate(d.getDate() - (view === "week" ? 7 : 30));
            setDate(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
          }}>← Prev</button>
          <button className="date-pill" onClick={() => setDate(todayISO())}>Today</button>
          <button className="date-pill" onClick={() => {
            const d = new Date(date + "T12:00:00");
            d.setDate(d.getDate() + (view === "week" ? 7 : 30));
            setDate(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
          }}>Next →</button>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
            style={{ padding: "8px 12px", border: "1.5px solid var(--ink)", borderRadius: 999, fontFamily: "var(--mono)", fontSize: 12 }} />
        </div>
      )}

      {/* DAY VIEW */}
      {view === "day" && (
        <>
          <div className="filter-chips">
            {Object.keys(STATUS_LABELS).map(s => (
              <button
                key={s}
                className={"filter-chip" + (statusFilter === s ? " on" : "")}
                onClick={() => setStatusFilter(s)}
              >
                {STATUS_LABELS[s]} · {counts[s] || 0}
              </button>
            ))}
          </div>

          {entries === null ? (
            <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
              <BouncingBall size="md" />
            </div>
          ) : (
            <>
              {/* Coaching sessions for the day (separate from guest bookings) */}
              {dayCoaching.length > 0 && (
                <div style={{ marginBottom: 18 }}>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, color: "var(--wood)", marginBottom: 8 }}>
                    ★ Coaching sessions · {dayCoaching.length}
                  </div>
                  {dayCoaching.map(s => (
                    <div key={s.bookingId} className="booking-row" style={{ borderLeft: "5px solid var(--wood)", background: "rgba(168,116,74,0.04)" }}>
                      <div className="when">{s.time}<span className="endtime">→ {s.timeEnd}</span></div>
                      <div className="who">
                        <div className="name">
                          ★ {s.coachName}
                          {s.studentName && <span style={{ fontWeight: 400, opacity: 0.7, fontSize: 13 }}>· with {s.studentName}</span>}
                        </div>
                        <div className="meta">C·{s.courtNumbers} · {s.durationHours}h · {s.sessionType}</div>
                        <div className="id">{s.bookingId}</div>
                      </div>
                      <div className="actions">
                        <div className="total" style={{ color: "var(--wood)" }}>${(s.facilityEarns || 0).toFixed(2)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Walk-in / Drop-in open play sessions */}
              {dayWalkIns.length > 0 && (
                <div style={{ marginBottom: 18 }}>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, color: "var(--peach,#D9785C)", marginBottom: 8 }}>
                    ◉ Open play · drop-in · {dayWalkIns.length}
                  </div>
                  {dayWalkIns.map(w => {
                    const full = w.playerCount >= w.playerCap;
                    return (
                      <div
                        key={w.bookingId}
                        className="booking-row"
                        style={{ borderLeft: "5px solid var(--peach,#D9785C)", background: "rgba(217,120,92,0.05)", cursor: "pointer" }}
                        onClick={async () => {
                          // Fetch latest block detail before opening
                          const r = await api("adminListWalkInBlocks", { dateFrom: w.date, dateTo: w.date });
                          if (r.ok) {
                            const fresh = (r.blocks || []).find(b => b.blockId === w.bookingId);
                            if (fresh) setWalkInBlock(fresh);
                          }
                        }}
                      >
                        <div className="when">{w.time}<span className="endtime">→ {w.timeEnd}</span></div>
                        <div className="who">
                          <div className="name">
                            ◉ Open Play · Court {w.courtNumbers}
                            <span style={{
                              marginLeft: 8, fontFamily: "var(--mono)", fontSize: 9,
                              letterSpacing: "0.16em", textTransform: "uppercase",
                              background: full ? "var(--clay)" : "var(--peach,#D9785C)", color: "var(--cream)",
                              padding: "2px 7px", borderRadius: 3
                            }}>
                              {w.playerCount}/{w.playerCap} {full ? "· FULL" : "players"}
                            </span>
                            {w.status === "Closed" && <span className="status-pill cancelled" style={{ marginLeft: 6 }}>Closed</span>}
                          </div>
                          <div className="meta">{w.durationHours}h · ${w.rate}/player · {w.status}</div>
                          <div className="id">{w.bookingId}</div>
                        </div>
                        <div className="actions">
                          <div className="total" style={{ color: "var(--peach,#D9785C)" }}>${(w.total || 0).toFixed(2)}</div>
                          <button className="btn-sm primary" onClick={(e) => { e.stopPropagation(); }}>Manage players</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Guest bookings */}
              {dayBookings.length === 0 ? (
                <div className="empty">
                  {statusFilter === "all" ? "No guest bookings for this date" : "No " + STATUS_LABELS[statusFilter].toLowerCase() + " bookings"}
                </div>
              ) : (
                <div className="booking-list">
                  {dayBookings.map(b => (
                    <BookingRow key={b.bookingId} booking={b} onAction={load} onOpen={() => setDetailBooking(b)} />
                  ))}
                </div>
              )}
            </>
          )}
        </>
      )}

      {/* WEEK VIEW */}
      {view === "week" && (
        entries === null ? (
          <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
            <BouncingBall size="md" />
          </div>
        ) : (
          <WeekView entries={entries} days={range.all || []} onDayClick={(iso) => { setView("day"); setDate(iso); }} />
        )
      )}

      {/* MONTH VIEW */}
      {view === "month" && (
        entries === null ? (
          <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
            <BouncingBall size="md" />
          </div>
        ) : (
          <MonthView entries={entries} centerDate={date} onDayClick={(iso) => { setView("day"); setDate(iso); }} />
        )
      )}

      {detailBooking && (
        <BookingDetailModal
          booking={detailBooking}
          onClose={() => setDetailBooking(null)}
          onAction={() => { load(); setDetailBooking(null); }}
        />
      )}

      {walkInBlock && (
        <WalkInBlockModal
          block={walkInBlock}
          onClose={() => setWalkInBlock(null)}
          onChanged={() => load()}
        />
      )}

      {addBookingFlow === "chooser" && (
        <AddBookingChooserModal
          onClose={() => setAddBookingFlow(null)}
          onPick={(kind) => setAddBookingFlow(kind)}
        />
      )}

      {addBookingFlow === "court" && (
        <BookingModal
          dateDefault={date}
          onClose={() => setAddBookingFlow(null)}
          onCreated={() => { load(); setAddBookingFlow(null); }}
        />
      )}

      {addBookingFlow === "walkin" && (
        <NewWalkInBlockModal
          dateDefault={date}
          onClose={() => setAddBookingFlow(null)}
          onCreated={(blockId) => {
            load();
            setAddBookingFlow(null);
            // Auto-open the new block to start adding players
            setTimeout(() => {
              api("adminListWalkInBlocks", { dateFrom: date, dateTo: date }).then(r => {
                if (r.ok) {
                  const fresh = (r.blocks || []).find(b => b.blockId === blockId);
                  if (fresh) setWalkInBlock(fresh);
                }
              });
            }, 100);
          }}
        />
      )}
    </div>
  );
}

/* Week view: 7 days stacked, each a mini timeline */
function WeekView({ entries, days, onDayClick }) {
  // Compute per-day breakdown
  const dayStats = useMemo(() => {
    const map = {};
    for (const iso of days) {
      const dayEntries = entries.filter(e => e.date === iso);
      const guestEntries = dayEntries.filter(e => e.entryType === "booking" && e.derivedStatus !== "cancelled");
      const coachEntries = dayEntries.filter(e => e.entryType === "coaching");
      const walkinEntries = dayEntries.filter(e => e.entryType === "walkin");
      const courtRev = guestEntries.reduce((s, e) => s + (e.total || 0), 0);
      const coachingRev = coachEntries.reduce((s, e) => s + (e.facilityEarns || 0), 0);
      const walkinRev = walkinEntries.reduce((s, e) => s + (e.total || 0), 0);
      map[iso] = {
        guestCount: guestEntries.length,
        coachCount: coachEntries.length,
        walkinCount: walkinEntries.length,
        courtRev: courtRev,
        coachingRev: coachingRev,
        walkinRev: walkinRev,
        totalRev: courtRev + coachingRev + walkinRev
      };
    }
    return map;
  }, [entries, days]);

  return (
    <div className="week-grid">
      {days.map(iso => {
        const d = new Date(iso + "T12:00:00");
        const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const isToday = iso === todayISO();
        const stats = dayStats[iso] || { guestCount: 0, coachCount: 0, walkinCount: 0, totalRev: 0, courtRev: 0, coachingRev: 0, walkinRev: 0 };

        const counts = [];
        if (stats.guestCount > 0) counts.push(stats.guestCount + " booking" + (stats.guestCount === 1 ? "" : "s"));
        if (stats.coachCount > 0) counts.push(stats.coachCount + " ★");
        if (stats.walkinCount > 0) counts.push(stats.walkinCount + " ◉");
        const countText = counts.length > 0 ? counts.join(" · ") : "No activity";

        return (
          <div className="week-day" key={iso}>
            <div
              className={"week-day-head" + (isToday ? " is-today" : "")}
              onClick={() => onDayClick(iso)}
              style={{ cursor: "pointer" }}
              title="Click to open this day's full view"
            >
              <div className="label">
                {DOW[d.getDay()]} <span className="num">{d.getDate()}</span>
              </div>
              <div className="stats">
                <span>{countText}</span>
                {stats.totalRev > 0 && (
                  <span style={{ marginLeft: 10 }}>
                    {stats.courtRev > 0 && <span>${stats.courtRev.toFixed(0)} court</span>}
                    {stats.coachingRev > 0 && <span style={{ marginLeft: 6, color: "var(--wood-2,#C9A24A)" }}>★ ${stats.coachingRev.toFixed(0)}</span>}
                    {stats.walkinRev > 0 && <span style={{ marginLeft: 6, color: "var(--peach,#D9785C)" }}>◉ ${stats.walkinRev.toFixed(0)}</span>}
                  </span>
                )}
              </div>
            </div>
            <Timeline bookings={entries.filter(e => e.date === iso)} dateStr={iso} />
          </div>
        );
      })}
    </div>
  );
}

/* Month view: calendar with daily counts */
function MonthView({ entries, centerDate, onDayClick }) {
  const d = new Date(centerDate + "T12:00:00");
  const y = d.getFullYear();
  const m = d.getMonth();
  const firstOfMonth = new Date(y, m, 1);
  const lastOfMonth = new Date(y, m + 1, 0);
  const daysInMonth = lastOfMonth.getDate();
  const startDow = firstOfMonth.getDay();

  const [hoverIso, setHoverIso] = useState(null);
  const [hoverPos, setHoverPos] = useState({ x: 0, y: 0 });

  // Track which month we've already animated — change month → re-animate;
  // same month silent refresh → don't re-animate.
  const [animatedFor, setAnimatedFor] = useState(null);
  const monthKey = y + "-" + m;
  const shouldAnimate = animatedFor !== monthKey;
  useEffect(() => {
    if (shouldAnimate) {
      const t = setTimeout(() => setAnimatedFor(monthKey), 700); // after animation completes
      return () => clearTimeout(t);
    }
  }, [monthKey, shouldAnimate]);

  // Build cells: leading empties + days + trailing empties
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) cells.push(day);
  while (cells.length % 7 !== 0) cells.push(null);

  // Map of date -> stats + entries list
  const byDate = useMemo(() => {
    const map = {};
    for (const e of entries) {
      if (!map[e.date]) map[e.date] = { bookings: 0, coaching: 0, revenue: 0, slots: 0, entries: [] };
      if (e.entryType === "booking" && e.derivedStatus !== "cancelled") {
        map[e.date].bookings++;
        map[e.date].revenue += (e.total || 0);
        const courtCount = String(e.courtNumbers || "").split(",").filter(Boolean).length;
        map[e.date].slots += (e.slots || 0) * courtCount;
        map[e.date].entries.push(e);
      } else if (e.entryType === "coaching") {
        map[e.date].coaching++;
        map[e.date].revenue += (e.facilityEarns || 0);
        const courtCount = String(e.courtNumbers || "").split(",").filter(Boolean).length;
        map[e.date].slots += (e.slots || 0) * courtCount;
        map[e.date].entries.push(e);
      }
    }
    return map;
  }, [entries]);

  // 32 slots × 8 courts = 256 court-slot capacity per full operating day
  const DAILY_CAPACITY = 32 * 8;

  // Max revenue in month for relative saturation scaling
  const maxRev = useMemo(() => {
    let max = 0;
    for (const iso in byDate) {
      if (byDate[iso].revenue > max) max = byDate[iso].revenue;
    }
    return max || 1;
  }, [byDate]);

  const DOW_FULL = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const DOW_SHORT = ["S","M","T","W","T","F","S"];
  const today = todayISO();

  function handleMouseEnter(iso, e) {
    setHoverIso(iso);
    const rect = e.currentTarget.getBoundingClientRect();
    setHoverPos({ x: rect.left + rect.width / 2, y: rect.bottom + 6 });
  }

  const hoverStats = hoverIso && byDate[hoverIso];

  return (
    <div className="month-wrap">
      <div className="month-grid-v2">
        {DOW_FULL.map((d, i) => (
          <div key={d + i} className="month-dow-head-v2">
            <span className="full">{d}</span>
            <span className="short">{DOW_SHORT[i]}</span>
          </div>
        ))}
        {cells.map((day, i) => {
          if (day === null) return <div key={"empty-" + i} className="month-cell-v2 empty" />;
          const iso = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
          const stats = byDate[iso] || { bookings: 0, coaching: 0, revenue: 0, slots: 0, entries: [] };
          const dt = new Date(y, m, day);
          const isWknd = dt.getDay() === 0 || dt.getDay() === 6;
          const isTodayCell = iso === today;
          const isPast = iso < today;
          const utilPct = Math.min(100, Math.round((stats.slots / DAILY_CAPACITY) * 100));
          const totalEvents = stats.bookings + stats.coaching;

          // Saturation: 0..1 scaling based on revenue
          const sat = Math.min(1, stats.revenue / maxRev);
          // Background tint: more saturated = stronger green tint
          // Use green at ~0.1 alpha for low to 0.32 for high
          const bgAlpha = totalEvents === 0 ? 0 : (0.07 + sat * 0.25);

          return (
            <div
              key={iso}
              className={
                "month-cell-v2"
                + (shouldAnimate ? " do-anim" : " no-anim")
                + (isTodayCell ? " today" : "")
                + (isWknd ? " weekend" : "")
                + (isPast ? " past" : "")
                + (totalEvents === 0 ? " empty-day" : "")
              }
              style={{
                background: totalEvents > 0
                  ? `linear-gradient(135deg, rgba(61,122,79,${bgAlpha}) 0%, rgba(168,116,74,${bgAlpha * 0.5}) 100%)`
                  : undefined,
                animationDelay: shouldAnimate ? (i * 8) + "ms" : "0ms"
              }}
              onClick={() => onDayClick(iso)}
              onMouseEnter={(e) => handleMouseEnter(iso, e)}
              onMouseLeave={() => setHoverIso(null)}
            >
              <div className="day-num-v2">{day}</div>

              {totalEvents > 0 && (
                <div className="day-body">
                  <div className="day-count">
                    <span className="big">{totalEvents}</span>
                    <span className="lbl">{totalEvents === 1 ? "EVENT" : "EVENTS"}</span>
                  </div>
                  <div className="day-rev">${stats.revenue.toFixed(0)}</div>

function BookingModal({ dateDefault, onClose, onCreated }) {
  const [form, setForm] = useState({
    phone: "",
    name: "",
    date: dateDefault || todayISO(),
    time: "18:00",
    slots: 2,
    courts: [],
    email: ""
  });
  const [availSlots, setAvailSlots] = useState([]);
  const [submitting, setSubmitting] = useState(false);
  const [pricePreview, setPricePreview] = useState(null);
  const [config, setConfig] = useState(null);
  const [memberInfo, setMemberInfo] = useState(null);

  // Load pricing config once when modal opens
  useEffect(() => {
    getCachedConfig().then(c => setConfig(c));
  }, []);

  // Load availability for selected date
  useEffect(() => {
    api("getAvailability", { date: form.date }).then(r => {
      if (r.ok) setAvailSlots(r.slots || []);
    });
  }, [form.date]);

  // Member lookup — debounced so we don't hammer the API on every keystroke
  useEffect(() => {
    if (!form.phone || form.phone.length < 6) {
      setMemberInfo(null);
      return;
    }
    const id = setTimeout(() => {
      api("lookupMember", { phone: form.phone }).then(r => {
        if (r.ok && r.member) setMemberInfo(r.member);
        else setMemberInfo(null);
      });
    }, 350);
    return () => clearTimeout(id);
  }, [form.phone]);

  // Determine which courts are available for the chosen time + duration
  const courtAvailability = useMemo(() => {
    if (!availSlots.length) return { available: [], unavailable: [1,2,3,4,5,6,7,8] };
    const startIdx = availSlots.findIndex(s => s.time === form.time);
    if (startIdx < 0) return { available: [], unavailable: [1,2,3,4,5,6,7,8] };
    const courtsAvail = new Set([1, 2, 3, 4, 5, 6, 7, 8]);
    for (let i = 0; i < form.slots; i++) {
      const s = availSlots[startIdx + i];
      if (!s) return { available: [], unavailable: [1,2,3,4,5,6,7,8] };
      const courtsBoolArr = s.courts || [];
      for (let cIdx = 0; cIdx < 8; cIdx++) {
        const courtNum = cIdx + 1;
        if (!courtsBoolArr[cIdx]) courtsAvail.delete(courtNum);
      }
    }
    const available = Array.from(courtsAvail).sort();
    const unavailable = [1,2,3,4,5,6,7,8].filter(c => !courtsAvail.has(c));
    return { available, unavailable };
  }, [availSlots, form.time, form.slots]);

  // Auto-select first available court when:
  //   - availability data loads
  //   - the user changes date/time/duration causing court reshuffle
  // If the currently-selected courts are no longer available, swap them out
  useEffect(() => {
    if (!courtAvailability.available.length) return;
    const validCurrentlySelected = form.courts.filter(c => courtAvailability.available.includes(c));
    if (validCurrentlySelected.length === form.courts.length && form.courts.length > 0) {
      return;  // current selection is fine
    }
    // Either no selection or some/all selected courts are now unavailable
    if (validCurrentlySelected.length === 0) {
      setForm(f => ({ ...f, courts: [courtAvailability.available[0]] }));
    } else {
      setForm(f => ({ ...f, courts: validCurrentlySelected }));
    }
  }, [courtAvailability.available.join(",")]);

  // CLIENT-SIDE price preview — fast, instant, no network call
  useEffect(() => {
    if (!config) {
      setPricePreview(null);
      return;
    }
    const isMember = !!memberInfo;
    const tier = memberInfo ? memberInfo.tier : "";
    const result = calculatePriceClient({
      config: config,
      isMember: isMember,
      tier: tier,
      date: form.date,
      time: form.time,
      slots: form.slots,
      courts: form.courts.length || 1
    });
    setPricePreview(result);
  }, [config, memberInfo, form.date, form.time, form.slots, form.courts.length]);

  function toggleCourt(c) {
    if (courtAvailability.unavailable.includes(c)) return;
    setForm(f => {
      const set = new Set(f.courts);
      if (set.has(c)) set.delete(c);
      else set.add(c);
      const arr = Array.from(set).sort();
      return { ...f, courts: arr.length ? arr : [c] };
    });
  }

  async function submit() {
    if (!form.phone) return showToast("Phone required", "error");
    if (!form.name) return showToast("Name required", "error");
    if (form.courts.length === 0) return showToast("Pick at least one court", "error");

    setSubmitting(true);
    const r = await api("adminCreateBooking", {
      phone: form.phone,
      name: form.name,
      email: form.email,
      date: form.date,
      time: form.time,
      slots: form.slots,
      courts: form.courts.length,
      source: "Staff"
    });
    setSubmitting(false);
    if (r.ok) {
      showToast("Walk-in booked", "success");
      onCreated && onCreated();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  // Time options: 06:00 to 21:30 in 30-min steps
  const timeOptions = useMemo(() => {
    const out = [];
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      for (const m of [0, 30]) {
        const t = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        const slot = availSlots.find(s => s.time === t);
        const isFree = slot ? (slot.availableCount > 0) : false;
        out.push({ value: t, label: t + (isFree ? "" : "  (full)"), disabled: !isFree });
      }
    }
    return out;
  }, [availSlots]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">New court reservation</div>
            <h2>Add Booking</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field">
          <div className="field-label">Phone</div>
          <input
            type="tel"
            inputMode="numeric"
            value={form.phone}
            placeholder="e.g. 12345678"
            onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/[^0-9]/g, "") })}
          />
        </div>

        <div className="field">
          <div className="field-label">Customer name</div>
          <input
            type="text"
            value={form.name}
            placeholder="First & last name"
            onChange={(e) => setForm({ ...form, name: e.target.value })}
          />
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Date</div>
            <input
              type="date"
              value={form.date}
              onChange={(e) => setForm({ ...form, date: e.target.value, courts: [1] })}
            />
          </div>
          <div className="field">
            <div className="field-label">Start time</div>
            <select value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value, courts: [1] })}>
              {timeOptions.map(o => (
                <option key={o.value} value={o.value} disabled={o.disabled}>{o.label}</option>
              ))}
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Duration</div>
          <select value={form.slots} onChange={(e) => setForm({ ...form, slots: parseInt(e.target.value) })}>
            <option value={2}>1h</option>
            <option value={3}>1h 30m</option>
            <option value={4}>2h</option>
            <option value={5}>2h 30m</option>
            <option value={6}>3h</option>
            <option value={7}>3h 30m</option>
            <option value={8}>4h</option>
          </select>
        </div>

        <div className="field">
          <div className="field-label">
            Courts {form.courts.length > 0 && <span style={{ opacity: 0.6, fontSize: 10 }}>· selected: {form.courts.join(", ")}</span>}
          </div>
          <div className="court-picker">
            {[1, 2, 3, 4, 5, 6, 7, 8].map(c => {
              const isUnavail = courtAvailability.unavailable.includes(c);
              const isOn = form.courts.includes(c);
              return (
                <div
                  key={c}
                  className={"ct" + (isOn ? " on" : "") + (isUnavail ? " unavail" : "")}
                  onClick={() => toggleCourt(c)}
                >
                  C·{c}
                </div>
              );
            })}
          </div>
        </div>

        {memberInfo && (
          <div className="modal-detail-row" style={{ marginTop: 6, background: "rgba(168,116,74,0.08)", padding: "8px 10px", borderRadius: 4, borderLeft: "3px solid var(--wood)" }}>
            <span className="k">Member detected</span>
            <span className="v">
              <span className={"tier-pill " + memberInfo.tier}>{memberInfo.tier}</span>
              <span style={{ marginLeft: 6, fontFamily: "var(--mono)", fontSize: 11 }}>{memberInfo.memberNumber} · {memberInfo.name}</span>
            </span>
          </div>
        )}

        {pricePreview && (
          <div className="math-preview">
            <div className="row">
              <span className="k">Subtotal</span>
              <span className="v">${pricePreview.subtotal.toFixed(2)}</span>
            </div>
            {pricePreview.discountPct > 0 && (
              <div className="row" style={{ color: "var(--clay)" }}>
                <span className="k">Discount ({pricePreview.discountPct}%)</span>
                <span className="v">−${pricePreview.discountAmount.toFixed(2)}</span>
              </div>
            )}
            <div className="row total facility">
              <span className="k">Estimated total</span>
              <span className="v">${pricePreview.total.toFixed(2)}</span>
            </div>
          </div>
        )}

        <div className="modal-warning">
          Staff booking bypasses the customer's phone OTP. SMS confirmation will still be sent if phone is provided.
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Cancel</button>
          <button
            className="btn primary"
            onClick={submit}
            disabled={submitting || !form.phone || !form.name || form.courts.length === 0}
          >
            {submitting ? "Booking…" : "Create booking"}
          </button>
        </div>
      </div>
    </div>
  );
}

    api("adminGetWalkInRate", { date: form.date, time: form.time }).then(r => {
      if (r.ok) setComputedRate(r);
    });
  }, [form.date, form.time]);

    api("getAvailability", { date: form.date }).then(r => {
      if (r.ok) setAvailSlots(r.slots || []);
    });
  }, [form.date]);

  // Court availability across full duration
  const courtAvailability = useMemo(() => {
    if (!availSlots.length) return { unavailable: [] };
    const startIdx = availSlots.findIndex(s => s.time === form.time);
    if (startIdx < 0) return { unavailable: [1,2,3,4,5,6,7,8] };

      const courtsBoolArr = s.courts || [];
      for (let cIdx = 0; cIdx < 8; cIdx++) {
        const courtNum = cIdx + 1;
        if (!courtsBoolArr[cIdx]) courtsAvail.delete(courtNum);
      }

    return { unavailable: [1,2,3,4,5,6,7,8].filter(c => !courtsAvail.has(c)) };

                <div
                  key={c}
                  className={"ct" + (isOn ? " on" : "") + (isUnavail ? " unavail" : "")}
                  onClick={() => { if (!isUnavail) setForm({ ...form, court: c }); }}
                >C·{c}</div>
              );
            })}
          </div>
        </div>

        {computedRate && (
          <div className="math-preview">
            <div className="row total facility">
              <span className="k">Auto rate per player</span>
              <span className="v">${computedRate.rate.toFixed(2)}</span>
            </div>
            <div className="formula">
              {form.time >= "17:00" || (new Date(form.date + "T12:00:00").getDay() % 6 === 0)
                ? "Peak (weekday after " + computedRate.peakStartHour + ":00 or weekend)"
                : "Off-peak (weekday before " + computedRate.peakStartHour + ":00)"}
              {" · Cap: " + computedRate.maxPlayers + " players"}
            </div>
          </div>
        )}

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea value={form.notes} placeholder="e.g. Open play night · all skill levels"
            onChange={(e) => setForm({ ...form, notes: e.target.value })} />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Cancel</button>
          <button className="btn primary" onClick={submit} disabled={submitting}>
            {submitting ? "Creating…" : "Open the court"}
          </button>
        </div>
      </div>
    </div>
  );
}

function WalkInBlockModal({ block, onClose, onChanged }) {
  const [players, setPlayers] = useState(block.players || []);
  const [showAddPlayer, setShowAddPlayer] = useState(false);
  const [working, setWorking] = useState(false);

  async function refresh() {
    const r = await api("adminListWalkInBlocks", { dateFrom: block.date, dateTo: block.date });
    if (r.ok) {
      const fresh = (r.blocks || []).find(b => b.blockId === block.blockId);
      if (fresh) setPlayers(fresh.players || []);
    }
  }

  async function markPaid(playerId) {
    setWorking(true);
    const r = await api("adminMarkWalkInPlayerPaid", { playerId: playerId, paymentMethod: "Cash" });
    setWorking(false);
    if (r.ok) {
      showToast("Marked paid", "success");
      refresh();
      onChanged && onChanged();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function removePlayer(playerId) {
    if (!confirm("Remove this player from the block?")) return;
    setWorking(true);
    const r = await api("adminRemoveWalkInPlayer", { playerId: playerId });
    setWorking(false);
    if (r.ok) {
      showToast("Removed", "success");
      refresh();
      onChanged && onChanged();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function closeBlock() {
    if (!confirm("Close this walk-in block? Players already added remain on record.")) return;
    setWorking(true);
    const r = await api("adminCloseWalkInBlock", { blockId: block.blockId });
    setWorking(false);
    if (r.ok) {
      showToast("Block closed", "success");
      onChanged && onChanged();
      onClose && onClose();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function cancelBlock() {
    if (!confirm("Cancel this walk-in block? Court will be freed and players removed from the roster.")) return;
    setWorking(true);
    const r = await api("adminCancelWalkInBlock", { blockId: block.blockId });
    setWorking(false);
    if (r.ok) {
      showToast("Block cancelled", "success");
      onChanged && onChanged();
      onClose && onClose();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const paid = players.filter(p => String(p.paymentStatus).toLowerCase() === "paid");
  const pending = players.filter(p => String(p.paymentStatus).toLowerCase() !== "paid");
  const capacity = block.playerCap || 15;
  const full = players.length >= capacity;
  const revenuePaid = paid.reduce((s, p) => s + p.amountPaid, 0);
  const revenuePending = pending.reduce((s, p) => s + p.amountPaid, 0);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 640, maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{block.blockId} · {block.date}</div>
            <h2>Open Play · Court {block.courtNumber}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="stat-grid" style={{ gridTemplateColumns: "1fr 1fr 1fr", marginBottom: 14 }}>
          <div className="stat-card accent-ink">
            <div className="label">Players</div>
            <div className="value">{players.length}<span className="unit">of {capacity}</span></div>
          </div>
          <div className="stat-card accent-green">
            <div className="label">Collected</div>
            <div className="value">${revenuePaid.toFixed(2)}</div>
          </div>
          <div className="stat-card accent-clay">
            <div className="label">Pending</div>
            <div className="value">${revenuePending.toFixed(2)}</div>
          </div>
        </div>

        <div className="modal-detail-row">
          <span className="k">Time</span>
          <span className="v">{block.time} – {(() => {
            const [h,m] = block.time.split(":").map(Number);
            const end = h*60+m+block.durationHours*60;
            return String(Math.floor(end/60)).padStart(2,"0") + ":" + String(end%60).padStart(2,"0");
          })()} ({block.durationHours}h)</span>
        </div>
        <div className="modal-detail-row">
          <span className="k">Rate per player</span>
          <span className="v">${block.rate.toFixed(2)}</span>
        </div>
        <div className="modal-detail-row">
          <span className="k">Status</span>
          <span className="v">
            <span className={"status-pill " + (block.status === "Open" ? "paid" : block.status === "Closed" ? "completed" : "cancelled")}>
              {block.status}
            </span>
          </span>
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 14, marginBottom: 8 }}>
          <div style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", fontWeight: 700 }}>
            Players · {players.length}/{capacity}
          </div>
          <button
            className="btn-sm primary"
            disabled={full || block.status !== "Open"}
            onClick={() => setShowAddPlayer(true)}
          >
            {full ? "FULL" : "+ Add player"}
          </button>
        </div>

        {players.length === 0 ? (
          <div className="empty-mini" style={{ padding: 20 }}>No players yet · tap + Add player</div>
        ) : (
          <div style={{ maxHeight: 280, overflowY: "auto" }}>
            {players.map(p => {
              const isPaid = String(p.paymentStatus).toLowerCase() === "paid";
              return (
                <div key={p.playerId} style={{
                  display: "grid", gridTemplateColumns: "1fr auto auto auto", gap: 10, alignItems: "center",
                  padding: "10px 0", borderBottom: "1px solid rgba(26,26,26,0.08)"
                }}>
                  <div>
                    <div style={{ fontFamily: "var(--sans)", fontWeight: 600, fontSize: 13.5 }}>{p.name}</div>
                    <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.06em", opacity: 0.55 }}>
                      {p.phone || "no phone"} · {p.checkedInAt}
                    </div>
                  </div>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 13, fontWeight: 700 }}>
                    ${p.amountPaid.toFixed(2)}
                  </div>
                  <span className={"status-pill " + (isPaid ? "paid" : "at_risk")}>{p.paymentStatus}</span>
                  {!isPaid && (
                    <button className="btn-sm primary" onClick={() => markPaid(p.playerId)} disabled={working}>Mark paid</button>
                  )}
                  {isPaid && (
                    <button className="btn-sm ghost" onClick={() => removePlayer(p.playerId)} disabled={working} title="Remove">×</button>
                  )}
                </div>
              );
            })}
          </div>
        )}

        <div className="actions" style={{ flexWrap: "wrap" }}>
          {block.status === "Open" && (
            <>
              <button className="btn ghost" style={{ color: "var(--clay)", marginRight: "auto" }}
                onClick={cancelBlock} disabled={working}>Cancel block</button>
              <button className="btn" onClick={closeBlock} disabled={working}>Close block</button>
            </>
          )}
          <button className="btn primary" onClick={onClose}>Done</button>
        </div>

        {showAddPlayer && (
          <AddWalkInPlayerModal
            block={block}
            onClose={() => setShowAddPlayer(false)}
            onAdded={() => {
              setShowAddPlayer(false);
              refresh();
              onChanged && onChanged();
            }}
          />
        )}
      </div>
    </div>
  );
}

function AddWalkInPlayerModal({ block, onClose, onAdded }) {
  const [form, setForm] = useState({
    name: "",
    phone: "",
    amount: block.rate,
    paymentStatus: "Pending",
    paymentMethod: "Cash"
  });
  const [submitting, setSubmitting] = useState(false);

  async function submit(markPaidNow) {
    if (!form.name) return showToast("Name required", "error");
    setSubmitting(true);
    const r = await api("adminAddWalkInPlayer", {
      blockId: block.blockId,
      name: form.name,
      phone: form.phone,
      amount: form.amount,
      paymentStatus: markPaidNow ? "Paid" : form.paymentStatus,
      paymentMethod: markPaidNow ? form.paymentMethod : ""
    });
    setSubmitting(false);
    if (r.ok) {
      showToast(markPaidNow ? "Player added · $" + r.amountCharged + " collected" : "Player added · pending payment", "success");
      onAdded && onAdded();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 440 }} onClick={(e) => e.stopPropagation()}>

          <div>
            <div className="kicker">{block.playerCount}/{block.playerCap} · Court {block.courtNumber}</div>
            <h2>Add Player</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field">

        </div>

          <div className="field-label">Phone (optional)</div>

          <div className="field">
            <div className="field-label">Amount · $</div>

              onChange={(e) => setForm({ ...form, amount: parseFloat(e.target.value) || 0 })} />

              Default ${block.rate}/player — edit to discount
            </div>

            <div className="field-label">Payment method</div>

              <option value="Cash">Cash</option>

          <button className="btn" onClick={() => submit(false)} disabled={submitting || !form.name}>
            Add · pay later
          </button>
          <button className="btn primary" onClick={() => submit(true)} disabled={submitting || !form.name}>
            Add · paid now
          </button>
        </div>
      </div>
    </div>
  );
}


/* ====================================================================
   MEMBERS TAB — list, add (with Founding cap), edit, renew

function ScreenMembers() {
  const [members, setMembers] = useState(null);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [editMember, setEditMember] = useState(null);

  async function load() {
    setLoading(true);
    const r = await api("adminListMembers");
    if (r.ok) setMembers(r.members || []);
    else showToast(r.error || "Failed to load", "error");
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const founding = (members || []).filter(m => m.tier === "Founding" && m.status === "Active");
  const standard = (members || []).filter(m => m.tier === "Standard" && m.status === "Active");

  const FOUNDING_CAP = 20;
  const foundingFull = founding.length >= FOUNDING_CAP;

  const filtered = (members || []).filter(m => {
    if (!search.trim()) return true;
    const s = search.toLowerCase();
    return (
      m.name.toLowerCase().includes(s) ||
      m.phone.includes(s) ||
      m.memberNumber.toLowerCase().includes(s)
    );
  });

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">Membership</div>
          <h1>Members</h1>
        </div>
        <div>
          <button className="btn primary" onClick={() => setShowAdd(true)}>+ Add member</button>
        </div>
      </div>

      {/* Counters */}
      <div className="member-header">
        <div className={"member-counter founding" + (foundingFull ? " full" : "")}>
          <div className="label">Founding · capped at {FOUNDING_CAP}</div>
          <div className="big">{founding.length}<span className="of">of {FOUNDING_CAP}</span></div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", opacity: 0.6, marginTop: 4 }}>
            {foundingFull ? "Capped — no more Founding slots" : (FOUNDING_CAP - founding.length) + " slots remain"}
          </div>
        </div>
        <div className="member-counter standard">
          <div className="label">Standard · unlimited</div>
          <div className="big">{standard.length}</div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", opacity: 0.6, marginTop: 4 }}>
            Active annual memberships
          </div>
        </div>
      </div>

      {/* Search */}
      <div style={{ marginBottom: 16 }}>
        <input
          type="text"
          className="search-input"
          placeholder="Search name, phone, member number…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      {loading ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
          <BouncingBall size="md" />
        </div>
      ) : filtered.length === 0 ? (
        <div className="empty">No members match</div>
      ) : (
        <div className="member-list">
          {filtered.map(m => (
            <div
              key={m.phone}
              className={"member-row" + (m.tier === "Founding" ? " founding" : "")}
              onClick={() => setEditMember(m)}
            >
              <div className="num">{m.memberNumber}</div>
              <div>
                <div className="name">
                  {m.name}
                  <span className={"tier-pill " + m.tier} style={{ marginLeft: 8 }}>{m.tier}</span>
                  {m.isExpired && <span className="status-pill cancelled" style={{ marginLeft: 6 }}>Expired</span>}
                  {m.status !== "Active" && !m.isExpired && (
                    <span className="status-pill cancelled" style={{ marginLeft: 6 }}>{m.status}</span>
                  )}
                </div>
                <div className="meta">{m.phone} · Exp. {m.expiryDate || "—"}</div>
              </div>
              <div className="bday">
                <span className="label">Birthday</span>
                {m.birthday || "—"}
              </div>
              <button className="btn-sm">Manage</button>
            </div>
          ))}
        </div>
      )}

      {showAdd && (
        <AddMemberModal
          foundingFull={foundingFull}
          onClose={() => setShowAdd(false)}
          onCreated={() => { load(); setShowAdd(false); }}
        />
      )}

      {editMember && (
        <EditMemberModal
          member={editMember}
          onClose={() => setEditMember(null)}
          onSaved={() => { load(); setEditMember(null); }}
        />
      )}
    </div>
  );
}

function AddMemberModal({ foundingFull, onClose, onCreated }) {
  const [form, setForm] = useState({
    phone: "",
    name: "",
    email: "",
    tier: foundingFull ? "Standard" : "Founding",
    birthday: "",
    notes: ""
  });
  const [bMonth, setBMonth] = useState("");
  const [bDay, setBDay] = useState("");
  const [submitting, setSubmitting] = useState(false);

  async function submit() {
    if (!form.phone) return showToast("Phone required", "error");
    if (!form.name) return showToast("Name required", "error");
    if (!bMonth || !bDay) return showToast("Birthday required", "error");
    const m = parseInt(bMonth);
    const d = parseInt(bDay);
    if (m < 1 || m > 12 || d < 1 || d > 31) return showToast("Invalid birthday", "error");
    const birthday = String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");

    setSubmitting(true);
    const r = await api("adminCreateMember", {
      phone: form.phone,
      name: form.name,
      email: form.email,
      tier: form.tier,
      birthday: birthday,
      notes: form.notes
    });
    setSubmitting(false);
    if (r.ok) {
      showToast("Member " + r.memberNumber + " added", "success");
      onCreated && onCreated();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const months = [
    "01 · Jan", "02 · Feb", "03 · Mar", "04 · Apr", "05 · May", "06 · Jun",
    "07 · Jul", "08 · Aug", "09 · Sep", "10 · Oct", "11 · Nov", "12 · Dec"
  ];

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">New membership</div>
            <h2>Add Member</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field">
          <div className="field-label">Tier</div>
          <select value={form.tier} onChange={(e) => setForm({ ...form, tier: e.target.value })}>
            <option value="Founding" disabled={foundingFull}>
              Founding {foundingFull ? "(capped at 20)" : "· $200/yr · 50% off"}
            </option>
            <option value="Standard">Standard · $150/yr · 30% off</option>
          </select>
        </div>

        <div className="field">
          <div className="field-label">Phone</div>
          <input
            type="tel"
            inputMode="numeric"
            value={form.phone}
            placeholder="e.g. 12345678"
            onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/[^0-9]/g, "") })}
          />
        </div>

        <div className="field">
          <div className="field-label">Full name</div>
          <input
            type="text"
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
          />
        </div>

        <div className="field">
          <div className="field-label">Email (optional)</div>
          <input
            type="email"
            value={form.email}
            onChange={(e) => setForm({ ...form, email: e.target.value })}
          />
        </div>

        <div className="field">
          <div className="field-label">Birthday · MM and DD</div>
          <div className="field-row">
            <select value={bMonth} onChange={(e) => setBMonth(e.target.value)}>
              <option value="">Month…</option>
              {months.map((m, i) => (
                <option key={i} value={String(i + 1).padStart(2, "0")}>{m}</option>
              ))}
            </select>
            <input
              type="number"
              min="1"
              max="31"
              value={bDay}
              placeholder="Day"
              onChange={(e) => setBDay(e.target.value)}
            />
          </div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.55, marginTop: 4 }}>
            Used to grant birthday-week sessions. Day only, no year.
          </div>
        </div>

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea
            value={form.notes}
            onChange={(e) => setForm({ ...form, notes: e.target.value })}
            placeholder="Anything staff should remember…"
          />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Cancel</button>
          <button
            className="btn primary"
            onClick={submit}
            disabled={submitting || !form.phone || !form.name || !bMonth || !bDay}
          >
            {submitting ? "Adding…" : "Add member"}
          </button>
        </div>
      </div>
    </div>
  );
}

function EditMemberModal({ member, onClose, onSaved }) {
  const [form, setForm] = useState({
    name: member.name || "",
    email: member.email || "",
    expiryDate: member.expiryDate || "",
    birthday: member.birthday || "",
    status: member.status || "Active",
    notes: member.notes || ""
  });
  const [saving, setSaving] = useState(false);

  async function save() {
    setSaving(true);
    const r = await api("adminUpdateMember", {
      phone: member.phone,
      name: form.name,
      email: form.email,
      expiryDate: form.expiryDate,
      birthday: form.birthday,
      status: form.status,
      notes: form.notes
    });
    setSaving(false);
    if (r.ok) {
      showToast("Saved", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function renew() {
    if (!confirm("Renew this membership for another year?")) return;
    const exp = member.expiryDate ? new Date(member.expiryDate + "T12:00:00") : new Date();
    if (exp < new Date()) exp.setTime(Date.now());  // start from today if expired
    exp.setFullYear(exp.getFullYear() + 1);
    const newExp = exp.getFullYear() + "-" + String(exp.getMonth() + 1).padStart(2, "0") + "-" + String(exp.getDate()).padStart(2, "0");
    setForm(f => ({ ...f, expiryDate: newExp, status: "Active" }));
    showToast("Renewal date set — press Save to confirm", "success");
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{member.memberNumber} · {member.phone}</div>
            <h2>{member.name}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="modal-detail-row">
          <span className="k">Tier</span>
          <span className="v"><span className={"tier-pill " + member.tier}>{member.tier}</span></span>
        </div>
        <div className="modal-detail-row">
          <span className="k">Started</span>
          <span className="v">{member.startDate || "—"}</span>
        </div>

        <div className="field" style={{ marginTop: 14 }}>
          <div className="field-label">Name</div>
          <input type="text" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        </div>

        <div className="field">
          <div className="field-label">Email</div>
          <input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
        </div>

        <div className="field">
          <div className="field-label">Birthday · MM-DD</div>
          <input
            type="text"
            value={form.birthday}
            placeholder="05-15"
            maxLength={5}
            onChange={(e) => setForm({ ...form, birthday: e.target.value })}
          />
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Expiry date</div>
            <input

          <div className="field">
            <div className="field-label">Phone</div>

          <select value={form.dealType} onChange={(e) => setForm({ ...form, dealType: e.target.value })}>

        <select value={coachFilter} onChange={(e) => setCoachFilter(e.target.value)}

          {coaches.map(c => <option key={c.coachId} value={c.coachId}>{c.coachId} · {c.name}</option>)}
        </select>
        <select value={paymentFilter} onChange={(e) => setPaymentFilter(e.target.value)}

function CoachingSessionModal({ session, coaches, dateDefault, onClose, onSaved }) {
  const isNew = !session;
  const activeCoaches = coaches.filter(c => c.status === "Active");

  const [form, setForm] = useState({
    coachId: session ? session.coachId : (activeCoaches[0] ? activeCoaches[0].coachId : ""),
    date: session ? session.date : (dateDefault || todayISO()),
    time: session ? session.time : "18:00",
    durationHours: session ? session.durationHours : 1,
    courts: session ? String(session.courtNumbers).split(",").map(x => parseInt(x.trim())).filter(Boolean) : [1],
    sessionType: session ? session.sessionType : "private",
    studentName: session ? session.studentName : "",
    studentPhone: session ? session.studentPhone : "",
    groupSize: session ? session.groupSize : 1,
    lessonFee: session ? session.lessonFee : 0,
    manualOverride: session ? session.manualOverride : false,
    facilityEarnsOverride: session ? session.facilityEarns : 0,
    coachTakesOverride: session ? session.coachTakes : 0,
    paymentStatus: session ? session.paymentStatus : "Pending",
    paymentMethod: session ? session.paymentMethod : "",
    paymentDate: session ? session.paymentDate : "",
    notes: session ? session.notes : ""
  });
  const [submitting, setSubmitting] = useState(false);

  const selectedCoach = coaches.find(c => c.coachId === form.coachId);

  // Compute facility earns + coach takes from coach's deal terms
  const auto = useMemo(() => {
    if (!selectedCoach) return { facilityEarns: 0, coachTakes: 0, formula: "" };
    const fee = parseFloat(form.lessonFee) || 0;
    const rate = parseFloat(selectedCoach.courtRate) || 0;
    const pct = parseFloat(selectedCoach.revSharePct) || 0;
    const hrs = parseFloat(form.durationHours) || 0;
    let facility = 0;
    let formula = "";
    if (selectedCoach.dealType === "flat_rent") {
      facility = rate * hrs;
      formula = `$${rate}/hr × ${hrs}h = $${facility.toFixed(2)}`;
    } else if (selectedCoach.dealType === "rev_share") {
      facility = fee * (pct / 100);
      formula = `$${fee.toFixed(2)} × ${pct}% = $${facility.toFixed(2)}`;
    } else if (selectedCoach.dealType === "hybrid") {
      const rent = rate * hrs;
      const share = fee * (pct / 100);
      facility = rent + share;
      formula = `$${rate}/hr × ${hrs}h + $${fee.toFixed(2)} × ${pct}% = $${facility.toFixed(2)}`;
    } else {
      facility = 0;
      formula = "Custom deal — enter amounts manually";
    }
    facility = Math.round(facility * 100) / 100;
    const coachTakes = Math.round((fee - facility) * 100) / 100;
    return { facilityEarns: facility, coachTakes: coachTakes, formula: formula };
  }, [selectedCoach, form.lessonFee, form.durationHours]);

  const facilityEarns = form.manualOverride ? parseFloat(form.facilityEarnsOverride) || 0 : auto.facilityEarns;
  const coachTakes = form.manualOverride ? parseFloat(form.coachTakesOverride) || 0 : auto.coachTakes;

  function toggleCourt(c) {
    setForm(f => {
      const set = new Set(f.courts);
      if (set.has(c)) set.delete(c);
      else set.add(c);
      return { ...f, courts: Array.from(set).sort() };
    });
  }

  async function submit() {
    if (!form.coachId) return showToast("Coach required", "error");
    if (!form.courts.length) return showToast("Pick at least one court", "error");
    if (!form.durationHours || form.durationHours <= 0) return showToast("Duration required", "error");

    setSubmitting(true);
    if (isNew) {
      const r = await api("adminCreateCoachingSession", {
        coachId: form.coachId,
        date: form.date,
        time: form.time,
        durationHours: form.durationHours,
        courts: form.courts.join(","),
        sessionType: form.sessionType,
        studentName: form.studentName,
        studentPhone: form.studentPhone,
        groupSize: form.groupSize,
        lessonFee: form.lessonFee,
        manualOverride: form.manualOverride ? "true" : "false",
        facilityEarns: facilityEarns,
        coachTakes: coachTakes,
        paymentStatus: form.paymentStatus,
        paymentMethod: form.paymentMethod,
        notes: form.notes
      });
      setSubmitting(false);
      if (r.ok) {
        showToast("Session " + r.sessionId + " booked", "success");
        onSaved && onSaved();
      } else {
        showToast(r.error || "Failed", "error");
      }
    } else {
      // Edit: only mutable fields
      const r = await api("adminUpdateCoachingSession", {
        sessionId: session.sessionId,
        studentName: form.studentName,
        studentPhone: form.studentPhone,
        groupSize: form.groupSize,
        lessonFee: form.lessonFee,
        manualOverride: form.manualOverride ? "true" : "false",
        facilityEarns: facilityEarns,
        coachTakes: coachTakes,
        paymentStatus: form.paymentStatus,
        paymentMethod: form.paymentMethod,
        paymentDate: form.paymentDate,
        notes: form.notes
      });
      setSubmitting(false);
      if (r.ok) {
        showToast("Saved", "success");
        onSaved && onSaved();
      } else {
        showToast(r.error || "Failed", "error");
      }
    }
  }

  async function cancelSession() {
    if (!confirm("Cancel this session? Court slots will be released.")) return;
    setSubmitting(true);
    const r = await api("adminCancelCoachingSession", { sessionId: session.sessionId });
    setSubmitting(false);
    if (r.ok) {
      showToast("Cancelled", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const timeOptions = useMemo(() => {
    const out = [];
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      for (const m of [0, 30]) {
        const t = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        out.push(t);
      }
    }
    return out;
  }, []);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 640 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{isNew ? "New coaching session" : session.sessionId}</div>
            <h2>{isNew ? "Book Session" : selectedCoach ? selectedCoach.name : "Session"}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        {isNew && (
          <>
            <div className="field">
              <div className="field-label">Coach</div>
              <select value={form.coachId} onChange={(e) => setForm({ ...form, coachId: e.target.value })}>
                {activeCoaches.length === 0 && <option>(no active coaches)</option>}
                {activeCoaches.map(c => (
                  <option key={c.coachId} value={c.coachId}>
                    {c.coachId} · {c.name} · {c.dealType.replace("_", " ")}
                  </option>
                ))}
              </select>
              {selectedCoach && (
                <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.55, marginTop: 4 }}>
                  Default: {selectedCoach.dealType === "flat_rent" ? "$" + selectedCoach.courtRate + "/hr court" : ""}
                  {selectedCoach.dealType === "rev_share" ? selectedCoach.revSharePct + "% rev share" : ""}
                  {selectedCoach.dealType === "hybrid" ? "$" + selectedCoach.courtRate + "/hr + " + selectedCoach.revSharePct + "%" : ""}
                  {selectedCoach.dealType === "custom" ? "Custom — manual amounts" : ""}
                </div>
              )}
            </div>

            <div className="field-row three">
              <div className="field">
                <div className="field-label">Date</div>
                <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
              </div>
              <div className="field">
                <div className="field-label">Time</div>

/* ----- Payments Due subview ----- */

function PaymentsDueView() {
  const [data, setData] = useState(null);
  const [expandedCoachId, setExpandedCoachId] = useState(null);
  const [coachSessions, setCoachSessions] = useState({});  // coachId -> sessions[]
  const [loadingSessions, setLoadingSessions] = useState(false);
  const [paymentModal, setPaymentModal] = useState(null);  // { coach, sessionIds }

  async function load() {
    const r = await api("adminListCoachPayments");
    if (r.ok) setData(r.summary || []);
  }
  useEffect(() => { load(); }, []);

  async function expand(coachId) {
    if (expandedCoachId === coachId) {
      setExpandedCoachId(null);
      return;
    }
    setExpandedCoachId(coachId);
    if (!coachSessions[coachId]) {
      setLoadingSessions(true);
      const r = await api("adminListCoachingSessions", {
        coachId: coachId,
        paymentStatus: "pending"
      });
      setLoadingSessions(false);
      if (r.ok) {
        setCoachSessions(prev => ({ ...prev, [coachId]: r.sessions || [] }));
      }
    }
  }

  function openPaymentModal(coach, sessionIds) {
    if (!sessionIds || sessionIds.length === 0) return;
    setPaymentModal({ coach, sessionIds });
  }

  async function confirmPayment(paymentMethod, paymentDate) {
    if (!paymentModal) return;
    const r = await api("adminMarkCoachingSessionsPaid", {
      sessionIds: paymentModal.sessionIds.join(","),
      paymentMethod: paymentMethod,
      paymentDate: paymentDate
    });
    if (r.ok) {
      showToast(`Marked ${r.updated} session${r.updated === 1 ? "" : "s"} paid · $${r.totalCollected.toFixed(2)} collected`, "success");
      // Clear cached sessions for this coach so they reload
      setCoachSessions(prev => {
        const next = { ...prev };
        delete next[paymentModal.coach.coachId];
        return next;
      });
      setExpandedCoachId(null);
      setPaymentModal(null);
      load();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  if (data === null) {
    return <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>;
  }

  const totalOwed = data.reduce((s, c) => s + c.pendingAmount, 0);
  const totalPaid = data.reduce((s, c) => s + c.paidAmount, 0);
  const totalCoachTakes = data.reduce((s, c) => s + c.coachTakesPending, 0);

  return (
    <div>
      <div className="stat-grid" style={{ marginBottom: 24 }}>
        <div className="stat-card accent-clay">
          <div className="label">Coaches owe us</div>
          <div className="value">${totalOwed.toFixed(2)}</div>
          <div className="sub">Across all unpaid sessions</div>
        </div>
        <div className="stat-card accent-green">
          <div className="label">Already collected</div>
          <div className="value">${totalPaid.toFixed(2)}</div>
          <div className="sub">All-time paid sessions</div>
        </div>
        <div className="stat-card accent-wood">
          <div className="label">Coaches haven't taken</div>
          <div className="value">${totalCoachTakes.toFixed(2)}</div>
          <div className="sub">Their earnings on unpaid sessions</div>
        </div>
      </div>

      <div className="section-label">
        <span><span className="num">01</span><span className="name">By Coach · click to expand</span></span>
        <span className="right">{data.length} coach{data.length === 1 ? "" : "es"}</span>
      </div>
      {data.length === 0 ? (
        <div className="empty">No coaches in system</div>
      ) : (
        data.map(c => {
          const isExpanded = expandedCoachId === c.coachId;
          const sessions = coachSessions[c.coachId] || [];
          return (
            <div key={c.coachId} style={{ marginBottom: 10 }}>
              <div
                className={"coach-pay-card" + (c.pendingAmount > 0 ? " has-debt" : "") + (isExpanded ? " expanded" : "")}
                onClick={() => expand(c.coachId)}
                style={{ cursor: "pointer", marginBottom: 0 }}
              >
                <div>
                  <div className="name">{c.name}</div>
                  <div className="meta">{c.coachId} · {c.phone}</div>
                </div>
                <div style={{ textAlign: "right", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.6 }}>
                  <div>{c.pendingSessions} unpaid · {c.paidSessions} paid</div>
                  <div style={{ marginTop: 2 }}>Lifetime $ {c.paidAmount.toFixed(2)} collected</div>
                </div>
                <div className="owes">
                  <div className="v">${c.pendingAmount.toFixed(2)}</div>
                  <div className="label">
                    {c.pendingAmount > 0 ? (isExpanded ? "▼ Hide sessions" : "▶ Show sessions") : "All settled"}
                  </div>
                </div>
              </div>

              {isExpanded && (
                <div className="pay-expand">
                  {loadingSessions && !sessions.length ? (
                    <div style={{ padding: 20, display: "flex", justifyContent: "center" }}>
                      <BouncingBall size="sm" />
                    </div>
                  ) : sessions.length === 0 ? (
                    <div className="empty-mini" style={{ padding: 14 }}>No unpaid sessions for this coach</div>
                  ) : (
                    <>
                      <div className="pay-expand-head">
                        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", opacity: 0.7, fontWeight: 700 }}>
                          {sessions.length} unpaid session{sessions.length === 1 ? "" : "s"} · total ${sessions.reduce((s, x) => s + x.facilityEarns, 0).toFixed(2)}
                        </div>
                        <button
                          className="btn primary"
                          onClick={(e) => {
                            e.stopPropagation();
                            openPaymentModal(c, sessions.map(s => s.sessionId));
                          }}
                        >
                          Mark all paid · ${sessions.reduce((s, x) => s + x.facilityEarns, 0).toFixed(2)}
                        </button>
                      </div>
                      {sessions.map(s => (
                        <PaymentSessionRow
                          key={s.sessionId}
                          session={s}
                          onMarkPaid={() => openPaymentModal(c, [s.sessionId])}
                        />
                      ))}
                    </>
                  )}
                </div>
              )}
            </div>
          );
        })
      )}

      {paymentModal && (
        <PaymentConfirmModal
          coach={paymentModal.coach}
          sessionIds={paymentModal.sessionIds}
          totalAmount={
            (coachSessions[paymentModal.coach.coachId] || [])
              .filter(s => paymentModal.sessionIds.indexOf(s.sessionId) >= 0)
              .reduce((sum, s) => sum + s.facilityEarns, 0)
          }
          onClose={() => setPaymentModal(null)}
          onConfirm={confirmPayment}
        />
      )}
    </div>
  );
}
