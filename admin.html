function SponsorshipModal({ banner, onClose, onSaved }) {
  const isNew = !banner;
  const [form, setForm] = useState({
    location: banner ? banner.location : "",
    sponsorName: banner ? banner.sponsorName : "",
    sponsorContact: banner ? banner.sponsorContact : "",
    saleType: banner ? banner.saleType : "monthly",
    price: banner ? banner.price : 0,
    startDate: banner ? banner.startDate : todayISO(),
    endDate: banner ? banner.endDate : "",
    status: banner ? banner.rawStatus : "active",
    notes: banner ? banner.notes : ""
  });
  const [saving, setSaving] = useState(false);

  async function save() {
    if (!form.location.trim()) return showToast("Location required", "error");
    if (!form.sponsorName.trim()) return showToast("Sponsor name required", "error");
    if (form.saleType === "one_off" && !form.endDate) return showToast("One-off banners need an End Date", "error");

    setSaving(true);
    const params = { ...form };
    if (!isNew) params.bannerId = banner.bannerId;
    const action = isNew ? "adminCreateSponsorship" : "adminUpdateSponsorship";
    const r = await api(action, params);
    setSaving(false);
    if (r.ok) {
      if (r.warning) showToast(r.warning, "error");
      else showToast(isNew ? "Banner added" : "Saved", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function cancelBanner() {
    if (!confirm("Cancel this banner? It will be marked cancelled but kept for records.")) return;
    setSaving(true);
    const r = await api("adminCancelSponsorship", { bannerId: banner.bannerId });
    setSaving(false);
    if (r.ok) {
      showToast("Cancelled", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 540 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{isNew ? "Add sponsor banner" : banner.bannerId}</div>
            <h2>{isNew ? "New Banner" : banner.sponsorName}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field">
          <div className="field-label">Location / Position</div>
          <input
            type="text"
            value={form.location}
            placeholder="e.g. Court 1 wall, Entrance, Above bar"
            onChange={(e) => setForm({ ...form, location: e.target.value })}
          />
        </div>

        <div className="field">
          <div className="field-label">Sponsor name</div>
          <input
            type="text"
            value={form.sponsorName}
            placeholder="e.g. ABA Bank, Cellcard"
            onChange={(e) => setForm({ ...form, sponsorName: e.target.value })}
          />
        </div>

        <div className="field">
          <div className="field-label">Sponsor contact (optional)</div>
          <input
            type="text"
            value={form.sponsorContact}
            placeholder="phone / email / Instagram"
            onChange={(e) => setForm({ ...form, sponsorContact: e.target.value })}
          />
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Sale type</div>
            <select value={form.saleType} onChange={(e) => setForm({ ...form, saleType: e.target.value })}>
              <option value="monthly">Monthly subscription</option>
              <option value="one_off">One-off payment</option>
            </select>
          </div>
          <div className="field">
            <div className="field-label">Price · USD</div>
            <input
              type="number"
              min="0"
              step="10"
              value={form.price}
              onChange={(e) => setForm({ ...form, price: parseFloat(e.target.value) || 0 })}
            />
          </div>
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Start date</div>
            <input
              type="date"
              value={form.startDate}
              onChange={(e) => setForm({ ...form, startDate: e.target.value })}
            />
          </div>
          <div className="field">
            <div className="field-label">
              End date {form.saleType === "monthly" ? "(optional)" : "(required)"}
            </div>
            <input
              type="date"
              value={form.endDate}
              onChange={(e) => setForm({ ...form, endDate: e.target.value })}
            />
          </div>
        </div>

        {!isNew && (
          <div className="field">
            <div className="field-label">Status</div>
            <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
              <option value="active">Active</option>
              <option value="expired">Expired</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        )}

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea
            value={form.notes}
            onChange={(e) => setForm({ ...form, notes: e.target.value })}
            placeholder="Renewal date, contract reference, etc."
          />
        </div>

        <div className="actions">
          {!isNew && banner.status === "active" && (
            <button className="btn ghost" onClick={cancelBanner} disabled={saving} style={{ color: "var(--clay)", marginRight: "auto" }}>
              Cancel banner
            </button>
          )}
          <button className="btn ghost" onClick={onClose} disabled={saving}>Close</button>
          <button className="btn primary" onClick={save} disabled={saving}>
            {saving ? "Saving…" : isNew ? "Add banner" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}


/* ====================================================================
   SMS LOG
   ==================================================================== */

function ScreenSmsLog() {
  const [entries, setEntries] = useState(null);
  const [typeFilter, setTypeFilter] = useState("");
  const [statusFilter, setStatusFilter] = useState("");

  async function load() {
    const r = await api("adminListSmsLog", { type: typeFilter, status: statusFilter, limit: 200 });
    if (r.ok) setEntries(r.entries || []);
  }
  useEffect(() => { load(); }, [typeFilter, statusFilter]);

  const totalCost = useMemo(() => {
    if (!entries) return 0;
    return entries.reduce((s, x) => s + (x.cost || 0), 0);
  }, [entries]);

  const sentCount = useMemo(() => (entries || []).filter(e => String(e.status).toLowerCase() === "sent").length, [entries]);
  const failedCount = useMemo(() => (entries || []).filter(e => String(e.status).toLowerCase() === "failed").length, [entries]);

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">All SMS sent · last 200</div>
          <h1>SMS Log</h1>
        </div>
      </div>

      <div className="stat-grid" style={{ marginBottom: 20 }}>
        <div className="stat-card accent-ink">
          <div className="label">Messages shown</div>
          <div className="value">{entries ? entries.length : 0}</div>
        </div>
        <div className="stat-card accent-green">
          <div className="label">Sent successfully</div>
          <div className="value">{sentCount}</div>
        </div>
        <div className="stat-card accent-clay">
          <div className="label">Failed</div>
          <div className="value">{failedCount}</div>
        </div>
        <div className="stat-card accent-wood">
          <div className="label">Cost · shown</div>
          <div className="value">${totalCost.toFixed(3)}</div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)}
          style={{ padding: "8px 12px", border: "1.5px solid var(--ink)", borderRadius: 999, fontFamily: "var(--mono)", fontSize: 12 }}>
          <option value="">All types</option>
          <option value="otp">OTP</option>
          <option value="confirmation">Confirmation</option>
          <option value="reminder">Reminder</option>
          <option value="cancellation">Cancellation</option>
          <option value="noshow_release">No-show release</option>
        </select>
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}
          style={{ padding: "8px 12px", border: "1.5px solid var(--ink)", borderRadius: 999, fontFamily: "var(--mono)", fontSize: 12 }}>
          <option value="">All statuses</option>
          <option value="sent">Sent</option>
          <option value="failed">Failed</option>
        </select>
      </div>

      {entries === null ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
      ) : entries.length === 0 ? (
        <div className="empty">No messages match</div>
      ) : (
        <div className="sms-list">
          {entries.map((e, i) => (
            <div key={i} className={"sms-row " + (String(e.status).toLowerCase() === "failed" ? "failed" : "ok")}>
              <div className="sms-when">
                {e.timestamp}
              </div>
              <div className="sms-body">
                <div className="sms-head">
                  <span className={"sms-type type-" + String(e.type).toLowerCase()}>{e.type}</span>
                  <span className="sms-phone">{e.phone}</span>
                  <span className={"sms-status " + String(e.status).toLowerCase()}>{e.status}</span>
                </div>
                <div className="sms-msg">{e.message}</div>
                {e.error && <div className="sms-error">⚠ {e.error}</div>}
              </div>
              <div className="sms-cost">${(e.cost || 0).toFixed(3)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}



/* ====================================================================
   SETTINGS
   ==================================================================== */
function ScreenSettings() {
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [promo, setPromo] = useState({ active: false, pct: 50, label: "Soft launch −50%" });
  const [posSettings, setPosSettings] = useState({ memberDiscountPct: 10, memberDiscountDefault: 10 });
  const [savingPos, setSavingPos] = useState(false);
  const [goals, setGoals] = useState({
    monthlyRevenue: 0, monthlyBookings: 0, monthlyNewMembers: 0, monthlyPosRevenue: 0,
    peakUtilizationPct: 0, offPeakUtilizationPct: 0, activeMembers: 0
  });
  const [savingGoals, setSavingGoals] = useState(false);
  const [sponsorSettings, setSponsorSettings] = useState({ totalSlots: 12, totalSlotsDefault: 12 });
  const [savingSponsor, setSavingSponsor] = useState(false);

  async function load() {
    setLoading(true);
    const r = await api("adminGetPromo");
    if (r.ok) {
      setPromo({
        active: !!r.active,
        pct: r.pct || 50,
        label: r.label || "Soft launch −50%"
      });
    }
    const ps = await api("adminGetPosSettings");
    if (ps.ok) {
      setPosSettings({
        memberDiscountPct: ps.memberDiscountPct,
        memberDiscountDefault: ps.memberDiscountDefault
      });
    }
    const g = await api("adminGetGoals");
    if (g.ok) setGoals(g.goals);
    const sp = await api("adminGetSponsorshipSettings");
    if (sp.ok) {
      setSponsorSettings({
        totalSlots: sp.totalSlots,
        totalSlotsDefault: sp.totalSlotsDefault
      });
    }
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  async function save() {
    setSaving(true);
    const r = await api("adminSetPromo", {
      active: promo.active,
      pct: promo.pct,
      label: promo.label
    });
    setSaving(false);
    if (r.ok) {
      showToast("Saved", "success");
      setPromo({
        active: !!r.active,
        pct: r.pct || 50,
        label: r.label || ""
      });
    } else {
      showToast(r.error || "Save failed", "error");
    }
  }

  async function savePosSettings() {
    setSavingPos(true);
    const r = await api("adminSetPosSettings", {
      memberDiscountPct: posSettings.memberDiscountPct
    });
    setSavingPos(false);
    if (r.ok) {
      showToast("POS settings saved", "success");
      setPosSettings({
        memberDiscountPct: r.memberDiscountPct,
        memberDiscountDefault: r.memberDiscountDefault
      });
    } else {
      showToast(r.error || "Save failed", "error");
    }
  }

  async function resetPosSettings() {
    if (!confirm("Reset member discount % to default (" + posSettings.memberDiscountDefault + "%)?")) return;
    setSavingPos(true);
    const r = await api("adminSetPosSettings", { memberDiscountPct: "" });
    setSavingPos(false);
    if (r.ok) {
      showToast("Reset to default", "success");
      setPosSettings({
        memberDiscountPct: r.memberDiscountPct,
        memberDiscountDefault: r.memberDiscountDefault
      });
    } else {
      showToast(r.error || "Save failed", "error");
    }
  }

  async function saveGoals() {
    setSavingGoals(true);
    const r = await api("adminSetGoals", {
      monthlyRevenue: goals.monthlyRevenue,
      monthlyBookings: goals.monthlyBookings,
      monthlyNewMembers: goals.monthlyNewMembers,
      monthlyPosRevenue: goals.monthlyPosRevenue,
      peakUtilizationPct: goals.peakUtilizationPct,
      offPeakUtilizationPct: goals.offPeakUtilizationPct,
      activeMembers: goals.activeMembers
    });
    setSavingGoals(false);
    if (r.ok) {
      showToast("Goals saved", "success");
      setGoals(r.goals);
    } else {
      showToast(r.error || "Save failed", "error");
    }
  }

  async function saveSponsorSettings() {
    setSavingSponsor(true);
    const r = await api("adminSetSponsorshipSettings", { totalSlots: sponsorSettings.totalSlots });
    setSavingSponsor(false);
    if (r.ok) {
      showToast("Sponsorship settings saved", "success");
      setSponsorSettings({ totalSlots: r.totalSlots, totalSlotsDefault: r.totalSlotsDefault });
    } else {
      showToast(r.error || "Save failed", "error");
    }
  }

  if (loading) {
    return (
      <div className="main">
        <div style={{ padding: 60, display: "flex", justifyContent: "center" }}>
          <BouncingBall size="md" />
        </div>
      </div>
    );
  }

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">Configuration</div>
          <h1>Settings</h1>
        </div>
      </div>

      <div className="settings-card">
        <h3>Promotional Discount</h3>
        <div className="desc">
          When active, applies a flat percentage discount to <b>all bookings</b>.
          Member discounts do not stack — customers receive whichever is more generous.
          Birthday sessions are exempt and keep their original discount.
        </div>

        <div className="settings-row">
          <div className="field-label">Status</div>
          <div
            className={"toggle" + (promo.active ? " on" : "")}
            onClick={() => setPromo({ ...promo, active: !promo.active })}
          />
          <div style={{
            fontFamily: "var(--mono)",
            fontSize: 12,
            letterSpacing: "0.14em",
            textTransform: "uppercase",
            fontWeight: 600,
            color: promo.active ? "var(--green)" : "var(--ink)",
            opacity: promo.active ? 1 : 0.5
          }}>
            {promo.active ? "Active" : "Inactive"}
          </div>
        </div>

        <div className="settings-row">
          <div className="field-label">Discount %</div>
          <input
            type="number"
            min="0"
            max="100"
            value={promo.pct}
            onChange={(e) => setPromo({ ...promo, pct: parseInt(e.target.value) || 0 })}
          />
        </div>

        <div className="settings-row">
          <div className="field-label">Label</div>
          <input
            type="text"
            value={promo.label}
            placeholder="e.g. Soft launch −50%, Grand Opening Weekend"
            onChange={(e) => setPromo({ ...promo, label: e.target.value })}
            maxLength={60}
          />
        </div>

        <div className="settings-row">
          <div className="actions">
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? "Saving…" : "Save changes"}
            </button>
          </div>
        </div>

        {promo.active && promo.pct > 0 && (
          <div className="settings-warning">
            <b>HEADS-UP:</b> All bookings will receive a {promo.pct}% discount as long as this is active.
            Toggle off to return to standard pricing + member discounts.
          </div>
        )}
      </div>

      <div className="settings-card">
        <h3>Pro Shop · Member Discount</h3>
        <div className="desc">
          Members get this discount on <b>eligible</b> POS items (accessories, paddles, apparel by default — drinks are typically excluded).
          Court rentals already have their tier discount built in (50% Founding / 30% Standard), so this <b>does not stack</b> on courts.
          Per-product eligibility can be toggled in the product edit modal.
        </div>

        <div className="settings-row">
          <div className="field-label">Discount %</div>
          <input
            type="number"
            min="0"
            max="100"
            step="0.5"
            value={posSettings.memberDiscountPct}
            onChange={(e) => setPosSettings({ ...posSettings, memberDiscountPct: parseFloat(e.target.value) || 0 })}
          />
          <span style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.55, marginLeft: 8 }}>
            DEFAULT: {posSettings.memberDiscountDefault}%
          </span>
        </div>

        <div className="settings-row">
          <div className="actions">
            <button className="btn ghost" onClick={resetPosSettings} disabled={savingPos}>
              Reset to default
            </button>
            <button className="btn primary" onClick={savePosSettings} disabled={savingPos}>
              {savingPos ? "Saving…" : "Save changes"}
            </button>
          </div>
        </div>

        {posSettings.memberDiscountPct !== posSettings.memberDiscountDefault && (
          <div className="settings-warning">
            <b>OVERRIDE ACTIVE:</b> Current rate is {posSettings.memberDiscountPct}% (default is {posSettings.memberDiscountDefault}%).
            All eligible POS sales to members use this rate.
          </div>

      </div>

      <div className="settings-card">
        <h3>Monthly KPI Goals</h3>
        <div className="desc">
          Set monthly targets to track on the dashboard. Leave blank or set to <b>0</b> to disable a KPI.
          Progress bars show pace vs. expected (days elapsed in month).
          <br />
          <span style={{ fontSize: 11, opacity: 0.7 }}>
            Operational targets (utilization, active members) come from your Operational Plan.
          </span>
        </div>

        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, color: "var(--green)", marginTop: 12, marginBottom: 6 }}>
          Financial
        </div>

        <div className="settings-row">
          <div className="field-label">Revenue · $</div>
          <input
            type="number"
            min="0"
            step="100"
            value={goals.monthlyRevenue}
            onChange={(e) => setGoals({ ...goals, monthlyRevenue: parseFloat(e.target.value) || 0 })}
            placeholder="e.g. 13750 (Y1 average ~$165k/12)"
          />
        </div>
        <div className="settings-row">
          <div className="field-label">Paid bookings · count</div>
          <input
            type="number"
            min="0"
            step="10"
            value={goals.monthlyBookings}
            onChange={(e) => setGoals({ ...goals, monthlyBookings: parseInt(e.target.value) || 0 })}
            placeholder="e.g. 250"
          />
        </div>
        <div className="settings-row">
          <div className="field-label">New members · count</div>
          <input
            type="number"
            min="0"
            step="1"
            value={goals.monthlyNewMembers}
            onChange={(e) => setGoals({ ...goals, monthlyNewMembers: parseInt(e.target.value) || 0 })}
            placeholder="e.g. 1 (plan: 1 Standard/month)"
          />
        </div>
        <div className="settings-row">
          <div className="field-label">POS revenue · $</div>
          <input
            type="number"
            min="0"
            step="50"
            value={goals.monthlyPosRevenue}
            onChange={(e) => setGoals({ ...goals, monthlyPosRevenue: parseFloat(e.target.value) || 0 })}
            placeholder="e.g. 1500"

        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, color: "var(--wood)", marginTop: 18, marginBottom: 6 }}>

            step="1"

          />
        </div>

        <div className="settings-row" style={{ marginTop: 14 }}>
          <div className="actions">
            <button className="btn primary" onClick={saveGoals} disabled={savingGoals}>
              {savingGoals ? "Saving…" : "Save goals"}

      <div className="settings-card">
        <h3>Sponsorship · Total Banner Slots</h3>

      <div className="settings-card" style={{ opacity: 0.6 }}>

/* ====================================================================
   APP SHELL — sidebar + screen router
   ==================================================================== */
function App() {
  const [authed, setAuthed] = useState(!!getStoredPin());
  const [screen, setScreen] = useState("dashboard");

  // Validate the stored PIN on boot, then prefetch common tabs so navigation feels instant
  useEffect(() => {
    if (!authed) return;
    api("adminDashboard").then(r => {
      if (!r.ok) {
        setStoredPin("");
        invalidateApiCache("");
        setAuthed(false);
        return;
      }
      // Warm-up: kick off background fetches for the most-used tabs so cache
      // is hot by the time the user clicks them. Failures are silently ignored
      // (these will be retried on first real visit).
      const today = todayISO();
      setTimeout(() => {
        api("adminListTimelineEntries", { dateFrom: today, dateTo: today }).catch(() => {});
        api("posListProducts").catch(() => {});
        api("adminListMembers").catch(() => {});
        api("tabListOpen").catch(() => {});
      }, 200);  // small delay so dashboard loads first
      setTimeout(() => {
        api("adminDashboardKpi").catch(() => {});
        api("adminOperationalKpi").catch(() => {});
        api("adminListSponsorships").catch(() => {});
      }, 800);
    });
  }, []);

  function signOut() {
    setStoredPin("");
    invalidateApiCache("");  // wipe all cached responses so next user starts clean
    setAuthed(false);
  }

  if (!authed) {
    return <ScreenLogin onAuth={() => setAuthed(true)} />;
  }

  // Tab definitions
  const tabs = [
    { id: "dashboard", label: "Dashboard", ready: true },
    { id: "bookings",  label: "Bookings",  ready: true },
    { id: "pos",       label: "POS",       ready: true },
    { id: "members",   label: "Members",   ready: true },
    { id: "coaching",  label: "Coaching",  ready: true },
    { id: "customers", label: "Customers", ready: true },
    { id: "finances",  label: "Finances",  ready: true },
    { id: "sponsorships", label: "Sponsorships", ready: true },
    { id: "sms",       label: "SMS Log",   ready: true },
    { id: "settings",  label: "Settings",  ready: true }
  ];

  // Prefetch data for a tab when the user hovers (before they actually click)
  function prefetchForTab(id) {
    const today = todayISO();
    switch (id) {
      case "dashboard":
        api("adminDashboard").catch(() => {});
        api("adminListTimelineEntries", { dateFrom: today, dateTo: today }).catch(() => {});
        api("adminDashboardKpi").catch(() => {});
        api("adminOperationalKpi").catch(() => {});
        break;
      case "bookings":
        api("adminListTimelineEntries", { dateFrom: today, dateTo: today }).catch(() => {});
        break;
      case "pos":
        api("posListProducts").catch(() => {});
        api("tabListOpen").catch(() => {});
        break;
      case "members":
        api("adminListMembers").catch(() => {});
        break;
      case "coaching":
        api("adminListCoaches").catch(() => {});
        break;
      case "finances": {
        const now = new Date();
        api("adminFinancesMonth", { year: now.getFullYear(), month: now.getMonth() + 1 }).catch(() => {});
        break;
      }
      case "sponsorships":
        api("adminListSponsorships").catch(() => {});
        break;
      case "settings":
        api("adminGetPromo").catch(() => {});
        api("adminGetPosSettings").catch(() => {});
        api("adminGetGoals").catch(() => {});
        api("adminGetSponsorshipSettings").catch(() => {});
        break;
    }
  }

  function go(id) {
    const t = tabs.find(x => x.id === id);
    if (!t || !t.ready) return;
    setScreen(id);
  }

  let body;
  switch (screen) {
    case "dashboard": body = <ScreenDashboard />; break;
    case "bookings":  body = <ScreenBookings />; break;
    case "members":   body = <ScreenMembers />; break;
    case "coaching":  body = <ScreenCoaching />; break;
    case "settings":  body = <ScreenSettings />; break;
    case "pos":       body = <ScreenPOS />; break;
    case "customers": body = <ScreenCustomers />; break;
    case "finances":  body = <ScreenFinances />; break;
    case "sponsorships": body = <ScreenSponsorships />; break;
    case "sms":       body = <ScreenSmsLog />; break;
    default:          body = <ScreenDashboard />;
  }

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="logo">
          <svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" style={{ width: "100%", height: "auto", display: "block" }}>
            <g>
              <rect x="40" y="20" width="160" height="180" fill="none" stroke="#f1ead6" strokeWidth="5"/>
              <line x1="120" y1="20" x2="120" y2="72" stroke="#f1ead6" strokeWidth="3"/>
              <line x1="120" y1="148" x2="120" y2="200" stroke="#f1ead6" strokeWidth="3"/>
              <line x1="40" y1="72" x2="200" y2="72" stroke="#f1ead6" strokeWidth="3"/>
              <line x1="40" y1="148" x2="200" y2="148" stroke="#f1ead6" strokeWidth="3"/>
              <rect x="40" y="94" width="160" height="32" fill="#f1ead6"/>
              <text x="120" y="116" textAnchor="middle" fill="#1a1a1a" fontFamily="Manrope, sans-serif" fontWeight="800" fontSize="20" letterSpacing="3.6">THE YARD</text>
              <path d="M 70 86 Q 120 56 170 134" stroke="#c64f3a" strokeWidth="2.8" fill="none" strokeDasharray="2.5 4.5"/>
              <circle cx="170" cy="134" r="5" fill="#c64f3a"/>
            </g>
            <text x="240" y="105" fill="#f1ead6" fontFamily="Fraunces, serif" fontWeight="500" fontSize="54" letterSpacing="-1.08">The Yard.</text>
            <text x="242" y="148" fill="#f1ead6" opacity="0.6" fontFamily="DM Mono, monospace" fontSize="14" letterSpacing="3.92">PICKLEBALL · TOUL KORK</text>
          </svg>
          <div className="sub">Admin</div>
        </div>
        <nav>
          {tabs.map(t => (
            <button
              key={t.id}
              className={(screen === t.id ? "active " : "") + (!t.ready ? "soon" : "")}
              onClick={() => go(t.id)}
              onMouseEnter={() => t.ready && prefetchForTab(t.id)}
              onFocus={() => t.ready && prefetchForTab(t.id)}
            >
              <span className="label">{t.label}</span>
              {!t.ready && <span className="soon-tag">Soon</span>}
            </button>
          ))}
        </nav>
        <div className="footer">
          <div className="staff">Signed in</div>
          <button className="signout" onClick={signOut}>
            <span>Sign out</span>
          </button>
        </div>
      </aside>
      {body}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);

  </script>
</body>
</html>
