<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A1A1A" />
  <title>The Yard — Admin</title>
  <meta name="robots" content="noindex,nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" />

  <style>
/* ====================================================================
   THE YARD — ADMIN PANEL STYLES
   Brand: Cream/Ink/Green/Clay/Wood. Fraunces/Manrope/DM Mono.
   Optimized for tablet+laptop (1024px+). Phone fallback at 768px down.
   ==================================================================== */

:root {
  /* Brand palette */
  --cream:    #F1EAD6;
  --paper:    #FBF7EC;
  --ink:      #1A1A1A;
  --ink-2:    #2D2D2D;
  --concrete: #C9C6BD;
  --concrete-2: #E5E2D9;
  --green:    #3D7A4F;
  --green-2:  #4F9665;
  --clay:     #C64F3A;
  --clay-2:   #D9785C;
  --wood:     #A8744A;
  --peach:    #D9785C;
  --ok:       #4F9665;
  --warn:     #C7A24A;
  --danger:   #C64F3A;

  /* Fonts */
  --serif: 'Fraunces', Georgia, serif;
  --sans:  'Manrope', -apple-system, sans-serif;
  --mono:  'DM Mono', 'Courier New', monospace;
  --km:    'Noto Sans Khmer', sans-serif;

  /* Sidebar width */
  --sidebar-w: 220px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--cream);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }

/* ============== LOGIN ============== */
.login-shell {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background:
    radial-gradient(circle at 20% 30%, rgba(61,122,79,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(198,79,58,0.04) 0%, transparent 50%),
    var(--cream);
}
.login-card {
  width: 100%; max-width: 400px;
  background: var(--paper);
  border: 1.5px solid var(--ink);
  padding: 40px 32px;
  border-radius: 4px;
}
.login-card .brand {
  text-align: center;
  margin-bottom: 28px;
}
.login-card .brand .label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink);
  opacity: 0.55;
  margin-bottom: 8px;
}
.login-card .brand h1 {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 44px;
  letter-spacing: -0.01em;
  margin: 0;
  line-height: 1;
}
.login-card .brand .sub {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 12px;
  color: var(--clay);
  font-weight: 500;
}
.login-card .pin-prompt {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  margin: 24px 0 14px;
  opacity: 0.7;
}
.login-card .pin-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.login-card .pin-box {
  aspect-ratio: 1/1.18;
  border: 1.5px solid var(--ink);
  background: var(--cream);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 500;
}
.login-card .pin-box.filled {
  background: var(--ink);
  color: var(--cream);
}
.login-card .pin-input {
  position: absolute;
  left: -9999px;
  opacity: 0;
}
.login-card .error {
  color: var(--clay);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-align: center;
  margin-top: 12px;
  min-height: 14px;
}

/* ============== APP SHELL ============== */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  background: var(--ink);
  color: var(--cream);
  padding: 24px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.sidebar .logo {
  padding: 0 24px 24px;
  border-bottom: 1px solid rgba(241,234,214,0.08);
  margin-bottom: 16px;
}
.sidebar .logo .top {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  opacity: 0.5;
  margin-bottom: 6px;
}
.sidebar .logo .name {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 26px;
  line-height: 1;
}
.sidebar .logo .sub {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 8px;
  color: var(--clay-2);
}

.sidebar nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 12px;
}
.sidebar nav button {
  background: transparent;
  border: none;
  color: var(--cream);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  padding: 11px 14px;
  border-radius: 6px;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.12s ease;
}
.sidebar nav button:hover {
  background: rgba(241,234,214,0.06);
}
.sidebar nav button.active {
  background: var(--clay);
  color: var(--cream);
  font-weight: 600;
}
.sidebar nav button.soon {
  opacity: 0.4;
  cursor: default;
}
.sidebar nav button.soon:hover { background: transparent; }
.sidebar nav button .soon-tag {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-left: auto;
  opacity: 0.7;
}

.sidebar .footer {
  padding: 12px 16px 0;
  border-top: 1px solid rgba(241,234,214,0.08);
  margin-top: 12px;
}
.sidebar .footer .staff {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.55;
  margin-bottom: 8px;
}
.sidebar .footer .signout {
  background: transparent;
  border: 1px solid rgba(241,234,214,0.2);
  color: var(--cream);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 8px 12px;
  border-radius: 6px;
  width: 100%;
}
.sidebar .footer .signout:hover {
  background: rgba(241,234,214,0.06);
  border-color: rgba(241,234,214,0.4);
}

/* Main content */
.main {
  padding: 28px 32px 40px;
  overflow-x: hidden;
}
.main-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1.5px solid var(--ink);
  gap: 16px;
  flex-wrap: wrap;
}
.main-head .title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  opacity: 0.55;
  margin-bottom: 4px;
}
.main-head h1 {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 40px;
  line-height: 1;
  margin: 0;
  letter-spacing: -0.01em;
}
.main-head .meta {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.6;
  text-align: right;
}
.main-head .meta .live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.main-head .meta .live::before {
  content: "";
  width: 8px; height: 8px;
  background: var(--green-2);
  border-radius: 50%;
  animation: liveDot 1.6s ease-in-out infinite;
}
@keyframes liveDot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ============== PROMO BANNER ============== */
.promo-banner {
  background: var(--clay);
  color: var(--cream);
  padding: 14px 20px;
  margin-bottom: 24px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.promo-banner .kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.85;
}
.promo-banner h3 {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 22px;
  line-height: 1;
  margin: 4px 0 0;
}
.promo-banner .right {
  text-align: right;
}
.promo-banner .pct {
  font-family: var(--serif);
  font-style: italic;
  font-size: 36px;
  line-height: 1;
  font-weight: 400;
}

/* ============== STAT GRID ============== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  padding: 16px 18px;
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}
.stat-card .label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 6px;
}
.stat-card .value {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 36px;
  line-height: 1;
  letter-spacing: -0.01em;
}
.stat-card .value .unit {
  font-family: var(--mono);
  font-style: normal;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-left: 6px;
  opacity: 0.55;
  font-weight: 500;
}
.stat-card .sub {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.55;
  margin-top: 8px;
}
.stat-card.accent-green { border-left: 5px solid var(--green); }
.stat-card.accent-clay  { border-left: 5px solid var(--clay); }
.stat-card.accent-wood  { border-left: 5px solid var(--wood); }
.stat-card.accent-ink   { background: var(--ink); color: var(--cream); }
.stat-card.accent-ink .label { opacity: 0.7; }
.stat-card.accent-ink .sub { opacity: 0.7; }
.stat-card.accent-ink .value .unit { opacity: 0.7; }
.stat-card.warn {
  background: rgba(199,162,74,0.14);
  border-color: var(--warn);
}

/* ============== SECTION LABELS ============== */
.section-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 28px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(26,26,26,0.18);
  gap: 12px;
}
.section-label .num {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  font-weight: 700;
  margin-right: 12px;
}
.section-label .name {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
}
.section-label .right {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.6;
}

/* ============== TIMELINE (Gantt) ============== */
.timeline-wrap {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 16px;
  margin-bottom: 28px;
  overflow-x: auto;
}
.timeline {
  position: relative;
  min-width: 960px;
  /* CSS variables set in JS:
     --slot-count: number of 30-min slots (e.g. 32 for 06:00–22:00)
     --slot-w: pixel width per 30-min slot
     --court-h: pixel height per court row */
}

/* Header row: hours along the top */
.timeline-hours {
  display: grid;
  grid-template-columns: 80px 1fr;
  margin-bottom: 8px;
}
.timeline-hours .corner {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.55;
  display: flex;
  align-items: flex-end;
  padding-bottom: 4px;
}
.timeline-hours .hours-strip {
  display: flex;
  position: relative;
  border-bottom: 1px solid rgba(26,26,26,0.2);
  padding-bottom: 4px;
}
.timeline-hours .hour-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  font-weight: 600;
  position: absolute;
  bottom: 4px;
  transform: translateX(-50%);
  white-space: nowrap;
  color: var(--ink);
}
.timeline-hours .hour-label.peak {
  color: var(--clay);
}

/* Body: court rows */
.timeline-body {
  display: grid;
  grid-template-columns: 80px 1fr;
  position: relative;
}
.timeline-courts-labels {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.timeline-courts-labels .court {
  display: flex;
  align-items: center;
  padding: 0 12px 0 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
  border-bottom: 1px solid rgba(26,26,26,0.08);
}
.timeline-rows {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.timeline-row {
  position: relative;
  border-bottom: 1px solid rgba(26,26,26,0.08);
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent calc(var(--slot-w) * 2 - 1px),
      rgba(26,26,26,0.1) calc(var(--slot-w) * 2 - 1px),
      rgba(26,26,26,0.1) calc(var(--slot-w) * 2)
    );
}
/* Off-peak/peak background tint */
.timeline-peak-overlay {
  position: absolute;
  top: 0; bottom: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    45deg,
    rgba(198,79,58,0.04) 0,
    rgba(198,79,58,0.04) 4px,
    transparent 4px,
    transparent 8px
  );
}
/* "Now" vertical line */
.timeline-now {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--clay);
  pointer-events: none;
  z-index: 5;
}
.timeline-now::before {
  content: "";
  position: absolute;
  top: -5px;
  left: -5px;
  width: 12px; height: 12px;
  background: var(--clay);
  border-radius: 50%;
}

/* Booking blocks */
.booking-block {
  position: absolute;
  top: 3px;
  bottom: 3px;
  border-radius: 4px;
  padding: 4px 6px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border: 1.5px solid var(--ink);
}
.booking-block:hover {
  transform: scale(1.02);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  z-index: 10;
}
.booking-block .name {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.booking-block .time {
  opacity: 0.75;
  font-size: 9px;
  letter-spacing: 0.06em;
}
.booking-block.status-awaiting    { background: var(--concrete-2); color: var(--ink); }
.booking-block.status-at_risk     { background: var(--warn); color: var(--ink); }
.booking-block.status-paid        { background: var(--green); color: var(--cream); border-color: var(--green); }
.booking-block.status-no_show_freed{background: var(--clay); color: var(--cream); border-color: var(--clay); opacity: 0.7; }
.booking-block.status-no_show_kept{ background: var(--clay-2); color: var(--cream); border-color: var(--clay); }
.booking-block.status-completed   { background: var(--ink); color: var(--cream); opacity: 0.6; }
.booking-block.status-cancelled   { display: none; }
.booking-block.member {
  border-color: var(--wood);
  box-shadow: inset 0 0 0 1px var(--wood);
}

/* Legend */
.timeline-legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px dashed rgba(26,26,26,0.2);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.timeline-legend .swatch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.timeline-legend .swatch i {
  width: 14px; height: 14px;
  border: 1.5px solid var(--ink);
  border-radius: 2px;
}

/* ============== UPCOMING LIST ============== */
.upcoming-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}
.upcoming-card {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 12px 16px;
  display: grid;
  grid-template-columns: 90px 1fr auto;
  gap: 14px;
  align-items: center;
}
.upcoming-card .when {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.upcoming-card .when .countdown {
  display: block;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-top: 2px;
  font-weight: 500;
}
.upcoming-card .who .name {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
}
.upcoming-card .who .meta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  opacity: 0.55;
  margin-top: 2px;
}
.upcoming-card .total {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
}
.upcoming-card.member { border-left: 5px solid var(--wood); }
.upcoming-card.at-risk { background: rgba(199,162,74,0.12); }

/* ============== EMPTY STATE ============== */
.empty {
  text-align: center;
  padding: 24px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.5;
  border: 1px dashed rgba(26,26,26,0.2);
  border-radius: 4px;
}

/* ============== SETTINGS PAGE ============== */
.settings-card {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  padding: 20px 22px;
  border-radius: 4px;
  margin-bottom: 16px;
}
.settings-card h3 {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 24px;
  margin: 0 0 6px;
  line-height: 1;
}
.settings-card .desc {
  font-size: 13px;
  opacity: 0.75;
  margin-bottom: 18px;
}
.settings-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 0;
  border-top: 1px dashed rgba(26,26,26,0.15);
}
.settings-row:first-of-type { border-top: none; }
.settings-row .field-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  min-width: 140px;
}
.settings-row input[type="text"],
.settings-row input[type="number"] {
  font-family: var(--mono);
  font-size: 14px;
  padding: 8px 12px;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  background: var(--cream);
  flex: 1;
  max-width: 320px;
}
.settings-row input:focus {
  outline: none;
  border-color: var(--clay);
}

/* Toggle switch */
.toggle {
  position: relative;
  width: 56px;
  height: 30px;
  background: var(--concrete);
  border-radius: 999px;
  border: 1.5px solid var(--ink);
  cursor: pointer;
  transition: background 0.18s ease;
  flex-shrink: 0;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  background: var(--cream);
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  transition: transform 0.18s ease;
}
.toggle.on { background: var(--green); }
.toggle.on::after { transform: translateX(26px); }

/* Settings save button */
.btn {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: 4px;
  border: 1.5px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  transition: background 0.12s ease, color 0.12s ease;
}
.btn:hover { background: var(--ink); color: var(--cream); }
.btn.primary { background: var(--ink); color: var(--cream); }
.btn.primary:hover { background: var(--clay); border-color: var(--clay); }
.btn.danger { background: var(--clay); color: var(--cream); border-color: var(--clay); }
.btn.danger:hover { background: var(--ink); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.settings-row .actions { margin-left: auto; }

.settings-warning {
  background: rgba(199,79,58,0.08);
  border: 1px solid var(--clay);
  border-radius: 4px;
  padding: 12px 14px;
  font-size: 12.5px;
  margin-top: 16px;
  font-style: italic;
}
.settings-warning b { color: var(--clay); }

/* ============== ACTION QUEUE + PULSE (Dashboard panels) ============== */
.two-col {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
  margin-bottom: 28px;
}
@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
}

.panel {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 18px 20px;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px dashed rgba(26,26,26,0.2);
}
.panel-head h3 {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 22px;
  margin: 0;
  line-height: 1;
}
.panel-head .count {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--clay);
}
.panel-head .count.zero { color: var(--ink); opacity: 0.4; }
.panel-head .count.green { color: var(--green); }

/* Action items */
.action-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(26,26,26,0.08);
}
.action-item:last-child { border-bottom: none; }
.action-item .badge {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 3px;
  border: 1.5px solid var(--ink);
  white-space: nowrap;
}
.action-item .badge.urgent { background: var(--clay); color: var(--cream); border-color: var(--clay); }
.action-item .badge.warn   { background: var(--warn); color: var(--ink); border-color: var(--ink); }
.action-item .badge.info   { background: var(--paper); color: var(--ink); }
.action-item .badge.wood   { background: var(--wood); color: var(--cream); border-color: var(--wood); }

.action-item .body .title {
  font-family: var(--sans);
  font-size: 13.5px;
  font-weight: 600;
}
.action-item .body .meta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  opacity: 0.6;
  margin-top: 2px;
}
.action-item .body .meta.amount {
  color: var(--clay);
  opacity: 1;
  font-weight: 700;
}
.action-item .right {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-align: right;
  white-space: nowrap;
}

.section-group {
  margin-bottom: 16px;
}
.section-group:last-child { margin-bottom: 0; }
.section-group .head {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.section-group .head .count {
  font-size: 11px;
  background: var(--ink);
  color: var(--cream);
  padding: 2px 7px;
  border-radius: 999px;
}
.section-group .head .count.zero { background: var(--concrete); color: var(--ink); opacity: 0.6; }
.section-group .head .count.urgent { background: var(--clay); }
.section-group .head .count.warn { background: var(--warn); color: var(--ink); }
.section-group .head .count.wood { background: var(--wood); }

.empty-mini {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.4;
  padding: 8px 0;
}

/* Pulse metrics */
.pulse-metric {
  margin-bottom: 18px;
}
.pulse-metric:last-child { margin-bottom: 0; }
.pulse-metric .label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 4px;
}
.pulse-metric .value {
  font-family: var(--serif);
  font-style: italic;
  font-size: 30px;
  line-height: 1;
  font-weight: 400;
}
.pulse-metric .value .unit {
  font-family: var(--mono);
  font-style: normal;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-left: 6px;
  opacity: 0.55;
  font-weight: 500;
}
.pulse-metric .delta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  margin-top: 6px;
}
.pulse-metric .delta.up { color: var(--green); }
.pulse-metric .delta.down { color: var(--clay); }
.pulse-metric .delta.flat { color: var(--ink); opacity: 0.5; }

/* Utilization bar */
.util-bar {
  position: relative;
  height: 10px;
  background: var(--concrete);
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 8px;
}
.util-bar .fill {
  position: absolute;
  inset: 0;
  background: var(--green);
  transform-origin: left center;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.util-bar .fill.peak { background: var(--clay); }
.util-bar .fill.warn { background: var(--warn); }


/* ============== BOOKINGS TAB ============== */
.bookings-toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  align-items: center;
}
.date-strip {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.date-pill {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 14px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  background: var(--cream);
  cursor: pointer;
  font-weight: 600;
}
.date-pill .num {
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  margin-left: 4px;
  letter-spacing: 0;
  text-transform: none;
}
.date-pill.on {
  background: var(--ink);
  color: var(--cream);
}
.date-pill input[type=date] {
  border: none;
  background: transparent;
  font-family: inherit;
  color: inherit;
  font-size: inherit;
  letter-spacing: inherit;
  cursor: pointer;
  width: 110px;
}

.filter-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.filter-chip {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 12px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  background: var(--cream);
  cursor: pointer;
  font-weight: 600;
}
.filter-chip.on { background: var(--clay); color: var(--cream); border-color: var(--clay); }

.booking-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.booking-row {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
}
@media (max-width: 600px) {
  .booking-row { grid-template-columns: 1fr; gap: 8px; }
  .booking-row .actions { justify-content: flex-start !important; }
}
.booking-row .when {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  min-width: 100px;
}
.booking-row .when .endtime {
  display: block;
  font-size: 10px;
  letter-spacing: 0.14em;
  opacity: 0.5;
  font-weight: 500;
  margin-top: 2px;
}
.booking-row .who .name {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.booking-row .who .meta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  opacity: 0.6;
  margin-top: 3px;
}
.booking-row .who .id {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  opacity: 0.4;
  margin-top: 2px;
}
.booking-row .actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
  align-items: center;
}
.booking-row .total {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  margin-right: 8px;
}
.booking-row.is-member { border-left: 5px solid var(--wood); }
.booking-row.is-at-risk { background: rgba(199,162,74,0.12); }

.status-pill {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 3px;
  border: 1.5px solid var(--ink);
  display: inline-block;
}
.status-pill.awaiting    { background: var(--concrete-2); color: var(--ink); }
.status-pill.at_risk     { background: var(--warn); color: var(--ink); }
.status-pill.paid        { background: var(--green); color: var(--cream); border-color: var(--green); }
.status-pill.no_show_freed { background: var(--clay); color: var(--cream); border-color: var(--clay); opacity: 0.8; }
.status-pill.no_show_kept  { background: var(--clay-2); color: var(--cream); border-color: var(--clay); }
.status-pill.completed   { background: var(--ink); color: var(--cream); opacity: 0.7; }
.status-pill.cancelled   { background: var(--concrete); color: var(--ink); opacity: 0.5; text-decoration: line-through; }

.tier-pill {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 3px;
}
.tier-pill.Founding { background: var(--wood); color: var(--cream); }
.tier-pill.Standard { background: var(--ink); color: var(--cream); }

.btn-sm {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 7px 12px;
  border-radius: 4px;
  border: 1.5px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
  white-space: nowrap;
}
.btn-sm:hover { background: var(--ink); color: var(--cream); }
.btn-sm.primary { background: var(--ink); color: var(--cream); }
.btn-sm.primary:hover { background: var(--clay); border-color: var(--clay); }
.btn-sm.danger { background: var(--clay); color: var(--cream); border-color: var(--clay); }
.btn-sm.danger:hover { background: var(--ink); border-color: var(--ink); }
.btn-sm.ghost { background: transparent; }
.btn-sm:disabled { opacity: 0.35; cursor: not-allowed; }

/* ============== MODAL ============== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(26,26,26,0.55);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.18s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  width: 100%;
  max-width: 540px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 24px 26px;
  animation: modalIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes modalIn {
  from { transform: translateY(12px) scale(0.96); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 14px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 20px;
}
.modal-head h2 {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 30px;
  margin: 0;
  line-height: 1;
}
.modal-head .kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 4px;
}
.modal-head .x {
  background: transparent;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--ink);
  padding: 0 4px;
  line-height: 1;
  align-self: flex-start;
}
.modal-head .x:hover { color: var(--clay); }

.modal .field {
  margin-bottom: 14px;
}
.modal .field-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 6px;
}
.modal input[type=text],
.modal input[type=number],
.modal input[type=email],
.modal input[type=date],
.modal input[type=time],
.modal input[type=tel],
.modal select,
.modal textarea {
  font-family: var(--sans);
  font-size: 14px;
  padding: 10px 12px;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  background: var(--paper);
  width: 100%;
  font-weight: 500;
}
.modal input:focus, .modal select:focus, .modal textarea:focus {
  outline: none;
  border-color: var(--clay);
}
.modal textarea { min-height: 70px; resize: vertical; font-family: var(--sans); }
.modal .field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.modal .field-row.three { grid-template-columns: 1fr 1fr 1fr; }

.modal .actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px dashed rgba(26,26,26,0.2);
}

.modal-detail-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid rgba(26,26,26,0.08);
  font-size: 13.5px;
}
.modal-detail-row .k {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.6;
}
.modal-detail-row .v { font-weight: 600; font-family: var(--mono); }
.modal-detail-row.total { padding: 14px 0 4px; border-bottom: none; }
.modal-detail-row.total .v { font-size: 22px; font-family: var(--serif); font-style: italic; }

/* Court picker for walk-in modal */
.court-picker {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
}
@media (max-width: 480px) {
  .court-picker { grid-template-columns: repeat(4, 1fr); }
}
.court-picker .ct {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.court-picker .ct.on {
  background: var(--ink);
  color: var(--cream);
}
.court-picker .ct.unavail {
  opacity: 0.3;
  cursor: not-allowed;
  background: var(--concrete);
}

.modal-warning {
  background: rgba(199,79,58,0.08);
  border: 1px solid var(--clay);
  border-radius: 4px;
  padding: 10px 12px;
  font-size: 12.5px;
  margin: 12px 0;
}

/* ============== MEMBERS TAB ============== */
.member-header {
  display: flex;
  gap: 14px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.member-counter {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  padding: 14px 18px;
  border-radius: 4px;
  flex: 1;
  min-width: 200px;
}
.member-counter .label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 4px;
}
.member-counter .big {
  font-family: var(--serif);
  font-style: italic;
  font-size: 32px;
  line-height: 1;
}
.member-counter .big .of {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  opacity: 0.5;
  margin-left: 4px;
  font-weight: 500;
}
.member-counter.founding { border-left: 5px solid var(--wood); }
.member-counter.standard { border-left: 5px solid var(--ink); }
.member-counter.full {
  background: rgba(168,116,74,0.12);
  border-color: var(--wood);
}

.member-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.member-row {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 12px 16px;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  gap: 14px;
  align-items: center;
  cursor: pointer;
  transition: background 0.12s ease;
}
.member-row:hover { background: var(--cream); }
.member-row.founding { border-left: 5px solid var(--wood); }
.member-row .num {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.member-row .name {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 14px;
}
.member-row .meta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  opacity: 0.6;
  margin-top: 2px;
}
.member-row .bday {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
}
.member-row .bday .label {
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.5;
  display: block;
  margin-bottom: 1px;
}

/* Coaching block in timeline — wood-toned to distinguish */
.booking-block.status-coaching     { background: var(--wood); color: var(--cream); border-color: var(--wood); }
.booking-block.status-coaching_paid{ background: var(--wood); color: var(--cream); border-color: var(--wood); }
.booking-block.status-coaching::before,
.booking-block.status-coaching_paid::before {
  content: "★";
  margin-right: 3px;
  font-size: 9px;
}

/* ============== BOOKINGS RANGE VIEW TOGGLE ============== */
.range-toggle {
  display: inline-flex;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  overflow: hidden;
  margin-left: auto;
}
.range-toggle button {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 8px 14px;
  border: none;
  border-right: 1.5px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  cursor: pointer;
}
.range-toggle button:last-child { border-right: none; }
.range-toggle button.on {
  background: var(--ink);
  color: var(--cream);
}

/* Week view: stacked daily timelines */
.week-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.week-day {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  overflow: hidden;
}
.week-day-head {
  background: var(--ink);
  color: var(--cream);
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.week-day-head .label {
  font-weight: 700;
}
.week-day-head .label .num {
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  margin-left: 6px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
}
.week-day-head .stats {
  opacity: 0.7;
  font-weight: 500;
}
.week-day-head.is-today .label::after {
  content: " · TODAY";
  color: var(--clay-2);
}

/* Month grid: calendar */
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  overflow: hidden;
}
.month-dow-head {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 10px 12px;
  background: var(--ink);
  color: var(--cream);
  text-align: center;
}
.month-cell {
  min-height: 90px;
  padding: 8px 10px;
  border-right: 1px solid rgba(26,26,26,0.08);

/* ====================================================================
   THE YARD — ADMIN PANEL
   Single-file React app. PIN-protected. Polls every 15s.
   ==================================================================== */

const { useState, useEffect, useRef, useMemo, useCallback } = React;
const { createRoot } = ReactDOM;

/* ====== CONFIG ======
 * IMPORTANT: Replace API_URL below with your deployed Apps Script Web App URL.
 * It should match the URL used by the customer-facing index.html.
 * Find it in Apps Script → Deploy → Manage deployments → copy "Web app" URL.
 */
const API_URL = "https://script.google.com/macros/s/AKfycbySSk--iEFY8vTvldpARENCQ6KApJik0UHqASKa7PfJ1IkIJkmEAvOQPCsKR84MFtAY/exec";

const COURTS_COUNT = 8;
const OPEN_HOUR = 6;       // 06:00
const CLOSE_HOUR = 22;     // 22:00 (last booking starts 21:30)
const SLOT_MINUTES = 30;
const POLL_INTERVAL_MS = 15000;  // 15s

/* ====== LOCALSTORAGE / SESSION ====== */
const PIN_KEY = "yard.admin.pin";
function getStoredPin() { try { return sessionStorage.getItem(PIN_KEY) || ""; } catch (e) { return ""; } }
function setStoredPin(v) {
  try {
    if (v) sessionStorage.setItem(PIN_KEY, v);
    else sessionStorage.removeItem(PIN_KEY);
  } catch (e) {}
}

/* ====== API ====== */
async function api(action, params = {}) {
  const pin = getStoredPin();
  const url = new URL(API_URL);
  url.searchParams.set("action", action);
  if (pin) params.adminPin = pin;
  for (const k in params) {
    if (params[k] !== undefined && params[k] !== null) {
      url.searchParams.set(k, String(params[k]));
    }
  }
  try {
    const r = await fetch(url.toString(), { method: "GET" });
    const j = await r.json();
    return j;
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

/* ====== HELPERS ====== */
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDateLong(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T12:00:00");
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return DOW[d.getDay()] + " " + d.getDate() + " " + MO[d.getMonth()] + " " + d.getFullYear();
}
function fmtClock() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function isWeekend(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const x = d.getDay();
  return x === 0 || x === 6;
}
function isPeakHour(dateStr, hour) {
  return isWeekend(dateStr) || hour >= 17;
}
function timeToSlotIdx(timeStr) {
  // "06:00" -> 0, "06:30" -> 1, ..., "21:30" -> 31
  if (!timeStr) return 0;
  const [h, m] = timeStr.split(":").map(Number);
  return (h - OPEN_HOUR) * 2 + (m >= 30 ? 1 : 0);
}
function slotIdxToTime(idx) {
  const totalMin = OPEN_HOUR * 60 + idx * SLOT_MINUTES;
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}
function countdownMins(dateStr, timeStr) {
  // Minutes until this booking starts (negative if past)
  const [h, m] = String(timeStr || "00:00").split(":").map(Number);
  const dt = new Date(dateStr + "T00:00:00");
  dt.setHours(h, m, 0, 0);
  return Math.round((dt.getTime() - Date.now()) / 60000);
}
function fmtCountdown(mins) {
  if (mins < 0) return "started " + Math.abs(mins) + "m ago";
  if (mins < 60) return "in " + mins + "m";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return "in " + h + "h" + (m > 0 ? " " + m + "m" : "");
}

/* ====== TOAST ====== */
let toastTimeout = null;
function showToast(text, kind = "default") {
  let el = document.getElementById("toast-root");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast-root";
    document.body.appendChild(el);
  }
  el.className = "toast " + kind;
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { el.style.display = "none"; }, 3000);
}

/* ====== BOUNCING BALL ====== */
function BouncingBall({ size = "md" }) {
  return (
    <div className={"bouncer bouncer-" + size}>
      <div className="ground" />
      <div className="ball-track"><div className="ball" /></div>

/* ====================================================================
   LOGIN SCREEN
   ==================================================================== */
function ScreenLogin({ onAuth }) {
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const [checking, setChecking] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 50);
  }, []);

  async function tryAuth(pin) {
    setChecking(true);
    setError("");
    // Verify PIN by hitting a PIN-protected endpoint
    setStoredPin(pin);
    const r = await api("adminDashboard");
    setChecking(false);
    if (r.ok) {
      onAuth();
    } else {
      setStoredPin("");
      setError(r.error || "Wrong PIN");
      setCode("");
    }
  }

  function onChange(e) {
    const v = e.target.value.replace(/[^0-9]/g, "").slice(0, 6);
    setCode(v);
    setError("");
    if (v.length === 6) {
      tryAuth(v);
    }
  }

  function clickPinBox() {
    if (inputRef.current) inputRef.current.focus();
  }

  return (
    <div className="login-shell">
      <div className="login-card">
        <div className="brand">
          <div className="label">THE</div>
          <h1>Yard</h1>
          <div className="sub">Admin · Toul Kork</div>
        </div>
        <div className="pin-prompt">
          {checking ? "Verifying…" : "Enter staff PIN"}
        </div>
        <div className="pin-row" onClick={clickPinBox}>
          {[0, 1, 2, 3, 4, 5].map(i => (
            <div key={i} className={"pin-box" + (code[i] ? " filled" : "")}>
              {code[i] ? "•" : ""}
            </div>
          ))}
        </div>
        <input
          ref={inputRef}
          className="pin-input"
          type="tel"
          inputMode="numeric"
          pattern="[0-9]*"
          autoComplete="off"
          value={code}
          onChange={onChange}
        />
        <div className="error">{error}</div>
        {checking && (
          <div style={{ display: "flex", justifyContent: "center", marginTop: 8 }}>
            <BouncingBall size="sm" />
          </div>
        )}
      </div>
    </div>
  );
}

/* ====================================================================
   TIMELINE — horizontal Gantt, 8 courts × 06:00–22:00
   Polls every 15s for live updates.
   ==================================================================== */

function Timeline({ bookings, dateStr }) {
  const wrapRef = useRef(null);
  const [slotW, setSlotW] = useState(28);

  // Total slots: 32 (06:00 to 22:00 in 30-min steps)
  const SLOT_COUNT = (CLOSE_HOUR - OPEN_HOUR) * 2;
  const COURT_H = 38;

  // Measure container to compute slot width
  useEffect(() => {
    function measure() {
      if (!wrapRef.current) return;
      const inner = wrapRef.current.querySelector(".timeline");
      if (!inner) return;
      // Reserve 80px for court labels column
      const totalW = inner.offsetWidth - 80;
      const w = Math.max(22, Math.floor(totalW / SLOT_COUNT));
      setSlotW(w);
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [SLOT_COUNT]);

  // Parse all bookings into court-row segments
  // Each entry row can have Court_Numbers like "1, 3, 5" — split into separate blocks per court
  // Entries can be either guest bookings or coaching sessions (entryType field)
  const blocks = useMemo(() => {
    const out = [];
    if (!bookings) return out;
    for (const b of bookings) {
      const derived = b.derivedStatus || "awaiting";
      if (derived === "cancelled") continue;
      const startIdx = timeToSlotIdx(b.time);
      const slots = parseInt(b.slots) || 2;
      const courtNums = String(b.courtNumbers || "")
        .split(",").map(s => parseInt(s.trim())).filter(n => n >= 1 && n <= COURTS_COUNT);
      const isCoaching = b.entryType === "coaching";
      for (const c of courtNums) {
        out.push({
          court: c,
          startIdx: startIdx,
          slots: slots,
          name: isCoaching
            ? "Coach: " + (b.coachName || b.name || "—")
            : (b.name || "—"),
          subtext: isCoaching
            ? (b.studentName ? b.studentName : (b.sessionType || ""))
            : b.time + "–" + b.timeEnd,
          time: b.time + "–" + b.timeEnd,
          total: b.total || 0,
          status: isCoaching ? "coaching" : derived,
          isMember: !!(b.memberTier && b.memberTier.length > 0),
          isCoaching: isCoaching,
          bookingId: b.bookingId
        });
      }
    }
    return out;
  }, [bookings]);

  // "Now" indicator x position
  const nowOffset = useMemo(() => {
    if (dateStr !== todayISO()) return -1;
    const now = new Date();
    const minsFromOpen = (now.getHours() - OPEN_HOUR) * 60 + now.getMinutes();
    if (minsFromOpen < 0 || minsFromOpen > (CLOSE_HOUR - OPEN_HOUR) * 60) return -1;
    return (minsFromOpen / 30) * slotW;
  }, [dateStr, slotW, bookings]);  // re-evaluate when polling re-renders

  // Build hour labels: 06, 07, 08, ..., 22
  const hourLabels = [];
  for (let h = OPEN_HOUR; h <= CLOSE_HOUR; h++) {
    hourLabels.push(h);
  }

  // Peak-hour shading: 17:00 onwards on weekdays, all-day weekends
  const peakStartSlot = isWeekend(dateStr) ? 0 : (17 - OPEN_HOUR) * 2;
  const peakStartPx = peakStartSlot * slotW;
  const peakEndPx = SLOT_COUNT * slotW;

  const stripStyle = { width: SLOT_COUNT * slotW + "px" };

  return (
    <div className="timeline-wrap" ref={wrapRef}>
      <div className="timeline" style={{ "--slot-w": slotW + "px", "--slot-count": SLOT_COUNT }}>

        <div className="timeline-hours">
          <div className="corner">Court</div>
          <div className="hours-strip" style={stripStyle}>
            {hourLabels.map(h => {
              const x = (h - OPEN_HOUR) * 2 * slotW;
              const peak = isPeakHour(dateStr, h);
              return (
                <span
                  key={h}
                  className={"hour-label" + (peak ? " peak" : "")}
                  style={{ left: x + "px" }}
                >
                  {String(h).padStart(2, "0")}
                </span>
              );
            })}
          </div>
        </div>

        <div className="timeline-body">
          <div className="timeline-courts-labels" style={{ height: COURTS_COUNT * COURT_H + "px" }}>
            {Array.from({ length: COURTS_COUNT }, (_, i) => i + 1).map(c => (
              <div key={c} className="court" style={{ height: COURT_H + "px" }}>
                C·{c}
              </div>
            ))}
          </div>

          <div className="timeline-rows" style={{ width: SLOT_COUNT * slotW + "px" }}>
            {/* Peak overlay */}
            {peakStartPx < peakEndPx && (
              <div
                className="timeline-peak-overlay"
                style={{ left: peakStartPx + "px", width: (peakEndPx - peakStartPx) + "px" }}
              />
            )}

            {Array.from({ length: COURTS_COUNT }, (_, i) => i + 1).map(c => (
              <div
                key={c}
                className="timeline-row"
                style={{ height: COURT_H + "px" }}
              >
                {blocks.filter(b => b.court === c).map((b, idx) => {
                  const left = b.startIdx * slotW;
                  const width = b.slots * slotW - 2;
                  return (
                    <div
                      key={c + "-" + b.bookingId + "-" + idx}
                      className={
                        "booking-block status-" + b.status +
                        (b.isMember ? " member" : "")
                      }
                      style={{ left: left + "px", width: width + "px" }}
                      title={b.name + " · " + b.time + " · $" + b.total + (b.isMember ? " · Member" : "")}
                    >
                      <span className="name">{b.name}</span>
                      <span className="time">{b.time}</span>
                    </div>
                  );
                })}
              </div>
            ))}

            {/* Now indicator */}
            {nowOffset >= 0 && (
              <div className="timeline-now" style={{ left: nowOffset + "px" }} />
            )}
          </div>
        </div>

      </div>

      <div className="timeline-legend">
        <span className="swatch"><i style={{ background: "var(--concrete-2)" }} /> Awaiting</span>
        <span className="swatch"><i style={{ background: "var(--warn)" }} /> At-risk</span>
        <span className="swatch"><i style={{ background: "var(--green)" }} /> Paid</span>
        <span className="swatch"><i style={{ background: "var(--clay)" }} /> No-show</span>
        <span className="swatch"><i style={{ background: "var(--ink)", opacity: 0.6 }} /> Completed</span>
        <span className="swatch"><i style={{ background: "transparent", borderColor: "var(--wood)", boxShadow: "inset 0 0 0 1px var(--wood)" }} /> Member</span>
      </div>
    </div>
  );
}

/* ====================================================================

function ActionQueuePanel({ data, onMarkPaid }) {
  const aq = data.actionQueue || {};
  const payments = aq.paymentsToCollect || [];
  const atRisk = aq.atRisk || [];
  const lowStock = aq.lowStock || [];
  const birthdayWeek = aq.birthdayThisWeek || [];

  const total =
    payments.length +
    atRisk.length +
    lowStock.length +
    birthdayWeek.filter(m => !m.alreadyUsed).length;

  async function markPaid(bookingId) {
    const r = await api("adminMarkPaid", { bookingId: bookingId });
    if (r.ok) {
      showToast("Marked paid", "success");
      onMarkPaid && onMarkPaid();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function noShowRelease(bookingId) {
    if (!confirm("Release the court and notify the customer? This sends an SMS.")) return;
    const r = await api("adminNoShowAndRelease", { bookingId: bookingId });
    if (r.ok) {
      showToast("Court released", "success");
      onMarkPaid && onMarkPaid();
    } else {
      showToast(r.error || "Failed", "error");

  return (
    <div className="panel">
      <div className="panel-head">

        ) : (
          payments.map(p => (

              <span className="badge urgent">{p.timeEnd}</span>

/* ====================================================================
   TODAY'S PULSE PANEL
   ==================================================================== */
function TodaysPulsePanel({ data }) {
  const util = data.utilization || {};
  const cmp = data.comparison || {};

  // Delta vs yesterday
  const todayTotal = cmp.todayRevTotal || 0;
  const yest = cmp.yesterdayRevTotal || 0;
  const lastWk = cmp.lastWeekRev || 0;
  const deltaYest = yest > 0 ? ((todayTotal - yest) / yest) * 100 : null;
  const deltaWk = lastWk > 0 ? ((todayTotal - lastWk) / lastWk) * 100 : null;

  function deltaClass(d) {
    if (d == null) return "flat";
    if (d > 2) return "up";
    if (d < -2) return "down";
    return "flat";
  }
  function deltaLabel(d) {
    if (d == null) return "No data";
    const sign = d > 0 ? "+" : "";
    return sign + d.toFixed(0) + "%";
  }

  const utilCls = util.utilizationPct >= 70 ? "" : (util.utilizationPct >= 40 ? "warn" : "warn");
  const peakCls = util.peakUtilizationPct >= 80 ? "peak" : "";

  return (
    <div className="panel">
      <div className="panel-head">
        <h3>Today's Pulse</h3>
        <span className="count green">live</span>
      </div>

      <div className="pulse-metric">
        <div className="label">Courts in use right now</div>
        <div className="value">{util.courtsInUseNow || 0}<span className="unit">of {util.courtsTotal || 8}</span></div>
        <div className="util-bar">
          <div
            className="fill"
            style={{ transform: "scaleX(" + ((util.courtsInUseNow || 0) / (util.courtsTotal || 8)) + ")" }}
          />
        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Day utilization</div>
        <div className="value">{util.utilizationPct || 0}<span className="unit">%</span></div>
        <div className="util-bar">
          <div
            className={"fill " + utilCls}
            style={{ transform: "scaleX(" + ((util.utilizationPct || 0) / 100) + ")" }}
          />
        </div>
        <div className="delta flat">
          {util.bookedCourtHours || 0}h booked of {util.totalCourtHours || 0}h available
        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Peak utilization · {util.peakHoursToday || 5}h peak window</div>
        <div className="value">{util.peakUtilizationPct || 0}<span className="unit">%</span></div>
        <div className="util-bar">
          <div
            className={"fill " + peakCls}
            style={{ transform: "scaleX(" + ((util.peakUtilizationPct || 0) / 100) + ")" }}
          />
        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Today's total revenue</div>
        <div className="value">${todayTotal.toFixed(2)}</div>
        <div className={"delta " + deltaClass(deltaYest)}>
          vs yesterday: {deltaLabel(deltaYest)} · ${yest.toFixed(2)}
        </div>
        <div className={"delta " + deltaClass(deltaWk)}>
          vs last {new Date().toLocaleDateString("en", { weekday: "long" })}: {deltaLabel(deltaWk)} · ${lastWk.toFixed(2)}
        </div>
      </div>
    </div>
  );
}

/* ====================================================================
   BOOKINGS TAB — list, filter by date+status, actions (paid/no-show/cancel),
   walk-in creation modal.
   ==================================================================== */

const STATUS_LABELS = {
  all: "All",
  awaiting: "Awaiting",
  at_risk: "At-risk",
  paid: "Paid",
  no_show_freed: "Released",
  no_show_kept: "No-show",
  completed: "Completed",
  cancelled: "Cancelled"
};

function ScreenBookings() {
  const [view, setView] = useState("day"); // day | week | month
  const [date, setDate] = useState(todayISO());
  const [statusFilter, setStatusFilter] = useState("all");
  const [entries, setEntries] = useState(null);
  const [loading, setLoading] = useState(true);
  const [detailBooking, setDetailBooking] = useState(null);
  const [showWalkIn, setShowWalkIn] = useState(false);

  // Compute the date range we need to fetch based on view + selected date
  const range = useMemo(() => {
    const d = new Date(date + "T12:00:00");
    if (view === "day") {
      return { from: date, to: date };
    } else if (view === "week") {
      // 7 days starting from selected date
      const out = [date];
      for (let i = 1; i < 7; i++) {
        const x = new Date(d);
        x.setDate(x.getDate() + i);
        out.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"));
      }
      return { from: out[0], to: out[6], all: out };
    } else {
      // Month containing the selected date
      const y = d.getFullYear();
      const m = d.getMonth();
      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const fmt = (x) => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
      return { from: fmt(first), to: fmt(last) };
    }
  }, [view, date]);

  async function load() {
    setLoading(true);
    const r = await api("adminListTimelineEntries", { dateFrom: range.from, dateTo: range.to });
    if (r.ok) setEntries(r.entries || []);
    else showToast(r.error || "Failed to load", "error");
    setLoading(false);
  }

  useEffect(() => { load(); }, [range.from, range.to]);

  // Poll every 20s while on this screen
  useEffect(() => {
    const id = setInterval(load, 20000);
    return () => clearInterval(id);
  }, [range.from, range.to]);

  // For Day view: get just today's bookings (not coaching, since coaching has its own tab)
  // Coaching sessions still show on the timeline visual, but the Booking ROW list is guest-only
  const dayBookings = useMemo(() => {
    if (!entries) return [];
    return entries
      .filter(e => e.date === date && e.entryType === "booking")
      .filter(b => statusFilter === "all" ? true : b.derivedStatus === statusFilter);
  }, [entries, date, statusFilter]);

  // Coaching entries on day (for showing in the list separately)
  const dayCoaching = useMemo(() => {
    if (!entries) return [];
    return entries.filter(e => e.date === date && e.entryType === "coaching");
  }, [entries, date]);

  // Status counts (guest bookings only)
  const counts = useMemo(() => {
    const c = { all: 0, awaiting: 0, at_risk: 0, paid: 0, no_show_freed: 0, no_show_kept: 0, completed: 0, cancelled: 0 };
    if (!entries) return c;
    for (const b of entries) {
      if (b.entryType !== "booking") continue;
      if (b.date !== date) continue;
      c.all++;
      if (c[b.derivedStatus] !== undefined) c[b.derivedStatus]++;
    }
    return c;
  }, [entries, date]);

  // Date pills (Day view only)
  const datePills = useMemo(() => {
    const out = [];
    const today = new Date();
    for (let off = -1; off <= 2; off++) {
      const d = new Date(today);
      d.setDate(d.getDate() + off);
      const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const labels = { "-1": "Yesterday", "0": "Today", "1": "Tomorrow", "2": d.toLocaleDateString("en", { weekday: "short" }) };
      out.push({ iso: iso, label: labels[String(off)] || iso, day: d.getDate() });
    }
    return out;
  }, []);

  // Title for the head
  const title = useMemo(() => {
    if (view === "day") return fmtDateLong(date);
    if (view === "week") {
      const start = new Date(range.from + "T12:00:00");
      const end = new Date(range.to + "T12:00:00");
      const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return start.getDate() + " " + MO[start.getMonth()] + " – " + end.getDate() + " " + MO[end.getMonth()] + " " + end.getFullYear();
    }
    const d = new Date(date + "T12:00:00");
    const MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return MO[d.getMonth()] + " " + d.getFullYear();
  }, [view, date, range]);

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">{title}</div>
          <h1>Bookings</h1>
        </div>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <div className="range-toggle">
            <button className={view === "day" ? "on" : ""} onClick={() => setView("day")}>Day</button>
            <button className={view === "week" ? "on" : ""} onClick={() => setView("week")}>Week</button>
            <button className={view === "month" ? "on" : ""} onClick={() => setView("month")}>Month</button>
          </div>
          <button className="btn primary" onClick={() => setShowWalkIn(true)}>+ Walk-in</button>
        </div>
      </div>

      {/* Date strip — visible on Day view, simpler nav on Week/Month */}
      {view === "day" && (
        <div className="bookings-toolbar">
          <div className="date-strip">
            {datePills.map(p => (
              <button
                key={p.iso}
                className={"date-pill" + (date === p.iso ? " on" : "")}
                onClick={() => setDate(p.iso)}
              >
                {p.label}<span className="num">{p.day}</span>
              </button>
            ))}
            <button className="date-pill">
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
            </button>
          </div>
        </div>
      )}

      {(view === "week" || view === "month") && (
        <div className="bookings-toolbar">
          <button className="date-pill" onClick={() => {
            const d = new Date(date + "T12:00:00");
            d.setDate(d.getDate() - (view === "week" ? 7 : 30));
            setDate(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
          }}>← Prev</button>
          <button className="date-pill" onClick={() => setDate(todayISO())}>Today</button>
          <button className="date-pill" onClick={() => {
            const d = new Date(date + "T12:00:00");
            d.setDate(d.getDate() + (view === "week" ? 7 : 30));

/* Week view: 7 days stacked, each a mini timeline */
function WeekView({ entries, days, onDayClick }) {
  return (
    <div className="week-grid">
      {days.map(iso => {
        const dayEntries = entries.filter(e => e.date === iso);
        const guestCount = dayEntries.filter(e => e.entryType === "booking" && e.derivedStatus !== "cancelled").length;
        const coachCount = dayEntries.filter(e => e.entryType === "coaching").length;
        const totalRev = dayEntries.reduce((s, e) => s + (e.total || 0), 0);
        const d = new Date(iso + "T12:00:00");
        const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const isToday = iso === todayISO();
        return (
          <div className="week-day" key={iso}>
            <div className={"week-day-head" + (isToday ? " is-today" : "")}>
              <div className="label" onClick={() => onDayClick(iso)} style={{ cursor: "pointer" }}>
                {DOW[d.getDay()]} <span className="num">{d.getDate()}</span>
              </div>
              <div className="stats">
                {guestCount} bookings{coachCount > 0 ? ` · ${coachCount} coaching` : ""} · ${totalRev.toFixed(0)}
              </div>
            </div>
            <Timeline bookings={dayEntries} dateStr={iso} />
          </div>
        );
      })}
    </div>
  );
}

/* Month view: calendar with daily counts */
function MonthView({ entries, centerDate, onDayClick }) {
  const d = new Date(centerDate + "T12:00:00");
  const y = d.getFullYear();
  const m = d.getMonth();
  const firstOfMonth = new Date(y, m, 1);
  const lastOfMonth = new Date(y, m + 1, 0);
  const daysInMonth = lastOfMonth.getDate();

  // What weekday does month start on? (0 = Sun)
  const startDow = firstOfMonth.getDay();

  // Build cells: leading empties + days + trailing empties to fill weeks
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) cells.push(day);
  while (cells.length % 7 !== 0) cells.push(null);

  // Map of date -> stats
  const byDate = {};
  for (const e of entries) {
    if (!byDate[e.date]) byDate[e.date] = { bookings: 0, coaching: 0, revenue: 0, slots: 0 };
    if (e.entryType === "booking" && e.derivedStatus !== "cancelled") {
      byDate[e.date].bookings++;
      byDate[e.date].revenue += (e.total || 0);
      const courtCount = String(e.courtNumbers || "").split(",").filter(Boolean).length;
      byDate[e.date].slots += (e.slots || 0) * courtCount;
    } else if (e.entryType === "coaching") {
      byDate[e.date].coaching++;
      byDate[e.date].revenue += (e.facilityEarns || 0);
      const courtCount = String(e.courtNumbers || "").split(",").filter(Boolean).length;
      byDate[e.date].slots += (e.slots || 0) * courtCount;
    }
  }

  // Total court-slots in a full operating day: 32 slots × 8 courts = 256
  const DAILY_CAPACITY = 32 * 8;

  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const today = todayISO();

  return (
    <div className="month-grid">
      {DOW.map(d => <div key={d} className="month-dow-head">{d}</div>)}
      {cells.map((day, i) => {
        if (day === null) return <div key={"empty-" + i} className="month-cell empty" />;
        const iso = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
        const stats = byDate[iso] || { bookings: 0, coaching: 0, revenue: 0, slots: 0 };
        const dt = new Date(y, m, day);
        const isWknd = dt.getDay() === 0 || dt.getDay() === 6;
        const isTodayCell = iso === today;
        const utilPct = Math.min(100, Math.round((stats.slots / DAILY_CAPACITY) * 100));
        const totalEvents = stats.bookings + stats.coaching;
        return (
          <div
            key={iso}
            className={"month-cell" + (isTodayCell ? " today" : "") + (isWknd ? " weekend" : "")}
            onClick={() => onDayClick(iso)}
          >
            <div className="day-num">{day}</div>
            {totalEvents > 0 ? (
              <div className="day-stats">
                <div className="ct">
                  <span>BK</span><span className="v">{stats.bookings}</span>
                </div>
                {stats.coaching > 0 && (
                  <div className="ct" style={{ color: "var(--wood)" }}>
                    <span>★</span><span className="v">{stats.coaching}</span>
                  </div>
                )}
                <div className="ct">
                  <span>$</span><span className="v">{stats.revenue.toFixed(0)}</span>
                </div>
                <div className="util-mini">
                  <div className="fill" style={{ transform: "scaleX(" + (utilPct / 100) + ")" }} />
                </div>
              </div>
            ) : null}
          </div>
        );
      })}
    </div>
  );
}

function WalkInModal({ dateDefault, onClose, onCreated }) {
  const [form, setForm] = useState({
    phone: "",
    name: "",
    date: dateDefault || todayISO(),
    time: "18:00",
    slots: 2,
    courts: [1],
    email: ""
  });
  const [availSlots, setAvailSlots] = useState([]);
  const [submitting, setSubmitting] = useState(false);
  const [pricePreview, setPricePreview] = useState(null);

  // Load availability for selected date
  useEffect(() => {
    api("getAvailability", { date: form.date }).then(r => {
      if (r.ok) setAvailSlots(r.slots || []);
    });
  }, [form.date]);

  // Price preview when relevant fields change
  useEffect(() => {
    if (!form.phone) {
      setPricePreview(null);
      return;
    }
    api("calculatePrice", {
      date: form.date,
      time: form.time,
      slots: form.slots,
      courts: form.courts.length,
      phone: form.phone
    }).then(r => { if (r.ok) setPricePreview(r); });
  }, [form.date, form.time, form.slots, form.courts.length, form.phone]);

  // Determine which courts are available for the chosen time + duration
  const courtAvailability = useMemo(() => {
    if (!availSlots.length) return { available: [], unavailable: [] };
    const startIdx = availSlots.findIndex(s => s.time === form.time);
    if (startIdx < 0) return { available: [], unavailable: [] };
    const courtsAvail = new Set([1, 2, 3, 4, 5, 6, 7, 8]);
    for (let i = 0; i < form.slots; i++) {
      const s = availSlots[startIdx + i];
      if (!s) {
        return { available: [], unavailable: [1, 2, 3, 4, 5, 6, 7, 8] };
      }
      const free = new Set((s.freeCourts || []).map(Number));
      for (const c of Array.from(courtsAvail)) {
        if (!free.has(c)) courtsAvail.delete(c);
      }
    }
    const available = Array.from(courtsAvail).sort();
    const unavailable = [1, 2, 3, 4, 5, 6, 7, 8].filter(c => !courtsAvail.has(c));
    return { available, unavailable };
  }, [availSlots, form.time, form.slots]);

  function toggleCourt(c) {
    if (courtAvailability.unavailable.includes(c)) return;
    setForm(f => {
      const set = new Set(f.courts);
      if (set.has(c)) set.delete(c);
      else set.add(c);
      const arr = Array.from(set).sort();
      return { ...f, courts: arr.length ? arr : [c] };
    });
  }

  async function submit() {
    if (!form.phone) return showToast("Phone required", "error");
    if (!form.name) return showToast("Name required", "error");
    if (form.courts.length === 0) return showToast("Pick at least one court", "error");

    setSubmitting(true);
    const r = await api("adminCreateBooking", {
      phone: form.phone,
      name: form.name,
      email: form.email,
      date: form.date,
      time: form.time,
      slots: form.slots,
      courts: form.courts.length,
      source: "Walk-in"
    });
    setSubmitting(false);
    if (r.ok) {
      showToast("Walk-in booked", "success");
      onCreated && onCreated();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  // Time options: 06:00 to 21:30 in 30-min steps
  const timeOptions = useMemo(() => {
    const out = [];
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      for (const m of [0, 30]) {
        const t = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        const slot = availSlots.find(s => s.time === t);
        const isFree = slot ? (slot.availableCount > 0) : false;
        out.push({ value: t, label: t + (isFree ? "" : "  (full)"), disabled: !isFree });
      }
    }
    return out;
  }, [availSlots]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">New walk-in booking</div>
            <h2>Walk-in</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field">
          <div className="field-label">Phone</div>
          <input
            type="tel"
            inputMode="numeric"
            value={form.phone}
            placeholder="e.g. 12345678"
            onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/[^0-9]/g, "") })}
          />
        </div>

        <div className="field">
          <div className="field-label">Customer name</div>
          <input
            type="text"
            value={form.name}
            placeholder="First & last name"
            onChange={(e) => setForm({ ...form, name: e.target.value })}
          />
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Date</div>
            <input
              type="date"
              value={form.date}
              onChange={(e) => setForm({ ...form, date: e.target.value, courts: [1] })}
            />
          </div>
          <div className="field">
            <div className="field-label">Start time</div>
            <select value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value, courts: [1] })}>
              {timeOptions.map(o => (
                <option key={o.value} value={o.value} disabled={o.disabled}>{o.label}</option>
              ))}
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Duration</div>
          <select value={form.slots} onChange={(e) => setForm({ ...form, slots: parseInt(e.target.value) })}>
            <option value={2}>1h</option>
            <option value={3}>1h 30m</option>
            <option value={4}>2h</option>
            <option value={5}>2h 30m</option>
            <option value={6}>3h</option>
            <option value={7}>3h 30m</option>
            <option value={8}>4h</option>
          </select>
        </div>

        <div className="field">
          <div className="field-label">
            Courts {form.courts.length > 0 && <span style={{ opacity: 0.6, fontSize: 10 }}>· selected: {form.courts.join(", ")}</span>}
          </div>
          <div className="court-picker">
            {[1, 2, 3, 4, 5, 6, 7, 8].map(c => {
              const isUnavail = courtAvailability.unavailable.includes(c);
              const isOn = form.courts.includes(c);
              return (
                <div
                  key={c}
                  className={"ct" + (isOn ? " on" : "") + (isUnavail ? " unavail" : "")}
                  onClick={() => toggleCourt(c)}
                >
                  C·{c}
                </div>
              );
            })}
          </div>
        </div>

        {pricePreview && (
          <div className="modal-detail-row" style={{ marginTop: 12 }}>
            <span className="k">Estimated total</span>
            <span className="v" style={{ fontSize: 18, fontFamily: "var(--serif)", fontStyle: "italic" }}>
              ${(pricePreview.total || 0).toFixed(2)}
              {pricePreview.discountPct > 0 && (
                <span style={{ marginLeft: 8, fontSize: 11, fontFamily: "var(--mono)", color: "var(--clay)" }}>
                  −{pricePreview.discountPct}%
                </span>
              )}
            </span>
          </div>
        )}

        <div className="modal-warning">
          Walk-in booking bypasses the customer's phone OTP. SMS confirmation will still be sent.
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Cancel</button>
          <button
            className="btn primary"
            onClick={submit}
            disabled={submitting || !form.phone || !form.name || form.courts.length === 0}
          >
            {submitting ? "Booking…" : "Confirm walk-in"}
          </button>
        </div>
      </div>
    </div>
  );
}
