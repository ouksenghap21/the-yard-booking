  );
}

/* ====================================================================
   TIMELINE — horizontal Gantt, 8 courts × 06:00–22:00
   Polls every 15s for live updates.
   ==================================================================== */

function Timeline({ bookings, dateStr, onBlockClick }) {
  const wrapRef = useRef(null);
  const [slotW, setSlotW] = useState(28);

  // Total slots: 32 (06:00 to 22:00 in 30-min steps)
  const SLOT_COUNT = (CLOSE_HOUR - OPEN_HOUR) * 2;
  const COURT_H = 38;

  // Measure container to compute slot width
  useEffect(() => {
    function measure() {
      if (!wrapRef.current) return;
      const inner = wrapRef.current.querySelector(".timeline");
      if (!inner) return;
      // Reserve 80px for court labels column
      const totalW = inner.offsetWidth - 80;
      const w = Math.max(22, Math.floor(totalW / SLOT_COUNT));
      setSlotW(w);
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [SLOT_COUNT]);

  // Parse all bookings into court-row segments
  // Each entry row can have Court_Numbers like "1, 3, 5" — split into separate blocks per court
  // Entries can be either guest bookings or coaching sessions (entryType field)
  const blocks = useMemo(() => {
    const out = [];
    if (!bookings) return out;
    for (const b of bookings) {
      const derived = b.derivedStatus || "awaiting";
      if (derived === "cancelled") continue;
      const startIdx = timeToSlotIdx(b.time);
      const slots = parseInt(b.slots) || 2;
      const courtNums = String(b.courtNumbers || "")
        .split(",").map(s => parseInt(s.trim())).filter(n => n >= 1 && n <= COURTS_COUNT);
      const isCoaching = b.entryType === "coaching";
      const isWalkIn = b.entryType === "walkin";

      // Determine the TYPE (color axis) and STATE (texture/opacity axis)
      // Type: booking | coaching | walkin
      // State: awaiting | at_risk | paid | no_show_freed | no_show_kept | completed
      let type, state;
      if (isCoaching) {
        type = "coaching";
        const ps = String(b.paymentStatus || "").toLowerCase();
        state = (ps === "paid") ? "paid" : "awaiting";
      } else if (isWalkIn) {
        type = "walkin";
        // walk-in state based on whether players paid in full
        const cap = b.playerCap || 15;
        const count = b.playerCount || 0;
        const rev = b.total || 0;
        const expected = count * (b.rate || 0);
        state = count === 0 ? "awaiting" : (rev >= expected && expected > 0 ? "paid" : "awaiting");
      } else {
        type = "booking";
        state = derived;
      }

      for (const c of courtNums) {
        out.push({
          court: c,
          startIdx: startIdx,
          slots: slots,
          name: isCoaching
            ? "Coach: " + (b.coachName || b.name || "—")
            : isWalkIn
            ? "Open Play · " + (b.playerCount || 0) + "/" + (b.playerCap || 15)
            : (b.name || "—"),
          subtext: isCoaching
            ? (b.studentName ? b.studentName : (b.sessionType || ""))
            : isWalkIn
            ? "$" + (b.rate || 0) + "/player"
            : b.time + "–" + b.timeEnd,
          time: b.time + "–" + b.timeEnd,
          total: b.total || 0,
          type: type,
          state: state,
          // legacy `status` kept for any old CSS that still references it
          status: isCoaching ? "coaching" : isWalkIn ? "walkin" : derived,
          isMember: !!(b.memberTier && b.memberTier.length > 0),
          isCoaching: isCoaching,
          isWalkIn: isWalkIn,
          bookingId: b.bookingId,
          sourceEntry: b
        });
      }
    }
    return out;
  }, [bookings]);

  // "Now" indicator x position
  const nowOffset = useMemo(() => {
    if (dateStr !== todayISO()) return -1;
    const now = new Date();
    const minsFromOpen = (now.getHours() - OPEN_HOUR) * 60 + now.getMinutes();
    if (minsFromOpen < 0 || minsFromOpen > (CLOSE_HOUR - OPEN_HOUR) * 60) return -1;
    return (minsFromOpen / 30) * slotW;
  }, [dateStr, slotW, bookings]);  // re-evaluate when polling re-renders

  // Build hour labels: 06, 07, 08, ..., 22
  const hourLabels = [];
  for (let h = OPEN_HOUR; h <= CLOSE_HOUR; h++) {
    hourLabels.push(h);
  }

  // Peak-hour shading: 17:00 onwards on weekdays, all-day weekends
  const peakStartSlot = isWeekend(dateStr) ? 0 : (17 - OPEN_HOUR) * 2;
  const peakStartPx = peakStartSlot * slotW;
  const peakEndPx = SLOT_COUNT * slotW;

  const stripStyle = { width: SLOT_COUNT * slotW + "px" };

  return (
    <div className="timeline-wrap" ref={wrapRef}>
      <div className="timeline" style={{ "--slot-w": slotW + "px", "--slot-count": SLOT_COUNT }}>

        <div className="timeline-hours">
          <div className="corner">Court</div>
          <div className="hours-strip" style={stripStyle}>
            {hourLabels.map(h => {
              const x = (h - OPEN_HOUR) * 2 * slotW;
              const peak = isPeakHour(dateStr, h);
              return (
                <span
                  key={h}
                  className={"hour-label" + (peak ? " peak" : "")}
                  style={{ left: x + "px" }}
                >
                  {String(h).padStart(2, "0")}
                </span>
              );
            })}
          </div>
        </div>

        <div className="timeline-body">
          <div className="timeline-courts-labels" style={{ height: COURTS_COUNT * COURT_H + "px" }}>
            {Array.from({ length: COURTS_COUNT }, (_, i) => i + 1).map(c => (
              <div key={c} className="court" style={{ height: COURT_H + "px" }}>
                C·{c}
              </div>
            ))}
          </div>

          <div className="timeline-rows" style={{ width: SLOT_COUNT * slotW + "px" }}>
            {/* Peak overlay */}
            {peakStartPx < peakEndPx && (
              <div
                className="timeline-peak-overlay"
                style={{ left: peakStartPx + "px", width: (peakEndPx - peakStartPx) + "px" }}
              />
            )}

            {Array.from({ length: COURTS_COUNT }, (_, i) => i + 1).map(c => (
              <div
                key={c}
                className="timeline-row"
                style={{ height: COURT_H + "px" }}
              >
                {blocks.filter(b => b.court === c).map((b, idx) => {
                  const left = b.startIdx * slotW;
                  const width = b.slots * slotW - 2;
                  return (
                    <div
                      key={c + "-" + b.bookingId + "-" + idx}
                      className={
                        "booking-block type-" + b.type + " state-" + b.state +
                        (b.isMember ? " member" : "") +
                        (onBlockClick ? " clickable" : "")
                      }
                      style={{ left: left + "px", width: width + "px" }}
                      title={b.name + " · " + b.time + " · $" + b.total + (b.isMember ? " · Member" : "") + (onBlockClick ? " · click to open" : "")}
                      onClick={onBlockClick ? (e) => { e.stopPropagation(); onBlockClick(b.sourceEntry); } : undefined}
                    >
                      <span className="name">{b.name}</span>
                      <span className="time">{b.time}</span>
                      {b.isMember && <span className="member-flag" title="Member">★</span>}
                    </div>
                  );
                })}
              </div>
            ))}

            {/* Now indicator */}
            {nowOffset >= 0 && (
              <div className="timeline-now" style={{ left: nowOffset + "px" }} />
            )}
          </div>
        </div>

      </div>

      <div className="timeline-legend">
        <div className="legend-group">
          <span className="legend-label">Type</span>
          <span className="swatch"><i className="sw-booking" /> Court booking</span>
          <span className="swatch"><i className="sw-coaching" /> ★ Coaching</span>
          <span className="swatch"><i className="sw-walkin" /> ◉ Open Play</span>
        </div>
        <div className="legend-group">
          <span className="legend-label">State</span>
          <span className="swatch"><i className="sw-state-awaiting" /> Awaiting</span>
          <span className="swatch"><i className="sw-state-at_risk" /> At-risk</span>
          <span className="swatch"><i className="sw-state-paid" /> Paid</span>
          <span className="swatch"><i className="sw-state-no_show" /> No-show</span>
          <span className="swatch"><i className="sw-state-completed" /> Completed</span>
          <span className="swatch"><i className="sw-member" /> ★ Member</span>
        </div>
      </div>
    </div>
  );
}

/* ====================================================================
   DASHBOARD
   ==================================================================== */
function ScreenDashboard() {
  const [data, setData] = useState(null);
  const [bookings, setBookings] = useState(null);
  const [kpiData, setKpiData] = useState(null);
  const [opKpiData, setOpKpiData] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [clock, setClock] = useState(fmtClock());

  // Click-to-detail modals — same pattern as ScreenBookings
  const [detailBooking, setDetailBooking] = useState(null);
  const [walkInBlock, setWalkInBlock] = useState(null);
  const [coachingInfo, setCoachingInfo] = useState(null);

  async function handleBlockClick(entry) {
    if (!entry) return;
    if (entry.entryType === "walkin") {
      const r = await api("adminListWalkInBlocks", { dateFrom: entry.date, dateTo: entry.date });
      if (r.ok) {
        const fresh = (r.blocks || []).find(b => b.blockId === entry.bookingId || b.blockId === entry.blockId);
        if (fresh) setWalkInBlock(fresh);
        else showToast("Block not found", "error");
      } else {
        showToast(r.error || "Failed", "error");
      }
    } else if (entry.entryType === "coaching") {
      setCoachingInfo(entry);
    } else {
      setDetailBooking(entry);
    }
  }

  async function refresh(opts = {}) {
    const today = todayISO();
    const bypass = !!opts.fresh;
    // Synchronous cache priming on first paint — show stale data instantly
    if (!bypass && !data) {
      const cd = getCachedApi("adminDashboard");
      const cb = getCachedApi("adminListTimelineEntries", { date: today });
      const ck = getCachedApi("adminDashboardKpi");
      const cok = getCachedApi("adminOperationalKpi");
      if (cd && cd.ok) setData(cd);
      if (cb && cb.ok) setBookings(cb.entries || []);
      if (ck && ck.ok) setKpiData(ck);
      if (cok && cok.ok) setOpKpiData(cok);
    }
    const [d, b, k, ok] = await Promise.all([
      api("adminDashboard", {}, { bypassCache: bypass }),
      api("adminListTimelineEntries", { date: today }, { bypassCache: bypass }),
      api("adminDashboardKpi", {}, { bypassCache: bypass }),
      api("adminOperationalKpi", {}, { bypassCache: bypass })
    ]);
    if (d.ok) setData(d);
    if (b.ok) setBookings(b.entries || []);
    if (k.ok) setKpiData(k);
    if (ok.ok) setOpKpiData(ok);
    setLastUpdated(new Date());
  }

  useEffect(() => {
    refresh();  // initial — uses cache if fresh
    let intervalId = null;
    function startPolling() {
      if (intervalId) return;
      intervalId = setInterval(() => refresh({ fresh: true }), POLL_INTERVAL_MS);
    }
    function stopPolling() {
      if (!intervalId) return;
      clearInterval(intervalId);
      intervalId = null;
    }
    function onVisChange() {
      if (document.hidden) {
        stopPolling();
      } else {
        // When user returns to the tab, immediately fetch fresh data + resume polling
        refresh({ fresh: true });
        startPolling();
      }
    }
    if (!document.hidden) startPolling();
    document.addEventListener("visibilitychange", onVisChange);
    const clockId = setInterval(() => setClock(fmtClock()), 30000);
    return () => {
      stopPolling();
      clearInterval(clockId);
      document.removeEventListener("visibilitychange", onVisChange);
    };
  }, []);

  if (!data) {
    return (
      <div style={{ padding: 60, display: "flex", justifyContent: "center" }}>
        <BouncingBall size="md" />
      </div>
    );
  }

  const today = todayISO();
  const todayLong = fmtDateLong(today);

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">Today · {todayLong}</div>
          <h1>Dashboard</h1>
        </div>
        <div className="meta">
          <div className="live">Live · auto-refresh 15s</div>
          <div style={{ marginTop: 4, fontSize: 10 }}>
            {clock} · Toul Kork
          </div>
        </div>
      </div>

      {/* Promo banner if active */}
      {data.promo && data.promo.active && data.promo.pct > 0 && (
        <div className="promo-banner">
          <div>
            <div className="kicker">Promo active</div>
            <h3>{data.promo.label || "Soft launch promo"}</h3>
          </div>
          <div className="right">
            <div className="kicker">All bookings</div>
            <div className="pct">−{data.promo.pct}%</div>
          </div>
        </div>
      )}

      {/* Stat grid */}
      <div className="stat-grid">
        <div className="stat-card accent-ink">
          <div className="label">Today's bookings</div>
          <div className="value">{data.bookings.total}<span className="unit">total</span></div>
          <div className="sub">{data.bookings.upcomingNext2hrs} in next 2hrs</div>
        </div>
        <div className="stat-card accent-green">
          <div className="label">Court rev. paid</div>
          <div className="value">${data.bookings.revenuePaid.toFixed(2)}</div>
          <div className="sub">Today · courts only</div>
        </div>
        <div className="stat-card accent-clay">
          <div className="label">Court rev. pending</div>
          <div className="value">${data.bookings.revenuePending.toFixed(2)}</div>
          <div className="sub">Awaiting payment · courts only</div>
        </div>
        <div className="stat-card accent-wood">
          <div className="label">POS revenue</div>
          <div className="value">${data.pos.revenue.toFixed(2)}</div>
          <div className="sub">{data.pos.transactions} transactions</div>
        </div>
        {data.bookings.atRisk > 0 && (
          <div className="stat-card warn">
            <div className="label">At risk</div>
            <div className="value">{data.bookings.atRisk}</div>
            <div className="sub">Past grace period</div>
          </div>
        )}
        <div className="stat-card">
          <div className="label">Founding members</div>
          <div className="value">{data.members.founding}<span className="unit">of {data.members.foundingCap}</span></div>
          <div className="sub">{data.members.foundingRemaining} slots left</div>
        </div>
      </div>

      {/* Timeline */}
      <div className="section-label">
        <span><span className="num">01</span><span className="name">Today's Court Timeline</span></span>
        <span className="right">{bookings ? bookings.filter(b => b.derivedStatus !== "cancelled").length : 0} active</span>
      </div>
      {bookings === null ? (
        <div className="empty"><BouncingBall size="sm" /></div>
      ) : (
        <Timeline bookings={bookings} dateStr={today} onBlockClick={handleBlockClick} />
      )}

      {/* Monthly KPI Goals (only shown when at least one goal is set in Settings) */}
      {kpiData && kpiData.anyGoalSet && (
        <KpiGoalsPanel kpiData={kpiData} />
      )}

      {/* Operational diagnostics — court utilization, active members, self-service % */}
      {opKpiData && (
        <OperationalKpiPanel data={opKpiData} />
      )}

      {/* Action Queue + Today's Pulse */}
      <div className="two-col">
        <ActionQueuePanel data={data} onMarkPaid={refresh} />
        <TodaysPulsePanel data={data} />
      </div>

      {/* Click-to-detail modals from the timeline */}
      {detailBooking && (
        <BookingDetailModal
          booking={detailBooking}
          onClose={() => setDetailBooking(null)}
          onAction={() => { refresh(); setDetailBooking(null); }}
        />
      )}
      {walkInBlock && (
        <WalkInBlockModal
          block={walkInBlock}
          onClose={() => setWalkInBlock(null)}
          onChanged={() => refresh()}
        />
      )}
      {coachingInfo && (
        <CoachingInfoModal
          session={coachingInfo}
          onClose={() => setCoachingInfo(null)}
        />
      )}
    </div>
  );
}

/* ====================================================================
   KPI GOALS PANEL — monthly targets with progress bars
   ==================================================================== */
function KpiGoalsPanel({ kpiData }) {
  const kpis = kpiData.kpis || {};
  const items = [
    { key: "monthlyRevenue", label: "Monthly Revenue", unit: "$", data: kpis.monthlyRevenue, color: "var(--green)" },
    { key: "monthlyBookings", label: "Paid Bookings", unit: "", data: kpis.monthlyBookings, color: "var(--ink)" },
    { key: "monthlyNewMembers", label: "New Members", unit: "", data: kpis.monthlyNewMembers, color: "var(--wood)" },
    { key: "monthlyPosRevenue", label: "POS Revenue", unit: "$", data: kpis.monthlyPosRevenue, color: "var(--peach,#D9785C)" }
  ].filter(x => x.data !== null);

  const paceColor = {
    "achieved": "var(--green)",
    "ahead": "var(--green)",
    "on-track": "var(--wood)",
    "behind": "var(--clay)"
  };
  const paceLabel = {
    "achieved": "✓ ACHIEVED",
    "ahead": "AHEAD",
    "on-track": "ON TRACK",
    "behind": "BEHIND"
  };

  function formatVal(unit, n) {
    if (unit === "$") return "$" + n.toFixed(2);
    return n.toString();
  }

  return (
    <div className="settings-card" style={{ marginBottom: 18, padding: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
        <h3 style={{ margin: 0 }}>Monthly Goals · {kpiData.monthStr}</h3>
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", opacity: 0.55, textTransform: "uppercase" }}>
          Day {kpiData.daysElapsed} of {kpiData.daysInMonth} · {kpiData.daysRemaining} days left
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(" + items.length + ", 1fr)", gap: 14 }}>
        {items.map(item => {
          const d = item.data;
          const cappedPct = Math.min(100, d.pct);
          const pColor = paceColor[d.pace] || "var(--ink)";
          return (
            <div key={item.key} style={{
              padding: 14,
              border: "1.5px solid var(--ink)",
              borderRadius: 4,
              background: "var(--paper)"
            }}>
              <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.16em", opacity: 0.55, textTransform: "uppercase", marginBottom: 4 }}>
                {item.label}
              </div>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 6 }}>
                <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 26, fontWeight: 700 }}>
                  {formatVal(item.unit, d.actual)}
                </div>
                <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55 }}>
                  / {formatVal(item.unit, d.target)}
                </div>
              </div>

              {/* Progress bar */}
              <div style={{
                position: "relative",
                height: 6,
                background: "rgba(26,26,26,0.08)",
                borderRadius: 3,
                marginBottom: 8,
                overflow: "hidden"
              }}>
                <div style={{
                  position: "absolute",
                  left: 0, top: 0, bottom: 0,
                  width: cappedPct + "%",
                  background: item.color,
                  borderRadius: 3,
                  transition: "width 0.4s ease"
                }} />
                {/* Pace marker (expected position based on days elapsed) */}
                {d.pace !== "achieved" && (
                  <div style={{
                    position: "absolute",
                    left: ((kpiData.daysElapsed / kpiData.daysInMonth) * 100) + "%",
                    top: -2, bottom: -2,
                    width: 2,
                    background: "rgba(26,26,26,0.4)"
                  }} title="Expected pace" />
                )}
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{
                  fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.14em", fontWeight: 700,
                  color: pColor, textTransform: "uppercase"
                }}>
                  {paceLabel[d.pace] || d.pace} · {d.pct}%
                </div>
                {d.pace !== "achieved" && (
                  <div style={{ fontFamily: "var(--mono)", fontSize: 9, opacity: 0.55 }}>
                    pace: {formatVal(item.unit, d.expectedNow)}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}


/* ====================================================================
   OPERATIONAL KPI PANEL — court utilization, active members, self-service %
   Informational only (no targets), but shown prominently on dashboard.
   ==================================================================== */
function OperationalKpiPanel({ data }) {
  const u = data.utilization || {};
  const am = data.activeMembers || {};
  const ss = data.selfService || {};

  // When a target is set, pace from backend dictates color.
  // When no target, fall back to absolute-value coloring (>=60% green, >=30% wood, else clay).
  const PACE_COLOR = {
    "achieved": "var(--green)",
    "on-track": "var(--wood)",
    "behind": "var(--clay)"
  };
  const PACE_LABEL = {
    "achieved": "✓ ACHIEVED",
    "on-track": "ON TRACK",
    "behind": "BEHIND"
  };
  function fallbackColor(pct) {
    if (pct >= 60) return "var(--green)";
    if (pct >= 30) return "var(--wood)";
    return "var(--clay)";
  }
  function colorFor(pace, pct) {
    return pace ? (PACE_COLOR[pace] || "var(--ink)") : fallbackColor(pct);
  }

  const items = [
    {
      label: "Peak Utilization",
      sub: "weekday 17:00+ & weekends",
      pct: u.peak ? u.peak.pct : 0,
      target: u.peak ? u.peak.target : 0,
      pace: u.peak ? u.peak.pace : null,
      isPercentage: true,
      denom: u.peak ? Math.round(u.peak.usedHours) + " / " + u.peak.capacityHours + " court-hrs" : ""
    },
    {
      label: "Off-Peak Utilization",
      sub: "weekday 06:00–17:00",
      pct: u.offPeak ? u.offPeak.pct : 0,
      target: u.offPeak ? u.offPeak.target : 0,
      pace: u.offPeak ? u.offPeak.pace : null,
      isPercentage: true,
      denom: u.offPeak ? Math.round(u.offPeak.usedHours) + " / " + u.offPeak.capacityHours + " court-hrs" : ""
    },
    {
      label: "Active Members",
      sub: "played in last 30 days",
      pct: am.target > 0
        ? Math.min(100, Math.round((am.recent30d / am.target) * 100))
        : (am.totalActive > 0 ? am.pct : 0),
      target: am.target || 0,
      pace: am.pace,
      isPercentage: false,
      actualValue: am.recent30d,
      denom: am.target > 0
        ? am.recent30d + " / " + am.target + " target · " + am.totalActive + " in system"
        : am.totalActive + " total · " + am.pct + "% of system"
    },
    {
      label: "Self-Service Bookings",
      sub: "this month — Web vs admin-entered",
      pct: ss.pct,
      target: 0,
      pace: null,
      isPercentage: true,
      denom: ss.selfServiceCount + " / " + ss.totalCount
    }
  ];

  return (
    <div className="settings-card" style={{ marginBottom: 18, padding: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
        <h3 style={{ margin: 0 }}>Operational Health · {data.monthStr}</h3>
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", opacity: 0.55, textTransform: "uppercase" }}>
          From Operational Plan targets
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
        {items.map((item, idx) => {
          const color = colorFor(item.pace, item.pct);
          const barFillPct = Math.min(100, item.pct);
          // Position of target marker as % of bar width (capped at 100)
          const targetMarkerPct = item.target > 0 && item.isPercentage
            ? Math.min(100, item.target)
            : null;
          return (
            <div key={idx} style={{
              padding: 14,
              border: "1.5px solid var(--ink)",
              borderRadius: 4,
              background: "var(--paper)"
            }}>
              <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.16em", opacity: 0.55, textTransform: "uppercase", marginBottom: 2 }}>
                {item.label}
              </div>
              <div style={{ fontFamily: "var(--mono)", fontSize: 9, opacity: 0.45, marginBottom: 8 }}>
                {item.sub}
              </div>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 6 }}>
                <div style={{
                  fontFamily: "var(--serif)", fontStyle: "italic",
                  fontSize: 28, fontWeight: 700, color: color
                }}>
                  {item.isPercentage ? item.pct + "%" : (item.actualValue !== undefined ? item.actualValue : item.pct + "%")}
                </div>
                {item.target > 0 && (
                  <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55 }}>
                    / {item.isPercentage ? item.target + "%" : item.target}
                  </div>
                )}
              </div>
              {/* Progress bar */}
              <div style={{
                position: "relative", height: 6,
                background: "rgba(26,26,26,0.08)",
                borderRadius: 3, marginBottom: 6, overflow: "hidden"
              }}>
                <div style={{
                  position: "absolute", left: 0, top: 0, bottom: 0,
                  width: barFillPct + "%",
                  background: color,
                  borderRadius: 3,
                  transition: "width 0.4s ease"
                }} />
                {/* Target marker line */}
                {targetMarkerPct !== null && (
                  <div style={{
                    position: "absolute",
                    left: targetMarkerPct + "%",
                    top: -2, bottom: -2, width: 2,
                    background: "rgba(26,26,26,0.5)"
                  }} title={"Target: " + item.target + "%"} />
                )}
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontFamily: "var(--mono)", fontSize: 9, opacity: 0.55 }}>
                  {item.denom}
                </div>
                {item.pace && (
                  <div style={{
                    fontFamily: "var(--mono)", fontSize: 9, fontWeight: 700,
                    letterSpacing: "0.14em", color: color
                  }}>
                    {PACE_LABEL[item.pace]}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}


/* ====================================================================
   ACTION QUEUE PANEL
   ==================================================================== */
function ActionQueuePanel({ data, onMarkPaid }) {
  const aq = data.actionQueue || {};
  const payments = aq.paymentsToCollect || [];
  const atRisk = aq.atRisk || [];
  const lowStock = aq.lowStock || [];
  const birthdayWeek = aq.birthdayThisWeek || [];

  const total =
    payments.length +
    atRisk.length +
    lowStock.length +
    birthdayWeek.filter(m => !m.alreadyUsed).length;

  async function markPaid(bookingId) {
    const r = await api("adminMarkPaid", { bookingId: bookingId });
    if (r.ok) {
      showToast("Marked paid", "success");
      onMarkPaid && onMarkPaid();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function noShowRelease(bookingId) {
    if (!confirm("Release the court and notify the customer? This sends an SMS.")) return;
    const r = await api("adminNoShowAndRelease", { bookingId: bookingId });
    if (r.ok) {
      showToast("Court released", "success");
      onMarkPaid && onMarkPaid();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  return (
    <div className="panel">
      <div className="panel-head">
        <h3>Needs Attention</h3>
        <span className={"count" + (total === 0 ? " zero" : "")}>
          {total === 0 ? "All clear" : total + " items"}
        </span>
      </div>

      {/* Payments to collect */}
      <div className="section-group">
        <div className="head">
          <span>Payments to Collect</span>
          <span className={"count" + (payments.length === 0 ? " zero" : " urgent")}>
            {payments.length}
          </span>
        </div>
        {payments.length === 0 ? (
          <div className="empty-mini">No outstanding payments</div>
        ) : (
          payments.map(p => (
            <div className="action-item" key={p.bookingId}>
              <span className="badge urgent">{p.timeEnd}</span>
              <div className="body">
                <div className="title">
                  {p.name}
                  {p.memberTier && <span className={"tier-pill " + p.memberTier} style={{ marginLeft: 8 }}>{p.memberTier}</span>}
                </div>
                <div className="meta">C·{p.courts} · ${(p.total || 0).toFixed(2)} · {p.phone}</div>
              </div>
              <button className="btn-sm primary" onClick={() => markPaid(p.bookingId)}>Mark paid</button>
            </div>
          ))
        )}
      </div>

      {/* At-risk bookings */}
      <div className="section-group">
        <div className="head">
          <span>At-Risk Bookings</span>
          <span className={"count" + (atRisk.length === 0 ? " zero" : " warn")}>
            {atRisk.length}
          </span>
        </div>
        {atRisk.length === 0 ? (
          <div className="empty-mini">No-one past grace period</div>
        ) : (
          atRisk.map(b => (
            <div className="action-item" key={b.bookingId}>
              <span className="badge warn">{b.time}</span>
              <div className="body">
                <div className="title">{b.name}</div>
                <div className="meta">C·{b.courts} · ${(b.total || 0).toFixed(2)} · {b.phone}</div>
              </div>
              <button className="btn-sm danger" onClick={() => noShowRelease(b.bookingId)}>Release</button>
            </div>
          ))
        )}
      </div>

      {/* Low stock */}
      <div className="section-group">
        <div className="head">
          <span>Low Stock</span>
          <span className={"count" + (lowStock.length === 0 ? " zero" : " urgent")}>
            {lowStock.length}
          </span>
        </div>
        {lowStock.length === 0 ? (
          <div className="empty-mini">All products stocked above reorder level</div>
        ) : (
          lowStock.map(s => (
            <div className="action-item" key={s.sku}>
              <span className="badge urgent">{s.stock} left</span>
              <div className="body">
                <div className="title">{s.name}</div>
                <div className="meta">{s.category} · Reorder at {s.reorderLevel}</div>
              </div>
              <span style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.5 }}>{s.sku}</span>
            </div>
          ))
        )}
      </div>

      {/* Members in birthday week */}
      <div className="section-group">
        <div className="head">
          <span>Birthday-Week Members</span>
          <span className={"count" + (birthdayWeek.length === 0 ? " zero" : " wood")}>
            {birthdayWeek.length}
          </span>
        </div>
        {birthdayWeek.length === 0 ? (
          <div className="empty-mini">No members in birthday window</div>
        ) : (
          birthdayWeek.map(m => (
            <div className="action-item" key={m.memberNumber}>
              <span className="badge wood">{m.birthday}</span>
              <div className="body">
                <div className="title">
                  {m.name} <span className={"tier-pill " + m.tier} style={{ marginLeft: 6 }}>{m.tier}</span>
                </div>
                <div className="meta">
                  {m.memberNumber} · {m.alreadyUsed ? "Gift already redeemed this year" : "Eligible for birthday gift"}
                </div>
              </div>
              <span style={{
                fontFamily: "var(--mono)",
                fontSize: 9,
                letterSpacing: "0.14em",
                textTransform: "uppercase",
                opacity: m.alreadyUsed ? 0.4 : 0.8,
                color: m.alreadyUsed ? "var(--ink)" : "var(--green)"
              }}>
                {m.alreadyUsed ? "Redeemed" : "Available"}
              </span>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

/* ====================================================================
   TODAY'S PULSE PANEL
   ==================================================================== */
function TodaysPulsePanel({ data }) {
  const util = data.utilization || {};
  const cmp = data.comparison || {};

  // Delta vs yesterday
  const todayTotal = cmp.todayRevTotal || 0;
  const yest = cmp.yesterdayRevTotal || 0;
  const lastWk = cmp.lastWeekRev || 0;
  const deltaYest = yest > 0 ? ((todayTotal - yest) / yest) * 100 : null;
  const deltaWk = lastWk > 0 ? ((todayTotal - lastWk) / lastWk) * 100 : null;

  function deltaClass(d) {
    if (d == null) return "flat";
    if (d > 2) return "up";
    if (d < -2) return "down";
    return "flat";
  }
  function deltaLabel(d) {
    if (d == null) return "No data";
    const sign = d > 0 ? "+" : "";
    return sign + d.toFixed(0) + "%";
  }

  const utilCls = util.utilizationPct >= 70 ? "" : (util.utilizationPct >= 40 ? "warn" : "warn");
  const peakCls = util.peakUtilizationPct >= 80 ? "peak" : "";

  return (
    <div className="panel">
      <div className="panel-head">
        <h3>Today's Pulse</h3>
        <span className="count green">live</span>
      </div>

      <div className="pulse-metric">
        <div className="label">Courts in use right now</div>
        <div className="value">{util.courtsInUseNow || 0}<span className="unit">of {util.courtsTotal || 8}</span></div>
        <div className="util-bar">
          <div
            className="fill"
            style={{ transform: "scaleX(" + ((util.courtsInUseNow || 0) / (util.courtsTotal || 8)) + ")" }}
          />
        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Day utilization</div>
        <div className="value">{util.utilizationPct || 0}<span className="unit">%</span></div>
        <div className="util-bar">
          <div
            className={"fill " + utilCls}
            style={{ transform: "scaleX(" + ((util.utilizationPct || 0) / 100) + ")" }}
          />
        </div>
        <div className="delta flat">
          {util.bookedCourtHours || 0}h booked of {util.totalCourtHours || 0}h available
        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Peak utilization · {util.peakHoursToday || 5}h peak window</div>
        <div className="value">{util.peakUtilizationPct || 0}<span className="unit">%</span></div>
        <div className="util-bar">
          <div
            className={"fill " + peakCls}
            style={{ transform: "scaleX(" + ((util.peakUtilizationPct || 0) / 100) + ")" }}
          />
        </div>
      </div>

      <div className="pulse-metric">
        <div className="label">Today's total revenue</div>
        <div className="value">${todayTotal.toFixed(2)}</div>
        <div style={{
          fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.14em",
          textTransform: "uppercase", opacity: 0.5, marginTop: 4
        }}>
          court + walk-in + coaching + pos
        </div>
        <div className={"delta " + deltaClass(deltaYest)}>
          vs yesterday: {deltaLabel(deltaYest)} · ${yest.toFixed(2)}
        </div>
        <div className={"delta " + deltaClass(deltaWk)}>
          vs last {new Date().toLocaleDateString("en", { weekday: "long" })}: {deltaLabel(deltaWk)} · ${lastWk.toFixed(2)}
        </div>
      </div>
    </div>
  );
}

/* ====================================================================
   BOOKINGS TAB — list, filter by date+status, actions (paid/no-show/cancel),
   walk-in creation modal.
   ==================================================================== */

const STATUS_LABELS = {
  all: "All",
  awaiting: "Awaiting",
  at_risk: "At-risk",
  paid: "Paid",
  no_show_freed: "Released",
  no_show_kept: "No-show",
  completed: "Completed",
  cancelled: "Cancelled"
};

function ScreenBookings() {
  const [view, setView] = useState("day"); // day | week | month
  const [date, setDate] = useState(todayISO());
  const [statusFilter, setStatusFilter] = useState("all");
  const [entries, setEntries] = useState(null);
  const [loading, setLoading] = useState(true);
  const [detailBooking, setDetailBooking] = useState(null);
  const [walkInBlock, setWalkInBlock] = useState(null); // walk-in block modal
  const [coachingInfo, setCoachingInfo] = useState(null); // simple coaching info modal
  const [addBookingFlow, setAddBookingFlow] = useState(null); // null | "chooser" | "court" | "walkin"

  // Unified block-click handler routing to the right detail modal by entry type
  async function handleBlockClick(entry) {
    if (!entry) return;
    if (entry.entryType === "walkin") {
      // Fetch fresh block details (players may have changed)
      const r = await api("adminListWalkInBlocks", { dateFrom: entry.date, dateTo: entry.date });
      if (r.ok) {
        const fresh = (r.blocks || []).find(b => b.blockId === entry.bookingId || b.blockId === entry.blockId);
        if (fresh) setWalkInBlock(fresh);
        else showToast("Block not found", "error");
      } else {
        showToast(r.error || "Failed", "error");
      }
    } else if (entry.entryType === "coaching") {
      setCoachingInfo(entry);
    } else {
      setDetailBooking(entry);
    }
  }

  // Compute the date range we need to fetch based on view + selected date
  const range = useMemo(() => {
    const d = new Date(date + "T12:00:00");
    if (view === "day") {
      return { from: date, to: date };
    } else if (view === "week") {
      // 7 days starting from selected date
      const out = [date];
      for (let i = 1; i < 7; i++) {
        const x = new Date(d);
        x.setDate(x.getDate() + i);
        out.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"));
      }
      return { from: out[0], to: out[6], all: out };
    } else {
      // Month containing the selected date
      const y = d.getFullYear();
      const m = d.getMonth();
      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const fmt = (x) => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
      return { from: fmt(first), to: fmt(last) };
    }
  }, [view, date]);

  async function load(opts) {
    const silent = opts && opts.silent;
    // Synchronous cache hit: render stale data instantly so the tab/date switch feels instant
    if (!silent) {
      const cached = getCachedApi("adminListTimelineEntries", { dateFrom: range.from, dateTo: range.to });
      if (cached && cached.ok) {
        setEntries(cached.entries || []);
        setLoading(false);
      } else {
        setLoading(true);
      }
    }
    const r = await api(
      "adminListTimelineEntries",
      { dateFrom: range.from, dateTo: range.to },
      { bypassCache: !!silent }  // periodic polls bypass; initial/explicit reads use cache
    );
    if (r.ok) setEntries(r.entries || []);
    else if (!silent) showToast(r.error || "Failed to load", "error");
    if (!silent) setLoading(false);
  }

  useEffect(() => { load(); }, [range.from, range.to]);

  // Poll every 20s silently — no loading flicker
  useEffect(() => {
    const id = setInterval(() => load({ silent: true }), 20000);
    return () => clearInterval(id);
  }, [range.from, range.to]);

  // For Day view: get just today's bookings (not coaching, since coaching has its own tab)
  // Coaching sessions still show on the timeline visual, but the Booking ROW list is guest-only
  const dayBookings = useMemo(() => {
    if (!entries) return [];
    return entries
      .filter(e => e.date === date && e.entryType === "booking")
      .filter(b => statusFilter === "all" ? true : b.derivedStatus === statusFilter);
  }, [entries, date, statusFilter]);

  // Coaching entries on day (for showing in the list separately)
  const dayCoaching = useMemo(() => {
    if (!entries) return [];
    return entries.filter(e => e.date === date && e.entryType === "coaching");
  }, [entries, date]);

  // Walk-in entries on day (separate from guest bookings)
  const dayWalkIns = useMemo(() => {
    if (!entries) return [];
    return entries.filter(e => e.date === date && e.entryType === "walkin");
  }, [entries, date]);

  // Status counts (guest bookings only)
  const counts = useMemo(() => {
    const c = { all: 0, awaiting: 0, at_risk: 0, paid: 0, no_show_freed: 0, no_show_kept: 0, completed: 0, cancelled: 0 };
    if (!entries) return c;
    for (const b of entries) {
      if (b.entryType !== "booking") continue;
      if (b.date !== date) continue;
      c.all++;
      if (c[b.derivedStatus] !== undefined) c[b.derivedStatus]++;
    }
    return c;
  }, [entries, date]);

  // Date pills (Day view only)
  const datePills = useMemo(() => {
    const out = [];
    const today = new Date();
    for (let off = -1; off <= 2; off++) {
      const d = new Date(today);
      d.setDate(d.getDate() + off);
      const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const labels = { "-1": "Yesterday", "0": "Today", "1": "Tomorrow", "2": d.toLocaleDateString("en", { weekday: "short" }) };
      out.push({ iso: iso, label: labels[String(off)] || iso, day: d.getDate() });
    }
    return out;
  }, []);

  // Title for the head
  const title = useMemo(() => {
    if (view === "day") return fmtDateLong(date);
    if (view === "week") {
      const start = new Date(range.from + "T12:00:00");
      const end = new Date(range.to + "T12:00:00");
      const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return start.getDate() + " " + MO[start.getMonth()] + " – " + end.getDate() + " " + MO[end.getMonth()] + " " + end.getFullYear();
    }
    const d = new Date(date + "T12:00:00");
    const MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return MO[d.getMonth()] + " " + d.getFullYear();
  }, [view, date, range]);

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">{title}</div>
          <h1>Bookings</h1>
        </div>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <div className="range-toggle">
            <button className={view === "day" ? "on" : ""} onClick={() => setView("day")}>Day</button>
            <button className={view === "week" ? "on" : ""} onClick={() => setView("week")}>Week</button>
            <button className={view === "month" ? "on" : ""} onClick={() => setView("month")}>Month</button>
          </div>
          <button className="btn primary" onClick={() => setAddBookingFlow("chooser")}>+ Add booking</button>
        </div>
      </div>

      {/* Date strip — visible on Day view, simpler nav on Week/Month */}
      {view === "day" && (
        <div className="bookings-toolbar">
          <div className="date-strip">
            {datePills.map(p => (
              <button
                key={p.iso}
                className={"date-pill" + (date === p.iso ? " on" : "")}
                onClick={() => setDate(p.iso)}
              >
                {p.label}<span className="num">{p.day}</span>
              </button>
            ))}
            <button className="date-pill">
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
            </button>
          </div>
        </div>
      )}

      {(view === "week" || view === "month") && (
        <div className="bookings-toolbar">
          <button className="date-pill" onClick={() => {
            const d = new Date(date + "T12:00:00");
            d.setDate(d.getDate() - (view === "week" ? 7 : 30));
            setDate(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
          }}>← Prev</button>
          <button className="date-pill" onClick={() => setDate(todayISO())}>Today</button>
          <button className="date-pill" onClick={() => {
            const d = new Date(date + "T12:00:00");
            d.setDate(d.getDate() + (view === "week" ? 7 : 30));
            setDate(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
          }}>Next →</button>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
            style={{ padding: "8px 12px", border: "1.5px solid var(--ink)", borderRadius: 999, fontFamily: "var(--mono)", fontSize: 12 }} />
        </div>
      )}

      {/* DAY VIEW */}
      {view === "day" && (
        <>
          <div className="filter-chips">
            {Object.keys(STATUS_LABELS).map(s => (
              <button
                key={s}
                className={"filter-chip" + (statusFilter === s ? " on" : "")}
                onClick={() => setStatusFilter(s)}
              >
                {STATUS_LABELS[s]} · {counts[s] || 0}
              </button>
            ))}
          </div>

          {entries === null ? (
            <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
              <BouncingBall size="md" />
            </div>
          ) : (
            <>
              {/* Coaching sessions for the day (separate from guest bookings) */}
              {dayCoaching.length > 0 && (
                <div style={{ marginBottom: 18 }}>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, color: "var(--wood)", marginBottom: 8 }}>
                    ★ Coaching sessions · {dayCoaching.length}
                  </div>
                  {dayCoaching.map(s => (
                    <div
                      key={s.bookingId}
                      className="booking-row"
                      style={{ borderLeft: "5px solid var(--wood)", background: "rgba(168,116,74,0.04)", cursor: "pointer" }}
                      onClick={() => handleBlockClick(s)}
                    >
                      <div className="when">{s.time}<span className="endtime">→ {s.timeEnd}</span></div>
                      <div className="who">
                        <div className="name">
                          ★ {s.coachName}
                          {s.studentName && <span style={{ fontWeight: 400, opacity: 0.7, fontSize: 13 }}>· with {s.studentName}</span>}
                        </div>
                        <div className="meta">C·{s.courtNumbers} · {s.durationHours}h · {s.sessionType}</div>
                        <div className="id">{s.bookingId}</div>
                      </div>
                      <div className="actions">
                        <div className="total" style={{ color: "var(--wood)" }}>${(s.facilityEarns || 0).toFixed(2)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Walk-in / Drop-in open play sessions */}
              {dayWalkIns.length > 0 && (
                <div style={{ marginBottom: 18 }}>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 700, color: "var(--peach,#D9785C)", marginBottom: 8 }}>
                    ◉ Open play · drop-in · {dayWalkIns.length}
                  </div>
                  {dayWalkIns.map(w => {
                    const full = w.playerCount >= w.playerCap;
                    return (
                      <div
                        key={w.bookingId}
                        className="booking-row"
                        style={{ borderLeft: "5px solid var(--peach,#D9785C)", background: "rgba(217,120,92,0.05)", cursor: "pointer" }}
                        onClick={async () => {
                          // Fetch latest block detail before opening
                          const r = await api("adminListWalkInBlocks", { dateFrom: w.date, dateTo: w.date });
                          if (r.ok) {
                            const fresh = (r.blocks || []).find(b => b.blockId === w.bookingId);
                            if (fresh) setWalkInBlock(fresh);
                          }
                        }}
                      >
                        <div className="when">{w.time}<span className="endtime">→ {w.timeEnd}</span></div>
                        <div className="who">
                          <div className="name">
                            ◉ Open Play · Court {w.courtNumbers}
                            <span style={{
                              marginLeft: 8, fontFamily: "var(--mono)", fontSize: 9,
                              letterSpacing: "0.16em", textTransform: "uppercase",
                              background: full ? "var(--clay)" : "var(--peach,#D9785C)", color: "var(--cream)",
                              padding: "2px 7px", borderRadius: 3
                            }}>
                              {w.playerCount}/{w.playerCap} {full ? "· FULL" : "players"}
                            </span>
                            {w.status === "Closed" && <span className="status-pill cancelled" style={{ marginLeft: 6 }}>Closed</span>}
                          </div>
                          <div className="meta">{w.durationHours}h · ${w.rate}/player · {w.status}</div>
                          <div className="id">{w.bookingId}</div>
                        </div>
                        <div className="actions">
                          <div className="total" style={{ color: "var(--peach,#D9785C)" }}>${(w.total || 0).toFixed(2)}</div>
                          <button className="btn-sm primary" onClick={(e) => { e.stopPropagation(); }}>Manage players</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Guest bookings */}
              {dayBookings.length === 0 ? (
                <div className="empty">
                  {statusFilter === "all" ? "No guest bookings for this date" : "No " + STATUS_LABELS[statusFilter].toLowerCase() + " bookings"}
                </div>
              ) : (
                <div className="booking-list">
                  {dayBookings.map(b => (
                    <BookingRow key={b.bookingId} booking={b} onAction={load} onOpen={() => setDetailBooking(b)} />
                  ))}
                </div>
              )}
            </>
          )}
        </>
      )}

      {/* WEEK VIEW */}
      {view === "week" && (
        entries === null ? (
          <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
            <BouncingBall size="md" />
          </div>
        ) : (
          <WeekView entries={entries} days={range.all || []} onDayClick={(iso) => { setView("day"); setDate(iso); }} onBlockClick={handleBlockClick} />
        )
      )}

      {/* MONTH VIEW */}
      {view === "month" && (
        entries === null ? (
          <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
            <BouncingBall size="md" />
          </div>
        ) : (
          <MonthView entries={entries} centerDate={date} onDayClick={(iso) => { setView("day"); setDate(iso); }} />
        )
      )}

      {detailBooking && (
        <BookingDetailModal
          booking={detailBooking}
          onClose={() => setDetailBooking(null)}
          onAction={() => { load(); setDetailBooking(null); }}
        />
      )}

      {walkInBlock && (
        <WalkInBlockModal
          block={walkInBlock}
          onClose={() => setWalkInBlock(null)}
          onChanged={() => load()}
        />
      )}

      {coachingInfo && (
        <CoachingInfoModal
          session={coachingInfo}
          onClose={() => setCoachingInfo(null)}
        />
      )}

      {addBookingFlow === "chooser" && (
        <AddBookingChooserModal
          onClose={() => setAddBookingFlow(null)}
          onPick={(kind) => setAddBookingFlow(kind)}
        />
      )}

      {addBookingFlow === "court" && (
        <BookingModal
          dateDefault={date}
          onClose={() => setAddBookingFlow(null)}
          onCreated={() => { load(); setAddBookingFlow(null); }}
        />
      )}

      {addBookingFlow === "walkin" && (
        <NewWalkInBlockModal
          dateDefault={date}
          onClose={() => setAddBookingFlow(null)}
          onCreated={(blockId) => {
            load();
            setAddBookingFlow(null);
            // Auto-open the new block to start adding players
            setTimeout(() => {
              api("adminListWalkInBlocks", { dateFrom: date, dateTo: date }).then(r => {
                if (r.ok) {
                  const fresh = (r.blocks || []).find(b => b.blockId === blockId);
                  if (fresh) setWalkInBlock(fresh);
                }
              });
            }, 100);
          }}
        />
      )}
    </div>
  );
}

/* Week view: 7 days stacked, each a mini timeline */
function WeekView({ entries, days, onDayClick, onBlockClick }) {
  // Compute per-day breakdown
  const dayStats = useMemo(() => {
    const map = {};
    for (const iso of days) {
      const dayEntries = entries.filter(e => e.date === iso);
      const guestEntries = dayEntries.filter(e => e.entryType === "booking" && e.derivedStatus !== "cancelled");
      const coachEntries = dayEntries.filter(e => e.entryType === "coaching");
      const walkinEntries = dayEntries.filter(e => e.entryType === "walkin");
      const courtRev = guestEntries.reduce((s, e) => s + (e.total || 0), 0);
      const coachingRev = coachEntries.reduce((s, e) => s + (e.facilityEarns || 0), 0);
      const walkinRev = walkinEntries.reduce((s, e) => s + (e.total || 0), 0);
      map[iso] = {
        guestCount: guestEntries.length,
        coachCount: coachEntries.length,
        walkinCount: walkinEntries.length,
        courtRev: courtRev,
        coachingRev: coachingRev,
        walkinRev: walkinRev,
        totalRev: courtRev + coachingRev + walkinRev
      };
    }
    return map;
  }, [entries, days]);

  return (
    <div className="week-grid">
      {days.map(iso => {
        const d = new Date(iso + "T12:00:00");
        const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const isToday = iso === todayISO();
        const stats = dayStats[iso] || { guestCount: 0, coachCount: 0, walkinCount: 0, totalRev: 0, courtRev: 0, coachingRev: 0, walkinRev: 0 };

        const counts = [];
        if (stats.guestCount > 0) counts.push(stats.guestCount + " booking" + (stats.guestCount === 1 ? "" : "s"));
        if (stats.coachCount > 0) counts.push(stats.coachCount + " ★");
        if (stats.walkinCount > 0) counts.push(stats.walkinCount + " ◉");
        const countText = counts.length > 0 ? counts.join(" · ") : "No activity";

        return (
          <div className="week-day" key={iso}>
            <div
              className={"week-day-head" + (isToday ? " is-today" : "")}
              onClick={() => onDayClick(iso)}
              style={{ cursor: "pointer" }}
              title="Click to open this day's full view"
            >
              <div className="label">
                {DOW[d.getDay()]} <span className="num">{d.getDate()}</span>
              </div>
              <div className="stats">
                <span>{countText}</span>
                {stats.totalRev > 0 && (
                  <span style={{ marginLeft: 10 }}>
                    {stats.courtRev > 0 && <span>${stats.courtRev.toFixed(0)} court</span>}
                    {stats.coachingRev > 0 && <span style={{ marginLeft: 6, color: "var(--wood-2,#C9A24A)" }}>★ ${stats.coachingRev.toFixed(0)}</span>}
                    {stats.walkinRev > 0 && <span style={{ marginLeft: 6, color: "var(--peach,#D9785C)" }}>◉ ${stats.walkinRev.toFixed(0)}</span>}
                  </span>
                )}
              </div>
            </div>
            <Timeline bookings={entries.filter(e => e.date === iso)} dateStr={iso} onBlockClick={onBlockClick} />
          </div>
        );
      })}
    </div>
  );
}

/* Month view: calendar with daily counts */
function MonthView({ entries, centerDate, onDayClick }) {
  const d = new Date(centerDate + "T12:00:00");
  const y = d.getFullYear();
  const m = d.getMonth();
  const firstOfMonth = new Date(y, m, 1);
  const lastOfMonth = new Date(y, m + 1, 0);
  const daysInMonth = lastOfMonth.getDate();
  const startDow = firstOfMonth.getDay();

  const [hoverIso, setHoverIso] = useState(null);
  const [hoverPos, setHoverPos] = useState({ x: 0, y: 0 });

  // Track which month we've already animated — change month → re-animate;
  // same month silent refresh → don't re-animate.
  const [animatedFor, setAnimatedFor] = useState(null);
  const monthKey = y + "-" + m;
  const shouldAnimate = animatedFor !== monthKey;
  useEffect(() => {
    if (shouldAnimate) {
      const t = setTimeout(() => setAnimatedFor(monthKey), 700); // after animation completes
      return () => clearTimeout(t);
    }
  }, [monthKey, shouldAnimate]);

  // Build cells: leading empties + days + trailing empties
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let day = 1; day <= daysInMonth; day++) cells.push(day);
  while (cells.length % 7 !== 0) cells.push(null);

  // Map of date -> stats + entries list
  const byDate = useMemo(() => {
    const map = {};
    for (const e of entries) {
      if (!map[e.date]) map[e.date] = { bookings: 0, coaching: 0, walkin: 0, revenue: 0, slots: 0, entries: [] };
      if (e.entryType === "booking" && e.derivedStatus !== "cancelled") {
        map[e.date].bookings++;
        map[e.date].revenue += (e.total || 0);
        const courtCount = String(e.courtNumbers || "").split(",").filter(Boolean).length;
        map[e.date].slots += (e.slots || 0) * courtCount;
        map[e.date].entries.push(e);
      } else if (e.entryType === "coaching") {
        map[e.date].coaching++;
        map[e.date].revenue += (e.facilityEarns || 0);
        const courtCount = String(e.courtNumbers || "").split(",").filter(Boolean).length;
        map[e.date].slots += (e.slots || 0) * courtCount;
        map[e.date].entries.push(e);
      } else if (e.entryType === "walkin") {
        map[e.date].walkin++;
        map[e.date].revenue += (e.total || 0);
        const courtCount = String(e.courtNumbers || "").split(",").filter(Boolean).length;
        map[e.date].slots += (e.slots || 0) * courtCount;
        map[e.date].entries.push(e);
      }
    }
    return map;
  }, [entries]);

  // 32 slots × 8 courts = 256 court-slot capacity per full operating day
  const DAILY_CAPACITY = 32 * 8;

  // Max revenue in month for relative saturation scaling
  const maxRev = useMemo(() => {
    let max = 0;
    for (const iso in byDate) {
      if (byDate[iso].revenue > max) max = byDate[iso].revenue;
    }
    return max || 1;
  }, [byDate]);

  const DOW_FULL = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const DOW_SHORT = ["S","M","T","W","T","F","S"];
  const today = todayISO();

  function handleMouseEnter(iso, e) {
    setHoverIso(iso);
    const rect = e.currentTarget.getBoundingClientRect();
    setHoverPos({ x: rect.left + rect.width / 2, y: rect.bottom + 6 });
  }

  const hoverStats = hoverIso && byDate[hoverIso];

  return (
    <div className="month-wrap">
      <div className="month-grid-v2">
        {DOW_FULL.map((d, i) => (
          <div key={d + i} className="month-dow-head-v2">
            <span className="full">{d}</span>
            <span className="short">{DOW_SHORT[i]}</span>
          </div>
        ))}
        {cells.map((day, i) => {
          if (day === null) return <div key={"empty-" + i} className="month-cell-v2 empty" />;
          const iso = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
          const stats = byDate[iso] || { bookings: 0, coaching: 0, revenue: 0, slots: 0, entries: [] };
          const dt = new Date(y, m, day);
          const isWknd = dt.getDay() === 0 || dt.getDay() === 6;
          const isTodayCell = iso === today;
          const isPast = iso < today;
          const utilPct = Math.min(100, Math.round((stats.slots / DAILY_CAPACITY) * 100));
          const totalEvents = stats.bookings + stats.coaching;

          // Saturation: 0..1 scaling based on revenue
          const sat = Math.min(1, stats.revenue / maxRev);
          // Background tint: more saturated = stronger green tint
          // Use green at ~0.1 alpha for low to 0.32 for high
          const bgAlpha = totalEvents === 0 ? 0 : (0.07 + sat * 0.25);

          return (
            <div
              key={iso}
              className={
                "month-cell-v2"
                + (shouldAnimate ? " do-anim" : " no-anim")
                + (isTodayCell ? " today" : "")
                + (isWknd ? " weekend" : "")
                + (isPast ? " past" : "")
                + (totalEvents === 0 ? " empty-day" : "")
              }
              style={{
                background: totalEvents > 0
                  ? `linear-gradient(135deg, rgba(61,122,79,${bgAlpha}) 0%, rgba(168,116,74,${bgAlpha * 0.5}) 100%)`
                  : undefined,
                animationDelay: shouldAnimate ? (i * 8) + "ms" : "0ms"
              }}
              onClick={() => onDayClick(iso)}
              onMouseEnter={(e) => handleMouseEnter(iso, e)}
              onMouseLeave={() => setHoverIso(null)}
            >
              <div className="day-num-v2">{day}</div>

              {totalEvents > 0 && (
                <div className="day-body">
                  <div className="day-count">
                    <span className="big">{totalEvents}</span>
                    <span className="lbl">{totalEvents === 1 ? "EVENT" : "EVENTS"}</span>
                  </div>
                  <div className="day-rev">${stats.revenue.toFixed(0)}</div>
                </div>
              )}

              {totalEvents > 0 && (
                <div className="day-foot">
                  {stats.coaching > 0 && (
                    <span className="dot-coach" title={stats.coaching + " coaching"}>★ {stats.coaching}</span>
                  )}
                  {stats.walkin > 0 && (
                    <span className="dot-walkin" title={stats.walkin + " walk-in"} style={{ color: "var(--peach,#D9785C)" }}>◉ {stats.walkin}</span>
                  )}
                  <div className="util-mini-v2">
                    <div className="fill" style={{ width: utilPct + "%" }} />
                  </div>
                  <span className="util-label">{utilPct}%</span>
                </div>
              )}

              {isTodayCell && <div className="today-flag">TODAY</div>}
            </div>
          );
        })}
      </div>

      {/* Hover preview popover */}
      {hoverStats && hoverStats.entries.length > 0 && (
        <div
          className="month-hover-popover"
          style={{
            left: hoverPos.x + "px",
            top: hoverPos.y + "px"
          }}
        >
          <div className="head">
            <div className="title">{fmtDateLong(hoverIso)}</div>
            <div className="meta">
              {hoverStats.bookings > 0 && <span>{hoverStats.bookings} guest</span>}
              {hoverStats.coaching > 0 && <span> · {hoverStats.coaching} ★</span>}
              {hoverStats.walkin > 0 && <span> · {hoverStats.walkin} ◉</span>}
              <span> · ${hoverStats.revenue.toFixed(0)} revenue</span>
            </div>
          </div>
          <div className="list">
            {hoverStats.entries.slice(0, 6).map((e, idx) => {
              const icon = e.entryType === "coaching" ? "★ " : e.entryType === "walkin" ? "◉ " : "";
              const rowClass = "row" + (e.entryType === "coaching" ? " is-coach" : e.entryType === "walkin" ? " is-walkin" : "");
              return (
                <div key={idx} className={rowClass}>
                  <span className="t">{e.time}</span>
                  <span className="n">{icon}{e.name}</span>
                  <span className="c">C·{e.courtNumbers}</span>
                </div>
              );
            })}
            {hoverStats.entries.length > 6 && (
              <div className="more">+ {hoverStats.entries.length - 6} more · click to view</div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function BookingModal({ dateDefault, onClose, onCreated }) {
  const [form, setForm] = useState({
    phone: "",
    name: "",
    date: dateDefault || todayISO(),
    time: "18:00",
    slots: 2,
    courts: [],
    email: ""
  });
  const [availSlots, setAvailSlots] = useState([]);
  const [submitting, setSubmitting] = useState(false);
  const [pricePreview, setPricePreview] = useState(null);
  const [config, setConfig] = useState(null);
  const [memberInfo, setMemberInfo] = useState(null);

  // Load pricing config once when modal opens
  useEffect(() => {
    getCachedConfig().then(c => setConfig(c));
  }, []);

  // Load availability for selected date
  useEffect(() => {
    api("getAvailability", { date: form.date }).then(r => {
      if (r.ok) setAvailSlots(r.slots || []);
    });
  }, [form.date]);

  // Member lookup — debounced so we don't hammer the API on every keystroke
  useEffect(() => {
    if (!form.phone || form.phone.length < 6) {
      setMemberInfo(null);
      return;
    }
    const id = setTimeout(() => {
      api("lookupMember", { phone: form.phone }).then(r => {
        if (r.ok && r.member) setMemberInfo(r.member);
        else setMemberInfo(null);
      });
    }, 350);
    return () => clearTimeout(id);
  }, [form.phone]);

  // Determine which courts are available for the chosen time + duration
  const courtAvailability = useMemo(() => {
    if (!availSlots.length) return { available: [], unavailable: [1,2,3,4,5,6,7,8] };
    const startIdx = availSlots.findIndex(s => s.time === form.time);
    if (startIdx < 0) return { available: [], unavailable: [1,2,3,4,5,6,7,8] };
    const courtsAvail = new Set([1, 2, 3, 4, 5, 6, 7, 8]);
    for (let i = 0; i < form.slots; i++) {
      const s = availSlots[startIdx + i];
      if (!s) return { available: [], unavailable: [1,2,3,4,5,6,7,8] };
      const courtsBoolArr = s.courts || [];
      for (let cIdx = 0; cIdx < 8; cIdx++) {
        const courtNum = cIdx + 1;
        if (!courtsBoolArr[cIdx]) courtsAvail.delete(courtNum);
      }
    }
    const available = Array.from(courtsAvail).sort();
    const unavailable = [1,2,3,4,5,6,7,8].filter(c => !courtsAvail.has(c));
    return { available, unavailable };
  }, [availSlots, form.time, form.slots]);

  // Auto-select first available court when:
  //   - availability data loads
  //   - the user changes date/time/duration causing court reshuffle
  // If the currently-selected courts are no longer available, swap them out
  useEffect(() => {
    if (!courtAvailability.available.length) return;
    const validCurrentlySelected = form.courts.filter(c => courtAvailability.available.includes(c));
    if (validCurrentlySelected.length === form.courts.length && form.courts.length > 0) {
      return;  // current selection is fine
    }
    // Either no selection or some/all selected courts are now unavailable
    if (validCurrentlySelected.length === 0) {
      setForm(f => ({ ...f, courts: [courtAvailability.available[0]] }));
    } else {
      setForm(f => ({ ...f, courts: validCurrentlySelected }));
    }
  }, [courtAvailability.available.join(",")]);

  // CLIENT-SIDE price preview — fast, instant, no network call
  useEffect(() => {
    if (!config) {
      setPricePreview(null);
      return;
    }
    const isMember = !!memberInfo;
    const tier = memberInfo ? memberInfo.tier : "";
    const result = calculatePriceClient({
      config: config,
      isMember: isMember,
      tier: tier,
      date: form.date,
      time: form.time,
      slots: form.slots,
      courts: form.courts.length || 1
    });
    setPricePreview(result);
  }, [config, memberInfo, form.date, form.time, form.slots, form.courts.length]);

  function toggleCourt(c) {
    if (courtAvailability.unavailable.includes(c)) return;
    setForm(f => {
      const set = new Set(f.courts);
      if (set.has(c)) set.delete(c);
      else set.add(c);
      const arr = Array.from(set).sort();
      return { ...f, courts: arr.length ? arr : [c] };
    });
  }

  async function submit() {
    if (!form.phone) return showToast("Phone required", "error");
    if (!form.name) return showToast("Name required", "error");
    if (form.courts.length === 0) return showToast("Pick at least one court", "error");

    setSubmitting(true);
    const r = await api("adminCreateBooking", {
      phone: form.phone,
      name: form.name,
      email: form.email,
      date: form.date,
      time: form.time,
      slots: form.slots,
      courts: form.courts.length,
      source: "Staff"
    });
    setSubmitting(false);
    if (r.ok) {
      showToast("Booking created", "success");
      onCreated && onCreated();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  // Time options: 06:00 to 21:30 in 30-min steps
  const timeOptions = useMemo(() => {
    const out = [];
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      for (const m of [0, 30]) {
        const t = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        const slot = availSlots.find(s => s.time === t);
        const isFree = slot ? (slot.availableCount > 0) : false;
        out.push({ value: t, label: t + (isFree ? "" : "  (full)"), disabled: !isFree });
      }
    }
    return out;
  }, [availSlots]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">New court reservation</div>
            <h2>Add Booking</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field">
          <div className="field-label">Phone</div>
          <input
            type="tel"
            inputMode="numeric"
            value={form.phone}
            placeholder="e.g. 12345678"
            onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/[^0-9]/g, "") })}
          />
        </div>

        <div className="field">
          <div className="field-label">Customer name</div>
          <input
            type="text"
            value={form.name}
            placeholder="First & last name"
            onChange={(e) => setForm({ ...form, name: e.target.value })}
          />
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Date</div>
            <input
              type="date"
              value={form.date}
              onChange={(e) => setForm({ ...form, date: e.target.value, courts: [1] })}
            />
          </div>
          <div className="field">
            <div className="field-label">Start time</div>
