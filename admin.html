        {/* Actions */}
        <div className="actions" style={{ borderTop: "1px solid rgba(26,26,26,0.1)", paddingTop: 14, marginTop: 14 }}>
          {isOpen ? (
            <>
              <button className="btn" onClick={cancelTab} disabled={working} style={{ color: "var(--clay)", marginRight: "auto" }}>
                Cancel tab
              </button>
              <button className="btn" onClick={onClose}>Close (keep open)</button>
              <button className="btn primary" onClick={() => setShowClose(true)} disabled={working || data.runningTotal === 0}>
                Close & Settle ${data.runningTotal.toFixed(2)}
              </button>
            </>
          ) : (
            <>
              {tab.saleId && (
                <span style={{ marginRight: "auto", fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55 }}>
                  Sale: {tab.saleId}
                </span>
              )}
              <button className="btn primary" onClick={onClose}>Close</button>
            </>
          )}
        </div>

        {showAddItem && (
          <AddItemToTabModal
            tabId={tabId}
            products={products}
            onClose={() => setShowAddItem(false)}
            onAdded={() => { setShowAddItem(false); load(); }}
          />
        )}

        {showAttachBooking && (
          <AttachBookingToTabModal
            tabId={tabId}
            customerPhone={tab.customerPhone}
            onClose={() => setShowAttachBooking(false)}
            onAttached={() => { setShowAttachBooking(false); load(); }}
          />
        )}

        {showClose && (
          <CloseTabModal
            tabId={tabId}
            total={data.runningTotal}
            itemTotal={data.itemTotal}
            eligibleItemTotal={data.eligibleItemTotal}
            bookingTotal={data.bookingTotal}
            playerTotal={data.playerTotal}
            customerPhone={tab.customerPhone}
            onClose={() => setShowClose(false)}
            onClosed={() => { setShowClose(false); onClose(); }}
          />
        )}
      </div>
    </div>
  );
}

function AddItemToTabModal({ tabId, products, onClose, onAdded }) {
  const [sku, setSku] = useState("");
  const [quantity, setQuantity] = useState(1);
  const [search, setSearch] = useState("");
  const [working, setWorking] = useState(false);

  const filtered = useMemo(() => {
    if (!products) return [];
    const q = search.toLowerCase();
    return products.filter(p =>
      p.active && (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q))
    );
  }, [products, search]);

  async function submit() {
    if (!sku) { showToast("Pick a product", "error"); return; }
    setWorking(true);
    const r = await api("tabAddItem", {
      tabId: tabId,
      sku: sku,
      quantity: quantity
    });
    setWorking(false);
    if (r.ok) onAdded();
    else showToast(r.error || "Failed", "error");
  }

  return (
    <div className="modal-overlay" onClick={onClose} style={{ zIndex: 200 }}>
      <div className="modal" style={{ maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">Add to {tabId}</div>
            <h2>Add Item</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <input
          type="text"
          placeholder="Search products…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          autoFocus
          style={{ width: "100%", padding: "8px 10px", marginBottom: 12, fontFamily: "var(--mono)", fontSize: 12, border: "1.5px solid var(--ink)", borderRadius: 3 }}
        />

        <div style={{ maxHeight: 280, overflowY: "auto", marginBottom: 14, border: "1px solid rgba(26,26,26,0.1)", borderRadius: 3 }}>
          {filtered.length === 0 ? (
            <div className="empty-mini" style={{ padding: 18 }}>No products match</div>
          ) : filtered.map(p => (
            <div key={p.sku}
              onClick={() => setSku(p.sku)}
              style={{
                padding: "10px 12px",
                cursor: "pointer",
                borderBottom: "1px solid rgba(26,26,26,0.06)",
                background: sku === p.sku ? "rgba(61,122,79,0.1)" : "transparent",
                display: "grid",
                gridTemplateColumns: "1fr auto",
                gap: 10
              }}
            >
              <div>
                <div style={{ fontWeight: 700 }}>{p.name}</div>
                <div style={{ fontFamily: "var(--mono)", fontSize: 9, opacity: 0.5, marginTop: 2 }}>
                  {p.sku} · stock: {p.stock}
                </div>
              </div>
              <div style={{ fontFamily: "var(--mono)", fontWeight: 700 }}>${p.price.toFixed(2)}</div>
            </div>
          ))}
        </div>

        {sku && (
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <label style={{ fontFamily: "var(--mono)", fontSize: 11 }}>Quantity:</label>
            <button className="btn-sm" onClick={() => setQuantity(Math.max(1, quantity - 1))}>−</button>
            <span style={{ fontFamily: "var(--mono)", fontSize: 16, fontWeight: 700, minWidth: 30, textAlign: "center" }}>{quantity}</span>
            <button className="btn-sm" onClick={() => setQuantity(quantity + 1)}>+</button>
          </div>
        )}

        <div className="actions">
          <button className="btn ghost" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={submit} disabled={working || !sku}>
            {working ? "Adding…" : "Add to tab"}
          </button>
        </div>
      </div>
    </div>
  );
}

function AttachBookingToTabModal({ tabId, customerPhone, onClose, onAttached }) {
  const [entries, setEntries] = useState(null);
  const [working, setWorking] = useState(false);

  useEffect(() => {
    api("adminListSettleableEntries").then(r => {
      if (!r.ok) {
        setEntries([]);
        return;
      }
      // Backend returns flat entries with entryType "booking" or "walkin_player".
      // Each is its own attachable item; no flattening needed.
      const flat = [];
      (r.entries || []).forEach(e => {
        if (e.entryType === "booking") {
          flat.push({
            kind: "booking",
            id: e.id,
            label: e.label,
            phone: String(e.customerPhone || e.phone || ""),
            name: String(e.customerName || e.name || ""),
            amount: e.total || e.amount || 0,
            sub: e.derivedStatus ? e.derivedStatus.replace(/_/g, " ").toUpperCase() : ""
          });
        } else if (e.entryType === "walkin_player") {
          flat.push({
            kind: "walkin_player",
            id: e.id,
            label: e.label + (e.name ? " · " + e.name : ""),
            phone: String(e.customerPhone || e.phone || ""),
            name: String(e.customerName || e.name || ""),
            amount: e.total || e.amount || 0,
            sub: "WALK-IN"
          });
        } else if (e.entryType === "walkin_block") {
          // Legacy support — flatten if backend ever returns the old shape
          (e.unpaidPlayers || []).forEach(p => {
            flat.push({
              kind: "walkin_player",
              id: p.playerId,
              label: e.label + " · " + (p.name || "Walk-in"),
              phone: String(p.phone || ""),
              name: String(p.name || ""),
              amount: p.amount || 0,
              sub: "WALK-IN"
            });
          });
        }
      });
      setEntries(flat);
    });
  }, []);

  async function attach(entry) {
    setWorking(true);
    let r;
    if (entry.kind === "booking") {
      r = await api("tabAttachBooking", { tabId: tabId, bookingId: entry.id });
    } else if (entry.kind === "walkin_player") {
      r = await api("tabAttachWalkInPlayer", { tabId: tabId, playerId: entry.id });
    } else {
      r = { ok: false, error: "Unknown entry type" };
    }
    setWorking(false);
    if (r.ok) onAttached();
    else showToast(r.error || "Failed", "error");
  }

  // Sort entries: customer's phone matches first, then by kind (bookings first), then by amount
  const sorted = useMemo(() => {
    if (!entries) return [];
    const cp = (customerPhone || "").trim();
    function normalize(p) {
      return String(p || "").replace(/[\s\-\(\)\+]/g, "");
    }
    const cpNorm = normalize(cp);
    return [...entries].sort((a, b) => {
      const ap = cpNorm && normalize(a.phone) === cpNorm;
      const bp = cpNorm && normalize(b.phone) === cpNorm;
      if (ap && !bp) return -1;
      if (!ap && bp) return 1;
      if (a.kind !== b.kind) return a.kind === "booking" ? -1 : 1;
      return b.amount - a.amount;
    });
  }, [entries, customerPhone]);

  return (
    <div className="modal-overlay" onClick={onClose} style={{ zIndex: 200 }}>
      <div className="modal" style={{ maxWidth: 620 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">Pick an unpaid booking or walk-in</div>
            <h2>Attach to Tab</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        {entries === null ? (
          <div style={{ padding: 30, display: "flex", justifyContent: "center" }}><BouncingBall size="sm" /></div>
        ) : sorted.length === 0 ? (
          <div className="empty">No unpaid bookings or walk-ins available to attach</div>
        ) : (
          <div style={{ maxHeight: 420, overflowY: "auto" }}>
            {sorted.map(e => {
              function normalize(p) {
                return String(p || "").replace(/[\s\-\(\)\+]/g, "");
              }
              const matchPhone = customerPhone && normalize(e.phone) === normalize(customerPhone);
              const kindColor = e.kind === "walkin_player" ? "var(--peach,#D9785C)" : "var(--green)";
              const kindLabel = e.kind === "walkin_player" ? "◉ WALK-IN" : "COURT";
              return (
                <div key={e.kind + "-" + e.id}
                  style={{
                    padding: "10px 12px",
                    border: matchPhone ? "1.5px solid var(--green)" : "1px solid rgba(26,26,26,0.08)",
                    borderRadius: 3,
                    marginBottom: 6,
                    display: "grid",
                    gridTemplateColumns: "auto 1fr auto auto",
                    gap: 10,
                    alignItems: "center",
                    background: matchPhone ? "rgba(61,122,79,0.06)" : "var(--paper)"
                  }}
                >
                  <div style={{
                    fontFamily: "var(--mono)", fontSize: 8, fontWeight: 700,
                    letterSpacing: "0.14em", padding: "3px 6px",
                    color: kindColor, border: "1px solid " + kindColor,
                    borderRadius: 3
                  }}>
                    {kindLabel}
                  </div>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 13 }}>
                      {e.label}
                      {matchPhone && <span style={{ marginLeft: 6, fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.12em", color: "var(--green)" }}>SAME PHONE</span>}
                    </div>
                    <div style={{ fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55, marginTop: 3 }}>
                      {e.phone || (e.name ? e.name : "—")}
                    </div>
                  </div>
                  <div style={{ fontFamily: "var(--mono)", fontWeight: 700 }}>${e.amount.toFixed(2)}</div>
                  <button className="btn-sm primary" onClick={() => attach(e)} disabled={working}>Attach</button>
                </div>
              );
            })}
          </div>
        )}

        <div className="actions">
          <button className="btn ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

function CloseTabModal({ tabId, total, itemTotal, eligibleItemTotal, bookingTotal, playerTotal, customerPhone, onClose, onClosed }) {
  const [paymentMethod, setPaymentMethod] = useState("Cash");
  const [cashReceived, setCashReceived] = useState("");
  const [discountPct, setDiscountPct] = useState(0);
  const [notes, setNotes] = useState("");
  const [working, setWorking] = useState(false);
  const [memberTier, setMemberTier] = useState("");
  const [memberDiscountPct, setMemberDiscountPct] = useState(10);

  // Look up member tier when modal opens (for discount preview)
  useEffect(() => {
    if (!customerPhone) return;
    api("adminGetMemberByPhone", { phone: customerPhone }).then(r => {
      if (r.ok && r.member && r.member.status === "active" && !r.member.isExpired) {
        setMemberTier(r.member.tier || "");
      }
    });
  }, [customerPhone]);

  // Fetch current member discount percentage (could be owner-overridden)
  useEffect(() => {
    api("adminGetPosSettings").then(r => {
      if (r.ok && typeof r.memberDiscountPct === "number") {
        setMemberDiscountPct(r.memberDiscountPct);
      }
    });
  }, []);

  // Member discount applies to ELIGIBLE products only (drinks excluded by default).
  // Court & walk-in totals already have their bigger member discount baked in.
  const eligibleBase = eligibleItemTotal !== undefined ? eligibleItemTotal : (itemTotal || 0);
  const memberDiscountAmount = memberTier && eligibleBase > 0
    ? Math.round(eligibleBase * memberDiscountPct) / 100
    : 0;
  const afterMember = total - memberDiscountAmount;
  const staffDiscountAmount = discountPct > 0 ? Math.round(afterMember * discountPct) / 100 : 0;
  const totalDiscount = memberDiscountAmount + staffDiscountAmount;
  const finalTotal = Math.round((total - totalDiscount) * 100) / 100;
  const cashGiven = parseFloat(cashReceived) || 0;
  const change = Math.max(0, cashGiven - finalTotal);

  async function submit() {
    if (paymentMethod === "Cash" && cashGiven < finalTotal) {
      showToast("Cash received less than total", "error");
      return;
    }
    setWorking(true);
    const r = await api("tabClose", {
      tabId: tabId,
      paymentMethod: paymentMethod,
      cashReceived: cashGiven,
      discountPct: discountPct,
      notes: notes
    });
    setWorking(false);
    if (r.ok) {
      showToast("Tab settled · $" + r.total.toFixed(2) + (r.changeGiven > 0 ? " · Change: $" + r.changeGiven.toFixed(2) : ""), "success");
      onClosed();
    } else {
      showToast(r.error || "Failed to settle", "error");
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose} style={{ zIndex: 300 }}>
      <div className="modal" style={{ maxWidth: 460 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">
              {tabId} · final settlement
              {memberTier && <span style={{ marginLeft: 8, color: "var(--green)" }}>· {memberTier.toUpperCase()} MEMBER</span>}
            </div>
            <h2>Close Tab</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div style={{ marginBottom: 12 }}>
          <label className="field-label">Payment method</label>
          <select className="field-input" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>
            <option value="Cash">Cash</option>
            <option value="ABA">ABA</option>
            <option value="Wing">Wing</option>
            <option value="Card">Card</option>
          </select>
        </div>

        <div style={{ marginBottom: 12 }}>
          <label className="field-label">Additional staff discount %</label>
          <input className="field-input" type="number" min="0" max="100" value={discountPct} onChange={(e) => setDiscountPct(parseFloat(e.target.value) || 0)} placeholder="0 (member discount applied automatically)" />
          {memberTier && (
            <div style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.1em", opacity: 0.6, marginTop: 4 }}>
              MEMBER {memberDiscountPct}% APPLIED AUTOMATICALLY ON ELIGIBLE ITEMS (NOT DRINKS) — ENTER STAFF OVERRIDE HERE IF DESIRED
            </div>
          )}
        </div>

        {paymentMethod === "Cash" && (
          <div style={{ marginBottom: 12 }}>
            <label className="field-label">Cash received</label>
            <input className="field-input" type="number" min="0" step="0.01" value={cashReceived} onChange={(e) => setCashReceived(e.target.value)} autoFocus />
          </div>
        )}

        <div style={{ marginBottom: 12 }}>
          <label className="field-label">Notes</label>
          <input className="field-input" type="text" value={notes} onChange={(e) => setNotes(e.target.value)} />
        </div>

        <div style={{ background: "var(--ink)", color: "var(--cream)", padding: 14, borderRadius: 3, marginBottom: 14 }}>
          {(itemTotal > 0 || bookingTotal > 0 || playerTotal > 0) && (
            <>
              {itemTotal > 0 && (
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 11, opacity: 0.7 }}>
                  <span style={{ fontFamily: "var(--mono)" }}>Pro shop items</span>
                  <span style={{ fontFamily: "var(--mono)" }}>${itemTotal.toFixed(2)}</span>
                </div>
              )}
              {bookingTotal > 0 && (
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 11, opacity: 0.7 }}>
                  <span style={{ fontFamily: "var(--mono)" }}>Court rentals (member-priced)</span>
                  <span style={{ fontFamily: "var(--mono)" }}>${bookingTotal.toFixed(2)}</span>
                </div>
              )}
              {playerTotal > 0 && (
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 11, opacity: 0.7 }}>
                  <span style={{ fontFamily: "var(--mono)" }}>Walk-in players</span>
                  <span style={{ fontFamily: "var(--mono)" }}>${playerTotal.toFixed(2)}</span>
                </div>
              )}
              <div style={{ borderTop: "1px solid rgba(241,234,214,0.15)", margin: "6px 0" }} />
            </>
          )}
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
            <span style={{ fontFamily: "var(--mono)", fontSize: 11, opacity: 0.7 }}>Subtotal</span>
            <span style={{ fontFamily: "var(--mono)" }}>${total.toFixed(2)}</span>
          </div>
          {memberDiscountAmount > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4, color: "var(--green)" }}>
              <span style={{ fontFamily: "var(--mono)", fontSize: 11 }}>{memberTier} {memberDiscountPct}% (eligible items)</span>
              <span style={{ fontFamily: "var(--mono)" }}>−${memberDiscountAmount.toFixed(2)}</span>
            </div>
          )}
          {staffDiscountAmount > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4, color: "var(--peach,#D9785C)" }}>
              <span style={{ fontFamily: "var(--mono)", fontSize: 11 }}>Staff discount {discountPct}%</span>
              <span style={{ fontFamily: "var(--mono)" }}>−${staffDiscountAmount.toFixed(2)}</span>
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: "1px solid rgba(241,234,214,0.2)" }}>
            <span style={{ fontFamily: "var(--mono)", fontSize: 12, fontWeight: 700 }}>TOTAL</span>
            <span style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 22, fontWeight: 700 }}>${finalTotal.toFixed(2)}</span>
          </div>
          {paymentMethod === "Cash" && cashGiven > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, opacity: 0.8 }}>
              <span style={{ fontFamily: "var(--mono)", fontSize: 11 }}>Change</span>
              <span style={{ fontFamily: "var(--mono)" }}>${change.toFixed(2)}</span>
            </div>
          )}
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={submit} disabled={working || finalTotal <= 0}>
            {working ? "Settling…" : "Confirm Payment"}
          </button>
        </div>
      </div>
    </div>
  );
}


function SaleHistoryModal({ onClose }) {
  const [range, setRange] = useState("2w");   // "1w" | "2w" | "1m" | "3m" | "all"
  const [paymentFilter, setPaymentFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [sales, setSales] = useState(null);
  const [total, setTotal] = useState(0);
  const [selected, setSelected] = useState(null);  // sale being viewed in detail
  const [working, setWorking] = useState(false);

  function rangeDates(r) {
    const now = new Date();
    const to = new Date(now);
    const from = new Date(now);
    if (r === "1w") from.setDate(from.getDate() - 7);
    else if (r === "2w") from.setDate(from.getDate() - 14);
    else if (r === "1m") from.setMonth(from.getMonth() - 1);
    else if (r === "3m") from.setMonth(from.getMonth() - 3);
    else from.setFullYear(2000, 0, 1);  // "all"
    const fmt = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    return { from: fmt(from), to: fmt(to) };
  }

  async function load() {
    const { from, to } = rangeDates(range);
    const r = await api("posListSales", {
      dateFrom: from,
      dateTo: to,
      includeVoided: "true"  // show voided too with a label
    });
    if (r.ok) {
      setSales(r.sales || []);
      setTotal(r.total || 0);
    }
  }

  useEffect(() => { load(); }, [range]);

  const filtered = useMemo(() => {
    if (!sales) return [];
    let out = sales;
    if (paymentFilter !== "all") out = out.filter(s => s.paymentMethod === paymentFilter);
    if (search) {
      const q = search.toLowerCase();
      out = out.filter(s =>
        s.saleId.toLowerCase().includes(q) ||
        (s.customerName || "").toLowerCase().includes(q) ||
        (s.customerPhone || "").includes(q)
      );
    }
    return out;
  }, [sales, paymentFilter, search]);

  const aggregate = useMemo(() => {
    return {
      count: filtered.length,
      revenue: filtered.reduce((s, x) => s + (x.voided ? 0 : x.total), 0),
      voided: filtered.filter(x => x.voided).length
    };
  }, [filtered]);

  async function voidSale(saleId) {
    if (!confirm("Void sale " + saleId + "?\n\nThis reverses the sale and restocks the items. Cannot be undone.")) return;
    setWorking(true);
    const r = await api("posVoidSale", { saleId: saleId });
    setWorking(false);
    if (r.ok) {
      showToast("Sale voided", "success");
      setSelected(null);
      load();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const RANGES = [
    { id: "1w",  label: "1 week" },
    { id: "2w",  label: "2 weeks" },
    { id: "1m",  label: "1 month" },
    { id: "3m",  label: "3 months" },
    { id: "all", label: "All time" }
  ];
  const PAYMENT_METHODS = ["all", "Cash", "ABA", "Wing", "Card"];

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 920, maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">Past receipts · voids · audit</div>
            <h2>Sale History</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        {/* Filters */}
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
          <div className="filter-chips" style={{ margin: 0 }}>
            {RANGES.map(r => (
              <button
                key={r.id}
                className={"filter-chip" + (range === r.id ? " on" : "")}
                onClick={() => setRange(r.id)}
              >{r.label}</button>
            ))}
          </div>
          <select value={paymentFilter} onChange={(e) => setPaymentFilter(e.target.value)}
            style={{ padding: "8px 10px", fontFamily: "var(--mono)", fontSize: 11, border: "1.5px solid var(--ink)", borderRadius: 3, background: "var(--paper)" }}>
            {PAYMENT_METHODS.map(p => <option key={p} value={p}>{p === "all" ? "All payments" : p}</option>)}
          </select>
          <input
            type="text"
            placeholder="Search sale ID / customer / phone..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            style={{ flex: 1, minWidth: 200, padding: "8px 10px", fontFamily: "var(--mono)", fontSize: 11, border: "1.5px solid var(--ink)", borderRadius: 3, background: "var(--paper)" }}
          />
        </div>

        {/* Headline stats */}
        <div className="stat-grid" style={{ gridTemplateColumns: "1fr 1fr 1fr", marginBottom: 14 }}>
          <div className="stat-card accent-green">
            <div className="label">Revenue</div>
            <div className="value">${aggregate.revenue.toFixed(2)}</div>
            <div className="sub">in selected range</div>
          </div>
          <div className="stat-card">
            <div className="label">Sales</div>
            <div className="value">{aggregate.count}</div>
            <div className="sub">{aggregate.voided > 0 ? aggregate.voided + " voided" : "0 voided"}</div>
          </div>
          <div className="stat-card">
            <div className="label">Avg ticket</div>
            <div className="value">${aggregate.count > 0 ? (aggregate.revenue / Math.max(1, aggregate.count - aggregate.voided)).toFixed(2) : "0.00"}</div>
          </div>
        </div>

        {/* Sales list */}
        {sales === null ? (
          <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
        ) : filtered.length === 0 ? (
          <div className="empty">No sales in this range</div>
        ) : (
          <div style={{ maxHeight: 430, overflowY: "auto", border: "1px solid rgba(26,26,26,0.08)", borderRadius: 3 }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead>
                <tr style={{ background: "var(--ink)", color: "var(--cream)", position: "sticky", top: 0 }}>
                  <th style={{ padding: "8px 10px", textAlign: "left", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase" }}>Sale ID</th>
                  <th style={{ padding: "8px 10px", textAlign: "left", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase" }}>When</th>
                  <th style={{ padding: "8px 10px", textAlign: "left", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase" }}>Customer</th>
                  <th style={{ padding: "8px 10px", textAlign: "left", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase" }}>Items</th>
                  <th style={{ padding: "8px 10px", textAlign: "left", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase" }}>Method</th>
                  <th style={{ padding: "8px 10px", textAlign: "right", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase" }}>Total</th>
                </tr>

              <tbody>
                {filtered.map(s => (
                  <tr key={s.saleId}
                    style={{
                      borderBottom: "1px solid rgba(26,26,26,0.08)",
                      cursor: "pointer",

                      textDecoration: s.voided ? "line-through" : "none"
                    }}
                    onClick={() => setSelected(s)}
                    onMouseEnter={(e) => e.currentTarget.style.background = "rgba(61,122,79,0.04)"}
                    onMouseLeave={(e) => e.currentTarget.style.background = ""}
                  >
                    <td style={{ padding: "8px 10px", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.06em" }}>{s.saleId}</td>
                    <td style={{ padding: "8px 10px", fontFamily: "var(--mono)", fontSize: 10 }}>{s.createdAt}</td>
                    <td style={{ padding: "8px 10px" }}>
                      {s.customerName || "—"}
                      {s.memberTier && <span className={"tier-pill " + s.memberTier} style={{ marginLeft: 6, fontSize: 9 }}>{s.memberTier}</span>}
                    </td>
                    <td style={{ padding: "8px 10px", fontFamily: "var(--mono)", fontSize: 10, opacity: 0.7 }}>
                      {s.items.length} {s.items.length === 1 ? "item" : "items"}
                    </td>
                    <td style={{ padding: "8px 10px", fontFamily: "var(--mono)", fontSize: 10 }}>{s.paymentMethod}</td>
                    <td style={{ padding: "8px 10px", textAlign: "right", fontFamily: "var(--mono)", fontWeight: 700 }}>
                      ${s.total.toFixed(2)}
                      {s.voided && <span style={{ marginLeft: 6, color: "var(--clay)", fontSize: 9, letterSpacing: "0.14em" }}>VOID</span>}

function ProductModal({ product, onClose, onSaved }) {
  const isNew = !product;
  const [form, setForm] = useState(() => {
    const initialCategory = product ? product.category : "Drinks";
    const initialEligible = product
      ? (product.memberEligible !== false)
      : (initialCategory.toLowerCase() !== "drinks");
    return {
      sku: product ? product.sku : "",
      name: product ? product.name : "",
      category: initialCategory,
      price: product ? product.price : 0,
      cost: product ? product.cost : 0,
      stock: product ? product.stock : 0,
      reorderLevel: product ? product.reorderLevel : 0,
      active: product ? product.active : true,
      notes: product ? product.notes : "",
      memberEligible: initialEligible
    };
  });

  const [saving, setSaving] = useState(false);

  // Smart-default: when category changes (NEW products only, before saving),
  // suggest the right eligibility default. Don't override if user already toggled.
  const [categoryTouched, setCategoryTouched] = useState(false);
  function changeCategory(newCat) {
    setForm(prev => {
      const next = { ...prev, category: newCat };
      // Auto-suggest eligibility if user hasn't manually changed it for THIS product
      if (!categoryTouched) {
        next.memberEligible = newCat.toLowerCase() !== "drinks";
      }
      return next;
    });
  }

  async function save() {
    if (!form.sku) return showToast("SKU required", "error");
    if (!form.name) return showToast("Name required", "error");
    setSaving(true);
    const action = isNew ? "posCreateProduct" : "posUpdateProduct";
    const params = { ...form };
    if (!isNew) params.sku = product.sku;
    const r = await api(action, params);
    setSaving(false);
    if (r.ok) {
      showToast(isNew ? "Product added" : "Saved", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{isNew ? "New product" : product.sku}</div>
            <h2>{isNew ? "Add Product" : product.name}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">SKU</div>
            <input type="text" value={form.sku} disabled={!isNew}
              onChange={(e) => setForm({ ...form, sku: e.target.value.toUpperCase() })} />
          </div>
          <div className="field">
            <div className="field-label">Category</div>
            <select value={form.category} onChange={(e) => changeCategory(e.target.value)}>
              <option value="Drinks">Drinks</option>
              <option value="Paddles">Paddles</option>
              <option value="Accessories">Accessories</option>
              <option value="Apparel">Apparel</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Name</div>
          <input type="text" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        </div>

        <div className="field-row three">
          <div className="field">
            <div className="field-label">Price · $</div>
            <input type="number" min="0" step="0.1" value={form.price}
              onChange={(e) => setForm({ ...form, price: parseFloat(e.target.value) || 0 })} />
          </div>
          <div className="field">
            <div className="field-label">Cost · $ (optional)</div>
            <input type="number" min="0" step="0.1" value={form.cost}
              onChange={(e) => setForm({ ...form, cost: parseFloat(e.target.value) || 0 })} />
          </div>
          <div className="field">
            <div className="field-label">Reorder at</div>
            <input type="number" min="0" value={form.reorderLevel}
              onChange={(e) => setForm({ ...form, reorderLevel: parseInt(e.target.value) || 0 })} />
          </div>
        </div>

        {isNew && (
          <div className="field">
            <div className="field-label">Opening stock</div>
            <input type="number" min="0" value={form.stock}
              onChange={(e) => setForm({ ...form, stock: parseInt(e.target.value) || 0 })} />
          </div>
        )}

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} />
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0" }}>
          <input
            type="checkbox"
            id="active-cb"
            checked={form.active}
            onChange={(e) => setForm({ ...form, active: e.target.checked })}
          />
          <label htmlFor="active-cb" style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 600 }}>
            Active · show in POS grid
          </label>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "0 0 10px 0" }}>
          <input
            type="checkbox"
            id="member-elig-cb"
            checked={form.memberEligible}
            onChange={(e) => { setCategoryTouched(true); setForm({ ...form, memberEligible: e.target.checked }); }}
          />
          <label htmlFor="member-elig-cb" style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 600 }}>
            Eligible for member discount
          </label>
          <span style={{ fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.1em", opacity: 0.55 }}>
            (drinks typically not eligible)
          </span>
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={saving}>Cancel</button>
          <button className="btn primary" onClick={save} disabled={saving}>
            {saving ? "Saving…" : isNew ? "Add product" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

function StockManagementModal({ products, onClose, onChanged }) {
  const [adjustments, setAdjustments] = useState({});  // sku -> delta string

  async function applyAll() {
    const deltas = Object.entries(adjustments).filter(([sku, d]) => parseInt(d) !== 0 && d !== "");
    if (deltas.length === 0) {
      showToast("No changes", "error");
      return;
    }
    let success = 0;
    for (const [sku, delta] of deltas) {
      const r = await api("posAdjustStock", { sku: sku, delta: parseInt(delta) });
      if (r.ok) success++;
    }
    showToast(`Adjusted ${success} product${success === 1 ? "" : "s"}`, "success");
    setAdjustments({});
    onChanged && onChanged();
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 600 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">Stock adjustments</div>
            <h2>Manage Stock</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.12em", opacity: 0.6, marginBottom: 12 }}>
          Enter a positive number to add stock (restocking), or negative for shrinkage/damage.
          Leave blank to skip.
        </div>

        <div style={{ maxHeight: 400, overflowY: "auto" }}>
          {(products || []).map(p => (
            <div key={p.sku} style={{
              display: "grid", gridTemplateColumns: "1fr auto auto", gap: 10, alignItems: "center",
              padding: "10px 0", borderBottom: "1px solid rgba(26,26,26,0.08)"
            }}>
              <div>
                <div style={{ fontFamily: "var(--sans)", fontWeight: 600, fontSize: 13 }}>{p.name}</div>
                <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.1em", opacity: 0.55 }}>
                  {p.sku} · {p.category}
                </div>
              </div>
              <div style={{ fontFamily: "var(--mono)", fontSize: 13, fontWeight: 700, minWidth: 60, textAlign: "right" }}>
                {p.stock} {p.reorderLevel > 0 && p.stock <= p.reorderLevel && <span style={{ color: "var(--clay)" }}> ⚠</span>}
              </div>
              <input
                type="number"
                placeholder="+/−"
                style={{ width: 80, padding: "6px 8px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)", textAlign: "center" }}
                value={adjustments[p.sku] || ""}
                onChange={(e) => setAdjustments(prev => ({ ...prev, [p.sku]: e.target.value }))}
              />
            </div>
          ))}
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose}>Close</button>
          <button className="btn primary" onClick={applyAll}>Apply all</button>
        </div>
      </div>
    </div>
  );
}

function ScreenCustomers() {
  const [customers, setCustomers] = useState(null);
  const [search, setSearch] = useState("");
  const [typeFilter, setTypeFilter] = useState("all");
  const [historyCustomer, setHistoryCustomer] = useState(null);

  async function load() {
    const r = await api("adminListCustomers", { search: search, type: typeFilter === "all" ? "" : typeFilter });
    if (r.ok) setCustomers(r.customers || []);
  }
  useEffect(() => {
    const id = setTimeout(load, 200);  // debounce search
    return () => clearTimeout(id);
  }, [search, typeFilter]);

  const counts = useMemo(() => {
    if (!customers) return { all: 0, member: 0, guest: 0, walkin: 0, student: 0 };
    return {
      all: customers.length,
      member: customers.filter(c => c.sources.indexOf("member") >= 0).length,
      guest: customers.filter(c => c.sources.indexOf("guest") >= 0).length,
      walkin: customers.filter(c => c.sources.indexOf("walkin") >= 0).length,
      student: customers.filter(c => c.sources.indexOf("student") >= 0).length
    };
  }, [customers]);

  const FILTERS = [
    { id: "all", label: "All" },
    { id: "member", label: "Members" },
    { id: "guest", label: "Court guests" },
    { id: "walkin", label: "Walk-in players" },
    { id: "student", label: "Coaching students" }
  ];

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">All customers · members · guests · walk-ins · students</div>
          <h1>Customers</h1>
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 16 }}>
        <input
          type="text"
          className="search-input"
          placeholder="Search name, phone, member number…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        <div className="filter-chips" style={{ margin: 0 }}>
          {FILTERS.map(f => (
            <button
              key={f.id}
              className={"filter-chip" + (typeFilter === f.id ? " on" : "")}
              onClick={() => setTypeFilter(f.id)}
            >
              {f.label} · {counts[f.id] || 0}
            </button>
          ))}
        </div>
      </div>

      {customers === null ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
      ) : customers.length === 0 ? (
        <div className="empty">No customers match</div>
      ) : (
        <div className="customer-list">
          {customers.map(c => {
            const totalActivity = (c.totalBookings || 0) + (c.totalWalkInVisits || 0) + (c.totalCoachingSessions || 0);
            return (
              <div
                key={c.identityKey || c.phone}
                className={"customer-row" + (c.sources.indexOf("member") >= 0 ? " is-member" : "")}
                onClick={() => setHistoryCustomer(c)}
              >
                <div>
                  <div className="cust-name">
                    {c.name || (c.noPhone ? "(anonymous walk-in)" : "Unknown")}
                    {c.sources.indexOf("member") >= 0 && <span className={"tier-pill " + c.tier} style={{ marginLeft: 8 }}>{c.tier}</span>}
                    {c.sources.indexOf("walkin") >= 0 && (
                      <span style={{ marginLeft: 6, fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.16em", textTransform: "uppercase", color: "var(--cream)", background: "var(--peach,#D9785C)", padding: "2px 6px", borderRadius: 3 }}>◉ Walk-in</span>
                    )}
                    {c.sources.indexOf("student") >= 0 && (
                      <span style={{ marginLeft: 6, fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.16em", textTransform: "uppercase", color: "var(--cream)", background: "var(--wood)", padding: "2px 6px", borderRadius: 3 }}>★ Student</span>
                    )}
                    {c.sources.indexOf("guest") >= 0 && c.sources.indexOf("member") < 0 && (

/* ====================================================================
   FINANCES — Month overview with revenue breakdown, charts, top customers
   ==================================================================== */

function ScreenFinances() {
  const now = new Date();
  const [granularity, setGranularity] = useState("monthly");  // "daily" | "weekly" | "monthly"
  const [periodOffset, setPeriodOffset] = useState(0);  // 0 = current, -1 = previous, etc

  // For monthly: also track explicit year/month so we have full month name
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);

  const [data, setData] = useState(null);  // full monthly report when granularity === monthly
  const [rangeData, setRangeData] = useState(null);  // daily/weekly report
  const [loading, setLoading] = useState(true);

  async function load() {
    setLoading(true);
    if (granularity === "monthly") {
      // Use the full monthly endpoint (top customers, products, splits, outstanding)
      // Map offset back to year/month for the call
      const ref = new Date();
      ref.setMonth(ref.getMonth() + periodOffset);
      const y = ref.getFullYear();
      const m = ref.getMonth() + 1;
      setYear(y); setMonth(m);
      const r = await api("adminFinancesMonth", { year: y, month: m });
      if (r.ok) { setData(r); setRangeData(null); }
    } else {
      // Use the leaner range endpoint
      const r = await api("adminFinancesRange", { granularity: granularity, periodOffset: periodOffset });
      if (r.ok) { setRangeData(r); setData(null); }
    }
    setLoading(false);
  }
  useEffect(() => { load(); }, [granularity, periodOffset]);

  function changeGranularity(g) {
    setPeriodOffset(0);  // reset to current period when switching granularity
    setGranularity(g);
  }

  function prevPeriod() { setPeriodOffset(periodOffset - 1); }
  function nextPeriod() {
    if (periodOffset >= 0) return;  // can't go to future
    setPeriodOffset(periodOffset + 1);
  }
  function currentPeriod() { setPeriodOffset(0); }

  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const isCurrent = periodOffset === 0;

  // Compute display label for the period
  let periodLabel;
  if (granularity === "monthly") {
    periodLabel = MONTH_NAMES[month - 1] + " " + year;
  } else if (rangeData) {
    periodLabel = rangeData.label;
  } else {
    periodLabel = "—";
  }

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">Revenue · receivables · trends</div>
          <h1>Finances</h1>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {/* Granularity toggle */}
          <div style={{ display: "flex", border: "1.5px solid var(--ink)", borderRadius: 999, overflow: "hidden", marginRight: 8 }}>
            {["daily", "weekly", "monthly"].map(g => (
              <button
                key={g}
                onClick={() => changeGranularity(g)}
                style={{
                  padding: "8px 14px",
                  background: granularity === g ? "var(--ink)" : "transparent",
                  color: granularity === g ? "var(--cream)" : "var(--ink)",
                  border: "none",
                  fontFamily: "var(--mono)",
                  fontSize: 10,
                  letterSpacing: "0.18em",
                  textTransform: "uppercase",
                  fontWeight: 700,
                  cursor: "pointer"
                }}
              >
                {g.charAt(0).toUpperCase() + g.slice(1)}
              </button>
            ))}
          </div>
          <button className="date-pill" onClick={prevPeriod}>← Prev</button>
          <div style={{
            fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 20, fontWeight: 400,
            padding: "0 14px", minWidth: 160, textAlign: "center"
          }}>
            {periodLabel}
            {isCurrent && (
              <span style={{
                marginLeft: 10, fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.18em",
                textTransform: "uppercase", color: "var(--green)", verticalAlign: "middle"
              }}>· CURRENT</span>
            )}
          </div>
          <button className="date-pill" onClick={nextPeriod} disabled={isCurrent}
            style={{ opacity: isCurrent ? 0.4 : 1, cursor: isCurrent ? "not-allowed" : "pointer" }}>
            Next →
          </button>
          {!isCurrent && <button className="date-pill" onClick={currentPeriod}>This {granularity === "daily" ? "Day" : granularity === "weekly" ? "Week" : "Month"}</button>}
        </div>
      </div>

      {loading && !data && !rangeData ? (
        <div style={{ padding: 60, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
      ) : data ? (
        <FinancesView data={data} onChanged={load} />
      ) : rangeData ? (
        <FinancesRangeView data={rangeData} granularity={granularity} />
      ) : (
        <div className="empty">Failed to load</div>
      )}
    </div>
  );
}

          <div className="label">◉ Walk-in</div>
          <div className="value" style={{ color: "var(--peach,#D9785C)" }}>${h.walkinRev.toFixed(0)}</div>
          <div className="sub">{pct(h.walkinRev)}% · {data.summary.paidWalkInPlayers} players</div>
        </div>
        <div className="stat-card" style={{ borderColor: "var(--wood)" }}>
          <div className="label">★ Coaching</div>
          <div className="value" style={{ color: "var(--wood)" }}>${h.coachingRev.toFixed(0)}</div>
          <div className="sub">{pct(h.coachingRev)}% · {data.summary.paidCoachingSessions} sessions</div>
        </div>
        <div className="stat-card">
          <div className="label">POS</div>
          <div className="value">${h.posRev.toFixed(0)}</div>
          <div className="sub">{pct(h.posRev)}% · {data.summary.posTransactions} txns</div>
        </div>
        <div className="stat-card" style={{ borderColor: "var(--clay)" }}>
          <div className="label">⬛ Sponsorships</div>
          <div className="value" style={{ color: "var(--clay)" }}>${(h.sponsorshipRev || 0).toFixed(0)}</div>
          <div className="sub">
            {pct(h.sponsorshipRev || 0)}%
            {(h.sponsorshipMonthly || h.sponsorshipOneOff) ? " · " + (h.sponsorshipMonthly ? "MRR $" + h.sponsorshipMonthly.toFixed(0) : "") + (h.sponsorshipMonthly && h.sponsorshipOneOff ? " + " : "") + (h.sponsorshipOneOff ? "one-off $" + h.sponsorshipOneOff.toFixed(0) : "") : ""}
          </div>
        </div>
      </div>

      {/* Mini chart — bars per bucket */}
      {series.length > 0 && (
        <div className="settings-card" style={{ padding: 20 }}>
          <h3 style={{ marginBottom: 14 }}>
            {granularity === "daily" ? "Hourly will surface in a future release" : granularity === "weekly" ? "Daily breakdown" : "Daily breakdown"}
          </h3>
          {granularity === "daily" ? (
            // Daily granularity = one day, so just show the breakdown numerically
            <div style={{ fontFamily: "var(--mono)", fontSize: 12, opacity: 0.75 }}>
              {series[0]?.total > 0
                ? <div>For {data.label}: court ${series[0].court.toFixed(2)} · walk-in ${series[0].walkin.toFixed(2)} · coaching ${series[0].coaching.toFixed(2)} · POS ${series[0].pos.toFixed(2)}</div>
                : <div>No revenue recorded for {data.label}.</div>}

/* Simple bar chart for daily revenue, drawn with divs (no chart lib).
   Each bar shows total revenue for that day, with a tooltip on hover. */
function DailyRevenueChart({ daily }) {
  const max = useMemo(() => Math.max(1, ...daily.map(d => d.total)), [daily]);
  const todayISOStr = todayISO();

  return (
    <div className="finance-chart">
      <div className="bars">
        {daily.map(d => {
          const h = max > 0 ? (d.total / max) * 100 : 0;
          const day = parseInt(d.date.substring(8, 10));
          const isToday = d.date === todayISOStr;
          const isWknd = (() => {
            const dow = new Date(d.date + "T12:00:00").getDay();
            return dow === 0 || dow === 6;
          })();
          return (
            <div key={d.date} className={"bar-col" + (isToday ? " today" : "") + (isWknd ? " weekend" : "")}
              title={d.date + " · $" + d.total.toFixed(2) + " ($" + d.court.toFixed(0) + " court · $" + d.walkin.toFixed(0) + " walk-in · $" + d.coaching.toFixed(0) + " coaching · $" + d.pos.toFixed(0) + " POS)"}>
              <div className="stack" style={{ height: h + "%" }}>
                {d.court > 0 && <div className="seg seg-court" style={{ flex: d.court }} />}
                {d.coaching > 0 && <div className="seg seg-coach" style={{ flex: d.coaching }} />}
                {d.walkin > 0 && <div className="seg seg-walk" style={{ flex: d.walkin }} />}
                {d.pos > 0 && <div className="seg seg-pos" style={{ flex: d.pos }} />}
              </div>
              <div className="day-label">{day}</div>
            </div>
          );
        })}
      </div>
      <div className="finance-chart-legend">
        <span className="leg-item"><i className="leg-swatch seg-court" /> Court</span>
        <span className="leg-item"><i className="leg-swatch seg-coach" /> Coaching</span>
        <span className="leg-item"><i className="leg-swatch seg-walk" /> Walk-in</span>
        <span className="leg-item"><i className="leg-swatch seg-pos" /> POS</span>
      </div>
    </div>
  );
}

function OutstandingPanel({ outstanding, headline, onChanged }) {
  const [showAllPending, setShowAllPending] = useState(false);
  const [showAllOverdue, setShowAllOverdue] = useState(false);
  const [working, setWorking] = useState(false);

  const pending = outstanding && outstanding.pending ? outstanding.pending : [];
  const overdue = outstanding && outstanding.overdue ? outstanding.overdue : [];

  async function markBookingPaid(item) {
    if (!confirm("Mark this booking as paid?\n\n" + item.name + " · $" + item.amount.toFixed(2))) return;
    setWorking(true);
    const r = await api("adminMarkPaid", { bookingId: item.id });
    setWorking(false);
    if (r.ok) {
      showToast("Marked paid", "success");
      onChanged && onChanged();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function markWalkInPaid(item) {
    if (!confirm("Mark this walk-in player as paid?\n\n" + item.name + " · $" + item.amount.toFixed(2))) return;
    setWorking(true);
    const r = await api("adminMarkWalkInPlayerPaid", { playerId: item.id, paymentMethod: "Cash" });
    setWorking(false);
    if (r.ok) {
      showToast("Marked paid", "success");
      onChanged && onChanged();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function markCoachingPaid(item) {
    if (!confirm("Mark this coaching session as paid?\n\nCoach " + item.coachName + " · $" + item.amount.toFixed(2))) return;
    setWorking(true);
    const r = await api("adminMarkCoachingSessionsPaid", {
      sessionIds: JSON.stringify([item.id]),
      paymentMethod: "Cash"
    });
    setWorking(false);
    if (r.ok) {
      showToast("Marked paid", "success");
      onChanged && onChanged();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  function markPaid(item) {
    if (item.entryType === "booking") return markBookingPaid(item);
    if (item.entryType === "walkin") return markWalkInPaid(item);
    if (item.entryType === "coaching") return markCoachingPaid(item);
  }

  function renderRow(item, isOverdue) {
    const icon = item.entryType === "coaching" ? "★" : item.entryType === "walkin" ? "◉" : "⬛";
    const ageLabel = item.ageHours < 0
      ? "in " + Math.abs(Math.round(item.ageHours)) + "h"
      : item.ageHours < 24
      ? Math.round(item.ageHours) + "h ago"
      : Math.round(item.ageHours / 24) + "d ago";
    return (
      <div key={item.entryType + "-" + item.id} className="modal-detail-row" style={{ padding: "10px 0" }}>
        <span className="k">
          <span style={{ marginRight: 6, opacity: 0.7 }}>{icon}</span>
          <strong>{item.name || "(no name)"}</strong>
          {item.courtNumbers && <span style={{ marginLeft: 6, fontFamily: "var(--mono)", fontSize: 10, opacity: 0.6 }}>C·{item.courtNumbers}</span>}
          <span style={{ marginLeft: 8, fontFamily: "var(--mono)", fontSize: 10, opacity: 0.55 }}>{item.date} · {item.time}</span>
          <span style={{
            marginLeft: 8, fontFamily: "var(--mono)", fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase",
            color: isOverdue ? "var(--clay)" : "var(--ink)", opacity: isOverdue ? 1 : 0.5, fontWeight: 700
          }}>{ageLabel}</span>
        </span>
        <span className="v" style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <span style={{ color: isOverdue ? "var(--clay)" : "var(--ink)" }}>${item.amount.toFixed(2)}</span>
          <button className="btn-sm primary" onClick={() => markPaid(item)} disabled={working}>Mark paid</button>
        </span>
      </div>
    );
  }

  return (
    <>
      {/* Outstanding stat cards — concise */}
      <div className="stat-grid" style={{ gridTemplateColumns: "1fr 1fr 1fr 1fr", marginBottom: 22 }}>
        <div className="stat-card" style={{ borderColor: headline.overdueTotal > 0 ? "var(--clay)" : "var(--ink)" }}>
          <div className="label">Overdue · &gt;24h</div>
          <div className="value" style={{ color: headline.overdueTotal > 0 ? "var(--clay)" : "var(--ink)" }}>${headline.overdueTotal.toFixed(2)}</div>
          <div className="sub">{headline.overdueCount} item{headline.overdueCount === 1 ? "" : "s"} · needs chasing</div>
        </div>
        <div className="stat-card">
          <div className="label">Pending · today</div>
          <div className="value">${headline.pendingTotal.toFixed(2)}</div>
          <div className="sub">{headline.pendingCount} item{headline.pendingCount === 1 ? "" : "s"} · settles at counter</div>
        </div>
        <div className="stat-card" style={{ borderColor: "var(--wood)" }}>
          <div className="label">★ Coaching share owed</div>
          <div className="value" style={{ color: "var(--wood)" }}>${headline.overdueCoaching.toFixed(2)}</div>
          <div className="sub">facility share unpaid by coaches</div>
        </div>
        <div className="stat-card">
          <div className="label">Court + Walk-in overdue</div>
          <div className="value">${(headline.overdueBookings + headline.overdueWalkin).toFixed(2)}</div>
          <div className="sub">customers who left without paying</div>
        </div>
      </div>

      {/* Inline lists, collapsed by default */}
      {overdue.length > 0 && (
        <>
          <div className="section-label">
            <span>
              <span className="num" style={{ color: "var(--clay)" }}>!</span>
              <span className="name" style={{ color: "var(--clay)" }}>Overdue Items · needs chasing</span>
            </span>
            <span className="right">{overdue.length}</span>
          </div>
          <div style={{ background: "rgba(198,79,58,0.04)", borderLeft: "3px solid var(--clay)", padding: "4px 14px", marginBottom: 18 }}>
            {(showAllOverdue ? overdue : overdue.slice(0, 5)).map(item => renderRow(item, true))}
            {overdue.length > 5 && (
              <button className="btn-sm ghost" style={{ marginTop: 8, marginBottom: 6 }} onClick={() => setShowAllOverdue(!showAllOverdue)}>
                {showAllOverdue ? "Show less" : "Show all " + overdue.length + " overdue"}
              </button>
            )}
          </div>
        </>
      )}

      {pending.length > 0 && (
        <>
          <div className="section-label" style={{ opacity: 0.7 }}>
            <span>
              <span className="num">~</span>
              <span className="name">Pending · in progress or settling at counter</span>
            </span>
            <span className="right">{pending.length}</span>
          </div>
          <div style={{ background: "rgba(26,26,26,0.025)", padding: "4px 14px", marginBottom: 22 }}>
            {(showAllPending ? pending : pending.slice(0, 3)).map(item => renderRow(item, false))}
            {pending.length > 3 && (
              <button className="btn-sm ghost" style={{ marginTop: 8, marginBottom: 6 }} onClick={() => setShowAllPending(!showAllPending)}>
                {showAllPending ? "Show less" : "Show all " + pending.length + " pending"}
              </button>
            )}
          </div>
        </>
      )}

      {overdue.length === 0 && pending.length === 0 && (
        <div className="empty-mini" style={{ padding: 16, marginBottom: 18, textAlign: "center" }}>
          ✓ Everything is settled · no outstanding receivables
        </div>
      )}
    </>
  );
}

function SplitBar({ segments }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  if (total === 0) {
    return <div className="empty-mini" style={{ padding: 16 }}>No revenue yet</div>;
  }
  return (
    <div>
      <div style={{ display: "flex", height: 36, borderRadius: 3, overflow: "hidden", border: "1.5px solid var(--ink)" }}>
        {segments.map((s, i) => {
          const pct = total > 0 ? (s.value / total) * 100 : 0;
          if (pct < 0.5) return null;
          return (
            <div key={i} style={{
              flex: pct, background: s.color, color: pct > 8 ? "var(--cream)" : "transparent",
              fontFamily: "var(--mono)", fontSize: 11, fontWeight: 700,
              display: "flex", alignItems: "center", justifyContent: "center"
            }} title={s.label + ": $" + s.value.toFixed(2) + " (" + pct.toFixed(1) + "%)"}>
              {pct >= 8 ? Math.round(pct) + "%" : ""}
            </div>
          );
        })}
      </div>
      <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 12 }}>
        {segments.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.06em" }}>
            <span style={{ width: 12, height: 12, background: s.color, borderRadius: 2, border: "1px solid var(--ink)" }} />
            <span>{s.label} · ${s.value.toFixed(2)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
