  const foundingFull = founding.length >= FOUNDING_CAP;

  const filtered = (members || []).filter(m => {
    if (!search.trim()) return true;
    const s = search.toLowerCase();
    return (
      m.name.toLowerCase().includes(s) ||
      m.phone.includes(s) ||
      m.memberNumber.toLowerCase().includes(s)
    );
  });

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">Membership</div>
          <h1>Members</h1>
        </div>
        <div>
          <button className="btn primary" onClick={() => setShowAdd(true)}>+ Add member</button>
        </div>
      </div>

      {/* Counters */}
      <div className="member-header">
        <div className={"member-counter founding" + (foundingFull ? " full" : "")}>
          <div className="label">Founding · capped at {FOUNDING_CAP}</div>
          <div className="big">{founding.length}<span className="of">of {FOUNDING_CAP}</span></div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", opacity: 0.6, marginTop: 4 }}>
            {foundingFull ? "Capped — no more Founding slots" : (FOUNDING_CAP - founding.length) + " slots remain"}
          </div>
        </div>
        <div className="member-counter standard">
          <div className="label">Standard · unlimited</div>
          <div className="big">{standard.length}</div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", opacity: 0.6, marginTop: 4 }}>
            Active annual memberships
          </div>
        </div>
      </div>

      {/* Search */}
      <div style={{ marginBottom: 16 }}>
        <input
          type="text"
          className="search-input"
          placeholder="Search name, phone, member number…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      {loading ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}>
          <BouncingBall size="md" />
        </div>
      ) : filtered.length === 0 ? (
        <div className="empty">No members match</div>
      ) : (
        <div className="member-list">
          {filtered.map(m => (
            <div
              key={m.phone}
              className={"member-row" + (m.tier === "Founding" ? " founding" : "")}
              onClick={() => setEditMember(m)}
            >
              <div className="num">{m.memberNumber}</div>
              <div>
                <div className="name">
                  {m.name}
                  <span className={"tier-pill " + m.tier} style={{ marginLeft: 8 }}>{m.tier}</span>
                  {m.isExpired && <span className="status-pill cancelled" style={{ marginLeft: 6 }}>Expired</span>}
                  {m.status !== "Active" && !m.isExpired && (
                    <span className="status-pill cancelled" style={{ marginLeft: 6 }}>{m.status}</span>
                  )}
                </div>
                <div className="meta">{m.phone} · Exp. {m.expiryDate || "—"}</div>
              </div>
              <div className="bday">
                <span className="label">Birthday</span>
                {m.birthday || "—"}
              </div>
              <button className="btn-sm">Manage</button>
            </div>
          ))}
        </div>
      )}

      {showAdd && (
        <AddMemberModal
          foundingFull={foundingFull}
          onClose={() => setShowAdd(false)}
          onCreated={() => { load(); setShowAdd(false); }}
        />
      )}

      {editMember && (
        <EditMemberModal
          member={editMember}
          onClose={() => setEditMember(null)}
          onSaved={() => { load(); setEditMember(null); }}
        />
      )}
    </div>
  );
}

function AddMemberModal({ foundingFull, onClose, onCreated }) {
  const [form, setForm] = useState({
    phone: "",
    name: "",
    email: "",
    tier: foundingFull ? "Standard" : "Founding",
    birthday: "",
    notes: ""
  });
  const [bMonth, setBMonth] = useState("");
  const [bDay, setBDay] = useState("");
  const [submitting, setSubmitting] = useState(false);

  async function submit() {
    if (!form.phone) return showToast("Phone required", "error");
    if (!form.name) return showToast("Name required", "error");
    if (!bMonth || !bDay) return showToast("Birthday required", "error");
    const m = parseInt(bMonth);
    const d = parseInt(bDay);
    if (m < 1 || m > 12 || d < 1 || d > 31) return showToast("Invalid birthday", "error");
    const birthday = String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");

    setSubmitting(true);
    const r = await api("adminCreateMember", {
      phone: form.phone,
      name: form.name,
      email: form.email,
      tier: form.tier,
      birthday: birthday,
      notes: form.notes
    });
    setSubmitting(false);
    if (r.ok) {
      showToast("Member " + r.memberNumber + " added", "success");
      onCreated && onCreated();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const months = [
    "01 · Jan", "02 · Feb", "03 · Mar", "04 · Apr", "05 · May", "06 · Jun",
    "07 · Jul", "08 · Aug", "09 · Sep", "10 · Oct", "11 · Nov", "12 · Dec"
  ];

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">New membership</div>
            <h2>Add Member</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="field">
          <div className="field-label">Tier</div>
          <select value={form.tier} onChange={(e) => setForm({ ...form, tier: e.target.value })}>
            <option value="Founding" disabled={foundingFull}>
              Founding {foundingFull ? "(capped at 20)" : "· $200/yr · 50% off"}
            </option>
            <option value="Standard">Standard · $150/yr · 30% off</option>
          </select>
        </div>

        <div className="field">
          <div className="field-label">Phone</div>
          <input
            type="tel"
            inputMode="numeric"
            value={form.phone}
            placeholder="e.g. 12345678"
            onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/[^0-9]/g, "") })}
          />
        </div>

        <div className="field">
          <div className="field-label">Full name</div>
          <input
            type="text"
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
          />
        </div>

        <div className="field">
          <div className="field-label">Email (optional)</div>
          <input
            type="email"
            value={form.email}
            onChange={(e) => setForm({ ...form, email: e.target.value })}
          />
        </div>

        <div className="field">
          <div className="field-label">Birthday · MM and DD</div>
          <div className="field-row">
            <select value={bMonth} onChange={(e) => setBMonth(e.target.value)}>
              <option value="">Month…</option>
              {months.map((m, i) => (
                <option key={i} value={String(i + 1).padStart(2, "0")}>{m}</option>
              ))}
            </select>
            <input
              type="number"
              min="1"
              max="31"
              value={bDay}
              placeholder="Day"
              onChange={(e) => setBDay(e.target.value)}
            />
          </div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.55, marginTop: 4 }}>
            Used to grant birthday-week sessions. Day only, no year.
          </div>
        </div>

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea
            value={form.notes}
            onChange={(e) => setForm({ ...form, notes: e.target.value })}
            placeholder="Anything staff should remember…"
          />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Cancel</button>
          <button
            className="btn primary"
            onClick={submit}
            disabled={submitting || !form.phone || !form.name || !bMonth || !bDay}
          >
            {submitting ? "Adding…" : "Add member"}
          </button>
        </div>
      </div>
    </div>
  );
}

function EditMemberModal({ member, onClose, onSaved }) {
  const [form, setForm] = useState({
    name: member.name || "",
    email: member.email || "",
    expiryDate: member.expiryDate || "",
    birthday: member.birthday || "",
    status: member.status || "Active",
    notes: member.notes || ""
  });
  const [saving, setSaving] = useState(false);

  async function save() {
    setSaving(true);
    const r = await api("adminUpdateMember", {
      phone: member.phone,
      name: form.name,
      email: form.email,
      expiryDate: form.expiryDate,
      birthday: form.birthday,
      status: form.status,
      notes: form.notes
    });
    setSaving(false);
    if (r.ok) {
      showToast("Saved", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  async function renew() {
    if (!confirm("Renew this membership for another year?")) return;
    const exp = member.expiryDate ? new Date(member.expiryDate + "T12:00:00") : new Date();
    if (exp < new Date()) exp.setTime(Date.now());  // start from today if expired
    exp.setFullYear(exp.getFullYear() + 1);
    const newExp = exp.getFullYear() + "-" + String(exp.getMonth() + 1).padStart(2, "0") + "-" + String(exp.getDate()).padStart(2, "0");
    setForm(f => ({ ...f, expiryDate: newExp, status: "Active" }));
    showToast("Renewal date set — press Save to confirm", "success");
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{member.memberNumber} · {member.phone}</div>
            <h2>{member.name}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        <div className="modal-detail-row">
          <span className="k">Tier</span>
          <span className="v"><span className={"tier-pill " + member.tier}>{member.tier}</span></span>
        </div>
        <div className="modal-detail-row">
          <span className="k">Started</span>
          <span className="v">{member.startDate || "—"}</span>
        </div>

        <div className="field" style={{ marginTop: 14 }}>
          <div className="field-label">Name</div>
          <input type="text" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        </div>

        <div className="field">
          <div className="field-label">Email</div>
          <input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
        </div>

        <div className="field">
          <div className="field-label">Birthday · MM-DD</div>
          <input
            type="text"
            value={form.birthday}
            placeholder="05-15"
            maxLength={5}
            onChange={(e) => setForm({ ...form, birthday: e.target.value })}
          />
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Expiry date</div>
            <input
              type="date"
              value={form.expiryDate}
              onChange={(e) => setForm({ ...form, expiryDate: e.target.value })}
            />
          </div>
          <div className="field">
            <div className="field-label">Status</div>
            <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
              <option value="Active">Active</option>
              <option value="Cancelled">Cancelled</option>
              <option value="Paused">Paused</option>
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Notes</div>
          <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} />
        </div>

        <div className="actions">
          <button className="btn ghost" onClick={onClose} disabled={saving}>Close</button>
          <button className="btn" onClick={renew} disabled={saving}>Renew +1yr</button>
          <button className="btn primary" onClick={save} disabled={saving}>
            {saving ? "Saving…" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

function SessionsView({ coaches }) {
  const today = todayISO();
  const weekFromNow = (() => {
    const d = new Date(); d.setDate(d.getDate() + 7);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  })();
  const [dateFrom, setDateFrom] = useState(today);
  const [dateTo, setDateTo] = useState(weekFromNow);
  const [coachFilter, setCoachFilter] = useState("");
  const [paymentFilter, setPaymentFilter] = useState("");
  const [sessions, setSessions] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [editSession, setEditSession] = useState(null);

  async function load() {
    const r = await api("adminListCoachingSessions", {
      dateFrom: dateFrom, dateTo: dateTo,
      coachId: coachFilter, paymentStatus: paymentFilter
    });
    if (r.ok) setSessions(r.sessions || []);
  }
  useEffect(() => { load(); }, [dateFrom, dateTo, coachFilter, paymentFilter]);

  async function duplicate(s) {
    if (!confirm("Duplicate this session to one week from now?")) return;
    const r = await api("adminDuplicateCoachingSession", { sessionId: s.sessionId, offsetDays: 7 });
    if (r.ok) {
      showToast("Duplicated to next week (" + r.sessionId + ")", "success");
      load();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  return (
    <div>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 16 }}>
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700 }}>From</div>
        <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)}
          style={{ padding: "6px 10px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)" }} />
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 700 }}>To</div>
        <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)}
          style={{ padding: "6px 10px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)" }} />
        <select value={coachFilter} onChange={(e) => setCoachFilter(e.target.value)}
          style={{ padding: "6px 10px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)", fontSize: 12 }}>
          <option value="">All coaches</option>
          {coaches.map(c => <option key={c.coachId} value={c.coachId}>{c.coachId} · {c.name}</option>)}
        </select>
        <select value={paymentFilter} onChange={(e) => setPaymentFilter(e.target.value)}
          style={{ padding: "6px 10px", border: "1.5px solid var(--ink)", borderRadius: 4, fontFamily: "var(--mono)", fontSize: 12 }}>
          <option value="">Any payment</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="waived">Waived</option>
        </select>
        <button className="btn primary" style={{ marginLeft: "auto" }}
          onClick={() => setShowAdd(true)}
          disabled={coaches.filter(c => c.status === "Active").length === 0}
        >+ Add session</button>
      </div>

      {coaches.length === 0 && (
        <div className="modal-warning" style={{ margin: "0 0 16px" }}>
          Add at least one coach (on the Coaches tab) before booking sessions.
        </div>
      )}

      {sessions === null ? (
        <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>
      ) : sessions.length === 0 ? (
        <div className="empty">No sessions in this range</div>
      ) : (
        sessions.map(s => (
          <div
            key={s.sessionId}
            className={"session-card " + s.paymentStatus.toLowerCase()}
            onClick={() => setEditSession(s)}
          >
            <div className="when">
              <span className="date">{s.date}</span>
              {s.time}
              <div style={{ fontSize: 9, fontWeight: 500, opacity: 0.5, letterSpacing: "0.14em", textTransform: "uppercase", marginTop: 2 }}>
                {s.durationHours}h · C·{s.courtNumbers}
              </div>
            </div>
            <div className="who">
              <div className="coach">
                {s.coachName}
                <span className={"deal-tag " + s.dealTypeUsed}>{s.dealTypeUsed.replace("_", " ")}</span>
                <span className={"status-pill " + (s.paymentStatus.toLowerCase() === "paid" ? "paid" : s.paymentStatus.toLowerCase() === "waived" ? "cancelled" : "at_risk")}>
                  {s.paymentStatus}
                </span>
              </div>
              <div className={"student-line" + (!s.studentName ? " empty" : "")}>
                {s.studentName ? (s.studentName + (s.studentPhone ? " · " + s.studentPhone : "")) : "No student recorded"}
              </div>
              <div className="meta-line">
                {s.sessionType}{s.groupSize > 1 ? " · " + s.groupSize + " students" : ""}{s.manualOverride ? " · MANUAL" : ""} · {s.sessionId}
              </div>
            </div>
            <div className="amounts">
              <div className="facility">${s.facilityEarns.toFixed(2)}</div>
              <div className="coach-take">Coach: ${s.coachTakes.toFixed(2)}</div>
              <div className="lesson">Lesson: ${s.lessonFee.toFixed(2)}</div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <button className="btn-sm" onClick={(e) => { e.stopPropagation(); duplicate(s); }} title="Duplicate to next week">↻ +1wk</button>
            </div>
          </div>
        ))
      )}

      {showAdd && (
        <CoachingSessionModal
          session={null}
          coaches={coaches}
          dateDefault={today}
          onClose={() => setShowAdd(false)}
          onSaved={() => { load(); setShowAdd(false); }}
        />
      )}
      {editSession && (
        <CoachingSessionModal
          session={editSession}
          coaches={coaches}
          onClose={() => setEditSession(null)}
          onSaved={() => { load(); setEditSession(null); }}
        />
      )}
    </div>
  );
}

function CoachingSessionModal({ session, coaches, dateDefault, onClose, onSaved }) {
  const isNew = !session;
  const activeCoaches = coaches.filter(c => c.status === "Active");

  const [form, setForm] = useState({
    coachId: session ? session.coachId : (activeCoaches[0] ? activeCoaches[0].coachId : ""),
    date: session ? session.date : (dateDefault || todayISO()),
    time: session ? session.time : "18:00",
    durationHours: session ? session.durationHours : 1,
    courts: session ? String(session.courtNumbers).split(",").map(x => parseInt(x.trim())).filter(Boolean) : [1],
    sessionType: session ? session.sessionType : "private",
    studentName: session ? session.studentName : "",
    studentPhone: session ? session.studentPhone : "",
    groupSize: session ? session.groupSize : 1,
    lessonFee: session ? session.lessonFee : 0,
    manualOverride: session ? session.manualOverride : false,
    facilityEarnsOverride: session ? session.facilityEarns : 0,
    coachTakesOverride: session ? session.coachTakes : 0,
    paymentStatus: session ? session.paymentStatus : "Pending",
    paymentMethod: session ? session.paymentMethod : "",
    paymentDate: session ? session.paymentDate : "",
    notes: session ? session.notes : ""
  });
  const [submitting, setSubmitting] = useState(false);

  const selectedCoach = coaches.find(c => c.coachId === form.coachId);

  // Compute facility earns + coach takes from coach's deal terms
  const auto = useMemo(() => {
    if (!selectedCoach) return { facilityEarns: 0, coachTakes: 0, formula: "" };
    const fee = parseFloat(form.lessonFee) || 0;
    const rate = parseFloat(selectedCoach.courtRate) || 0;
    const pct = parseFloat(selectedCoach.revSharePct) || 0;
    const hrs = parseFloat(form.durationHours) || 0;
    let facility = 0;
    let formula = "";
    if (selectedCoach.dealType === "flat_rent") {
      facility = rate * hrs;
      formula = `$${rate}/hr × ${hrs}h = $${facility.toFixed(2)}`;
    } else if (selectedCoach.dealType === "rev_share") {
      facility = fee * (pct / 100);
      formula = `$${fee.toFixed(2)} × ${pct}% = $${facility.toFixed(2)}`;
    } else if (selectedCoach.dealType === "hybrid") {
      const rent = rate * hrs;
      const share = fee * (pct / 100);
      facility = rent + share;
      formula = `$${rate}/hr × ${hrs}h + $${fee.toFixed(2)} × ${pct}% = $${facility.toFixed(2)}`;
    } else {
      facility = 0;
      formula = "Custom deal — enter amounts manually";
    }
    facility = Math.round(facility * 100) / 100;
    const coachTakes = Math.round((fee - facility) * 100) / 100;
    return { facilityEarns: facility, coachTakes: coachTakes, formula: formula };
  }, [selectedCoach, form.lessonFee, form.durationHours]);

  const facilityEarns = form.manualOverride ? parseFloat(form.facilityEarnsOverride) || 0 : auto.facilityEarns;
  const coachTakes = form.manualOverride ? parseFloat(form.coachTakesOverride) || 0 : auto.coachTakes;

  function toggleCourt(c) {
    setForm(f => {
      const set = new Set(f.courts);
      if (set.has(c)) set.delete(c);
      else set.add(c);
      return { ...f, courts: Array.from(set).sort() };
    });
  }

  async function submit() {
    if (!form.coachId) return showToast("Coach required", "error");
    if (!form.courts.length) return showToast("Pick at least one court", "error");
    if (!form.durationHours || form.durationHours <= 0) return showToast("Duration required", "error");

    setSubmitting(true);
    if (isNew) {
      const r = await api("adminCreateCoachingSession", {
        coachId: form.coachId,
        date: form.date,
        time: form.time,
        durationHours: form.durationHours,
        courts: form.courts.join(","),
        sessionType: form.sessionType,
        studentName: form.studentName,
        studentPhone: form.studentPhone,
        groupSize: form.groupSize,
        lessonFee: form.lessonFee,
        manualOverride: form.manualOverride ? "true" : "false",
        facilityEarns: facilityEarns,
        coachTakes: coachTakes,
        paymentStatus: form.paymentStatus,
        paymentMethod: form.paymentMethod,
        notes: form.notes
      });
      setSubmitting(false);
      if (r.ok) {
        showToast("Session " + r.sessionId + " booked", "success");
        onSaved && onSaved();
      } else {
        showToast(r.error || "Failed", "error");
      }
    } else {
      // Edit: only mutable fields
      const r = await api("adminUpdateCoachingSession", {
        sessionId: session.sessionId,
        studentName: form.studentName,
        studentPhone: form.studentPhone,
        groupSize: form.groupSize,
        lessonFee: form.lessonFee,
        manualOverride: form.manualOverride ? "true" : "false",
        facilityEarns: facilityEarns,
        coachTakes: coachTakes,
        paymentStatus: form.paymentStatus,
        paymentMethod: form.paymentMethod,
        paymentDate: form.paymentDate,
        notes: form.notes
      });
      setSubmitting(false);
      if (r.ok) {
        showToast("Saved", "success");
        onSaved && onSaved();
      } else {
        showToast(r.error || "Failed", "error");
      }
    }
  }

  async function cancelSession() {
    if (!confirm("Cancel this session? Court slots will be released.")) return;
    setSubmitting(true);
    const r = await api("adminCancelCoachingSession", { sessionId: session.sessionId });
    setSubmitting(false);
    if (r.ok) {
      showToast("Cancelled", "success");
      onSaved && onSaved();
    } else {
      showToast(r.error || "Failed", "error");
    }
  }

  const timeOptions = useMemo(() => {
    const out = [];
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      for (const m of [0, 30]) {
        const t = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        out.push(t);
      }
    }
    return out;
  }, []);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 640 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="kicker">{isNew ? "New coaching session" : session.sessionId}</div>
            <h2>{isNew ? "Book Session" : selectedCoach ? selectedCoach.name : "Session"}</h2>
          </div>
          <button className="x" onClick={onClose}>×</button>
        </div>

        {isNew && (
          <>
            <div className="field">
              <div className="field-label">Coach</div>
              <select value={form.coachId} onChange={(e) => setForm({ ...form, coachId: e.target.value })}>
                {activeCoaches.length === 0 && <option>(no active coaches)</option>}
                {activeCoaches.map(c => (
                  <option key={c.coachId} value={c.coachId}>
                    {c.coachId} · {c.name} · {c.dealType.replace("_", " ")}
                  </option>
                ))}
              </select>
              {selectedCoach && (
                <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.55, marginTop: 4 }}>
                  Default: {selectedCoach.dealType === "flat_rent" ? "$" + selectedCoach.courtRate + "/hr court" : ""}
                  {selectedCoach.dealType === "rev_share" ? selectedCoach.revSharePct + "% rev share" : ""}
                  {selectedCoach.dealType === "hybrid" ? "$" + selectedCoach.courtRate + "/hr + " + selectedCoach.revSharePct + "%" : ""}
                  {selectedCoach.dealType === "custom" ? "Custom — manual amounts" : ""}
                </div>
              )}
            </div>

            <div className="field-row three">
              <div className="field">
                <div className="field-label">Date</div>
                <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
              </div>
              <div className="field">
                <div className="field-label">Time</div>
                <select value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })}>
                  {timeOptions.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="field">
                <div className="field-label">Duration</div>
                <select value={form.durationHours} onChange={(e) => setForm({ ...form, durationHours: parseFloat(e.target.value) })}>
                  <option value={0.5}>30 min</option>
                  <option value={1}>1h</option>
                  <option value={1.5}>1h 30m</option>
                  <option value={2}>2h</option>
                  <option value={2.5}>2h 30m</option>
                  <option value={3}>3h</option>
                </select>
              </div>
            </div>

            <div className="field">
              <div className="field-label">Courts {form.courts.length > 0 && <span style={{ opacity: 0.5 }}>· {form.courts.join(", ")}</span>}</div>
              <div className="court-picker">
                {[1, 2, 3, 4, 5, 6, 7, 8].map(c => (
                  <div
                    key={c}
                    className={"ct" + (form.courts.includes(c) ? " on" : "")}
                    onClick={() => toggleCourt(c)}
                  >C·{c}</div>
                ))}
              </div>
            </div>
          </>
        )}

        <div className="field-row">
          <div className="field">
            <div className="field-label">Session type</div>
            <select value={form.sessionType} onChange={(e) => setForm({ ...form, sessionType: e.target.value })}>
              <option value="private">Private (1 student)</option>
              <option value="group">Group (2–4)</option>
              <option value="clinic">Clinic (5+)</option>
              <option value="practice">Coach practice (no student)</option>
            </select>
          </div>
          {form.sessionType !== "practice" && (
            <div className="field">
              <div className="field-label">Group size</div>
              <input
                type="number"
                min="1"
                value={form.groupSize}
                onChange={(e) => setForm({ ...form, groupSize: parseInt(e.target.value) || 1 })}
              />
            </div>
          )}
        </div>

        {form.sessionType !== "practice" && (
          <div className="field-row">
            <div className="field">
              <div className="field-label">Student name</div>
              <input type="text" value={form.studentName}
                onChange={(e) => setForm({ ...form, studentName: e.target.value })} />
            </div>
            <div className="field">
              <div className="field-label">Student phone</div>
              <input type="tel" inputMode="numeric" value={form.studentPhone}
                onChange={(e) => setForm({ ...form, studentPhone: e.target.value.replace(/[^0-9]/g, "") })} />
            </div>
          </div>
        )}

        <div className="field">
          <div className="field-label">Lesson fee charged · $</div>
          <input
            type="number"
            min="0"
            step="0.5"
            value={form.lessonFee}
            onChange={(e) => setForm({ ...form, lessonFee: parseFloat(e.target.value) || 0 })}
            placeholder="What coach charged the student"
          />
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.1em", opacity: 0.55, marginTop: 4 }}>
            Used to calculate revenue split. Leave at 0 if coach is renting court for practice.
          </div>
        </div>

        {/* Math preview */}
        <div className="math-preview">
          <div className="row">
            <span className="k">Lesson fee</span>
            <span className="v">${(parseFloat(form.lessonFee) || 0).toFixed(2)}</span>
          </div>
          <div className="row total facility">
            <span className="k">Facility earns</span>
            <span className="v">${facilityEarns.toFixed(2)}</span>
          </div>
          <div className="row total coach">
            <span className="k">Coach takes</span>
            <span className="v">${coachTakes.toFixed(2)}</span>
          </div>
          {auto.formula && !form.manualOverride && (
            <div className="formula">{auto.formula}</div>
          )}
          <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 8 }}>
            <input
              type="checkbox"
              id="override"
              checked={form.manualOverride}
              onChange={(e) => setForm({
                ...form,
                manualOverride: e.target.checked,
                facilityEarnsOverride: e.target.checked ? facilityEarns : 0,
                coachTakesOverride: e.target.checked ? coachTakes : 0
              })}
            />
            <label htmlFor="override" style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", fontWeight: 600, cursor: "pointer" }}>
              Override default split for this session
            </label>
          </div>
          {form.manualOverride && (
            <div className="field-row" style={{ marginTop: 10 }}>
              <div className="field">
                <div className="field-label">Facility earns</div>
                <input type="number" step="0.5" value={form.facilityEarnsOverride}
                  onChange={(e) => setForm({ ...form, facilityEarnsOverride: parseFloat(e.target.value) || 0 })} />
              </div>
              <div className="field">
                <div className="field-label">Coach takes</div>
                <input type="number" step="0.5" value={form.coachTakesOverride}
                  onChange={(e) => setForm({ ...form, coachTakesOverride: parseFloat(e.target.value) || 0 })} />
              </div>
            </div>
          )}
        </div>

        <div className="field-row">
          <div className="field">
            <div className="field-label">Payment status</div>
            <select value={form.paymentStatus} onChange={(e) => setForm({ ...form, paymentStatus: e.target.value })}>
              <option value="Pending">Pending</option>
              <option value="Paid">Paid</option>
              <option value="Waived">Waived</option>
            </select>
          </div>
          <div className="field">
            <div className="field-label">Payment method</div>
            <select value={form.paymentMethod} onChange={(e) => setForm({ ...form, paymentMethod: e.target.value })}>
              <option value="">—</option>
              <option value="Cash">Cash</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="ABA">ABA</option>
              <option value="Wing">Wing</option>
              <option value="Net from coach earnings">Net from coach earnings</option>
            </select>
          </div>
        </div>

        <div className="field">
          <div className="field-label">Notes (optional)</div>
          <textarea value={form.notes}
            placeholder="e.g. Make-up session, monthly clinic, etc."
            onChange={(e) => setForm({ ...form, notes: e.target.value })} />
        </div>

        <div className="actions">
          {!isNew && (
            <button
              className="btn ghost"
              style={{ color: "var(--clay)", marginRight: "auto" }}
              onClick={cancelSession}
              disabled={submitting}
            >Cancel session</button>
          )}
          <button className="btn ghost" onClick={onClose} disabled={submitting}>Close</button>
          <button className="btn primary" onClick={submit} disabled={submitting || !form.coachId || (isNew && form.courts.length === 0)}>
            {submitting ? "Saving…" : isNew ? "Book session" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ----- Payments Due subview ----- */

function PaymentsDueView() {
  const [data, setData] = useState(null);

  async function load() {
    const r = await api("adminListCoachPayments");
    if (r.ok) setData(r.summary || []);
  }
  useEffect(() => { load(); }, []);

  if (data === null) {
    return <div style={{ padding: 40, display: "flex", justifyContent: "center" }}><BouncingBall size="md" /></div>;
  }

  const totalOwed = data.reduce((s, c) => s + c.pendingAmount, 0);
  const totalPaid = data.reduce((s, c) => s + c.paidAmount, 0);
  const totalCoachTakes = data.reduce((s, c) => s + c.coachTakesPending, 0);

  return (
    <div>
      <div className="stat-grid" style={{ marginBottom: 24 }}>
        <div className="stat-card accent-clay">
          <div className="label">Coaches owe us</div>
          <div className="value">${totalOwed.toFixed(2)}</div>
          <div className="sub">Across all unpaid sessions</div>
        </div>
        <div className="stat-card accent-green">
          <div className="label">Already collected</div>
          <div className="value">${totalPaid.toFixed(2)}</div>
          <div className="sub">All-time paid sessions</div>
        </div>
        <div className="stat-card accent-wood">
          <div className="label">Coaches haven't taken</div>
          <div className="value">${totalCoachTakes.toFixed(2)}</div>
          <div className="sub">Their earnings on unpaid sessions</div>
        </div>
      </div>

      <div className="section-label">
        <span><span className="num">01</span><span className="name">By Coach</span></span>
        <span className="right">{data.length} coach{data.length === 1 ? "" : "es"}</span>
      </div>
      {data.length === 0 ? (
        <div className="empty">No coaches in system</div>
      ) : (
        data.map(c => (
          <div key={c.coachId} className={"coach-pay-card" + (c.pendingAmount > 0 ? " has-debt" : "")}>
            <div>
              <div className="name">{c.name}</div>
              <div className="meta">{c.coachId} · {c.phone}</div>
            </div>
            <div style={{ textAlign: "right", fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", opacity: 0.6 }}>
              <div>{c.pendingSessions} unpaid · {c.paidSessions} paid</div>
              <div style={{ marginTop: 2 }}>Lifetime $ {c.paidAmount.toFixed(2)} collected</div>
            </div>
            <div className="owes">
              <div className="v">${c.pendingAmount.toFixed(2)}</div>
              <div className="label">{c.pendingAmount > 0 ? "Owes us" : "All settled"}</div>
            </div>
          </div>
        ))
      )}
    </div>
  );
}

function ScreenSettings() {
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [promo, setPromo] = useState({ active: false, pct: 50, label: "Soft launch −50%" });

  async function load() {
    setLoading(true);
    const r = await api("adminGetPromo");
    if (r.ok) {
      setPromo({
        active: !!r.active,
        pct: r.pct || 50,
        label: r.label || "Soft launch −50%"
      });
    }
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  async function save() {
    setSaving(true);
    const r = await api("adminSetPromo", {
      active: promo.active,
      pct: promo.pct,
      label: promo.label
    });
    setSaving(false);
    if (r.ok) {
      showToast("Saved", "success");
      setPromo({
        active: !!r.active,
        pct: r.pct || 50,
        label: r.label || ""
      });
    } else {
      showToast(r.error || "Save failed", "error");
    }
  }

  if (loading) {
    return (
      <div className="main">
        <div style={{ padding: 60, display: "flex", justifyContent: "center" }}>
          <BouncingBall size="md" />
        </div>
      </div>
    );
  }

  return (
    <div className="main">
      <div className="main-head">
        <div>
          <div className="title">Configuration</div>
          <h1>Settings</h1>
        </div>
      </div>

      <div className="settings-card">
        <h3>Promotional Discount</h3>
        <div className="desc">
          When active, applies a flat percentage discount to <b>all bookings</b>.
          Member discounts do not stack — customers receive whichever is more generous.
          Birthday sessions are exempt and keep their original discount.
        </div>

        <div className="settings-row">
          <div className="field-label">Status</div>
          <div
            className={"toggle" + (promo.active ? " on" : "")}
            onClick={() => setPromo({ ...promo, active: !promo.active })}
          />
          <div style={{
            fontFamily: "var(--mono)",
            fontSize: 12,
            letterSpacing: "0.14em",
            textTransform: "uppercase",
            fontWeight: 600,
            color: promo.active ? "var(--green)" : "var(--ink)",
            opacity: promo.active ? 1 : 0.5
          }}>
            {promo.active ? "Active" : "Inactive"}
          </div>
        </div>

        <div className="settings-row">
          <div className="field-label">Discount %</div>
          <input
            type="number"
            min="0"
            max="100"
            value={promo.pct}
            onChange={(e) => setPromo({ ...promo, pct: parseInt(e.target.value) || 0 })}
          />
        </div>

        <div className="settings-row">
          <div className="field-label">Label</div>
          <input
            type="text"
            value={promo.label}
            placeholder="e.g. Soft launch −50%, Grand Opening Weekend"
            onChange={(e) => setPromo({ ...promo, label: e.target.value })}
            maxLength={60}
          />
        </div>

        <div className="settings-row">
          <div className="actions">
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? "Saving…" : "Save changes"}
            </button>
          </div>
        </div>

        {promo.active && promo.pct > 0 && (
          <div className="settings-warning">
            <b>HEADS-UP:</b> All bookings will receive a {promo.pct}% discount as long as this is active.
            Toggle off to return to standard pricing + member discounts.
          </div>
        )}
      </div>

      <div className="settings-card" style={{ opacity: 0.6 }}>
        <h3>More settings</h3>
        <div className="desc">Pricing rules, operating hours, grace period, and birthday window will appear here in a future release. For now, these are configured in the Pricing sheet and Script Properties.</div>
      </div>
    </div>
  );
}

/* ====================================================================
   COMING SOON placeholder for stub tabs
   ==================================================================== */

      }}>

        }}>Coming soon</div>
        <div style={{

/* ====================================================================
   APP SHELL — sidebar + screen router
   ==================================================================== */
function App() {
  const [authed, setAuthed] = useState(!!getStoredPin());
  const [screen, setScreen] = useState("dashboard");

  // Validate the stored PIN on boot (e.g. PIN may have been changed)
  useEffect(() => {
    if (!authed) return;
    api("adminDashboard").then(r => {
      if (!r.ok) {
        setStoredPin("");
        setAuthed(false);
      }
    });
  }, []);

  function signOut() {
    setStoredPin("");
    setAuthed(false);
  }

  if (!authed) {
    return <ScreenLogin onAuth={() => setAuthed(true)} />;
  }

  // Tab definitions
  const tabs = [
    { id: "dashboard", label: "Dashboard", ready: true },
    { id: "bookings",  label: "Bookings",  ready: true },
    { id: "pos",       label: "POS",       ready: false },
    { id: "members",   label: "Members",   ready: true },
    { id: "coaching",  label: "Coaching",  ready: true },
    { id: "customers", label: "Customers", ready: false },
    { id: "sms",       label: "SMS Log",   ready: false },
    { id: "settings",  label: "Settings",  ready: true }
  ];

  function go(id) {
    const t = tabs.find(x => x.id === id);
    if (!t || !t.ready) return;
    setScreen(id);
  }

  let body;
  switch (screen) {
    case "dashboard": body = <ScreenDashboard />; break;
    case "bookings":  body = <ScreenBookings />; break;
    case "members":   body = <ScreenMembers />; break;
    case "coaching":  body = <ScreenCoaching />; break;
    case "settings":  body = <ScreenSettings />; break;
    case "pos":       body = <ScreenSoon title="Point of Sale" message="Drinks + Pro Shop POS with inventory, custom discounts, and payment methods. Coming in Drop B." />; break;
    case "customers": body = <ScreenSoon title="Customers" message="Guest list with booking history and quick member-conversion. Coming in Drop B." />; break;
    case "sms":       body = <ScreenSoon title="SMS Log" message="Searchable SMS log with cost tracking. Coming in Drop B." />; break;
    default:          body = <ScreenDashboard />;
  }

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="logo">
          <div className="top">THE</div>
          <div className="name">Yard</div>
          <div className="sub">Admin</div>
        </div>
        <nav>
          {tabs.map(t => (
            <button
              key={t.id}
              className={(screen === t.id ? "active " : "") + (!t.ready ? "soon" : "")}
              onClick={() => go(t.id)}
            >
              <span className="label">{t.label}</span>
              {!t.ready && <span className="soon-tag">Soon</span>}
            </button>
          ))}
        </nav>
        <div className="footer">
          <div className="staff">Signed in</div>
          <button className="signout" onClick={signOut}>
            <span>Sign out</span>
          </button>
        </div>
      </aside>
      {body}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);

  </script>
</body>
</html>
